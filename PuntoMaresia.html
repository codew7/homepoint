<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto Maresia — Dashboard Moda</title>
  <style>
    /* ─── Reset & Variables ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6c4eb6;
      --primary-light: #ede9fe;
      --primary-hover: #5a3d9e;
      --accent: #ec4899;
      --accent-light: #fce7f3;
      --bg: #f5f0ff;
      --surface: #ffffff;
      --surface-alt: #faf7ff;
      --border: #e2d9f3;
      --border-light: #ede8fb;
      --text: #1a1025;
      --text-secondary: #5a4e70;
      --text-muted: #9585b5;
      --gold: #f59e0b;
      --silver: #9ca3af;
      --bronze: #b45309;
      --success: #059669;
      --success-light: #d1fae5;
      --radius: 12px;
      --radius-sm: 7px;
      --radius-xs: 4px;
      --shadow: 0 1px 3px rgba(108,78,182,.07), 0 1px 2px rgba(108,78,182,.05);
      --shadow-md: 0 4px 14px rgba(108,78,182,.10), 0 2px 4px rgba(108,78,182,.06);
      --shadow-lg: 0 12px 32px rgba(108,78,182,.13), 0 4px 8px rgba(108,78,182,.07);
      --transition: 180ms cubic-bezier(.4,0,.2,1);
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ─── Header ─────────────────────────────────────────────────── */
    .app-header {
      background: linear-gradient(135deg, #4a1d96 0%, #6c4eb6 50%, #ec4899 100%);
      color: #fff;
      padding: 22px 28px 20px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-brand h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.4px;
      line-height: 1.2;
    }
    .header-brand p {
      font-size: 12px;
      opacity: .8;
      margin-top: 3px;
      letter-spacing: .2px;
    }
    .header-stats {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .header-stat {
      text-align: center;
      background: rgba(255,255,255,.15);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      min-width: 80px;
      backdrop-filter: blur(6px);
    }
    .header-stat .val {
      font-size: 18px;
      font-weight: 700;
      display: block;
      line-height: 1.2;
    }
    .header-stat .lbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .7px;
      opacity: .75;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: rgba(255,255,255,.85);
      text-decoration: none;
      background: rgba(255,255,255,.15);
      padding: 5px 12px;
      border-radius: 20px;
      transition: background var(--transition);
      font-weight: 600;
    }
    .btn-back:hover { background: rgba(255,255,255,.25); color: #fff; }

    /* ─── Loading Overlay ────────────────────────────────────────── */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(74,29,150,.35);
      backdrop-filter: blur(3px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loading-overlay p {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Container ──────────────────────────────────────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    /* ─── Drop Zone ──────────────────────────────────────────────── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 52px 28px;
      text-align: center;
      background: var(--surface);
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: var(--shadow-md);
    }
    .drop-zone .dz-icon {
      font-size: 48px;
      margin-bottom: 14px;
      display: block;
    }
    .drop-zone h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .drop-zone p {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .drop-zone input[type=file] { display: none; }
    .btn-file {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 28px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform 80ms;
      font-family: inherit;
    }
    .btn-file:hover { background: var(--primary-hover); }
    .btn-file:active { transform: scale(.97); }
    .dz-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 4px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .dz-divider::before,
    .dz-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .btn-drive {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 26px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform 80ms;
      font-family: inherit;
    }
    .btn-drive:hover { background: #1558b0; }
    .btn-drive:active { transform: scale(.97); }
    .btn-drive:disabled { opacity: .55; cursor: not-allowed; }
    .btn-drive svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ─── Section hidden by default ─────────────────────────────── */
    .section { display: none; }
    .section.visible { display: block; }

    /* ─── Date Filter Card ───────────────────────────────────────── */
    .filter-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 22px;
      margin-bottom: 20px;
    }
    .filter-card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .quick-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .quick-btn {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .quick-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .quick-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .date-range-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .date-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .date-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .date-group input[type=date] {
      padding: 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .date-group input[type=date]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,78,182,.12);
    }
    .btn-apply {
      padding: 8px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), transform 80ms;
      font-family: inherit;
      align-self: flex-end;
    }
    .btn-apply:hover { background: var(--primary-hover); }
    .btn-apply:active { transform: scale(.97); }
    .btn-clear {
      padding: 8px 16px;
      background: transparent;
      color: var(--text-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      align-self: flex-end;
    }
    .btn-clear:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn-clear:active { transform: scale(.97); }

    /* ─── Subcategory Pills ──────────────────────────────────────── */
    .subcat-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .subcat-pill {
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .subcat-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .subcat-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ─── Stats Cards ────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: box-shadow var(--transition), transform var(--transition);
    }
    .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .stat-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .stat-icon.purple { background: var(--primary-light); }
    .stat-icon.pink { background: var(--accent-light); }
    .stat-icon.green { background: var(--success-light); }
    .stat-body .val {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .stat-body .lbl {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* ─── Section Title ──────────────────────────────────────────── */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ─── Top 10 ─────────────────────────────────────────────────── */
    .top-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 24px;
    }
    .top-row {
      display: grid;
      grid-template-columns: 32px 1fr auto auto;
      gap: 8px 14px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .top-row:last-child { border-bottom: none; }
    .top-rank {
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rank-1 { background: #fef3c7; color: var(--gold); }
    .rank-2 { background: #f3f4f6; color: var(--silver); }
    .rank-3 { background: #fef2e2; color: var(--bronze); }
    .rank-other { background: var(--surface-alt); color: var(--text-muted); font-size: 12px; }
    .top-name-block { min-width: 0; }
    .top-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-code {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .top-bar-wrap {
      grid-column: 2;
      height: 5px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
      margin-top: -4px;
    }
    .top-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width .5s ease;
    }
    .top-qty {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
    }
    .top-usd {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
      white-space: nowrap;
    }
    .top-row-inner {
      display: contents;
    }

    /* ─── Subcategory Breakdown ──────────────────────────────────── */
    .subcat-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .subcat-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      border-left: 4px solid var(--accent);
      transition: box-shadow var(--transition);
    }
    .subcat-card:hover { box-shadow: var(--shadow-md); }
    .subcat-card .sc-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subcat-card .sc-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .subcat-card .sc-val {
      font-weight: 700;
      color: var(--text);
    }

    /* ─── Articles Table ─────────────────────────────────────────── */
    .table-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .table-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-light);
      flex-wrap: wrap;
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 160px;
    }
    .search-input-wrap .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px 8px 32px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,78,182,.12);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .sort-select {
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      cursor: pointer;
      transition: border-color var(--transition);
    }
    .sort-select:focus { border-color: var(--primary); }
    .btn-csv {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), transform 80ms;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-csv:hover { background: #047857; }
    .btn-csv:active { transform: scale(.97); }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: var(--surface-alt);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    thead th:first-child { width: 36px; text-align: center; }
    tbody tr {
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition);
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-alt); }
    tbody tr.totals-row {
      background: var(--primary-light);
      font-weight: 700;
      border-top: 2px solid var(--primary);
    }
    tbody tr.totals-row:hover { background: var(--primary-light); }
    td {
      padding: 11px 14px;
      vertical-align: middle;
    }
    td:first-child { text-align: center; color: var(--text-muted); font-size: 12px; }
    .td-code { font-family: 'Courier New', monospace; font-size: 12px; color: var(--text-secondary); }
    .td-nombre { font-weight: 600; max-width: 240px; }
    .td-cat {
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-light);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
      display: inline-block;
    }
    .td-qty { font-weight: 700; text-align: right; }
    .td-price { text-align: right; color: var(--text-secondary); }
    .td-total { text-align: right; font-weight: 700; }
    .td-pct { min-width: 100px; }
    .pct-bar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pct-bar-track {
      flex: 1;
      height: 6px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
    }
    .pct-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width .4s ease;
    }
    .pct-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      width: 36px;
      text-align: right;
    }

    /* ─── Empty State ────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 52px 24px;
      color: var(--text-secondary);
    }
    .empty-state .es-icon { font-size: 44px; margin-bottom: 12px; display: block; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .empty-state p { font-size: 13px; color: var(--text-muted); }

    /* ─── Toast ──────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1025;
      color: #fff;
      padding: 11px 22px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 2000;
      transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.error { background: #dc2626; }
    .toast.success { background: var(--success); }

    /* ─── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 680px) {
      .app-header { padding: 16px 16px 14px; }
      .header-brand h1 { font-size: 18px; }
      .header-stats { gap: 7px; }
      .header-stat { padding: 5px 10px; min-width: 65px; }
      .header-stat .val { font-size: 15px; }
      .container { padding: 16px 12px 48px; }
      .drop-zone { padding: 36px 18px; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-body .val { font-size: 20px; }
      .top-card { padding: 16px 14px; }
      .filter-card { padding: 14px 16px; }
      .table-toolbar { gap: 8px; }
      .search-input-wrap { min-width: 100%; }
      .sort-select { width: 100%; }
    }
    @media (max-width: 400px) {
      .stats-grid { grid-template-columns: 1fr; }
      .header-stat .val { font-size: 13px; }
      .quick-btn { font-size: 11px; padding: 5px 10px; }
    }
  </style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingMsg">Cargando datos…</p>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Header -->
<header class="app-header">
  <div class="header-top">
    <div class="header-brand">
      <h1>👗 Punto Maresia</h1>
      <p>Dashboard de ventas — Categoría Moda</p>
    </div>
    <div class="header-stats" id="headerStats" style="display:none">
      <div class="header-stat">
        <span class="val" id="hStatArts">0</span>
        <span class="lbl">Artículos</span>
      </div>
      <div class="header-stat">
        <span class="val" id="hStatUnits">0</span>
        <span class="lbl">Unidades</span>
      </div>
      <div class="header-stat">
        <span class="val" id="hStatUSD">$0</span>
        <span class="lbl">Total</span>
      </div>
    </div>
  </div>
</header>

<div class="container">


  <!-- ─── Date Filter ──────────────────────────────────── -->
  <div class="section filter-card" id="sectionFilter">
    <div class="filter-card-title">Filtrar por fecha</div>
    <div class="quick-btns" id="quickBtns">
      <button class="quick-btn" data-days="today">Hoy</button>
      <button class="quick-btn" data-days="yesterday">Ayer</button>
      <button class="quick-btn" data-days="7">Última semana</button>
      <button class="quick-btn" data-days="30">Último mes</button>
      <button class="quick-btn active" data-days="0">Todo</button>
    </div>
    <div class="date-range-row">
      <div class="date-group">
        <label for="dateFrom">Desde</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="date-group">
        <label for="dateTo">Hasta</label>
        <input type="date" id="dateTo">
      </div>
      <button class="btn-apply" id="btnApply">Aplicar</button>
      <button class="btn-clear" id="btnClear">Limpiar</button>
    </div>
  </div>

  <!-- ─── Stats Cards ─────────────────────────────────── -->
  <div class="section" id="sectionStats">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon purple">👗</div>
        <div class="stat-body">
          <div class="val" id="statArts">0</div>
          <div class="lbl">Artículos únicos</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon pink">📦</div>
        <div class="stat-body">
          <div class="val" id="statUnits">0</div>
          <div class="lbl">Unidades vendidas</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">💵</div>
        <div class="stat-body">
          <div class="val" id="statUSD">$0</div>
          <div class="lbl">Total</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Articles Table ──────────────────────────────── -->
  <div class="section" id="sectionTable">
    <div class="section-title">📋 Todos los artículos</div>
    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="Buscar por nombre o código…">
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="qty-desc">Mayor cantidad</option>
          <option value="qty-asc">Menor cantidad</option>
          <option value="total-desc">Mayor total</option>
          <option value="total-asc">Menor total</option>
          <option value="name-asc">Nombre A→Z</option>
          <option value="name-desc">Nombre Z→A</option>
        </select>
      </div>
      <div class="table-wrap">
        <table id="artTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Código</th>
              <th>Artículo</th>
              <th>Subcategoría</th>
              <th style="text-align:right">Cant.</th>
              <th style="text-align:right">Precio</th>
              <th style="text-align:right">Total</th>
              <th>% del total</th>
            </tr>
          </thead>
          <tbody id="artTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script>
  /* ─── Constants ────────────────────────────────────────────── */
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzs8fJtVLkdUjOwx76miDSku6m-tVp371iqfxjepxgWydumKKHhd7w0zLHTMZxDo95Cw/exec';

  /* ─── State ─────────────────────────────────────────────────── */
  let allPedidos = [];         // raw array of pedido objects
  let filteredArts = [];       // current filtered+aggregated articles
  let dateFrom = null;
  let dateTo = null;
  let searchDebounce = null;

  /* ─── Helpers ───────────────────────────────────────────────── */
  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmtNum(n) {
    if (n == null || isNaN(n)) return '0';
    return Number(n).toLocaleString('es-AR');
  }

  function fmtUSD(n) {
    if (n == null || isNaN(n)) return '$0';
    return '$' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtUSDShort(n) {
    if (!n) return '$0';
    if (n >= 1000) return '$' + (n / 1000).toFixed(1) + 'k';
    return '$' + Number(n).toFixed(0);
  }

  function showLoading(msg) {
    document.getElementById('loadingMsg').textContent = msg || 'Cargando…';
    document.getElementById('loadingOverlay').classList.add('active');
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
  }

  let toastTimer = null;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (type ? ' ' + type : '');
    void el.offsetWidth;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  function showSection(id) {
    document.getElementById(id).classList.add('visible');
  }

  /* ─── Data Loading ──────────────────────────────────────────── */
  function parseJSON(data) {
    try {
      const obj = typeof data === 'string' ? JSON.parse(data) : data;
      const pedidosObj = obj.pedidos || obj;
      const arr = [];
      for (const key in pedidosObj) {
        const p = pedidosObj[key];
        if (p && typeof p === 'object') {
          arr.push({ _key: key, ...p });
        }
      }
      return arr;
    } catch (e) {
      throw new Error('JSON inválido: ' + e.message);
    }
  }

  function onDataLoaded(pedidos) {
    allPedidos = pedidos;
    // Show all sections
    showSection('sectionFilter');
    showSection('sectionStats');

    showSection('sectionTable');
    // Reset filters
    dateFrom = null;
    dateTo = null;
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    // Mark "Todo" active
    document.querySelectorAll('.quick-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.days === '0');
    });
    renderAll();
    showToast('Datos cargados: ' + pedidos.length + ' pedidos', 'success');
  }

  /* ─── Auto-load from Google Drive on page open ──────────────── */
  async function loadFromDrive() {
    showLoading('Conectando con Google Drive…');
    try {
      const resp = await fetch(APPS_SCRIPT_URL);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const text = await resp.text();
      const pedidos = parseJSON(text);
      hideLoading();
      onDataLoaded(pedidos);
    } catch (err) {
      hideLoading();
      showToast('Error al cargar datos: ' + err.message, 'error');
    }
  }

  document.addEventListener('DOMContentLoaded', loadFromDrive);

  /* ─── Aggregation ───────────────────────────────────────────── */
  function aggregateData() {
    const tsFrom = dateFrom ? new Date(dateFrom).getTime() : null;
    const tsTo = dateTo ? (new Date(dateTo).getTime() + 86399999) : null;

    const artMap = {};

    allPedidos.forEach(p => {
      if (p.status !== 'DESPACHADO/ENTREGADO') return;

      const ts = p.timestamp ? (
        typeof p.timestamp === 'number' ? p.timestamp : new Date(p.timestamp).getTime()
      ) : null;

      if (tsFrom && ts && ts < tsFrom) return;
      if (tsTo && ts && ts > tsTo) return;

      const items = Array.isArray(p.items) ? p.items : [];
      items.forEach(it => {
        if (!it.categoria || !it.categoria.toLowerCase().includes('moda')) return;

        const key = (it.codigo || '') + '|' + (it.nombre || '');
        const qty = parseInt(it.cantidad) || 0;
        const price = parseFloat(it.valorU || it.valorUSD) || 0;

        if (!artMap[key]) {
          artMap[key] = {
            codigo: it.codigo || '',
            nombre: it.nombre || '(sin nombre)',
            categoria: it.categoria || 'Moda',
            cantidad: 0,
            valorU: 0,
            totalUSD: 0,
            codigoBarras: it.codigoBarras || ''
          };
        }
        artMap[key].cantidad += qty;
        artMap[key].totalUSD += qty * price;
        if (price > 0) artMap[key].valorU = price;
      });
    });

    return Object.values(artMap);
  }

  /* ─── Render All ─────────────────────────────────────────────── */
  function renderAll() {
    const allArts = aggregateData();

    filteredArts = allArts;

    // Stats
    const totalUnits = allArts.reduce((s, a) => s + a.cantidad, 0);
    const totalUSD = allArts.reduce((s, a) => s + a.totalUSD, 0);
    const uniqueArts = allArts.length;

    document.getElementById('statArts').textContent = fmtNum(uniqueArts);
    document.getElementById('statUnits').textContent = fmtNum(totalUnits);
    document.getElementById('statUSD').textContent = fmtUSD(totalUSD);

    // Header stats
    document.getElementById('hStatArts').textContent = fmtNum(uniqueArts);
    document.getElementById('hStatUnits').textContent = fmtNum(totalUnits);
    document.getElementById('hStatUSD').textContent = fmtUSDShort(totalUSD);
    document.getElementById('headerStats').style.display = 'flex';

    // Table
    renderTable();
  }

  /* ─── Table ──────────────────────────────────────────────────── */
  function getSortedFiltered() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const sort = document.getElementById('sortSelect').value;

    let arr = filteredArts.slice();

    if (q) {
      arr = arr.filter(a =>
        a.nombre.toLowerCase().includes(q) ||
        a.codigo.toLowerCase().includes(q)
      );
    }

    arr.sort((a, b) => {
      switch (sort) {
        case 'qty-asc':    return a.cantidad - b.cantidad;
        case 'qty-desc':   return b.cantidad - a.cantidad;
        case 'total-asc':  return a.totalUSD - b.totalUSD;
        case 'total-desc': return b.totalUSD - a.totalUSD;
        case 'name-asc':   return a.nombre.localeCompare(b.nombre, 'es');
        case 'name-desc':  return b.nombre.localeCompare(a.nombre, 'es');
        default:           return b.cantidad - a.cantidad;
      }
    });

    return arr;
  }

  function renderTable() {
    const arr = getSortedFiltered();
    const totalUSD = arr.reduce((s, a) => s + a.totalUSD, 0);
    const totalQty = arr.reduce((s, a) => s + a.cantidad, 0);
    const tbody = document.getElementById('artTableBody');

    if (!arr.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8">
            <div class="empty-state">
              <span class="es-icon">👗</span>
              <h3>Sin resultados</h3>
              <p>Probá con otro término de búsqueda o rango de fechas</p>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    const rows = arr.map((art, i) => {
      const pct = totalUSD > 0 ? (art.totalUSD / totalUSD * 100) : 0;
      return `
        <tr>
          <td>${i + 1}</td>
          <td class="td-code">${esc(art.codigo)}</td>
          <td class="td-nombre" title="${esc(art.nombre)}">${esc(art.nombre)}</td>
          <td><span class="td-cat">${esc(art.categoria)}</span></td>
          <td class="td-qty">${fmtNum(art.cantidad)}</td>
          <td class="td-price">${art.valorU > 0 ? fmtUSD(art.valorU) : '—'}</td>
          <td class="td-total">${fmtUSD(art.totalUSD)}</td>
          <td class="td-pct">
            <div class="pct-bar-wrap">
              <div class="pct-bar-track">
                <div class="pct-bar-fill" style="width:${pct.toFixed(1)}%"></div>
              </div>
              <span class="pct-text">${pct.toFixed(1)}%</span>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    const totalsRow = `
      <tr class="totals-row">
        <td>—</td>
        <td class="td-code"></td>
        <td class="td-nombre"><strong>TOTAL</strong></td>
        <td></td>
        <td class="td-qty"><strong>${fmtNum(totalQty)}</strong></td>
        <td class="td-price"></td>
        <td class="td-total"><strong>${fmtUSD(totalUSD)}</strong></td>
        <td class="td-pct">
          <div class="pct-bar-wrap">
            <div class="pct-bar-track">
              <div class="pct-bar-fill" style="width:100%"></div>
            </div>
            <span class="pct-text">100%</span>
          </div>
        </td>
      </tr>
    `;

    tbody.innerHTML = rows + totalsRow;
  }

  /* ─── Search (debounced) ─────────────────────────────────────── */
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(renderTable, 300);
  });

  document.getElementById('sortSelect').addEventListener('change', renderTable);

  /* ─── Date Filter ────────────────────────────────────────────── */
  document.getElementById('quickBtns').addEventListener('click', e => {
    const btn = e.target.closest('.quick-btn');
    if (!btn) return;
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const val = btn.dataset.days;
    const today = new Date();
    const pad = d => d.toISOString().split('T')[0];
    if (val === '0') {
      dateFrom = null;
      dateTo = null;
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
    } else if (val === 'today') {
      dateFrom = pad(today);
      dateTo = pad(today);
      document.getElementById('dateFrom').value = dateFrom;
      document.getElementById('dateTo').value = dateTo;
    } else if (val === 'yesterday') {
      const ayer = new Date(today - 86400000);
      dateFrom = pad(ayer);
      dateTo = pad(ayer);
      document.getElementById('dateFrom').value = dateFrom;
      document.getElementById('dateTo').value = dateTo;
    } else {
      const days = parseInt(val);
      const from = new Date(today - days * 86400000);
      dateFrom = pad(from);
      dateTo = pad(today);
      document.getElementById('dateFrom').value = dateFrom;
      document.getElementById('dateTo').value = dateTo;
    }
    renderAll();
  });

  document.getElementById('btnApply').addEventListener('click', () => {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    dateFrom = from || null;
    dateTo = to || null;
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    renderAll();
  });

  /* ─── Clear Filters ──────────────────────────────────────────── */
  document.getElementById('btnClear').addEventListener('click', () => {
    dateFrom = null;
    dateTo = null;
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.quick-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.days === '0');
    });
    renderAll();

  });
</script>
</body>
</html>
