<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Despacho de Pedidos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Despachos">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f0ee;
      --surface: #ffffff;
      --surface-warm: #fafaf8;
      --text: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-muted: #9e9e9e;
      --border: #e5e5e0;
      --border-light: #f0f0ec;

      --accent: #e67e22;
      --accent-soft: #fdf0e2;
      --accent-glow: rgba(230, 126, 34, .18);

      --success: #2d9f6f;
      --success-soft: #e6f5ee;
      --success-glow: rgba(45, 159, 111, .15);

      --danger: #d94f4f;
      --danger-soft: #fce8e8;

      --header-from: #0f172a;
      --header-to: #1e293b;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;

      --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.03);
      --shadow-md: 0 4px 16px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.02);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.1);
      --shadow-glow: 0 0 30px var(--accent-glow);

      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;

      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================
       HEADER
       ========================================= */
    .header {
      background: linear-gradient(160deg, var(--header-from) 0%, var(--header-to) 100%);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      z-index: 10;
      position: relative;
      overflow: visible;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,.015) 60px,
        rgba(255,255,255,.015) 61px
      );
      pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .5;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-brand .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header-brand .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .header-brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.4px;
      white-space: nowrap;
    }

    .header-search {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .header-search input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font-ui);
      font-weight: 500;
      outline: none;
      background: rgba(255,255,255,.08);
      color: #fff;
      transition: all .25s var(--ease-out);
      backdrop-filter: blur(8px);
    }
    .header-search input::placeholder { color: rgba(255,255,255,.35); }
    .header-search input:focus {
      background: rgba(255,255,255,.14);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(230,126,34,.15);
    }
    .header-search .search-icon {
      position: absolute;
      left: 12px;
      color: rgba(255,255,255,.35);
      font-size: 13px;
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-btn {
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.75);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s var(--ease-out);
      text-transform: uppercase;
      letter-spacing: .6px;
      backdrop-filter: blur(8px);
    }
    .header-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
    .header-btn:active { transform: scale(.94); }
    .header-btn--accent {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(230,126,34,.3);
    }
    .header-btn--accent:hover { background: #d4711f; }

    #btnInstall {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all .2s var(--ease-out);
    }
    #btnInstall:active { transform: scale(.9); }

    /* =========================================
       QR SCANNER
       ========================================= */
    #qr-reader-container {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,23,42,.92);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
    }
    #qr-reader-container.active { display: flex; }
    #qr-reader {
      width: 320px;
      max-width: 88vw;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      border: 2px solid rgba(255,255,255,.1);
    }
    #qr-reader-container .qr-close {
      margin-top: 24px;
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--radius-md);
      padding: 13px 40px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: all .2s var(--ease-out);
      backdrop-filter: blur(8px);
    }
    #qr-reader-container .qr-close:hover { background: rgba(255,255,255,.18); }
    #qr-reader-container .qr-close:active { transform: scale(.95); }

    /* =========================================
       PEDIDOS PANEL
       ========================================= */
    .pedidos-panel {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,23,42,.45);
      z-index: 800;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(6px);
    }
    .pedidos-panel.active { display: flex; }
    .pedidos-panel-box {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp .35s var(--ease-out);
      box-shadow: 0 -12px 40px rgba(0,0,0,.1);
    }
    .pedidos-panel-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .pedidos-panel-header::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
    }
    .pedidos-panel-header h3 {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text);
    }
    .pedidos-panel-close {
      background: var(--bg);
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      transition: all .15s;
      line-height: 1;
    }
    .pedidos-panel-close:hover { background: var(--border); color: var(--text); }
    .pedidos-panel-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .pedidos-panel-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background .12s;
    }
    .pedidos-panel-item:active { background: var(--accent-soft); }
    .pedidos-panel-nombre {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .pedidos-panel-loading {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }
    .pedidos-panel-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* =========================================
       STATUS BAR
       ========================================= */
    .status-bar {
      display: none;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      flex-shrink: 0;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .status-bar.blocked {
      display: block;
      background: var(--danger-soft);
      color: var(--danger);
      border-bottom: 1px solid rgba(217,79,79,.15);
    }

    /* =========================================
       MAIN CONTENT
       ========================================= */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 24px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* =========================================
       LOADING / ERROR / WELCOME
       ========================================= */
    .loading-screen, .error-screen, .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      text-align: center;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-screen { color: var(--danger); }
    .error-screen .error-icon { font-size: 44px; margin-bottom: 14px; }

    .welcome-screen { color: var(--text-muted); }
    .welcome-screen .welcome-icon {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-lg);
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }
    .welcome-screen p {
      font-size: 15px;
      line-height: 1.6;
      max-width: 260px;
      color: var(--text-secondary);
    }
    .welcome-screen .welcome-hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: .3px;
    }

    /* =========================================
       PROGRESS BAR
       ========================================= */
    .progress-section {
      margin-bottom: 16px;
      animation: fadeSlideIn .4s var(--ease-out) both;
    }
    .progress-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #f0a04b);
      border-radius: 3px;
      transition: width .5s var(--ease-out);
      position: relative;
    }
    .progress-bar-fill.complete {
      background: linear-gradient(90deg, var(--success), #3ec98b);
    }
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 30px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35));
      border-radius: 3px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-label span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text-muted);
    }
    .progress-label .progress-pct {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }
    .progress-label .progress-pct.complete {
      color: var(--success);
    }

    /* =========================================
       CLIENTE SECTION
       ========================================= */
    .cliente-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
      animation: fadeSlideIn .4s .05s var(--ease-out) both;
    }
    .cliente-row {
      display: flex;
      gap: 8px;
    }
    .cliente-card {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      min-width: 0;
      transition: box-shadow .2s;
    }
    .cliente-card:hover { box-shadow: var(--shadow-md); }
    .cliente-card label {
      display: block;
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .cliente-card .value {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cliente-card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      transition: color .15s;
    }
    .cliente-card a:hover { color: #d4711f; }

    /* Tag-style status badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: .3px;
    }
    .status-badge--open { background: #eff6ff; color: #3b82f6; }
    .status-badge--closed { background: #fef3c7; color: #d97706; }
    .status-badge--dispatched { background: var(--success-soft); color: var(--success); }
    .status-badge--cancelled { background: var(--danger-soft); color: var(--danger); }

    /* =========================================
       ITEMS
       ========================================= */
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      animation: fadeSlideIn .4s .1s var(--ease-out) both;
    }
    .items-header h2 {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .items-counter {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
      padding: 5px 12px;
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }

    .item-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all .3s var(--ease-out);
      position: relative;
      border-left: 3px solid transparent;
      animation: fadeSlideIn .35s var(--ease-out) both;
    }
    .item-card:hover { box-shadow: var(--shadow-md); }
    .item-card.checked {
      background: var(--success-soft);
      border-left-color: var(--success);
      box-shadow: var(--shadow-sm), 0 0 20px var(--success-glow);
    }
    .item-card.checked .item-name { color: var(--success); }
    .item-card.checked .item-code { color: var(--success); opacity: .6; }

    .item-img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      flex-shrink: 0;
      background: var(--bg);
      transition: all .2s var(--ease-out);
      border: 1px solid var(--border-light);
    }
    .item-img:hover { transform: scale(1.06); box-shadow: var(--shadow-md); }
    .item-img:active { transform: scale(.95); }

    .item-img-placeholder {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
      border: 1px solid var(--border-light);
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      transition: color .15s;
    }
    .item-name:active { color: var(--accent); }
    .item-code {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 500;
      letter-spacing: .3px;
    }

    /* Quantity controls */
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .qty-btn {
      background: transparent;
      border: none;
      width: 30px;
      height: 32px;
      font-size: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all .15s var(--ease-out);
      user-select: none;
    }
    .qty-btn:hover { background: var(--border); color: var(--text); }
    .qty-btn:active { background: var(--accent-soft); color: var(--accent); transform: scale(.9); }
    .qty-value {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      min-width: 28px;
      text-align: center;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      height: 32px;
      line-height: 32px;
    }

    /* Custom checkbox */
    .item-check {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: all .25s var(--ease-spring);
      background: var(--surface);
    }
    .item-check:hover { border-color: var(--success); }
    .item-check:checked {
      background: var(--success);
      border-color: var(--success);
      animation: checkBounce .35s var(--ease-spring);
    }
    .item-check:checked::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 7px;
      width: 5px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }
    .item-check:active { transform: scale(.85); }

    @keyframes checkBounce {
      0% { transform: scale(.7); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .item-delete {
      background: none;
      border: none;
      color: var(--border);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
      line-height: 1;
      border-radius: 6px;
      transition: all .2s var(--ease-out);
    }
    .item-delete:hover { color: var(--danger); background: var(--danger-soft); }
    .item-delete:active { transform: scale(.85); }

    /* Static qty display (blocked mode) */
    .qty-static {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 14px;
      padding: 0 8px;
      color: var(--text);
    }

    /* =========================================
       TOOLTIP
       ========================================= */
    .tooltip-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 500;
    }
    .tooltip-overlay.active { display: block; }
    .tooltip-box {
      position: absolute;
      background: var(--header-from);
      color: #fff;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      line-height: 1.6;
      box-shadow: var(--shadow-lg);
      max-width: 260px;
      z-index: 501;
      animation: tooltipIn .2s var(--ease-out);
      border: 1px solid rgba(255,255,255,.08);
    }
    @keyframes tooltipIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .tooltip-box span { display: block; }
    .tooltip-box .tt-label {

  <!-- Firebase + Config -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>

  <script>
    // ==========================================
    // INICIALIZACION
    // ==========================================
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // AUTENTICACION
    // ==========================================
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        const currentUrl = encodeURIComponent(window.location.href);
        window.location.href = '../Admin/login.html?redirect=' + currentUrl;
        return;
      }
      const authLoading = document.getElementById('authLoading');
      if (authLoading) {
        authLoading.classList.add('hide');
        setTimeout(() => authLoading.remove(), 300);
      }
    });

    // Estado global
    let pedidoActual = null;
    let pedidoId = null;
    let sheetsData = {};       // { codigo: { imagen, nombre, codigoBarras } }
    let sheetsAllItems = [];   // Lista completa para agregar articulos
    let sheetsLoaded = false;
    let isBlocked = false;
    let deleteIdx = -1;
    let html5QrCode = null;
    let tooltipTimer = null;
    let autoSaveTimer = null;
    let realtimeListener = null;

    // ==========================================
    // HISTORIAL DE BUSQUEDA
    // ==========================================
    const HISTORIAL_KEY = 'despachos_historial';

    function getHistorial() {
      return JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
    }

    function saveToHistorial(id, nombre) {
      let hist = getHistorial();
      hist = hist.filter(h => h.id !== id);
      hist.unshift({ id, nombre: nombre || 'Sin nombre' });
      hist = hist.slice(0, 10);
      localStorage.setItem(HISTORIAL_KEY, JSON.stringify(hist));
    }

    const searchDropdown = document.getElementById('searchDropdown');

    function renderSearchDropdown() {
      const hist = getHistorial();
      if (hist.length === 0) {
        searchDropdown.classList.remove('active');
        return;
      }
      searchDropdown.innerHTML =
        '<div class="search-dropdown-header">Recientes</div>' +
        hist.map(h =>
          '<div class="search-dropdown-item" data-id="' + escapeHtml(h.id) + '">' +
          '<span class="search-dropdown-id">' + escapeHtml(h.id) + '</span>' +
          '<span class="search-dropdown-nombre">' + escapeHtml(h.nombre) + '</span>' +
          '</div>'
        ).join('');
      searchDropdown.classList.add('active');
    }

    function hideSearchDropdown() {
      searchDropdown.classList.remove('active');
    }

    function programarAutoGuardado(cambios) {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(async () => {
        if (!pedidoId || !pedidoActual) return;
        try {
          await db.ref('pedidos/' + pedidoId).update({ ...cambios, lastUpdated: Date.now() });
        } catch (err) {
          console.error('Auto-guardado error:', err);
        }
      }, 1200);
    }

    // ==========================================
    // CARGAR GOOGLE SHEETS (una sola vez)
    // ==========================================
    async function cargarSheets() {
      if (sheetsLoaded) return;
      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID}/values/${GOOGLE_SHEETS_CONFIG.RANGO}?key=${GOOGLE_SHEETS_CONFIG.API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        const rows = data.values || [];

        rows.forEach(row => {
          const codigo = (row[2] || '').trim();
          if (!codigo) return;
          const imagenRaw = row[1] || '';
          const imagenes = imagenRaw.split(',').map(u => u.trim()).filter(Boolean);
          sheetsData[codigo] = {
            imagen: imagenes[0] || '',
            nombre: (row[3] || '').trim(),
            codigoBarras: (row[11] || '').trim()
          };
          sheetsAllItems.push({
            codigo,
            nombre: (row[3] || '').trim(),
            imagen: imagenes[0] || ''
          });
        });

        sheetsLoaded = true;
      } catch (err) {
        console.error('Error cargando Google Sheets:', err);
      }
    }

    // Cargar sheets al inicio
    cargarSheets();

    // ==========================================
    // BUSCAR PEDIDO
    // ==========================================
    const pedidoInput = document.getElementById('pedidoInput');
    const btnQR = document.getElementById('btnQR');

    pedidoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const id = pedidoInput.value.trim();
        if (id) { hideSearchDropdown(); cargarPedido(id); }
      }
      if (e.key === 'Escape') hideSearchDropdown();
    });

    pedidoInput.addEventListener('focus', () => {
      renderSearchDropdown();
    });

    pedidoInput.addEventListener('blur', () => {
      setTimeout(hideSearchDropdown, 160);
    });

    searchDropdown.addEventListener('mousedown', (e) => {
      // Evitar que el blur del input se dispare antes del click
      e.preventDefault();
    });

    searchDropdown.addEventListener('click', (e) => {
      const item = e.target.closest('.search-dropdown-item');
      if (!item) return;
      const id = item.dataset.id;
      pedidoInput.value = id;
      hideSearchDropdown();
      cargarPedido(id);
    });

    // ==========================================
    // ESCANEO QR
    // ==========================================
    const qrContainer = document.getElementById('qr-reader-container');
    const btnQRClose = document.getElementById('btnQRClose');

    btnQR.addEventListener('click', async () => {
      qrContainer.classList.add('active');
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('qr-reader');
      }
      try {
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 250 },
          (decodedText) => {
            // Extraer ID del texto decodificado
            let id = decodedText;
            // Si es una URL, extraer el parametro o la ultima parte
            if (id.includes('id=')) {
              const match = id.match(/id=([^&]+)/);
              if (match) id = match[1];
            } else if (id.includes('/')) {
              id = id.split('/').pop();
            }
            id = id.trim();
            if (id) {
              pedidoInput.value = id;
              cerrarQR();
              cargarPedido(id);
            }
          },
          () => {} // error silencioso por frame
        );
      } catch (err) {
        cerrarQR();
        showToast('No se pudo acceder a la camara');
      }
    });

    btnQRClose.addEventListener('click', cerrarQR);

    function cerrarQR() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().catch(() => {});
      }
      qrContainer.classList.remove('active');
    }

    // ==========================================
    // CARGAR PEDIDO DESDE FIREBASE
    // ==========================================
    async function cargarPedido(id) {
      // Desconectar listener del pedido anterior si existe
      if (realtimeListener) {
        db.ref('pedidos/' + pedidoId).off('value', realtimeListener);
        realtimeListener = null;
      }

      pedidoId = id;
      isBlocked = false;
      const mainContent = document.getElementById('mainContent');
      const statusBar = document.getElementById('statusBar');
      const footer = document.getElementById('footerControls');

      // Mostrar loading
      statusBar.className = 'status-bar';
      statusBar.style.display = 'none';
      footer.style.display = 'none';
      mainContent.innerHTML = '<div class="loading-screen"><div class="spinner"></div><p>Cargando pedido...</p></div>';

      // Esperar a que sheets este cargado
      await cargarSheets();

      try {
        const snap = await db.ref('pedidos/' + id).once('value');
        const pedido = snap.val();

        if (!pedido) {
          mainContent.innerHTML = '<div class="error-screen"><div class="error-icon">&#10060;</div><p>Pedido no encontrado o expirado</p></div>';
          return;
        }

        pedidoActual = pedido;
        pedidoActual.id = id;

        // Verificar status bloqueado
        isBlocked = pedido.status === 'CANCELADO' || pedido.status === 'DESPACHADO/ENTREGADO';
        if (isBlocked) {
          statusBar.textContent = 'Pedido ' + pedido.status + ' - Solo lectura';
          statusBar.className = 'status-bar blocked';
          statusBar.style.display = 'block';
        }

        saveToHistorial(id, (pedidoActual.cliente || {}).nombre);
        renderPedido();
        footer.style.display = isBlocked ? 'none' : 'block';
        cargarLocalStorage();

        // Activar listener en tiempo real
        activarListenerTiempoReal(id);
      } catch (err) {
        mainContent.innerHTML = '<div class="error-screen"><div class="error-icon">&#9888;</div><p>Error al cargar: ' + err.message + '</p></div>';
      }
    }

    // ==========================================
    // LISTENER EN TIEMPO REAL
    // ==========================================
    function activarListenerTiempoReal(id) {
      const callback = (snap) => {
        const nuevoPedido = snap.val();
        if (!nuevoPedido || !pedidoActual) return;

        const itemsChanged = JSON.stringify(nuevoPedido.items) !== JSON.stringify(pedidoActual.items);
        const statusChanged = nuevoPedido.status !== pedidoActual.status;
        const notaChanged = nuevoPedido.nota !== pedidoActual.nota || nuevoPedido.notaFecha !== pedidoActual.notaFecha;
        const clienteChanged =
          JSON.stringify(nuevoPedido.cliente) !== JSON.stringify(pedidoActual.cliente) ||
          nuevoPedido.tipoPago !== pedidoActual.tipoPago ||
          nuevoPedido.tipoEntrega !== pedidoActual.tipoEntrega;
        if (!itemsChanged && !statusChanged && !notaChanged && !clienteChanged) return;

        pedidoActual = nuevoPedido;
        pedidoActual.id = id;

        if (statusChanged) {
          const footer = document.getElementById('footerControls');
          const statusBar = document.getElementById('statusBar');
          isBlocked = nuevoPedido.status === 'CANCELADO' || nuevoPedido.status === 'DESPACHADO/ENTREGADO';
          if (isBlocked) {
            statusBar.textContent = 'Pedido ' + nuevoPedido.status + ' - Solo lectura';
            statusBar.className = 'status-bar blocked';
            statusBar.style.display = 'block';
            footer.style.display = 'none';
          } else {
            statusBar.className = 'status-bar';
            statusBar.style.display = 'none';
            footer.style.display = 'block';
          }
        }

        if (itemsChanged || clienteChanged || statusChanged) {
          renderPedido();
        }

        if (notaChanged) {
          notaSelect.value = nuevoPedido.nota || '';
        }
      };

      realtimeListener = callback;
      db.ref('pedidos/' + id).on('value', callback);
    }

    // ==========================================
    // EMOJIS PARA TIPO DE PAGO Y ENTREGA
    // ==========================================
    function emojiPago(valor) {
      if (!valor) return '';
      const v = valor.toLowerCase();
      if (v.includes('efectivo'))      return '\u{1F4B5} ';
      if (v.includes('transferencia')) return '\u{1F4B3} ';
      return '';
    }

    function emojiEntrega(valor) {
      if (!valor) return '';
      const v = valor.toLowerCase();
      if (v.includes('correo'))     return '\u{1F4E6} ';
      if (v.includes('moto'))       return '\u{1F3CD}\uFE0F ';
      if (v.includes('via'))        return '\u{1F69B} ';
      if (v.includes('retiro'))     return '\u{1F3EA} ';
      return '';
    }

    function emojiStatus(valor) {
      if (!valor) return '';
      const v = valor.toUpperCase();
      if (v.includes('DESPACHADO') || v.includes('ENTREGADO')) return '\u{1F4E6} ';
      if (v.includes('CANCELADO'))  return '\u274C ';
      if (v.includes('CERRADO'))    return '\u{1F512} ';
      if (v.includes('ABIERTO'))    return '\u{1F4DD} ';
      return '';
    }

    function getStatusClass(valor) {
      if (!valor) return '';
      const v = valor.toUpperCase();
      if (v.includes('DESPACHADO') || v.includes('ENTREGADO')) return 'status-badge--dispatched';
      if (v.includes('CANCELADO'))  return 'status-badge--cancelled';
      if (v.includes('CERRADO'))    return 'status-badge--closed';
      if (v.includes('ABIERTO'))    return 'status-badge--open';
      return '';
    }

    // ==========================================
    // RENDER PEDIDO COMPLETO
    // ==========================================
    function renderPedido() {
      const mainContent = document.getElementById('mainContent');
      const cliente = pedidoActual.cliente || {};
      const items = pedidoActual.items || [];

      // Formatear telefono para WhatsApp
      let whatsappLink = '';
      if (cliente.telefono) {
        let tel = cliente.telefono.replace(/[^\d]/g, '');
        if (tel.startsWith('0')) tel = tel.substring(1);
        if (!tel.startsWith('54')) tel = '54' + tel;
        whatsappLink = 'https://api.whatsapp.com/send/?phone=' + tel;
      }

      // Calculate progress
      const checkedCount = items.filter(it => isItemChecked(it.codigo)).length;
      const progressPct = items.length > 0 ? Math.round((checkedCount / items.length) * 100) : 0;
      const isComplete = progressPct === 100 && items.length > 0;

      let html = '';

      // PROGRESS BAR
      html += '<div class="progress-section">';
      html += '<div class="progress-label"><span>Progreso</span><span class="progress-pct' + (isComplete ? ' complete' : '') + '">' + progressPct + '%</span></div>';
      html += '<div class="progress-bar-track"><div class="progress-bar-fill' + (isComplete ? ' complete' : '') + '" style="width:' + progressPct + '%"></div></div>';
      html += '</div>';

      // DATOS CLIENTE
      html += '<div class="cliente-section">';

      // Fila 1: Nombre + Telefono
      html += '<div class="cliente-row">';
      html += '<div class="cliente-card" style="flex:2"><label>Cliente</label><div class="value">' + escapeHtml(cliente.nombre || 'Sin nombre') + '</div></div>';
      html += '<div class="cliente-card"><label>Telefono</label><div class="value">' +
        (cliente.telefono
          ? '<a href="' + whatsappLink + '" target="_blank">' + escapeHtml(cliente.telefono) + ' \u{1F4AC}</a>'
          : 'N/A') +
        '</div></div>';
      html += '</div>';

      // Fila 2: Pago + Entrega + Estado
      html += '<div class="cliente-row">';
      html += '<div class="cliente-card"><label>Pago</label><div class="value tipoPagoDisplay">' + emojiPago(pedidoActual.tipoPago) + escapeHtml(pedidoActual.tipoPago || 'N/A') + '</div></div>';
      html += '<div class="cliente-card"><label>Entrega</label><div class="value tipoEntregaDisplay">' + emojiEntrega(pedidoActual.tipoEntrega) + escapeHtml(pedidoActual.tipoEntrega || 'N/A') + '</div></div>';
      html += '<div class="cliente-card"><label>Estado</label><div class="value"><span class="status-badge ' + getStatusClass(pedidoActual.status) + '">' + emojiStatus(pedidoActual.status) + escapeHtml(pedidoActual.status || 'N/A') + '</span></div></div>';
      html += '</div>';

      html += '</div>';

      // HEADER ITEMS
      const totalItems = items.reduce((s, it) => s + (it.cantidad || 0), 0);
      html += '<div class="items-header"><h2>Articulos</h2><span class="items-counter">' + items.length + ' items \u00B7 ' + totalItems + ' u.</span></div>';

      // ITEMS
      items.forEach((it, idx) => {
        const sheetInfo = sheetsData[it.codigo] || {};
        const imgUrl = sheetInfo.imagen || '';
        const checkedClass = isItemChecked(it.codigo) ? ' checked' : '';
        const delay = Math.min(idx * 0.03, 0.3);

        html += '<div class="item-card' + checkedClass + '" data-idx="' + idx + '" style="animation-delay:' + delay + 's">';

        // Imagen
        if (imgUrl) {
          html += '<img class="item-img" src="' + escapeHtml(imgUrl) + '" alt="" onclick="openLightbox(\'' + escapeHtml(imgUrl) + '\')" loading="lazy">';
        } else {
          html += '<div class="item-img-placeholder">&#128247;</div>';
        }

        // Info
        html += '<div class="item-info">';
        html += '<div class="item-name" onclick="showTooltip(event, \'' + escapeHtml(it.codigo || '') + '\')">' + escapeHtml(it.nombre || 'Sin nombre') + '</div>';
        html += '<div class="item-code">' + escapeHtml(it.codigo || '') + '</div>';
        html += '</div>';

        // Cantidad
        if (!isBlocked) {
          html += '<div class="qty-control">' +
            '<button class="qty-btn" onclick="cambiarQty(' + idx + ', -1)">\u25BC</button>' +
            '<span class="qty-value">' + (it.cantidad || 1) + '</span>' +
            '<button class="qty-btn" onclick="cambiarQty(' + idx + ', 1)">\u25B2</button>' +
            '</div>';
        } else {
          html += '<span class="qty-static">' + (it.cantidad || 1) + '</span>';
        }

        // Checkbox
        html += '<input type="checkbox" class="item-check"' + (isItemChecked(it.codigo) ? ' checked' : '') + ' onchange="toggleCheck(' + idx + ', this.checked)">';

        // Eliminar
        if (!isBlocked) {
          html += '<button class="item-delete" onclick="confirmDelete(' + idx + ')">&times;</button>';
        }

        html += '</div>';
      });

      if (items.length === 0) {
        html += '<div class="empty-items">No hay articulos en este pedido</div>';
      }

      mainContent.innerHTML = html;
    }

    // ==========================================
    // INTERACTIVIDAD DE ITEMS
    // ==========================================

    function actualizarContador() {
      const counter = document.querySelector('.items-counter');
      if (!counter || !pedidoActual || !pedidoActual.items) return;
      const items = pedidoActual.items;
      const total = items.reduce((s, it) => s + (parseInt(it.cantidad) || 0), 0);
      counter.textContent = items.length + ' items \u00B7 ' + total + ' u.';
    }

    function actualizarProgreso() {
      const items = pedidoActual.items || [];
      const checkedCount = items.filter(it => isItemChecked(it.codigo)).length;
      const pct = items.length > 0 ? Math.round((checkedCount / items.length) * 100) : 0;
      const isComplete = pct === 100 && items.length > 0;

      const fill = document.querySelector('.progress-bar-fill');
      const label = document.querySelector('.progress-pct');
      if (fill) {
        fill.style.width = pct + '%';
        fill.classList.toggle('complete', isComplete);
      }
      if (label) {
        label.textContent = pct + '%';
        label.classList.toggle('complete', isComplete);
      }
    }

    function cambiarQty(idx, delta) {
      if (!pedidoActual || !pedidoActual.items[idx]) return;
      const qty = Math.max(1, (pedidoActual.items[idx].cantidad || 1) + delta);
      pedidoActual.items[idx].cantidad = qty;
      const card = document.querySelector('.item-card[data-idx="' + idx + '"]');
      if (card) {
        const display = card.querySelector('.qty-value');
        if (display) display.textContent = qty;
      }
      actualizarContador();
      programarAutoGuardado({ items: pedidoActual.items });
    }

    // Toggle checkbox empaquetado
    function toggleCheck(idx, checked) {
      if (!pedidoActual || !pedidoActual.items[idx]) return;
      const codigo = pedidoActual.items[idx].codigo;
      const card = document.querySelector('.item-card[data-idx="' + idx + '"]');

      if (checked) {
        if (card) card.classList.add('checked');
      } else {

    function confirmDelete(idx) {
      deleteIdx = idx;
      const item = pedidoActual.items[idx];
      document.getElementById('deleteModalText').textContent = 'Eliminar "' + (item.nombre || 'articulo') + '"?';
      document.getElementById('deleteModal').classList.add('active');

    document.getElementById('deleteCancel').addEventListener('click', () => {

    document.getElementById('deleteConfirm').addEventListener('click', async () => {
      document.getElementById('deleteModal').classList.remove('active');
      if (deleteIdx < 0 || !pedidoActual) return;

      const itemEliminado = pedidoActual.items[deleteIdx];
      pedidoActual.items.splice(deleteIdx, 1);
      deleteIdx = -1;

      // Registrar en log de faltantes (localStorage)
      guardarFaltante(itemEliminado);

      // Eliminar de Firebase inmediatamente
      try {
        await db.ref('pedidos/' + pedidoId).update({
          items: pedidoActual.items,
          lastUpdated: Date.now()
        });
        renderPedido();

        showToast('Error al eliminar');
        console.error(err);

    function guardarFaltante(item) {
      if (!pedidoId || !item) return;
      const existing = JSON.parse(localStorage.getItem(getLocalKey()) || '{}');
      if (!existing.faltantes) existing.faltantes = [];
      existing.faltantes.push({
        nombre: item.nombre || '',
        codigo: item.codigo || '',
        cantidad: item.cantidad || 1
      });
      localStorage.setItem(getLocalKey(), JSON.stringify(existing));
      actualizarBtnFaltantes();
    }

    function getFaltantes() {
      if (!pedidoId) return [];
      const data = JSON.parse(localStorage.getItem(getLocalKey()) || '{}');
      return data.faltantes || [];
    }

    function limpiarFaltantes() {
      if (!pedidoId) return;
      const existing = JSON.parse(localStorage.getItem(getLocalKey()) || '{}');
      existing.faltantes = [];
      localStorage.setItem(getLocalKey(), JSON.stringify(existing));
      actualizarBtnFaltantes();
    }

    function formatearFaltantes() {
      const faltantes = getFaltantes();
      if (faltantes.length === 0) return '';
      let texto = 'Articulos faltantes:\n';
      faltantes.forEach(f => {
        texto += '- ' + f.nombre + ' (x' + f.cantidad + ')\n';
      });
      return texto.trim();
    }

    async function copiarFaltantes() {
      const texto = formatearFaltantes();
      if (!texto) {
        showToast('No hay faltantes registrados');
        return;
      }
      try {
        await navigator.clipboard.writeText(texto);
        showToast('Faltantes copiados al portapapeles');
      } catch (err) {
        // Fallback para navegadores sin clipboard API
        const ta = document.createElement('textarea');
        ta.value = texto;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Faltantes copiados al portapapeles');
      }
    }

    function actualizarBtnFaltantes() {
      const btn = document.getElementById('btnFaltantes');
      if (!btn) return;
      const count = getFaltantes().length;
      btn.textContent = count > 0 ? 'Faltantes (' + count + ')' : 'Sin faltantes';
      btn.disabled = count === 0;
      btn.style.opacity = count === 0 ? '.5' : '1';

    function renderAddItemList(filter) {
      let filtered = sheetsAllItems;
      if (filter) {
        filtered = sheetsAllItems.filter(it =>
          it.nombre.toLowerCase().includes(filter) ||
          it.codigo.toLowerCase().includes(filter)
        );
      }

      // Limitar a 50 resultados para rendimiento
      const limited = filtered.slice(0, 50);

      addItemList.innerHTML = limited.map(it =>
        '<div class="add-item-option" data-codigo="' + escapeHtml(it.codigo) + '">' +
        (it.imagen ? '<img src="' + escapeHtml(it.imagen) + '" loading="lazy">' : '<div style="width:40px;height:40px;background:var(--bg);border-radius:8px"></div>') +
        '<div><div class="opt-name">' + escapeHtml(it.nombre) + '</div><div class="opt-code">' + escapeHtml(it.codigo) + '</div></div>' +
        '</div>'
      ).join('');

      if (limited.length === 0) {
        addItemList.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-weight:500">Sin resultados</div>';
      }

      return 'despachos_' + pedidoId;

    function saveComentarioToLocal(value) {
      if (!pedidoId) return;
      const existing = JSON.parse(localStorage.getItem(getLocalKey()) || '{}');
      existing.comentario = value;
      localStorage.setItem(getLocalKey(), JSON.stringify(existing));

    function saveCheckedToLocal(codigo, checked) {
      if (!pedidoId) return;
      const existing = JSON.parse(localStorage.getItem(getLocalKey()) || '{}');

    async function cargarPedidosPendientes() {
      pedidosPanelList.innerHTML = '<div class="pedidos-panel-loading"><div class="spinner"></div>Cargando pedidos...</div>';

      try {
        // Consulta 1: status ABIERTO
        const snapAbierto = await db.ref('pedidos')
          .orderByChild('status')
          .equalTo('ABIERTO')
          .once('value');

        // Consulta 2: status CERRADO
        const snapCerrado = await db.ref('pedidos')
          .orderByChild('status')
          .equalTo('CERRADO')
          .once('value');

        const pedidos = [];

        snapAbierto.forEach(child => {
          const p = child.val();
          pedidos.push({ id: child.key, nombre: (p.cliente && p.cliente.nombre) || 'Sin nombre', status: p.status });
        });

        snapCerrado.forEach(child => {
          const p = child.val();
          pedidos.push({ id: child.key, nombre: (p.cliente && p.cliente.nombre) || 'Sin nombre', status: p.status });
        });

        if (pedidos.length === 0) {
          pedidosPanelList.innerHTML = '<div class="pedidos-panel-empty">No hay pedidos abiertos o cerrados</div>';
          return;
        }

        pedidosPanelList.innerHTML = pedidos.map(p =>
          '<div class="pedidos-panel-item" data-id="' + escapeHtml(p.id) + '">' +
          '<span class="pedidos-panel-nombre">' + escapeHtml(p.nombre) + '</span>' +
          '<span class="status-badge ' + getStatusClass(p.status) + '">' + emojiStatus(p.status) + escapeHtml(p.status) + '</span>' +
          '</div>'
        ).join('');
      } catch (err) {
        console.error('Error cargando pedidos:', err);
        pedidosPanelList.innerHTML = '<div class="pedidos-panel-empty">Error al cargar pedidos</div>';
      }
    }

        '@page { size: A4; margin: 12mm; }' +
        'body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background: #fff; color: #111; }' +
        '.rotulos-grid { display: flex; flex-direction: column; gap: 10mm; }' +
        '.rotulo { border: 2px dashed #333; border-radius: 6px; padding: 20px 28px; break-inside: avoid; page-break-inside: avoid; position: relative; }' +
        '.rotulo-qr { position: absolute; top: 29px; right: 35px; }' +
        '.rotulo-qr-img { width: 100px; height: 100px; }' +
        '.rotulo-inner { display: flex; gap: 24px; align-items: stretch; }' +
        '.rotulo-dest { flex: 1; padding-right: 110px; }' +
        '.rotulo-rem { width: 220px; flex-shrink: 0; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: flex-end; }' +
        '.rotulo-section { margin-bottom: 12px; }' +
        '.rotulo-title { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; color: #555; border-bottom: 2px solid #333; padding-bottom: 4px; margin-bottom: 12px; }' +
        '.rotulo-field { font-size: 17px; margin-bottom: 6px; line-height: 1.4; }' +
        '.rotulo-label { font-weight: bold; display: inline-block; min-width: 100px; font-size: 11px; text-transform: uppercase; color: #555; vertical-align: middle; }' +
        '.rotulo-value { font-size: 17px; font-weight: 600; vertical-align: middle; }' +
        '.rotulo-nowrap { white-space: nowrap; }' +
        '.rotulo-entrega { font-size: 15px; font-weight: bold; margin: 14px 0; padding: 8px 0; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; }' +
        '.rotulo-entrega .rotulo-label { font-size: 11px; }' +
        '.rotulo-entrega .rotulo-value { font-size: 16px; }' +
        '@media print { button { display: none !important; } }' +
        '</style></head><body>' +
        '<div class="rotulos-grid">' + rotuloHtml + '</div>' +
        '<script>window.onload = function(){ window.print(); }<\/script>' +
        '</body></html>';

      const w = window.open('', '_blank', 'width=800,height=900');
      w.document.write(html);
      w.document.close();
    }

    // ==========================================
    // UTILIDADES
    // ==========================================
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // ==========================================
    // PARAMETRO URL AUTOMATICO
    // ==========================================
    (function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        pedidoInput.value = id;
        cargarPedido(id);
      }
    })();

    // ==========================================
    // INSTALACION PWA
    // ==========================================
    let deferredPrompt = null;
    const btnInstall = document.getElementById('btnInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'block';
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btnInstall.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      btnInstall.style.display = 'none';
    });

    // ==========================================
    // REGISTRO SERVICE WORKER (PWA)
    // ==========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
