<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Articulos Necesarios</title>
  <link rel="manifest" href="manifest-necesarios.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Necesarios">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f0ee;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-muted: #9e9e9e;
      --border: #e5e5e0;
      --border-light: rgba(0,0,0,.06);
      --accent: #e67e22;
      --accent-soft: #fdf0e2;
      --success: #2d9f6f;
      --success-soft: #e6f5ee;
      --success-glow: rgba(45,159,111,.15);
      --danger: #d94f4f;
      --danger-soft: #fce8e8;
      --header-from: #0f172a;
      --header-to: #1e293b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.03);
      --shadow-md: 0 4px 16px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.02);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.1), 0 0 0 1px rgba(0,0,0,.02);
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes checkBounce {
      0% { transform: scale(.7); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* STICKY WRAPPER */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
    }

    /* HEADER */
    .header {
      background: linear-gradient(160deg, var(--header-from) 0%, var(--header-to) 100%);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .5;
    }
    .header .brand-mark {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
    }
    .header .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.4px;
      flex: 1;
    }
    .header-btn {
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.75);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s var(--ease-out);
      text-transform: uppercase;
      letter-spacing: .6px;
    }
    .header-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
    .header-btn:active { transform: scale(.94); }
    .header-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .header-btn.active:hover { background: #d4711f; }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      overflow-x: auto;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      flex: 1;
      min-width: 100px;
      text-align: center;
      transition: box-shadow .2s var(--ease-out), transform .2s var(--ease-out);
    }
    .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .stat-card .stat-value {
      font-size: 22px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--text);
    }
    .stat-card .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 2px;
    }
    .stat-card.accent .stat-value { color: var(--accent); }
    .stat-card.success .stat-value { color: var(--success); }

    /* PROGRESS BAR */
    .progress-section {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px 12px;
    }
    .progress-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .progress-bar-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width .4s var(--ease-out), background .3s;
      width: 0%;
    }
    .progress-bar-fill.complete { background: var(--success); }
    .progress-pct {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      min-width: 36px;
      text-align: right;
    }

    /* SEARCH */
    .search-bar {
      padding: 0 16px 12px;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font-ui);
      font-weight: 500;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(230,126,34,.12);
    }
    .search-bar .search-icon {
      position: absolute;
      left: 28px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* CARDS LIST */
    .cards-wrapper {
      padding: 0 16px 100px;
    }

    /* Column headers */
    .list-header {
      display: flex;
      align-items: center;
      padding: 8px 12px 8px 78px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
      gap: 12px;
    }
    .list-header .lh-info { flex: 1; }
    .list-header .lh-col {
      text-align: center;
      flex-shrink: 0;
    }
    .list-header .lh-stock { width: 52px; }
    .list-header .lh-necesario { width: 52px; }
    .list-header .lh-ok { width: 32px; }

    /* Category header */
    .category-header {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--accent);
      padding: 14px 12px 6px;
      margin-top: 4px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 8px;
    }

    /* Item card */
    .item-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all .3s var(--ease-out);
      position: relative;
      border-left: 3px solid transparent;
      animation: fadeSlideIn .35s var(--ease-out) both;
    }
    .item-card:hover { box-shadow: var(--shadow-md); }
    .item-card.card-done {
      background: var(--success-soft);
      border-left-color: var(--success);
      box-shadow: var(--shadow-sm), 0 0 20px var(--success-glow);
    }
    .item-card.card-done .item-name { color: var(--success); }
    .item-card.card-done .item-code { color: var(--success); opacity: .6; }

    /* Image */
    .item-img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      flex-shrink: 0;
      background: var(--bg);
      transition: all .2s var(--ease-out);
      border: 1px solid var(--border-light);
    }
    .item-img:hover { transform: scale(1.06); box-shadow: var(--shadow-md); }
    .item-img:active { transform: scale(.95); }

    .item-img-placeholder {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
      border: 1px solid var(--border-light);
    }

    /* Info */
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      transition: color .15s;
      line-height: 1.3;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
    }
    .longpress-tooltip {
      position: fixed;
      z-index: 9999;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      max-width: 80vw;
      white-space: normal;
      word-break: break-word;
      pointer-events: none;
      animation: tooltipIn .15s var(--ease-out);
    }
    @keyframes tooltipIn {
      from { opacity: 0; transform: scale(.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Modal detalle pedidos */
    .detalle-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn .2s var(--ease-out);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .detalle-modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 40px rgba(0,0,0,.3);
      width: 90vw;
      max-width: 400px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      animation: modalIn .25s var(--ease-out);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
    .detalle-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
    }
    .detalle-header h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 2px;
      line-height: 1.3;
    }
    .detalle-header small {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    .detalle-body {
      padding: 12px 18px 18px;
      overflow-y: auto;
      flex: 1;
    }
    .detalle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .detalle-row:last-child { border-bottom: none; }
    .detalle-cliente {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .detalle-cant {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-left: 12px;
      flex-shrink: 0;
    }
    .detalle-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .detalle-close:hover { color: var(--text); }

    /* Filtro de pedidos */
    .pedido-filtro-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .pedido-filtro-actions button {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-ui);
      color: var(--text-secondary);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .4px;
      transition: all .15s var(--ease-out);
    }
    .pedido-filtro-actions button:hover { background: var(--border); color: var(--text); }
    .pedido-filtro-actions button:active { transform: scale(.94); }
    .pedido-filtro-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .pedido-filtro-row:last-child { border-bottom: none; }
    .pedido-filtro-check {
      width: 20px; height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .pedido-filtro-nombre {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pedido-filtro-cant {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .pedido-filtro-row.excluido .pedido-filtro-nombre {
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .header-btn.has-filtro {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .item-code {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 500;
      letter-spacing: .3px;
    }
    .item-stock {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 6px;
      letter-spacing: .2px;
    }
    .item-stock.stock-zero { color: var(--danger); }
    .item-stock.stock-low  { color: #b8860b; }
    .item-stock.stock-ok   { color: var(--success); }

    /* Stock (columna) */
    .col-stock {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 14px;
      color: var(--text-secondary);
      width: 52px;
      text-align: center;
      flex-shrink: 0;
    }
    .col-stock.stock-zero { color: var(--danger); }
    .col-stock.stock-low  { color: #b8860b; }
    .col-stock.stock-ok   { color: var(--success); }

    /* Cantidad necesaria badge */
    .qty-necesaria {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      min-width: 52px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Quantity controls (pill) */
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .qty-btn {
      background: transparent;
      border: none;
      width: 30px;
      height: 32px;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all .15s var(--ease-out);
      user-select: none;
      font-family: var(--font-ui);
    }
    .qty-btn:hover { background: var(--border); color: var(--text); }
    .qty-btn:active { background: var(--accent-soft); color: var(--accent); transform: scale(.9); }
    .qty-value {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      min-width: 28px;
      text-align: center;
    }

    /* Pendiente badge */
    .pendiente-badge {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      min-width: 52px;
      text-align: center;
      flex-shrink: 0;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }
    .pendiente-positive {
      color: var(--danger);
      background: var(--danger-soft);
    }
    .pendiente-zero {
      color: var(--success);
      background: var(--success-soft);
    }

    /* Checkbox custom */
    .item-check {
      width: 22px; height: 22px;
      accent-color: var(--success);
      cursor: pointer;
      flex-shrink: 0;
    }
    .item-check.bounce {
      animation: checkBounce .3s var(--ease-spring);
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,23,42,.95);
      z-index: 900;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(16px);
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: var(--radius-md);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: lightboxIn .3s var(--ease-out);
    }
    @keyframes lightboxIn {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Loading state */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 14px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* Empty */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }

    /* INSTALL BANNER */
    .install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(160deg, var(--header-from) 0%, var(--header-to) 100%);
      color: #fff;
      padding: 14px 16px;
      z-index: 50;
      align-items: center;
      gap: 12px;
      animation: slideUpBanner .4s var(--ease-out);
      box-shadow: 0 -4px 20px rgba(0,0,0,.2);
    }
    .install-banner.active { display: flex; }
    .install-banner-icon {
      font-size: 28px;
      flex-shrink: 0;
    }
    .install-banner-text {
      flex: 1;
      min-width: 0;
    }
    .install-banner-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .install-banner-text span {
      font-size: 11px;
      color: rgba(255,255,255,.6);
    }
    .install-banner-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: .5px;
      transition: all .2s var(--ease-out);
      flex-shrink: 0;
    }
    .install-banner-btn:hover { background: #d4711f; }
    .install-banner-btn:active { transform: scale(.95); }
    .install-banner-close {
      background: none;
      border: none;
      color: rgba(255,255,255,.4);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
      transition: color .15s;
    }
    .install-banner-close:hover { color: #fff; }
    @keyframes slideUpBanner {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .item-card { padding: 10px 8px; gap: 8px; }
      .item-img, .item-img-placeholder { width: 40px; height: 40px; border-radius: 8px; }
      .item-name { font-size: 12px; }
      .qty-necesaria { font-size: 13px; min-width: 44px; }
      .col-stock { font-size: 13px; width: 44px; }
      .stat-card { padding: 10px 12px; }
      .stat-card .stat-value { font-size: 18px; }
      .list-header { padding-left: 58px; font-size: 9px; }
      .list-header .lh-stock { width: 44px; }
      .list-header .lh-necesario { width: 44px; }
    }
  </style>
</head>
<body>

  <div class="sticky-top">
    <!-- Header -->
    <div class="header">
      <div class="brand-mark"><img src="favicon.png" alt="Logo"></div>
      <button class="header-btn" style="margin-left:auto;" onclick="imprimirReporte()">&#128424; Print</button>
      <button class="header-btn active" id="filtroOkBtn" onclick="toggleFiltroSinOK()">&#9745; Faltan</button>
      <button class="header-btn" id="filtroPedidosBtn" onclick="abrirFiltroPedidos()">&#128101; Pedidos</button>
      <button class="header-btn" onclick="recargarDatos()">&#x21bb; Reload</button>
      <button class="header-btn" onclick="limpiarTodo()">&#129529; Clear</button>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="statPedidos">-</div>
        <div class="stat-label">Pedidos</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-value" id="statArticulos">-</div>
        <div class="stat-label">Artículos</div>
      </div>
      <div class="stat-card success">
        <div class="stat-value" id="statVerificados">-</div>
        <div class="stat-label">Verificados</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <span class="progress-label">Progreso</span>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <span class="search-icon">&#x1F50D;</span>
    <input type="text" id="searchInput" placeholder="Buscar artículo..." oninput="filtrarTabla()">
  </div>

  <!-- Cards -->
  <div class="cards-wrapper">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      Cargando artículos de pedidos...
    </div>
    <div id="tableContainer" style="display:none;"></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="Imagen">
  </div>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner">
    <div class="install-banner-icon">&#128242;</div>
    <div class="install-banner-text">
      <strong>Instalar en pantalla de inicio</strong>
      <span>Accede mas rapido sin abrir el navegador</span>
    </div>
    <button class="install-banner-btn" id="installBtn">Instalar</button>
    <button class="install-banner-close" id="installClose">&times;</button>
  </div>

  <!-- Firebase + Config -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let articulosMap = {}; // { codigo: { nombre, codigo, cantidadNecesaria, pedidos: [{cliente, cantidad, pedidoId}] } }
    let pedidosCount = 0;
    let sheetsData = {}; // { codigo: { imagen, nombre } }
    let sheetsLoaded = false;
    let filtroSinOK = true; // muestra solo artículos con OK sin tildar (activo por defecto)
    let todosPedidos = []; // [{ pedidoId, cliente, items: [{codigo, nombre, cantidad}] }]
    let pedidosExcluidos = new Set(); // pedidoIds deseleccionados del cálculo

    // Cargar sheets y datos en paralelo
    Promise.all([cargarSheets(), cargarDatos()]);

    // ==========================================
    // GOOGLE SHEETS (imágenes)
    // ==========================================
    async function cargarSheets() {
      if (sheetsLoaded) return;
      try {
        const url = 'https://sheets.googleapis.com/v4/spreadsheets/' +
          GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID + '/values/' +
          GOOGLE_SHEETS_CONFIG.RANGO + '?key=' + GOOGLE_SHEETS_CONFIG.API_KEY;
        const res = await fetch(url);
        const data = await res.json();
        const rows = data.values || [];

        rows.forEach(row => {
          const codigo = (row[2] || '').trim();
          if (!codigo) return;
          const imagenRaw = row[1] || '';
          const imgPartes = imagenRaw.split(',').map(u => u.trim());  // posicional (1er y 4to link)
          const stockRaw = (row[10] || '').toString().trim();
          sheetsData[codigo] = {
            imagen: imgPartes[0] || '',
            imagenAlt: imgPartes[3] || '',
            nombre: (row[3] || '').trim(),
            stock: stockRaw !== '' ? (parseInt(stockRaw, 10) || 0) : null,
            categoria: (row[0] || '').trim(),
            codigoBarras: (row[11] || '').toString().trim()
          };
        });

        sheetsLoaded = true;
        // Re-render si los datos ya están listos
        if (Object.keys(articulosMap).length > 0) renderTabla();
      } catch (err) {
        console.error('Error cargando Google Sheets:', err);
      }
    }

    // ==========================================
    // ACTUALIZAR STOCK EN TIEMPO REAL
    // ==========================================
    async function actualizarStock() {
      try {
        const url = 'https://sheets.googleapis.com/v4/spreadsheets/' +
          GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID + '/values/Lista!C2:K?key=' + GOOGLE_SHEETS_CONFIG.API_KEY;
        const res = await fetch(url);
        const data = await res.json();
        const rows = data.values || [];
        let huboCambios = false;
        rows.forEach(row => {
          const codigo = (row[0] || '').trim();
          if (!codigo) return;
          const stockRaw = (row[8] || '').toString().trim();
          const nuevoStock = stockRaw !== '' ? (parseInt(stockRaw, 10) || 0) : null;
          if (sheetsData[codigo] && sheetsData[codigo].stock !== nuevoStock) {
            sheetsData[codigo].stock = nuevoStock;
            huboCambios = true;
          }
        });
        if (huboCambios && Object.keys(articulosMap).length > 0) renderTabla();
      } catch (err) {
        console.warn('Error actualizando stock:', err);
      }
    }

    // Polling de stock cada 60 segundos
    setInterval(actualizarStock, 60000);

    // ==========================================
    // LIGHTBOX
    // ==========================================
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function openLightbox(url) {
      lightboxImg.src = url;
      lightbox.classList.add('active');
    }
    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    });

    // Fallback de imagen: 1er link -> 4to link -> placeholder
    function imgFallback(el, alt, phClass) {
      if (alt && el.dataset.imgAlt !== '1') {
        el.dataset.imgAlt = '1';
        el.src = alt;
        return;
      }
      el.onerror = null;
      const ph = document.createElement('div');
      ph.className = phClass || 'item-img-placeholder';
      ph.innerHTML = '&#128247;';
      el.replaceWith(ph);
    }

    // ==========================================
    // FIREBASE DATA
    // ==========================================
    async function cargarDatos() {
      document.getElementById('loadingState').style.display = 'flex';
      document.getElementById('tableContainer').style.display = 'none';

      try {
        const [snapAbierto, snapCerrado] = await Promise.all([
          db.ref('pedidos').orderByChild('status').equalTo('ABIERTO').once('value'),
          db.ref('pedidos').orderByChild('status').equalTo('CERRADO').once('value')
        ]);

        todosPedidos = [];
        pedidosExcluidos.clear(); // al recargar se reestablecen todos los pedidos

        const procesarSnap = (snap) => {
          snap.forEach(child => {
            const p = child.val();
            if (p.createdby !== 'web') return;
            if (p.enPreparacion === 'listo') return;

            const clienteNombre = (p.cliente && p.cliente.nombre) ? p.cliente.nombre : ('Pedido ' + child.key);
            const items = (p.items || [])
              .filter(it => it.listo !== 'y')
              .map(it => {
                const codigo = it.codigo || 'SIN_CODIGO';
                return { codigo: codigo, nombre: it.nombre || codigo, cantidad: parseInt(it.cantidad) || 0 };
              });
            if (items.length === 0) return;
            todosPedidos.push({ pedidoId: child.key, cliente: clienteNombre, items: items });
          });
        };

        procesarSnap(snapAbierto);
        procesarSnap(snapCerrado);

        construirArticulosMap();
        renderTabla();
        actualizarFiltroPedidosBtn();
      } catch (err) {
        console.error('Error cargando datos:', err);
        document.getElementById('loadingState').innerHTML = '<span style="color:var(--danger);">Error al cargar datos</span>';
      }
    }

    // Construye articulosMap a partir de los pedidos NO excluidos.
    function construirArticulosMap() {
      articulosMap = {};
      pedidosCount = 0;
      todosPedidos.forEach(p => {
        if (pedidosExcluidos.has(p.pedidoId)) return;
        pedidosCount++;
        p.items.forEach(it => {
          const codigo = it.codigo;
          if (!articulosMap[codigo]) {
            articulosMap[codigo] = {
              codigo: codigo,
              nombre: it.nombre,
              cantidadNecesaria: 0,
              pedidos: []
            };
          }
          articulosMap[codigo].cantidadNecesaria += it.cantidad;
          articulosMap[codigo].pedidos.push({ cliente: p.cliente, cantidad: it.cantidad, pedidoId: p.pedidoId });
        });
      });
    }

    // ==========================================
    // FILTRO DE PEDIDOS (incluir/excluir del cálculo)
    // ==========================================
    function aplicarFiltroPedidos() {
      construirArticulosMap();
      renderTabla();
      actualizarFiltroPedidosBtn();
    }

    function actualizarFiltroPedidosBtn() {
      const btn = document.getElementById('filtroPedidosBtn');
      if (!btn) return;
      btn.classList.toggle('has-filtro', pedidosExcluidos.size > 0);
    }

    function abrirFiltroPedidos() {
      if (todosPedidos.length === 0) return;
      const overlay = document.createElement('div');
      overlay.className = 'detalle-overlay';

      const actualizarContador = () => {
        const small = overlay.querySelector('.detalle-header small');
        if (small) small.textContent = (todosPedidos.length - pedidosExcluidos.size) + ' de ' + todosPedidos.length + ' incluidos en el cálculo';
      };

      const render = () => {
        const lista = [...todosPedidos].sort((a, b) => a.cliente.localeCompare(b.cliente, 'es'));
        let filas = '';
        lista.forEach(p => {
          const incluido = !pedidosExcluidos.has(p.pedidoId);
          const totalItems = p.items.reduce((s, it) => s + it.cantidad, 0);
          filas += '<label class="pedido-filtro-row' + (incluido ? '' : ' excluido') + '">' +
            '<input type="checkbox" class="pedido-filtro-check" data-pedido="' + escapeHtml(p.pedidoId) + '" ' + (incluido ? 'checked' : '') + '>' +
            '<span class="pedido-filtro-nombre">' + escapeHtml(p.cliente) + '</span>' +
            '<span class="pedido-filtro-cant">' + totalItems + ' art.</span>' +
            '</label>';
        });
        overlay.innerHTML =
          '<div class="detalle-modal" style="position:relative;">' +
            '<button class="detalle-close">&times;</button>' +
            '<div class="detalle-header">' +
              '<h3>Filtrar pedidos</h3>' +
              '<small>' + (todosPedidos.length - pedidosExcluidos.size) + ' de ' + todosPedidos.length + ' incluidos en el cálculo</small>' +
              '<div class="pedido-filtro-actions">' +
                '<button data-action="todos">Todos</button>' +
                '<button data-action="ninguno">Ninguno</button>' +
              '</div>' +
            '</div>' +
            '<div class="detalle-body">' + filas + '</div>' +
          '</div>';
      };

      render();

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay || e.target.classList.contains('detalle-close')) { overlay.remove(); return; }
        const action = e.target.getAttribute && e.target.getAttribute('data-action');
        if (action === 'todos') {
          pedidosExcluidos.clear();
          aplicarFiltroPedidos();
          render();
        } else if (action === 'ninguno') {
          todosPedidos.forEach(p => pedidosExcluidos.add(p.pedidoId));
          aplicarFiltroPedidos();
          render();
        }
      });

      overlay.addEventListener('change', function(e) {
        const cb = e.target.closest('.pedido-filtro-check');
        if (!cb) return;
        const id = cb.getAttribute('data-pedido');
        if (cb.checked) pedidosExcluidos.delete(id);
        else pedidosExcluidos.add(id);
        const row = cb.closest('.pedido-filtro-row');
        if (row) row.classList.toggle('excluido', !cb.checked);
        aplicarFiltroPedidos();
        actualizarContador();
      });

      document.body.appendChild(overlay);
    }

    // ==========================================
    // HELPERS
    // ==========================================
    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function getVerificado(codigo) {
      return localStorage.getItem('armado_verificado_' + codigo) === 'true';
    }

    function setVerificado(codigo, val) {
      localStorage.setItem('armado_verificado_' + codigo, val ? 'true' : 'false');
    }

    // ==========================================
    // RENDER
    // ==========================================
    function renderTabla() {
      const articulos = Object.values(articulosMap);
      articulos.forEach(art => {
        const si = sheetsData[art.codigo];
        art._categoria = (si && si.categoria) ? si.categoria : 'Sin categoría';
      });
      articulos.sort((a, b) => {
        const catCmp = a._categoria.localeCompare(b._categoria, 'es');
        if (catCmp !== 0) return catCmp;
        return a.nombre.localeCompare(b.nombre, 'es');
      });

      document.getElementById('loadingState').style.display = 'none';
      const container = document.getElementById('tableContainer');
      container.style.display = 'block';

      if (articulos.length === 0) {
        container.innerHTML = '<div class="empty-state">No hay artículos pendientes de armado</div>';
        actualizarStats();
        return;
      }

      // Column headers
      let html = '<div class="list-header">' +
        '<span class="lh-info">Artículo</span>' +
        '<span class="lh-col lh-stock">Stock</span>' +
        '<span class="lh-col lh-necesario">Neces.</span>' +
        '<span class="lh-col lh-ok">OK</span>' +
        '</div>';

      let currentCat = null;
      articulos.forEach((art, i) => {
        if (art._categoria !== currentCat) {
          currentCat = art._categoria;
          html += '<div class="category-header">' + escapeHtml(currentCat) + '</div>';
        }
        const verificado = getVerificado(art.codigo);
        const cardClass = verificado ? ' card-done' : '';
        const delay = Math.min(i * 0.03, 0.5);

        const sheetInfo = sheetsData[art.codigo] || {};
        const imgUrl = sheetInfo.imagen || '';
        const imgUrlAlt = sheetInfo.imagenAlt || '';
        const codigoEsc = escapeHtml(art.codigo).replace(/'/g, "\\'");

        html += '<div class="item-card art-row' + cardClass + '" data-codigo="' + escapeHtml(art.codigo) + '" data-nombre="' + escapeHtml(art.nombre.toLowerCase()) + '" style="animation-delay:' + delay + 's">';

        // Imagen
        if (imgUrl || imgUrlAlt) {
          const imgSrc = imgUrl || imgUrlAlt;
          const imgAlt = imgUrlAlt !== imgSrc ? imgUrlAlt : '';
          html += '<img class="item-img" src="' + escapeHtml(imgSrc) + '" alt=""'
            + ' onclick="openLightbox(this.src)"'
            + ' onerror="imgFallback(this, \'' + escapeHtml(imgAlt).replace(/'/g, "\\'") + '\')" loading="lazy">';
        } else {
          html += '<div class="item-img-placeholder">&#128247;</div>';
        }

        // Info
        const stockVal = sheetInfo.stock;
        const stockClass = (stockVal !== null && Number.isFinite(stockVal))
          ? (stockVal <= 0 ? ' stock-zero' : stockVal <= 10 ? ' stock-low' : ' stock-ok') : '';
        const stockCol = (stockVal !== null && Number.isFinite(stockVal)) ? stockVal : '—';
        const codBarras = (sheetInfo.codigoBarras || '').trim();
        const codigoDisplay = escapeHtml(art.codigo) + (codBarras ? ' - ' + escapeHtml(codBarras) : '');
        html += '<div class="item-info">' +
          '<div class="item-name" title="' + escapeHtml(art.nombre) + '">' + escapeHtml(art.nombre) + '</div>' +
          '<div class="item-code">' + codigoDisplay + '</div>' +
          '</div>';

        // Stock (columna a la izquierda de Necesario)
        html += '<span class="col-stock' + stockClass + '">' + stockCol + '</span>';

        // Cantidad necesaria
        html += '<span class="qty-necesaria">' + art.cantidadNecesaria + '</span>';

        // Checkbox
        html += '<input type="checkbox" class="item-check" ' + (verificado ? 'checked' : '') + ' onchange="onVerificadoChange(this, \'' + codigoEsc + '\')">';

        html += '</div>';
      });

      container.innerHTML = html;
      actualizarStats();
      filtrarTabla();
    }

    // ==========================================
    // ACCIONES
    // ==========================================
    function onVerificadoChange(checkbox, codigo) {
      const checked = checkbox.checked;
      setVerificado(codigo, checked);

      if (checked) {
        checkbox.classList.add('bounce');
        setTimeout(() => checkbox.classList.remove('bounce'), 300);
      }

      const card = checkbox.closest('.item-card');
      card.classList.toggle('card-done', checked);

      actualizarStats();

      // Si el filtro "Sin OK" está activo y se acaba de tildar, ocultar la fila
      if (filtroSinOK) filtrarTabla();
    }

    function actualizarStats() {
      const articulos = Object.values(articulosMap);
      let verificados = 0;
      articulos.forEach(art => {
        if (getVerificado(art.codigo)) verificados++;
      });
      document.getElementById('statPedidos').textContent = pedidosCount;
      document.getElementById('statArticulos').textContent = articulos.length;
      document.getElementById('statVerificados').textContent = verificados + '/' + articulos.length;

      // Progress bar
      const pct = articulos.length > 0 ? Math.round((verificados / articulos.length) * 100) : 0;
      const fill = document.getElementById('progressFill');
      const pctLabel = document.getElementById('progressPct');
      fill.style.width = pct + '%';
      fill.classList.toggle('complete', pct >= 100);
      pctLabel.textContent = pct + '%';
    }

    function filtrarTabla() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('.art-row').forEach(row => {
        const nombre = row.getAttribute('data-nombre') || '';
        const codigo = row.getAttribute('data-codigo') || '';
        const coincideBusqueda = (!q || nombre.includes(q) || codigo.toLowerCase().includes(q));
        const pasaFiltroOk = !filtroSinOK || !getVerificado(codigo);
        row.style.display = (coincideBusqueda && pasaFiltroOk) ? '' : 'none';
      });
      ocultarCategoriasVacias();
    }

    // Oculta los encabezados de categoría que no tienen artículos visibles
    function ocultarCategoriasVacias() {
      const container = document.getElementById('tableContainer');
      const hijos = Array.from(container.children);
      hijos.forEach((el, idx) => {
        if (!el.classList.contains('category-header')) return;
        let hayVisible = false;
        for (let j = idx + 1; j < hijos.length; j++) {
          if (hijos[j].classList.contains('category-header')) break;
          if (hijos[j].classList.contains('art-row') && hijos[j].style.display !== 'none') {
            hayVisible = true;
            break;
          }
        }
        el.style.display = hayVisible ? '' : 'none';
      });
    }

    function toggleFiltroSinOK() {
      filtroSinOK = !filtroSinOK;
      const btn = document.getElementById('filtroOkBtn');
      btn.classList.toggle('active', filtroSinOK);
      btn.innerHTML = (filtroSinOK ? '☑' : '☐') + ' Faltan';
      filtrarTabla();
    }

    function recargarDatos() {
      cargarDatos();
    }

    function limpiarTodo() {
      if (!confirm('¿Limpiar todos los valores de Disponibles y Verificados?')) return;
      // Barrer TODAS las claves de localStorage con los prefijos, sin importar
      // si el artículo está visible, filtrado o ya no presente en articulosMap.
      const aEliminar = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.startsWith('armado_preparado_') || k.startsWith('armado_verificado_'))) {
          aEliminar.push(k);
        }
      }
      aEliminar.forEach(k => localStorage.removeItem(k));
      // Reestablecer todos los pedidos en el cálculo
      pedidosExcluidos.clear();
      construirArticulosMap();
      renderTabla();
      actualizarFiltroPedidosBtn();
    }

    // ==========================================
    // CONFIRMAR RECARGA / CIERRE ACCIDENTAL
    // ==========================================
    window.addEventListener('beforeunload', function(e) {
      e.preventDefault();
      // Requerido por algunos navegadores para disparar el cartel nativo.
      e.returnValue = '';
      return '';
    });

    // ==========================================
    // PWA: SERVICE WORKER + INSTALACION
    // ==========================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw-necesarios.js', { scope: './necesarios.html' }).catch(() => {});
    }

    let deferredPrompt = null;
    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const installClose = document.getElementById('installClose');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.classList.add('active');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const result = await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBanner.classList.remove('active');
    });

    installClose.addEventListener('click', () => {
      installBanner.classList.remove('active');
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBanner.classList.remove('active');
      deferredPrompt = null;
    });

    function imprimirReporte() {
      const articulos = Object.values(articulosMap);
      if (articulos.length === 0) return;
      articulos.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

      const fecha = new Date().toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      let filas = '';
      articulos.forEach((art, i) => {
        const verificado = getVerificado(art.codigo);
        const sheetInfo = sheetsData[art.codigo] || {};
        const stockVal = sheetInfo.stock;
        const stockCol = (stockVal !== null && Number.isFinite(stockVal)) ? stockVal : '—';
        const rowClass = verificado ? ' class="row-done"' : '';
        filas += '<tr' + rowClass + '>' +
          '<td class="col-num">' + (i + 1) + '</td>' +
          '<td class="col-nombre">' + escapeHtml(art.nombre) + '</td>' +
          '<td class="col-codigo">' + escapeHtml(art.codigo) + '</td>' +
          '<td class="col-stock">' + stockCol + '</td>' +
          '<td class="col-cant">' + art.cantidadNecesaria + '</td>' +
          '<td class="col-check">' + (verificado ? '&#10003;' : '') + '</td>' +
          '</tr>';
      });

      const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte Articulos Necesarios</title>' +
        '<style>' +
        '@page { size: A4; margin: 12mm 10mm; }' +
        '* { margin: 0; padding: 0; box-sizing: border-box; }' +
        'body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #1a1a1a; }' +
        '.report-header { text-align: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #1a1a1a; }' +
        '.report-header h1 { font-size: 18px; font-weight: 800; margin-bottom: 2px; }' +
        '.report-header .fecha { font-size: 11px; color: #666; }' +
        '.report-header .stats { font-size: 11px; color: #444; margin-top: 4px; }' +
        'table { width: 100%; border-collapse: collapse; }' +
        'thead th { background: #0f172a; color: #fff; padding: 6px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; text-align: left; }' +
        'thead th.col-num { width: 28px; text-align: center; }' +
        'thead th.col-codigo { width: 100px; }' +
        'thead th.col-stock, thead th.col-cant { width: 55px; text-align: center; }' +
        'thead th.col-check { width: 32px; text-align: center; }' +
        'tbody td { padding: 5px 8px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }' +
        'tbody td.col-num { text-align: center; color: #999; font-size: 10px; }' +
        'tbody td.col-codigo { font-family: "Courier New", monospace; font-size: 10px; color: #666; }' +
        'tbody td.col-stock, tbody td.col-cant { text-align: center; font-weight: 700; font-family: "Courier New", monospace; }' +
        'tbody td.col-check { text-align: center; font-size: 14px; color: #2d9f6f; }' +
        'tbody tr:nth-child(even) { background: #f8f8f6; }' +
        'tbody tr.row-done { background: #e6f5ee; }' +
        'tbody tr.row-done td.col-nombre { color: #2d9f6f; }' +
        '@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }' +
        '</style></head><body>' +
        '<div class="report-header">' +
        '<h1>Articulos Necesarios</h1>' +
        '<div class="fecha">' + fecha + '</div>' +
        '<div class="stats">' + pedidosCount + ' pedidos &middot; ' + articulos.length + ' articulos</div>' +
        '</div>' +
        '<table>' +
        '<thead><tr>' +
        '<th class="col-num">#</th>' +
        '<th>Articulo</th>' +
        '<th class="col-codigo">Codigo</th>' +
        '<th class="col-stock">Stock</th>' +
        '<th class="col-cant">Neces.</th>' +
        '<th class="col-check">OK</th>' +
        '</tr></thead>' +
        '<tbody>' + filas + '</tbody>' +
        '</table></body></html>';

      const win = window.open('', '_blank');
      win.document.write(html);
      win.document.close();
      win.focus();
      win.print();
    }

    // ==========================================
    // DOBLE CLICK — Detalle de pedidos por artículo
    // ==========================================
    function mostrarDetallePedidos(codigo) {
      const art = articulosMap[codigo];
      if (!art || !art.pedidos || art.pedidos.length === 0) return;

      const overlay = document.createElement('div');
      overlay.className = 'detalle-overlay';

      let filas = '';
      art.pedidos.forEach(p => {
        filas += '<div class="detalle-row">' +
          '<span class="detalle-cliente">' + escapeHtml(p.cliente) + '</span>' +
          '<span class="detalle-cant">' + p.cantidad + '</span>' +
          '</div>';
      });

      overlay.innerHTML =
        '<div class="detalle-modal" style="position:relative;">' +
          '<button class="detalle-close">&times;</button>' +
          '<div class="detalle-header">' +
            '<h3>' + escapeHtml(art.nombre) + '</h3>' +
            '<small>' + escapeHtml(art.codigo) + ' &mdash; Total: ' + art.cantidadNecesaria + '</small>' +
          '</div>' +
          '<div class="detalle-body">' + filas + '</div>' +
        '</div>';

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay || e.target.classList.contains('detalle-close')) overlay.remove();
      });
      document.body.appendChild(overlay);
    }

    document.getElementById('tableContainer').addEventListener('dblclick', function(e) {
      const card = e.target.closest('.item-card');
      if (!card) return;
      const codigo = card.getAttribute('data-codigo');
      if (codigo) mostrarDetallePedidos(codigo);
    });

    // ==========================================
    // LONG-PRESS TOOLTIP para nombres truncados
    // ==========================================
    (function() {
      let lpTimer = null;
      let tooltip = null;
      const LONG_PRESS_MS = 400;

      function removeTooltip() {
        if (tooltip) { tooltip.remove(); tooltip = null; }
      }

      function showTooltip(el, x, y) {
        removeTooltip();
        // Solo mostrar si el texto está realmente truncado
        if (el.scrollWidth <= el.clientWidth) return;
        tooltip = document.createElement('div');
        tooltip.className = 'longpress-tooltip';
        tooltip.textContent = el.textContent;
        document.body.appendChild(tooltip);
        // Posicionar encima del dedo/cursor
        const rect = tooltip.getBoundingClientRect();
        let left = x - rect.width / 2;
        let top = y - rect.height - 12;
        if (left < 8) left = 8;
        if (left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
        if (top < 8) top = y + 20;
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
      }

      const container = document.getElementById('tableContainer');

      container.addEventListener('touchstart', function(e) {
        const el = e.target.closest('.item-name');
        if (!el) return;
        const touch = e.touches[0];
        lpTimer = setTimeout(() => showTooltip(el, touch.clientX, touch.clientY), LONG_PRESS_MS);
      }, { passive: true });

      container.addEventListener('touchend', function() {
        clearTimeout(lpTimer);
        setTimeout(removeTooltip, 1500);
      });

      container.addEventListener('touchmove', function() {
        clearTimeout(lpTimer);
        removeTooltip();
      });

      // Mouse: mostrar en hover si truncado
      container.addEventListener('mousedown', function(e) {
        const el = e.target.closest('.item-name');
        if (!el) return;
        lpTimer = setTimeout(() => showTooltip(el, e.clientX, e.clientY), LONG_PRESS_MS);
      });

      container.addEventListener('mouseup', function() {
        clearTimeout(lpTimer);
        setTimeout(removeTooltip, 1500);
      });

      container.addEventListener('mouseleave', function() {
        clearTimeout(lpTimer);
        removeTooltip();
      });
    })();
  </script>
</body>
</html>
