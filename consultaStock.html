<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Fuera de los buscadores: noindex impide que Google indexe la pagina y
         nofollow que siga sus enlaces. Debe quedar rastreable en robots.txt,
         porque si se bloquea el crawleo Google nunca lee esta etiqueta. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Consulta de Stock</title>
    <link rel="icon" href="faviconnegro.png" type="image/png">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="config.js"></script>

    <!-- Tipografías: Manrope para la interfaz y JetBrains Mono para códigos. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700&display=swap">

    <style>
        /* ------------------------------------------------------------ tokens -- */
        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --surface-2: #f3f3f1;
            --ink: #23262b;
            --ink-2: #5f646c;
            --ink-3: #969ba3;
            --line: rgba(35, 38, 43, 0.07);
            --line-strong: rgba(35, 38, 43, 0.12);
            --accent: #5b6b7d;
            --accent-soft: #e9edf1;
            --mark: #fff1c2;
            --ok: #4f7d64;
            --ok-soft: #edf4ef;
            --warn: #9a7a3c;
            --warn-soft: #f7f1e4;
            --bad: #a85a55;
            --bad-soft: #f8ecea;
            --bar: rgba(247, 247, 245, 0.82);
            --shadow-card: 0 1px 2px rgba(35, 38, 43, 0.04), 0 8px 24px -16px rgba(35, 38, 43, 0.14);
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --font-ui: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        }

        /* -------------------------------------------------------------- base -- */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-ui);
            font-size: 0.9375rem;
            line-height: 1.5;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            font-feature-settings: 'tnum' 1;
        }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ---------------------------------------- cabecera fija (barra + buscador) -- */
        .top {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bar);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--line);
        }
        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            height: 52px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }
        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--surface);
            border: 1px solid var(--line-strong);
            color: var(--ink-2);
        }
        .brand-mark svg { width: 15px; height: 15px; }
        .pv {
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
        }
        .spacer { flex: 1; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.8125rem;
            color: var(--ink-3);
            white-space: nowrap;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 3px var(--ok-soft);
        }
        .status.is-loading .status-dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 1.2s ease-in-out infinite; }
        .status.is-error .status-dot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
        @keyframes pulse { 50% { opacity: 0.35; } }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: none;
            background: transparent;
            border-radius: 9px;
            cursor: pointer;
            color: var(--ink-2);
            transition: transform 120ms ease-out, background 160ms ease, color 160ms ease;
        }
        .icon-btn:hover { color: var(--ink); background: var(--surface-2); }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 16px; height: 16px; }
        .icon-btn.is-spinning svg { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .user {
            display: none;
            align-items: center;
            gap: 0.15rem;
            padding-left: 0.6rem;
            margin-left: 0.15rem;
            border-left: 1px solid var(--line-strong);
        }
        .user.show { display: inline-flex; }
        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 0.75rem;
            background: var(--accent-soft);
            color: var(--accent);
        }
        #logoutBtn:hover { color: var(--bad); }

        /* Buscador: el protagonista de la página */
        .finder { padding: 0.5rem 0 0.9rem; }
        .search { position: relative; display: block; }
        .search > svg {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            width: 20px;
            height: 20px;
            transform: translateY(-50%);
            color: var(--ink-3);
            pointer-events: none;
            transition: color 160ms ease;
        }
        .search input {
            width: 100%;
            height: 56px;
            padding: 0 7.5rem 0 3.1rem;
            border-radius: 14px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            color: var(--ink);
            font: inherit;
            font-size: 1.0625rem;
            font-weight: 500;
            outline: none;
            box-shadow: var(--shadow-card);
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }
        .search input::placeholder { color: var(--ink-3); font-weight: 400; }
        .search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-card);
        }
        .search:focus-within > svg { color: var(--accent); }
        .search-end {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .count {
            font-size: 0.8125rem;
            color: var(--ink-3);
            white-space: nowrap;
        }
        .count strong { color: var(--ink); font-weight: 700; }
        .kbd {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            border: 1px solid var(--line-strong);
            color: var(--ink-3);
        }
        .clear-btn {
            display: none;
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--ink-2);
            cursor: pointer;
            place-items: center;
            transition: transform 120ms ease-out, background 160ms ease;
        }
        .clear-btn:hover { background: var(--line-strong); }
        .clear-btn:active { transform: scale(0.88); }
        .clear-btn svg { width: 12px; height: 12px; }
        .search.has-value .clear-btn { display: grid; }
        .search.has-value .kbd { display: none; }

        /* Filtros rápidos */
        .chips {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.7rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            --tone: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink-2);
            white-space: nowrap;
            cursor: pointer;
            transition: transform 120ms ease-out, background 160ms ease, border-color 160ms ease, color 160ms ease;
        }
        .chip:hover { border-color: var(--ink-3); color: var(--ink); }
        .chip:active { transform: scale(0.96); }
        .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--tone); }
        .chip b { font-weight: 700; color: var(--ink-3); transition: color 160ms ease; }
        .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
        .chip[aria-pressed="true"] b { color: rgba(255,255,255,0.65); }
        .chip[data-filtro="todos"] i { display: none; }
        .chip[data-filtro="bajo"] { --tone: var(--warn); }
        .chip[data-filtro="sin"], .chip[data-filtro="negativo"] { --tone: var(--bad); }

        /* -------------------------------------------------------------- tabla -- */
        main { padding-top: 1.25rem; padding-bottom: 3rem; }
        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            text-align: left;
            padding: 0;
            border-bottom: 1px solid var(--line);
            background: var(--surface-2);
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--ink-3);
        }
        thead th.num { text-align: right; }
        .sort-btn {
            all: unset;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            width: 100%;
            padding: 0.7rem 1rem;
            cursor: pointer;
            transition: color 160ms ease;
        }
        th.num .sort-btn { justify-content: flex-end; }
        .sort-btn:hover { color: var(--ink); }
        .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
        .sort-icon { width: 9px; height: 9px; opacity: 0; transition: opacity 160ms ease, transform 220ms var(--ease-out); }
        th[aria-sort] .sort-btn { color: var(--ink); }
        th[aria-sort] .sort-icon { opacity: 1; }
        th[aria-sort="descending"] .sort-icon { transform: rotate(180deg); }

        tbody td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 120ms ease; }
        tbody tr:hover { background: var(--surface-2); }
        tbody tr.enter { animation: rise 360ms var(--ease-out) both; animation-delay: calc(var(--i) * 14ms); }

        td.num { text-align: right; }
        .code { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--ink-3); white-space: nowrap; }
        .name { font-weight: 600; }
        mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
        .total { color: var(--ink-2); }
        .date { color: var(--ink-2); white-space: nowrap; font-size: 0.875rem; }
        .date-rel { display: block; font-size: 0.75rem; color: var(--ink-3); }

        .qty {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 3rem;
            padding: 0.15rem 0.6rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            background: var(--ok-soft);
            color: var(--ok);
        }
        .qty.low { background: var(--warn-soft); color: var(--warn); }
        .qty.zero { background: var(--bad-soft); color: var(--bad); }

        .skeleton td { padding: 1rem; }
        .skeleton span {
            display: block;
            height: 11px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--surface-2), var(--line-strong), var(--surface-2));
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
        }
        @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

        .empty { padding: 3.5rem 1rem; text-align: center; color: var(--ink-3); }
        .empty strong { display: block; font-size: 1.05rem; color: var(--ink); margin-bottom: 0.2rem; }

        .error-banner {
            display: none;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.9rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            background: var(--bad-soft);
            color: var(--bad);
            font-weight: 600;
            font-size: 0.875rem;
        }
        .error-banner.show { display: flex; }
        .error-banner svg { width: 18px; height: 18px; flex: none; }

        .print-head { display: none; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        /* ---------------------------------------------------------- responsive -- */
        @media (max-width: 760px) {
            .status-text, #printBtn { display: none; }
        }
        @media (max-width: 640px) {
            .wrap { padding-left: 1rem; padding-right: 1rem; }
            .brand-name { display: none; }
            .search input { height: 52px; font-size: 1rem; padding-right: 5.5rem; }
            .kbd { display: none; }

            /* Filas como tarjetas */
            thead { display: none; }
            table, tbody { display: block; }
            tbody tr {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 0.1rem 1rem;
                padding: 0.85rem 1rem;
                border-bottom: 1px solid var(--line);
            }
            tbody tr:last-child { border-bottom: none; }
            tbody td { padding: 0; border: none; }
            td.c-codigo { grid-column: 1; grid-row: 1; }
            td.c-nombre { grid-column: 1; grid-row: 2; }
            td.c-stock { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
            td.c-total, td.c-fecha { grid-row: 3; font-size: 0.75rem; color: var(--ink-3); padding-top: 0.2rem; }
            td.c-total { grid-column: 1; text-align: left; }
            td.c-fecha { grid-column: 2; text-align: right; }
            td.c-total::before { content: 'Total: '; }
            .date { font-size: 0.75rem; }
            .date-rel { display: none; }
            .skeleton, .empty-row { display: block !important; }
            .skeleton td, .empty-row td { display: block; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 1ms !important;
                animation-delay: 0ms !important;
                transition-duration: 1ms !important;
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .top { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
        }

        /* ------------------------------------------------------------ impresión -- */
        @media print {
            body { background: #fff; color: #000; font-size: 10pt; }
            .top, .error-banner, .date-rel { display: none !important; }
            main { padding: 0; }
            .wrap { max-width: none; padding: 0; }
            .panel { border: none; box-shadow: none; border-radius: 0; }
            .print-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #000; padding-bottom: 4pt; margin-bottom: 6pt; }
            .print-head h2 { margin: 0; font-size: 16pt; }
            thead th { background: none; color: #000; border-bottom: 1.5px solid #000; }
            .sort-btn { padding: 3pt 5pt; }
            .sort-icon { display: none; }
            tbody td { padding: 3pt 5pt; border-bottom: 0.5pt solid #999; }
            tbody tr { break-inside: avoid; animation: none !important; }
            mark { background: none; }
            .qty { background: none !important; color: #000 !important; padding: 0; min-width: 0; font-size: inherit; }
            .qty.low::after { content: ' ⚠'; }
            .qty.zero::after { content: ' ✕'; }
            .code, .total, .date { color: #000; }
        }
    </style>
</head>
<body>
    <header class="top">
        <div class="wrap">
            <div class="bar">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>
                    </span>
                    <span class="brand-name">Consulta de stock</span>
                    <span class="pv" id="puntoLabel">PV 1</span>
                </div>
                <div class="spacer"></div>
                <div class="status" id="status" role="status" aria-live="polite">
                    <span class="status-dot"></span>
                    <span class="status-text" id="statusText">Conectando…</span>
                </div>
                <button class="icon-btn" id="refreshStockBtn" type="button" title="Actualizar ahora" aria-label="Actualizar ahora">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
                <button class="icon-btn" id="printBtn" type="button" title="Imprimir" aria-label="Imprimir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>
                </button>
                <div class="user" id="userChip">
                    <span class="user-avatar" id="userAvatar"></span>
                    <button class="icon-btn" id="logoutBtn" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17-5-5 5-5"/><path d="M5 12h12"/></svg>
                    </button>
                </div>
            </div>

            <div class="finder">
                <label class="search" id="searchBox">
                    <span class="sr-only">Buscar artículo</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="text" id="searchInput" placeholder="¿Qué artículo buscás? Código o nombre" autocomplete="off" spellcheck="false" autofocus>
                    <span class="search-end">
                        <span class="count" id="resultCounter"></span>
                        <span class="kbd" aria-hidden="true">/</span>
                        <button class="clear-btn" id="clearBtn" type="button" title="Limpiar búsqueda" aria-label="Limpiar búsqueda">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        </button>
                    </span>
                </label>
                <div class="chips" role="group" aria-label="Filtros rápidos">
                    <button class="chip" type="button" data-filtro="todos" aria-pressed="true">Todos <b id="kpiTodos">—</b></button>
                    <button class="chip" type="button" data-filtro="bajo" aria-pressed="false"><i></i>Stock bajo <b id="kpiBajo">—</b></button>
                    <button class="chip" type="button" data-filtro="sin" aria-pressed="false"><i></i>Sin stock <b id="kpiSin">—</b></button>
                    <button class="chip" type="button" data-filtro="negativo" aria-pressed="false"><i></i>Negativos <b id="kpiNegativo">—</b></button>
                </div>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="error-banner" id="errorMsg" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <span id="errorText"></span>
        </div>
        <section class="panel">
            <div class="print-head">
                <h2>Consulta de stock</h2>
                <span id="printMeta"></span>
            </div>
            <table id="stockTable">
                <thead>
                    <tr>
                        <th data-column="codigo"><button class="sort-btn" type="button">Código<svg class="sort-icon" viewBox="0 0 10 10"><path d="M5 2 9 7H1z" fill="currentColor"/></svg></button></th>
                        <th data-column="nombre"><button class="sort-btn" type="button">Artículo<svg class="sort-icon" viewBox="0 0 10 10"><path d="M5 2 9 7H1z" fill="currentColor"/></svg></button></th>
                        <th data-column="stock" class="num"><button class="sort-btn" type="button"><span id="thStockLocal">Stock PV 1</span><svg class="sort-icon" viewBox="0 0 10 10"><path d="M5 2 9 7H1z" fill="currentColor"/></svg></button></th>
                        <th data-column="stockTotal" class="num"><button class="sort-btn" type="button">Total<svg class="sort-icon" viewBox="0 0 10 10"><path d="M5 2 9 7H1z" fill="currentColor"/></svg></button></th>
                        <th data-column="ultimaEntrada"><button class="sort-btn" type="button">Último ingreso<svg class="sort-icon" viewBox="0 0 10 10"><path d="M5 2 9 7H1z" fill="currentColor"/></svg></button></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </section>
    </main>

    <!-- Firebase Auth Check -->
    <script>
        firebase.initializeApp(firebaseConfig);

        let admin = false;
        let authResolved = false;
        const adminEmails = ["distribuidorahomepoint@gmail.com"];

        function inicializarPagina() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', inicializarStock);
            } else {
                inicializarStock();
            }
        }

        function redirigirALogin() {
            const currentUrl = encodeURIComponent(window.location.href);
            window.location.href = `login.html?redirect=${currentUrl}`;
        }

        // Timeout de seguridad: si la autenticación no responde en 5 s, a login
        setTimeout(() => {
            if (!authResolved) {
                console.warn('Timeout de autenticación - redirigiendo a login');
                redirigirALogin();
            }
        }, 5000);

        function mostrarUsuario(user) {
            const avatar = document.getElementById('userAvatar');
            avatar.textContent = (user.email || '?').charAt(0).toUpperCase();
            avatar.title = `${user.email || ''}${admin ? ' · Administrador' : ''}`;
            document.getElementById('userChip').classList.add('show');
        }

        firebase.auth().onAuthStateChanged(user => {
            authResolved = true;
            if (user) {
                admin = adminEmails.includes(user.email);
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => mostrarUsuario(user));
                } else {
                    mostrarUsuario(user);
                }
                inicializarPagina();
            } else {
                redirigirALogin();
            }
        });

        function cerrarSesion() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                firebase.auth().signOut().catch(error => {
                    console.error('Error al cerrar sesión:', error);
                    alert('Error al cerrar sesión: ' + error.message);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
        });
    </script>

    <script>
        function inicializarStock() {
            const tableBody = document.getElementById('tableBody');
            const searchInput = document.getElementById('searchInput');
            const searchBox = document.getElementById('searchBox');
            const clearBtn = document.getElementById('clearBtn');
            const printBtn = document.getElementById('printBtn');
            const refreshBtn = document.getElementById('refreshStockBtn');
            const resultCounter = document.getElementById('resultCounter');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const tableHeaders = document.querySelectorAll('#stockTable thead th');
            const chips = document.querySelectorAll('.chip');

            let stockData = [];
            let currentSort = { column: 'nombre', order: 'asc' };
            let filtro = 'todos';
            let primeraCarga = true;
            let cargando = false;

            // Punto de venta elegido en el panel (lo guarda puntoVenta.js).
            // En StockPorSucursal la columna C es el stock del punto 1 y la D
            // el del punto 2. Si no hay ninguno elegido se toma el 1.
            function puntoVentaActual() {
                try { const v = localStorage.getItem('hpPuntoVenta'); if (v) return v; } catch (_) {}
                try { const v = sessionStorage.getItem('hpPuntoVenta'); if (v) return v; } catch (_) {}
                return '1';
            }
            const puntoVenta = puntoVentaActual() === '2' ? '2' : '1';
            const COL_STOCK_LOCAL = puntoVenta === '2' ? 3 : 2; // D : C
            document.getElementById('thStockLocal').textContent = `Stock PV ${puntoVenta}`;
            document.getElementById('puntoLabel').textContent = `PV ${puntoVenta}`;

            const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const fmt = n => n.toLocaleString('es-AR');
            // Sin tildes y en minúscula, para que "cafe" encuentre "Café"
            const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

            // Resalta la parte del texto que coincide con la búsqueda
            function resaltar(texto, q) {
                if (!q) return esc(texto);
                const i = norm(texto).indexOf(q);
                if (i < 0) return esc(texto);
                return esc(texto.slice(0, i)) + '<mark>' + esc(texto.slice(i, i + q.length)) + '</mark>' + esc(texto.slice(i + q.length));
            }

            // Fechas de la planilla: dd/mm/aaaa (con o sin hora) o aaaa-mm-dd.
            function parseFecha(txt) {
                if (!txt) return null;
                let m = String(txt).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
                if (m) {
                    const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
                    return new Date(y, Number(m[2]) - 1, Number(m[1]));
                }
                m = String(txt).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
                return null;
            }
            function haceCuanto(fecha) {
                if (!fecha) return '';
                const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
                const dias = Math.round((hoy - fecha) / 86400000);
                if (dias <= 0) return 'Hoy';
                if (dias === 1) return 'Ayer';
                if (dias < 30) return `Hace ${dias} días`;
                const meses = Math.round(dias / 30);
                if (meses < 12) return `Hace ${meses} ${meses === 1 ? 'mes' : 'meses'}`;
                const anios = Math.round(dias / 365);
                return `Hace ${anios} ${anios === 1 ? 'año' : 'años'}`;
            }

            function setStatus(estado, texto) {
                status.classList.toggle('is-loading', estado === 'loading');
                status.classList.toggle('is-error', estado === 'error');
                statusText.textContent = texto;
                refreshBtn.classList.toggle('is-spinning', estado === 'loading');
            }
            function showError(msg) {
                errorText.textContent = msg;
                errorMsg.classList.add('show');
            }
            function clearError() {
                errorMsg.classList.remove('show');
            }

            function renderSkeleton() {
                const anchos = [[60, 70, 40, 40, 55], [50, 85, 40, 40, 50], [65, 60, 40, 40, 60]];
                let html = '';
                for (let i = 0; i < 8; i++) {
                    const a = anchos[i % anchos.length];
                    html += `<tr class="skeleton">${a.map(w => `<td><span style="width:${w}%"></span></td>`).join('')}</tr>`;
                }
                tableBody.innerHTML = html;
            }

            function claseStock(n) {
                if (n <= 0) return 'zero';
                if (n <= 5) return 'low';
                return '';
            }

            function coincideFiltro(item) {
                switch (filtro) {
                    case 'bajo': return item.stock > 0 && item.stock <= 5;
                    case 'sin': return item.stock <= 0;
                    case 'negativo': return item.stock < 0;
                    default: return true;
                }
            }

            function actualizarContadores() {
                document.getElementById('kpiTodos').textContent = fmt(stockData.length);
                document.getElementById('kpiBajo').textContent = fmt(stockData.filter(i => i.stock > 0 && i.stock <= 5).length);
                document.getElementById('kpiSin').textContent = fmt(stockData.filter(i => i.stock <= 0).length);
                document.getElementById('kpiNegativo').textContent = fmt(stockData.filter(i => i.stock < 0).length);
            }

            function renderTable(data, q, animar) {
                resultCounter.innerHTML = `<strong>${fmt(data.length)}</strong> ${data.length === 1 ? 'resultado' : 'resultados'}`;

                if (data.length === 0) {
                    const texto = searchInput.value.trim();
                    tableBody.innerHTML = `<tr class="empty-row"><td colspan="5"><div class="empty"><strong>Sin resultados</strong>${texto ? `Ningún artículo coincide con “${esc(texto)}”.` : 'No hay artículos en este filtro.'}</div></td></tr>`;
                    return;
                }

                const fragment = document.createDocumentFragment();
                data.forEach((item, i) => {
                    const row = document.createElement('tr');
                    if (animar && i < 20) {
                        row.className = 'enter';
                        row.style.setProperty('--i', i);
                    }
                    row.innerHTML = `
                        <td class="c-codigo"><span class="code">${resaltar(item.codigo, q)}</span></td>
                        <td class="c-nombre"><span class="name">${resaltar(item.nombre, q)}</span></td>
                        <td class="c-stock num"><span class="qty ${claseStock(item.stock)}">${fmt(item.stock)}</span></td>
                        <td class="c-total num"><span class="total">${fmt(item.stockTotal)}</span></td>
                        <td class="c-fecha"><span class="date">${esc(item.ultimaEntrada)}</span><span class="date-rel">${haceCuanto(item.fecha)}</span></td>
                    `;
                    fragment.appendChild(row);
                });
                tableBody.innerHTML = '';
                tableBody.appendChild(fragment);
            }

            function sortData(data, column, order) {
                const dir = order === 'asc' ? 1 : -1;
                return [...data].sort((a, b) => {
                    if (column === 'stock' || column === 'stockTotal') {
                        return ((Number(a[column]) || 0) - (Number(b[column]) || 0)) * dir;
                    }
                    if (column === 'ultimaEntrada') {
                        // Sin fecha siempre al final
                        const ta = a.fecha ? a.fecha.getTime() : null;
                        const tb = b.fecha ? b.fecha.getTime() : null;
                        if (ta === tb) return 0;
                        if (ta === null) return 1;
                        if (tb === null) return -1;
                        return (ta - tb) * dir;
                    }
                    return String(a[column] || '').localeCompare(String(b[column] || ''), 'es', { sensitivity: 'base', numeric: true }) * dir;
                });
            }

            function updateSortIcons() {
                tableHeaders.forEach(th => {
                    if (th.dataset.column === currentSort.column) {
                        th.setAttribute('aria-sort', currentSort.order === 'asc' ? 'ascending' : 'descending');
                    } else {
                        th.removeAttribute('aria-sort');
                    }
                });
            }

            function filterData(animar = false) {
                const q = norm(searchInput.value.trim());
                searchBox.classList.toggle('has-value', q.length > 0);

                const filtered = stockData.filter(item =>
                    coincideFiltro(item) && (!q || item._busqueda.includes(q))
                );
                renderTable(sortData(filtered, currentSort.column, currentSort.order), q, animar);
                updateSortIcons();
            }

            // Búsqueda al instante; solo agrupa teclas muy rápidas
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => filterData(), 80);
            });

            clearBtn.addEventListener('click', e => {
                e.preventDefault();
                searchInput.value = '';
                filterData();
                searchInput.focus();
            });

            // "/" enfoca el buscador desde cualquier lugar, Esc lo limpia
            document.addEventListener('keydown', e => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                } else if (e.key === 'Escape' && document.activeElement === searchInput) {
                    searchInput.value = '';
                    filterData();
                }
            });

            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const elegido = chip.dataset.filtro;
                    // Tocar el filtro activo lo apaga y vuelve a "Todos"
                    filtro = (filtro === elegido && elegido !== 'todos') ? 'todos' : elegido;
                    chips.forEach(c => c.setAttribute('aria-pressed', String(c.dataset.filtro === filtro)));
                    filterData();
                });
            });

            printBtn.addEventListener('click', () => {
                const ahora = new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
                document.getElementById('printMeta').textContent = `Punto de venta ${puntoVenta} · ${ahora}`;
                window.print();
            });

            tableHeaders.forEach(th => {
                th.querySelector('.sort-btn').addEventListener('click', () => {
                    const column = th.dataset.column;
                    if (currentSort.column === column) {
                        currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.column = column;
                        // Números y fechas arrancan de mayor a menor
                        currentSort.order = (column === 'nombre' || column === 'codigo') ? 'asc' : 'desc';
                    }
                    filterData();
                });
            });

            // Consulta a Google Sheets. Las recargas automáticas no borran la
            // tabla: solo cambia el indicador de estado de la barra superior.
            async function fetchStockData() {
                if (cargando) return;
                cargando = true;
                setStatus('loading', 'Actualizando…');
                if (primeraCarga) renderSkeleton();
                try {
                    const SHEETS_ID = typeof GOOGLE_SHEETS_CONFIG !== 'undefined' ? GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID : '';
                    const RANGE = 'StockPorSucursal!A2:F';
                    const API_KEY = typeof GOOGLE_SHEETS_CONFIG !== 'undefined' ? GOOGLE_SHEETS_CONFIG.API_KEY : '';
                    if (!SHEETS_ID || !API_KEY) throw new Error('Faltan datos de configuración de Google Sheets');

                    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${RANGE}?key=${API_KEY}`;
                    const response = await fetch(url, { cache: 'no-store' });
                    const { values } = await response.json();
                    if (!values || !values.length) throw new Error('No se encontraron datos en la hoja StockPorSucursal');

                    // StockPorSucursal (fila 1 = encabezado): A código, B nombre,
                    // C stock punto 1, D stock punto 2, E stock total, F último ingreso
                    stockData = values.map(row => {
                        const codigo = row[0] || '';
                        const nombre = row[1] || '';
                        return {
                            codigo,
                            nombre,
                            stock: Number(row[COL_STOCK_LOCAL]) || 0,
                            stockTotal: Number(row[4]) || 0,
                            ultimaEntrada: row[5] || '',
                            fecha: parseFecha(row[5]),
                            _busqueda: norm(codigo) + ' ' + norm(nombre)
                        };
                    }).filter(item => item.nombre.trim() !== '');

                    clearError();
                    actualizarContadores();
                    filterData(primeraCarga);
                    primeraCarga = false;
                    const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                    setStatus('ok', `Actualizado ${hora}`);
                } catch (error) {
                    console.error('Error al cargar datos de inventario:', error);
                    setStatus('error', 'Sin conexión');
                    if (primeraCarga) tableBody.innerHTML = '';
                    showError('No se pudo cargar el inventario: ' + error.message);
                } finally {
                    cargando = false;
                }
            }

            refreshBtn.addEventListener('click', fetchStockData);

            fetchStockData();
            setInterval(fetchStockData, 30000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) fetchStockData();
            });
        }
    </script>
</body>
</html>
