<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Fuera de los buscadores: noindex impide que Google indexe la pagina y
         nofollow que siga sus enlaces. Debe quedar rastreable en robots.txt,
         porque si se bloquea el crawleo Google nunca lee esta etiqueta. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Consulta de Stock</title>
    <link rel="icon" href="faviconnegro.png" type="image/png">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="config.js"></script>

    <!-- Tipografías: Manrope para la interfaz y JetBrains Mono para códigos. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700&display=swap">

    <style>
        /* ------------------------------------------------------------ tokens -- */
        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --surface-2: #f3f3f1;
            --ink: #23262b;
            --ink-2: #5f646c;
            --ink-3: #969ba3;
            --line: rgba(35, 38, 43, 0.07);
            --line-strong: rgba(35, 38, 43, 0.12);
            --accent: #5b6b7d;
            --accent-soft: #e9edf1;
            --mark: #fff1c2;
            --ok: #4f7d64;
            --ok-soft: #edf4ef;
            --warn: #9a7a3c;
            --warn-soft: #f7f1e4;
            --bad: #a85a55;
            --bad-soft: #f8ecea;
            --bar: rgba(247, 247, 245, 0.82);
            --shadow-card: 0 1px 2px rgba(35, 38, 43, 0.04), 0 8px 24px -16px rgba(35, 38, 43, 0.14);
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --font-ui: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        }

        /* -------------------------------------------------------------- base -- */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-ui);
            font-size: 0.9375rem;
            line-height: 1.5;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            font-feature-settings: 'tnum' 1;
        }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ---------------------------------------- cabecera fija (barra + buscador) -- */
        .top {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bar);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--line);
        }
        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            height: 52px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }
        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--surface);
            border: 1px solid var(--line-strong);
            color: var(--ink-2);
        }
        .brand-mark svg { width: 15px; height: 15px; }
        .pv {
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
        }
        .spacer { flex: 1; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.8125rem;
            color: var(--ink-3);
            white-space: nowrap;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 3px var(--ok-soft);
        }
        .status.is-loading .status-dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 1.2s ease-in-out infinite; }
        .status.is-error .status-dot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
        @keyframes pulse { 50% { opacity: 0.35; } }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: none;
            background: transparent;
            border-radius: 9px;
            cursor: pointer;
            color: var(--ink-2);
            transition: transform 120ms ease-out, background 160ms ease, color 160ms ease;
        }
        .icon-btn:hover { color: var(--ink); background: var(--surface-2); }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 16px; height: 16px; }
        .icon-btn.is-spinning svg { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .user {
            display: none;
            align-items: center;
            gap: 0.15rem;
            padding-left: 0.6rem;
            margin-left: 0.15rem;
            border-left: 1px solid var(--line-strong);
        }
        .user.show { display: inline-flex; }
        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 0.75rem;
            background: var(--accent-soft);
            color: var(--accent);
        }
        #logoutBtn:hover { color: var(--bad); }

        /* Buscador: el protagonista de la página */
        .finder { padding: 0.5rem 0 0.9rem; }
        .search { position: relative; display: block; }
        .search > svg {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            width: 20px;
            height: 20px;
            transform: translateY(-50%);
            color: var(--ink-3);
            pointer-events: none;
            transition: color 160ms ease;
        }
        .search input {
            width: 100%;
            height: 56px;
            padding: 0 7.5rem 0 3.1rem;
            border-radius: 14px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            color: var(--ink);
            font: inherit;
            font-size: 1.0625rem;
            font-weight: 500;
            outline: none;
            box-shadow: var(--shadow-card);
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }
        .search input::placeholder { color: var(--ink-3); font-weight: 400; }
        .search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-card);
        }
        .search:focus-within > svg { color: var(--accent); }
        .search-end {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .count {
            font-size: 0.8125rem;
            color: var(--ink-3);
            white-space: nowrap;
        }
        .count strong { color: var(--ink); font-weight: 700; }
        .kbd {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            border: 1px solid var(--line-strong);
            color: var(--ink-3);
        }
        .clear-btn {
            display: none;
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--ink-2);
            cursor: pointer;
            place-items: center;
            transition: transform 120ms ease-out, background 160ms ease;
        }
        .clear-btn:hover { background: var(--line-strong); }
        .clear-btn:active { transform: scale(0.88); }
        .clear-btn svg { width: 12px; height: 12px; }
        .search.has-value .clear-btn { display: grid; }
        .search.has-value .kbd { display: none; }

        /* Filtros rápidos */
        .chips {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.7rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            --tone: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink-2);
            white-space: nowrap;
            cursor: pointer;
            transition: transform 120ms ease-out, background 160ms ease, border-color 160ms ease, color 160ms ease;
        }
        .chip:hover { border-color: var(--ink-3); color: var(--ink); }
        .chip:active { transform: scale(0.96); }
        .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--tone); }
        .chip b { font-weight: 700; color: var(--ink-3); transition: color 160ms ease; }
        .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
        .chip[aria-pressed="true"] b { color: rgba(255,255,255,0.65); }
        .chip[data-filtro="todos"] i { display: none; }
        .chip[data-filtro="bajo"] { --tone: var(--warn); }
        .chip[data-filtro="sin"], .chip[data-filtro="negativo"] { --tone: var(--bad); }
        /* Botón "Ver listado completo": separado de los filtros */
        .chip-sep { flex: none; width: 1px; margin: 0.3rem 0.2rem; background: var(--line-strong); }
        .chip-all svg { width: 14px; height: 14px; }

        /* Filtro de categorías: botón con forma de chip que abre una lista con
           casillas. Todas marcadas por defecto; se desmarcan las que sobran. */
        .cat-btn svg { width: 12px; height: 12px; opacity: 0.7; transition: transform 200ms var(--ease-out); }
        .cat-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
        .cat-pop {
            position: fixed;
            z-index: 40;
            display: none;
            width: 300px;
            max-width: calc(100vw - 2rem);
            padding: 0.5rem;
            border-radius: 14px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            box-shadow: 0 1px 2px rgba(35, 38, 43, 0.05), 0 16px 40px -12px rgba(35, 38, 43, 0.28);
            transform-origin: top left;
        }
        .cat-pop.show { display: block; animation: pop-in 160ms var(--ease-out); }
        @keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
        .cat-search {
            width: 100%;
            height: 34px;
            padding: 0 0.7rem;
            border-radius: 9px;
            border: 1px solid transparent;
            background: var(--surface-2);
            color: var(--ink);
            font: inherit;
            font-size: 0.8125rem;
            outline: none;
            transition: border-color 160ms ease;
        }
        .cat-search:focus { border-color: var(--accent); }
        .cat-actions {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0.15rem;
        }
        .cat-actions button {
            border: none;
            background: none;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            transition: background 160ms ease;
        }
        .cat-actions button:hover { background: var(--accent-soft); }
        .cat-list {
            max-height: min(320px, 50vh);
            overflow-y: auto;
            overscroll-behavior: contain;
            border-top: 1px solid var(--line);
            padding-top: 0.25rem;
        }
        .cat-opt {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.4rem 0.5rem;
            border-radius: 8px;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
        }
        .cat-opt[hidden] { display: none; }
        .cat-opt:hover { background: var(--surface-2); }
        .cat-opt input { flex: none; width: 15px; height: 15px; margin: 0; accent-color: var(--ink); cursor: pointer; }
        .cat-opt span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-opt b { font-weight: 600; font-size: 0.75rem; color: var(--ink-3); }
        .cat-opt.zero { opacity: 0.55; }
        .cat-empty { padding: 0.9rem 0.5rem; text-align: center; font-size: 0.8125rem; color: var(--ink-3); }

        /* -------------------------------------------------------------- tabla -- */
        main { padding-top: 1.25rem; padding-bottom: 3rem; }
        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            text-align: left;
            padding: 0;
            border-bottom: 1px solid var(--line);
            background: var(--surface-2);
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--ink-3);
        }
        thead th.num { text-align: right; }
        .sort-btn {
            all: unset;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            width: 100%;
            padding: 0.7rem 1rem;
            cursor: pointer;
            transition: color 160ms ease;
        }
        th.num .sort-btn { justify-content: flex-end; }
        .sort-btn:hover { color: var(--ink); }
        .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
        .sort-icon { width: 9px; height: 9px; opacity: 0; transition: opacity 160ms ease, transform 220ms var(--ease-out); }
        th[aria-sort] .sort-btn { color: var(--ink); }
        th[aria-sort] .sort-icon { opacity: 1; }
        th[aria-sort="descending"] .sort-icon { transform: rotate(180deg); }

        tbody td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 120ms ease; }
        tbody tr:hover { background: var(--surface-2); }
        tbody tr.enter { animation: rise 360ms var(--ease-out) both; animation-delay: calc(var(--i) * 14ms); }

        td.num { text-align: right; }
        .code { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--ink-3); white-space: nowrap; }
        .name { font-weight: 600; }
        mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
        .total { color: var(--ink-2); }
        .date { color: var(--ink-2); white-space: nowrap; font-size: 0.875rem; }
        .date-rel { display: block; font-size: 0.75rem; color: var(--ink-3); }

        .qty {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 3rem;
            padding: 0.15rem 0.6rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            background: var(--ok-soft);
            color: var(--ok);
        }
        .qty.low { background: var(--warn-soft); color: var(--warn); }
        .qty.zero { background: var(--bad-soft); color: var(--bad); }

        /* Sucursal logueada remarcada; la otra, de referencia y más tenue */
        th.is-local .sort-btn { color: var(--ink); }
        .qty-otro { font-weight: 500; font-size: 0.875rem; color: var(--ink-3); }
        .qty-otro.neg { color: var(--bad); opacity: 0.7; }

        .skeleton td { padding: 1rem; }
        .skeleton span {
            display: block;
            height: 11px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--surface-2), var(--line-strong), var(--surface-2));
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
        }
        @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

        .empty { padding: 3.5rem 1rem; text-align: center; color: var(--ink-3); }
        .empty strong { display: block; font-size: 1.05rem; color: var(--ink); margin-bottom: 0.2rem; }

        .error-banner {
            display: none;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.9rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            background: var(--bad-soft);
            color: var(--bad);
            font-weight: 600;
            font-size: 0.875rem;
        }
        .error-banner.show { display: flex; }
        .error-banner svg { width: 18px; height: 18px; flex: none; }

        /* Foto del artículo: miniatura que abre la imagen grande al tocarla */
        td.c-img { width: 1%; padding-right: 0; }
        .thumb, .thumb-ph {
            display: block;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--surface-2);
        }
        .thumb {
            object-fit: cover;
            cursor: zoom-in;
            transition: transform 160ms var(--ease-out);
        }
        .thumb:hover { transform: scale(1.06); }
        .thumb:active { transform: scale(0.95); }
        .thumb-ph { display: grid; place-items: center; color: var(--ink-3); }
        .thumb-ph svg { width: 18px; height: 18px; }
        .skeleton .sk-thumb { width: 44px; height: 44px; border-radius: 10px; }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            place-items: center;
            padding: 1.5rem;
            background: rgba(35, 38, 43, 0.86);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            cursor: zoom-out;
        }
        .lightbox.show { display: grid; }
        .lightbox img {
            max-width: min(92vw, 720px);
            max-height: 86vh;
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: zoom-in 220ms var(--ease-out);
        }
        @keyframes zoom-in { from { opacity: 0; transform: scale(0.94); } }

        /* Estado inicial: hasta 3 caracteres no se muestra el listado */
        .panel.is-idle thead { display: none; }
        .idle { padding: 3.5rem 1rem; text-align: center; color: var(--ink-3); }
        .idle svg { display: block; width: 28px; height: 28px; margin: 0 auto; color: var(--ink-3); }

        /* Paginación */
        .pager {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-top: 1px solid var(--line);
            background: var(--surface-2);
            font-size: 0.8125rem;
            color: var(--ink-2);
        }
        .pager.show { display: flex; }
        .pager strong { color: var(--ink); font-weight: 700; }
        .pager-btns { display: flex; align-items: center; gap: 0.35rem; }
        .pager-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            height: 32px;
            padding: 0 0.75rem;
            border-radius: 9px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 120ms ease-out, border-color 160ms ease, color 160ms ease;
        }
        .pager-btn:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
        .pager-btn:active:not(:disabled) { transform: scale(0.96); }
        .pager-btn:disabled { opacity: 0.4; cursor: default; }
        .pager-btn svg { width: 14px; height: 14px; }
        .pager-page { min-width: 4.5rem; text-align: center; white-space: nowrap; }

        .print-head { display: none; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        /* ---------------------------------------------------------- responsive -- */
        @media (max-width: 760px) {
            .status-text, #printBtn { display: none; }
        }
        @media (max-width: 640px) {
            .wrap { padding-left: 1rem; padding-right: 1rem; }
            .brand-name { display: none; }
            .search input { height: 52px; font-size: 1rem; padding-right: 5.5rem; }
            .kbd { display: none; }

            /* Filas como tarjetas */
            thead { display: none; }
            table, tbody { display: block; }
            tbody tr {
                display: grid;
                grid-template-columns: auto 1fr auto;
                gap: 0.1rem 1rem;
                padding: 0.85rem 1rem;
                border-bottom: 1px solid var(--line);
            }
            tbody tr:last-child { border-bottom: none; }
            tbody td { padding: 0; border: none; }
            td.c-img { grid-column: 1; grid-row: 1 / span 4; width: auto; padding: 0; }
            td.c-codigo { grid-column: 2; grid-row: 1; }
            td.c-nombre { grid-column: 2; grid-row: 2; }
            td.c-stock { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
            td.c-otro, td.c-fecha { font-size: 0.75rem; color: var(--ink-3); padding-top: 0.2rem; }
            td.c-otro { grid-column: 2 / -1; grid-row: 3; text-align: left; }
            td.c-fecha { grid-column: 2 / -1; grid-row: 4; text-align: left; padding-top: 0; }
            .thumb, .thumb-ph { width: 52px; height: 52px; }
            td.c-otro::before { content: attr(data-label) ': '; }
            td.c-fecha::before { content: 'Último ingreso: '; }
            .qty-otro { font-size: inherit; }
            .date { font-size: 0.75rem; }
            .date-rel { display: none; }
            .skeleton, .empty-row { display: block !important; }
            .skeleton td, .empty-row td { display: block; }
            .pager-label { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 1ms !important;
                animation-delay: 0ms !important;
                transition-duration: 1ms !important;
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .top { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
        }

        /* ------------------------------------------------------------ impresión -- */
        @media print {
            body { background: #fff; color: #000; font-size: 10pt; }
            .top, .error-banner, .date-rel, .lightbox, .pager, .cat-pop { display: none !important; }
            .thumb, .thumb-ph { width: 28pt; height: 28pt; border-radius: 4pt; }
            main { padding: 0; }
            .wrap { max-width: none; padding: 0; }
            .panel { border: none; box-shadow: none; border-radius: 0; }
            .print-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #000; padding-bottom: 4pt; margin-bottom: 6pt; }
            .print-head h2 { margin: 0; font-size: 16pt; }
            thead th { background: none; color: #000; border-bottom: 1.5px solid #000; }
            .sort-btn { padding: 3pt 5pt; }
            .sort-icon { display: none; }
            tbody td { padding: 3pt 5pt; border-bottom: 0.5pt solid #999; }
            tbody tr { break-inside: avoid; animation: none !important; }
            mark { background: none; }
            .qty { background: none !important; color: #000 !important; padding: 0; min-width: 0; font-size: inherit; }
            .qty.low::after { content: ' ⚠'; }
            .qty.zero::after { content: ' ✕'; }
            .code, .total, .date, .qty-otro { color: #000 !important; opacity: 1 !important; }
        }
    </style>
</head>

    <!-- Firebase Auth Check -->
    <script>
        firebase.initializeApp(firebaseConfig);

        let admin = false;
        let authResolved = false;
        const adminEmails = ["distribuidorahomepoint@gmail.com"];

        function inicializarPagina() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', inicializarStock);
            } else {
                inicializarStock();
            }
        }

        function redirigirALogin() {
            const currentUrl = encodeURIComponent(window.location.href);
            window.location.href = `login.html?redirect=${currentUrl}`;
        }

        // Timeout de seguridad: si la autenticación no responde en 5 s, a login
        setTimeout(() => {
            if (!authResolved) {
                console.warn('Timeout de autenticación - redirigiendo a login');
                redirigirALogin();
            }
        }, 5000);

        function mostrarUsuario(user) {
            const avatar = document.getElementById('userAvatar');
            avatar.textContent = (user.email || '?').charAt(0).toUpperCase();
            avatar.title = `${user.email || ''}${admin ? ' · Administrador' : ''}`;
            document.getElementById('userChip').classList.add('show');
        }

        firebase.auth().onAuthStateChanged(user => {
            authResolved = true;
            if (user) {
                admin = adminEmails.includes(user.email);
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => mostrarUsuario(user));
                } else {
                    mostrarUsuario(user);
                }
                inicializarPagina();
            } else {
                redirigirALogin();
            }
        });

        function cerrarSesion() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                firebase.auth().signOut().catch(error => {
                    console.error('Error al cerrar sesión:', error);
                    alert('Error al cerrar sesión: ' + error.message);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
        });
    </script>

    <script>
        function inicializarStock() {
            const tableBody = document.getElementById('tableBody');
            const searchInput = document.getElementById('searchInput');
            const searchBox = document.getElementById('searchBox');
            const clearBtn = document.getElementById('clearBtn');
            const printBtn = document.getElementById('printBtn');
            const refreshBtn = document.getElementById('refreshStockBtn');
            const resultCounter = document.getElementById('resultCounter');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const tableHeaders = document.querySelectorAll('#stockTable thead th[data-column]');
            const panel = document.getElementById('panel');
            const topBar = document.querySelector('.top');
            const pager = document.getElementById('pager');
            const pagerInfo = document.getElementById('pagerInfo');
            const pagerPage = document.getElementById('pagerPage');
            const pagerPrev = document.getElementById('pagerPrev');
            const pagerNext = document.getElementById('pagerNext');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const chips = document.querySelectorAll('.chip[data-filtro]');
            const verTodoBtn = document.getElementById('verTodoBtn');
            const catBtn = document.getElementById('catBtn');
            const catBtnText = document.getElementById('catBtnText');
            const catPop = document.getElementById('catPop');
            const catList = document.getElementById('catList');
            const catSearch = document.getElementById('catSearch');
            const catChips = document.querySelector('.chips');

            let stockData = [];
            let imagenes = {}; // codigo -> { url, alt } desde la hoja Lista
            let categorias = {}; // codigo -> categoría (columna A de la hoja Lista)
            // Categorías desmarcadas. Se guardan las quitadas (y no las elegidas)
            // para que todas, incluso las nuevas, arranquen marcadas.
            const excluidas = new Set();
            const SIN_CAT = '__sin_categoria__';
            let currentSort = { column: 'nombre', order: 'asc' };
            let filtro = 'todos';
            let primeraCarga = true;
            let pagina = 1;
            const MIN_CARACTERES = 3;   // el listado aparece recién con 3 caracteres
            const POR_PAGINA = 30;
            let cargando = false;
            let verTodo = false;        // muestra el listado sin necesidad de buscar

            // Punto de venta elegido en el panel (lo guarda puntoVenta.js).
            // Si no hay ninguno elegido se toma el 1 (Munro).
            // Columnas de StockPorSucursal (índice 0 = A): stock en C/D,
            // último ingreso en F/G.
            const SUCURSALES = {
                '1': { nombre: 'Munro', colStock: 2, colFecha: 5 },   // C, F
                '2': { nombre: 'Caseros', colStock: 3, colFecha: 6 }  // D, G
            };
            function puntoVentaActual() {
                try { const v = localStorage.getItem('hpPuntoVenta'); if (v) return v; } catch (_) {}
                try { const v = sessionStorage.getItem('hpPuntoVenta'); if (v) return v; } catch (_) {}
                return '1';
            }
            const puntoVenta = puntoVentaActual() === '2' ? '2' : '1';
            const local = SUCURSALES[puntoVenta];
            const otra = SUCURSALES[puntoVenta === '2' ? '1' : '2'];
            document.getElementById('thStockLocal').textContent = local.nombre;
            document.getElementById('thStockOtro').textContent = otra.nombre;
            document.getElementById('puntoLabel').textContent = local.nombre;

            const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const fmt = n => n.toLocaleString('es-AR');
            // Sin tildes y en minúscula, para que "cafe" encuentre "Café"
            const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

            // Resalta la parte del texto que coincide con la búsqueda
            function resaltar(texto, q) {
                if (!q) return esc(texto);
                const i = norm(texto).indexOf(q);
                if (i < 0) return esc(texto);
                return esc(texto.slice(0, i)) + '<mark>' + esc(texto.slice(i, i + q.length)) + '</mark>' + esc(texto.slice(i + q.length));
            }

            // Fechas de la planilla: dd/mm/aaaa (con o sin hora) o aaaa-mm-dd.
            function parseFecha(txt) {
                if (!txt) return null;
                let m = String(txt).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
                if (m) {
                    const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
                    return new Date(y, Number(m[2]) - 1, Number(m[1]));
                }
                m = String(txt).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
                return null;
            }
            function haceCuanto(fecha) {
                if (!fecha) return '';
                const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
                const dias = Math.round((hoy - fecha) / 86400000);
                if (dias <= 0) return 'Hoy';
                if (dias === 1) return 'Ayer';
                if (dias < 30) return `Hace ${dias} días`;
                const meses = Math.round(dias / 30);
                if (meses < 12) return `Hace ${meses} ${meses === 1 ? 'mes' : 'meses'}`;
                const anios = Math.round(dias / 365);
                return `Hace ${anios} ${anios === 1 ? 'año' : 'años'}`;
            }

            function setStatus(estado, texto) {
                status.classList.toggle('is-loading', estado === 'loading');
                status.classList.toggle('is-error', estado === 'error');
                statusText.textContent = texto;
                refreshBtn.classList.toggle('is-spinning', estado === 'loading');
            }
            function showError(msg) {
                errorText.textContent = msg;
                errorMsg.classList.add('show');
            }
            function clearError() {
                errorMsg.classList.remove('show');
            }

            function renderSkeleton() {
                const anchos = [[60, 70, 40, 35, 55], [50, 85, 40, 35, 50], [65, 60, 40, 35, 60]];
                let html = '';
                for (let i = 0; i < 8; i++) {
                    const a = anchos[i % anchos.length];
                    html += `<tr class="skeleton"><td class="c-img"><span class="sk-thumb"></span></td>${a.map(w => `<td><span style="width:${w}%"></span></td>`).join('')}</tr>`;
                }
                tableBody.innerHTML = html;
            }

            // Imágenes: igual que necesarios.html. En la hoja Lista la columna B
            // trae varias URLs separadas por comas; se usa la 1ª y, si no carga,
            // la 4ª. Si tampoco carga (o no hay), queda un ícono.
            const PLACEHOLDER = '<span class="thumb-ph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span>';

            function celdaImagen(codigo) {
                const img = imagenes[String(codigo).trim()];
                if (!img) return PLACEHOLDER;
                const alt = img.alt && img.alt !== img.url ? ` data-alt="${esc(img.alt)}"` : '';
                return `<img class="thumb" src="${esc(img.url)}"${alt} alt="" loading="lazy" decoding="async">`;
            }

            // El evento error no sube por el DOM: se escucha en fase de captura.
            tableBody.addEventListener('error', e => {
                const el = e.target;
                if (!el.classList || !el.classList.contains('thumb')) return;
                if (el.dataset.alt) {
                    const alt = el.dataset.alt;
                    delete el.dataset.alt;
                    el.src = alt;
                    return;
                }
                el.outerHTML = PLACEHOLDER;
            }, true);

            tableBody.addEventListener('click', e => {
                const el = e.target.closest('.thumb');
                if (!el) return;
                lightboxImg.src = el.currentSrc || el.src;
                lightbox.classList.add('show');
            });
            function cerrarLightbox() {
                lightbox.classList.remove('show');
                lightboxImg.src = '';
            }
            lightbox.addEventListener('click', cerrarLightbox);

            async function fetchLista(SHEETS_ID, API_KEY) {
                // Lista: A categoría, B imagen(es), C código
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/Lista!A2:C?key=${API_KEY}`;
                const response = await fetch(url, { cache: 'no-store' });
                const { values } = await response.json();
                if (!values) throw new Error('Sin datos en la hoja Lista');
                const mapa = {};
                const cats = {};
                values.forEach(row => {
                    const codigo = String(row[2] || '').trim();
                    if (!codigo) return;
                    const cat = String(row[0] || '').trim();
                    if (cat) cats[codigo] = cat;
                    const partes = String(row[1] || '').split(',').map(u => u.trim());
                    const url1 = partes[0] || '';
                    const url4 = partes[3] || '';
                    if (url1 || url4) mapa[codigo] = { url: url1 || url4, alt: url4 };
                });
                return { imagenes: mapa, categorias: cats };
            }

            function claseStock(n) {
                if (n <= 0) return 'zero';
                if (n <= 5) return 'low';
                return '';
            }

            function coincideFiltro(item) {
                switch (filtro) {
                    case 'bajo': return item.stock > 0 && item.stock <= 5;
                    case 'sin': return item.stock <= 0;
                    case 'negativo': return item.stock < 0;
                    default: return true;
                }
            }

            function coincideCategoria(item) {
                return excluidas.size === 0 || !excluidas.has(item.categoria || SIN_CAT);
            }

            // Arma la lista solo con las categorías que aparecen en los
            // resultados actuales (búsqueda + filtro rápido), con su cantidad.
            // Las desmarcadas quedan en la lista aunque tengan 0, para poder
            // volver a marcarlas.
            function actualizarCategorias(base) {
                const cuenta = new Map();
                base.forEach(item => {
                    const c = item.categoria || SIN_CAT;
                    cuenta.set(c, (cuenta.get(c) || 0) + 1);
                });
                excluidas.forEach(c => { if (!cuenta.has(c)) cuenta.set(c, 0); });
                const lista = [...cuenta.keys()].filter(c => c !== SIN_CAT)
                    .sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
                if (cuenta.has(SIN_CAT)) lista.push(SIN_CAT);

                const html = lista.length
                    ? lista.map(c => `<label class="cat-opt${cuenta.get(c) ? '' : ' zero'}"><input type="checkbox" value="${esc(c)}"><span>${c === SIN_CAT ? 'Sin categoría' : esc(c)}</span><b>${fmt(cuenta.get(c))}</b></label>`).join('')
                    : '<div class="cat-empty">No hay categorías en estos resultados</div>';
                // Solo se reemplaza si cambió, para no mover la lista si está abierta
                if (catList.dataset.html !== html) {
                    catList.innerHTML = html;
                    catList.dataset.html = html;
                    filtrarListaCategorias();
                }
                catList.querySelectorAll('input').forEach(i => { i.checked = !excluidas.has(i.value); });

                const conDatos = lista.filter(c => cuenta.get(c) > 0);
                const marcadas = conDatos.filter(c => !excluidas.has(c)).length;
                catBtnText.textContent = excluidas.size
                    ? `Categorías: ${marcadas} de ${conDatos.length}`
                    : 'Todas las categorías';
                catBtn.setAttribute('aria-pressed', String(excluidas.size > 0));
            }

            // Buscador interno de la lista: solo oculta, no cambia el filtro
            function filtrarListaCategorias() {
                const q = norm(catSearch.value.trim());
                catList.querySelectorAll('.cat-opt').forEach(l => {
                    l.hidden = !!q && !norm(l.querySelector('span').textContent).includes(q);
                });
            }

            function abrirCategorias() {
                catPop.classList.add('show');
                const r = catBtn.getBoundingClientRect();
                const ancho = catPop.offsetWidth;
                catPop.style.top = `${r.bottom + 6}px`;
                catPop.style.left = `${Math.max(16, Math.min(r.left, window.innerWidth - ancho - 16))}px`;
                catBtn.setAttribute('aria-expanded', 'true');
                catSearch.focus({ preventScroll: true });
            }
            function cerrarCategorias() {
                if (!catPop.classList.contains('show')) return;
                catPop.classList.remove('show');
                catBtn.setAttribute('aria-expanded', 'false');
                catSearch.value = '';
                filtrarListaCategorias();
            }

            function actualizarContadores() {
                document.getElementById('kpiTodos').textContent = fmt(stockData.length);
                document.getElementById('kpiBajo').textContent = fmt(stockData.filter(i => i.stock > 0 && i.stock <= 5).length);
                document.getElementById('kpiSin').textContent = fmt(stockData.filter(i => i.stock <= 0).length);
                document.getElementById('kpiNegativo').textContent = fmt(stockData.filter(i => i.stock < 0).length);
            }

            // Mientras el buscador tiene menos de 3 caracteres: solo una lupa
            function renderIdle() {
                panel.classList.add('is-idle');
                pager.classList.remove('show');
                resultCounter.textContent = '';
                tableBody.innerHTML = `<tr class="empty-row"><td colspan="6"><div class="idle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    </div></td></tr>`;
            }

            function renderPager(total, totalPaginas) {
                if (totalPaginas <= 1) {
                    pager.classList.remove('show');
                    return;
                }
                const desde = (pagina - 1) * POR_PAGINA + 1;
                const hasta = Math.min(pagina * POR_PAGINA, total);
                pagerInfo.innerHTML = `<strong>${fmt(desde)}–${fmt(hasta)}</strong> de ${fmt(total)}`;
                pagerPage.textContent = `${pagina} / ${totalPaginas}`;
                pagerPrev.disabled = pagina <= 1;
                pagerNext.disabled = pagina >= totalPaginas;
                pager.classList.add('show');
            }

            function renderTable(data, q, animar) {
                panel.classList.remove('is-idle');
                resultCounter.innerHTML = `<strong>${fmt(data.length)}</strong> ${data.length === 1 ? 'resultado' : 'resultados'}`;

                if (data.length === 0) {
                    pager.classList.remove('show');
                    const texto = searchInput.value.trim();
                    tableBody.innerHTML = `<tr class="empty-row"><td colspan="6"><div class="empty"><strong>Sin resultados</strong>${texto ? `Ningún artículo coincide con “${esc(texto)}”.` : 'No hay artículos en este filtro.'}</div></td></tr>`;
                    return;
                }

                const totalPaginas = Math.ceil(data.length / POR_PAGINA);
                pagina = Math.min(Math.max(pagina, 1), totalPaginas);
                const visibles = data.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA);
                renderPager(data.length, totalPaginas);

                const fragment = document.createDocumentFragment();
                visibles.forEach((item, i) => {
                    const row = document.createElement('tr');
                    if (animar && i < 20) {
                        row.className = 'enter';
                        row.style.setProperty('--i', i);
                    }
                    row.innerHTML = `
                        <td class="c-img">${celdaImagen(item.codigo)}</td>
                        <td class="c-codigo"><span class="code">${resaltar(item.codigo, q)}</span></td>
                        <td class="c-nombre"><span class="name">${resaltar(item.nombre, q)}</span></td>
                        <td class="c-stock num"><span class="qty ${claseStock(item.stock)}">${fmt(item.stock)}</span></td>
                        <td class="c-otro num" data-label="${esc(otra.nombre)}"><span class="qty-otro${item.stockOtro < 0 ? ' neg' : ''}">${fmt(item.stockOtro)}</span></td>
                        <td class="c-fecha"><span class="date">${esc(item.ultimaEntrada)}</span><span class="date-rel">${haceCuanto(item.fecha)}</span></td>
                    `;
                    fragment.appendChild(row);
                });
                tableBody.innerHTML = '';
                tableBody.appendChild(fragment);
            }

            function sortData(data, column, order) {
                const dir = order === 'asc' ? 1 : -1;
                return [...data].sort((a, b) => {
                    if (column === 'stock' || column === 'stockOtro') {
                        return ((Number(a[column]) || 0) - (Number(b[column]) || 0)) * dir;
                    }
                    if (column === 'ultimaEntrada') {
                        // Sin fecha siempre al final
                        const ta = a.fecha ? a.fecha.getTime() : null;
                        const tb = b.fecha ? b.fecha.getTime() : null;
                        if (ta === tb) return 0;
                        if (ta === null) return 1;
                        if (tb === null) return -1;
                        return (ta - tb) * dir;
                    }
                    return String(a[column] || '').localeCompare(String(b[column] || ''), 'es', { sensitivity: 'base', numeric: true }) * dir;
                });
            }

            function updateSortIcons() {
                tableHeaders.forEach(th => {
                    if (th.dataset.column === currentSort.column) {
                        th.setAttribute('aria-sort', currentSort.order === 'asc' ? 'ascending' : 'descending');
                    } else {
                        th.removeAttribute('aria-sort');
                    }
                });
            }

            // mantenerPagina: true en las recargas automáticas, para no sacar al
            // usuario de la página en la que está. Buscar, filtrar u ordenar
            // vuelve a la página 1.
            function filterData(animar = false, mantenerPagina = false) {
                const q = norm(searchInput.value.trim());
                searchBox.classList.toggle('has-value', q.length > 0);
                if (!mantenerPagina) pagina = 1;

                const base = stockData.filter(item =>
                    coincideFiltro(item) && (!q || item._busqueda.includes(q))
                );
                actualizarCategorias(base);

                // Elegir una categoría también muestra el listado sin buscar
                if (q.length < MIN_CARACTERES && !verTodo && !excluidas.size) {
                    renderIdle();
                    updateSortIcons();
                    return;
                }
                if (primeraCarga) {   // todavía no llegaron los datos
                    panel.classList.remove('is-idle');
                    renderSkeleton();
                    return;
                }

                const filtered = base.filter(coincideCategoria);
                renderTable(sortData(filtered, currentSort.column, currentSort.order), q, animar);
                updateSortIcons();
            }

            // Búsqueda al instante; solo agrupa teclas muy rápidas
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => filterData(), 80);
            });

            clearBtn.addEventListener('click', e => {
                e.preventDefault();
                searchInput.value = '';
                filterData();
                searchInput.focus();
            });

            // "/" enfoca el buscador desde cualquier lugar, Esc lo limpia
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && catPop.classList.contains('show')) {
                    cerrarCategorias();
                    catBtn.focus();
                } else if (e.key === '/' && !e.target.closest('input, textarea')) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                } else if (e.key === 'Escape' && lightbox.classList.contains('show')) {
                    cerrarLightbox();
                } else if (e.key === 'Escape' && document.activeElement === searchInput) {
                    searchInput.value = '';
                    filterData();
                }
            });

            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const elegido = chip.dataset.filtro;
                    // Tocar el filtro activo lo apaga y vuelve a "Todos"
                    filtro = (filtro === elegido && elegido !== 'todos') ? 'todos' : elegido;
                    chips.forEach(c => c.setAttribute('aria-pressed', String(c.dataset.filtro === filtro)));
                    filterData();
                });
            });

            catBtn.addEventListener('click', () => {
                if (catPop.classList.contains('show')) cerrarCategorias();
                else abrirCategorias();
            });
            catList.addEventListener('change', e => {
                const input = e.target;
                if (input.checked) excluidas.delete(input.value);
                else excluidas.add(input.value);
                filterData();
            });
            // Marcar/desmarcar todas actúa sobre las visibles: si se escribió
            // algo en "Buscar categoría", solo sobre esas.
            function marcarVisibles(marcar) {
                catList.querySelectorAll('.cat-opt:not([hidden]) input').forEach(i => {
                    if (marcar) excluidas.delete(i.value);
                    else excluidas.add(i.value);
                });
                filterData();
            }
            document.getElementById('catAll').addEventListener('click', () => marcarVisibles(true));
            document.getElementById('catNone').addEventListener('click', () => marcarVisibles(false));
            catSearch.addEventListener('input', filtrarListaCategorias);
            document.addEventListener('click', e => {
                if (!catPop.contains(e.target) && !catBtn.contains(e.target)) cerrarCategorias();
            });
            window.addEventListener('resize', cerrarCategorias);
            catChips.addEventListener('scroll', cerrarCategorias);

            // Tocarlo de nuevo vuelve al modo normal (listado solo al buscar)
            verTodoBtn.addEventListener('click', () => {
                verTodo = !verTodo;
                verTodoBtn.setAttribute('aria-pressed', String(verTodo));
                filterData(true);
            });

            function irAPagina(n) {
                pagina = n;
                filterData(true, true);
                // Si la tabla quedó arriba de la pantalla, volver al comienzo de la lista
                const y = panel.getBoundingClientRect().top + window.scrollY - topBar.offsetHeight - 12;
                if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'smooth' });
            }
            pagerPrev.addEventListener('click', () => irAPagina(pagina - 1));
            pagerNext.addEventListener('click', () => irAPagina(pagina + 1));

            printBtn.addEventListener('click', () => {
                const ahora = new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
                document.getElementById('printMeta').textContent = `Punto de venta ${local.nombre} · ${ahora}`;
                window.print();
            });

            tableHeaders.forEach(th => {
                th.querySelector('.sort-btn').addEventListener('click', () => {
                    const column = th.dataset.column;
                    if (currentSort.column === column) {
                        currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.column = column;
                        // Números y fechas arrancan de mayor a menor
                        currentSort.order = (column === 'nombre' || column === 'codigo') ? 'asc' : 'desc';
                    }
                    filterData();
                });
            });

            // Consulta a Google Sheets. Las recargas automáticas no borran la
            // tabla: solo cambia el indicador de estado de la barra superior.
            async function fetchStockData() {
                if (cargando) return;
                cargando = true;
                setStatus('loading', 'Actualizando…');
                try {
                    const SHEETS_ID = typeof GOOGLE_SHEETS_CONFIG !== 'undefined' ? GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID : '';
                    const RANGE = 'StockPorSucursal!A2:G';
                    const API_KEY = typeof GOOGLE_SHEETS_CONFIG !== 'undefined' ? GOOGLE_SHEETS_CONFIG.API_KEY : '';
                    if (!SHEETS_ID || !API_KEY) throw new Error('Faltan datos de configuración de Google Sheets');

                    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${RANGE}?key=${API_KEY}`;
                    // Stock e imágenes a la vez. Si las imágenes fallan, la tabla
                    // igual se muestra (con las que ya se tenían o con íconos).
                    const [response, resLista] = await Promise.all([
                        fetch(url, { cache: 'no-store' }),
                        fetchLista(SHEETS_ID, API_KEY).then(m => ({ ok: true, m }), err => ({ ok: false, err }))
                    ]);
                    if (resLista.ok) {
                        imagenes = resLista.m.imagenes;
                        categorias = resLista.m.categorias;
                    } else {
                        console.warn('No se pudieron cargar imágenes y categorías:', resLista.err);
                    }
                    const { values } = await response.json();
                    if (!values || !values.length) throw new Error('No se encontraron datos en la hoja StockPorSucursal');

                    // StockPorSucursal (fila 1 = encabezado): A código, B nombre,
                    // C stock Munro, D stock Caseros, E stock total,
                    // F último ingreso Munro, G último ingreso Caseros
                    stockData = values.map(row => {
                        const codigo = row[0] || '';
                        const nombre = row[1] || '';
                        const ultimaEntrada = row[local.colFecha] || '';
                        return {
                            codigo,
                            nombre,
                            stock: Number(row[local.colStock]) || 0,
                            stockOtro: Number(row[otra.colStock]) || 0,
                            ultimaEntrada,
                            fecha: parseFecha(ultimaEntrada),
                            categoria: categorias[String(codigo).trim()] || '',
                            _busqueda: norm(codigo) + ' ' + norm(nombre)
                        };
                    }).filter(item => item.nombre.trim() !== '');

                    clearError();
                    actualizarContadores();
                    const animar = primeraCarga;
                    primeraCarga = false;
                    filterData(animar, true);
                    const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                    setStatus('ok', `Actualizado ${hora}`);
                } catch (error) {
                    console.error('Error al cargar datos de inventario:', error);
                    setStatus('error', 'Sin conexión');
                    if (primeraCarga && !panel.classList.contains('is-idle')) tableBody.innerHTML = '';
                    showError('No se pudo cargar el inventario: ' + error.message);
                } finally {
                    cargando = false;
                }
            }

            refreshBtn.addEventListener('click', fetchStockData);

            filterData();
            fetchStockData();
            setInterval(fetchStockData, 30000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) fetchStockData();
            });
        }
    </script>
</body>
</html>
