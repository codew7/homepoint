<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afiche QR Mayorista · HomePoint</title>
    <link rel="icon" href="faviconnegro.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!--
      Afiche A3 vertical (297 × 420 mm) para pegar en el local.
      Todo se mide en milímetros para que la impresión salga exacta.
      Pensado para leerse de lejos: poco texto, letras grandes y un QR
      de 16 cm. Fondo blanco a sangre: si la impresora no imprime hasta
      el borde, el corte no se nota.
    -->
    <style>
        @page { size: A3 portrait; margin: 0; }

        :root {
            --ink: #0d0b12;
            --violet: #6c4eb6;
            --lilac: #b8a4f5;
            --paper: #ffffff;
            --muted: #6b6578;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        body { font-family: 'Geist', system-ui, sans-serif; color: var(--ink); background: var(--paper); }

        .poster {
            position: relative;
            width: 297mm; height: 420mm;
            padding: 18mm 20mm 15mm;
            background: var(--paper);
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .poster::before {
            content: ''; position: absolute; top: -90mm; right: -90mm;
            width: 230mm; height: 230mm; border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 78, 182, 0.10), rgba(108, 78, 182, 0) 70%);
        }

        /* ===== Encabezado ===== */
        .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
        .top img { height: 17mm; }
        .tagline {
            display: flex; align-items: center; gap: 4mm;
            font-size: 5mm; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--violet);
        }
        .tagline::before { content: ''; width: 14mm; height: 0.6mm; background: currentColor; }

        /* ===== Titular: dos líneas, la segunda enorme ===== */
        h1 {
            position: relative;
            margin-top: 13mm;
            font-family: 'Instrument Serif', serif; font-weight: 400;
            letter-spacing: -0.025em; line-height: 0.88;
        }
        h1 .l1 { display: block; font-size: 33mm; }
        h1 .l2 { display: block; font-size: 58mm; font-style: italic; white-space: nowrap; color: var(--violet); margin-left: -1.5mm; }

        /* ===== Panel con el QR ===== */
        .panel {
            position: relative;
            margin-top: 10mm;
            flex: 1;
            border-radius: 10mm;
            background:
                radial-gradient(140mm 100mm at 100% 0%, rgba(139, 111, 224, 0.55), rgba(139, 111, 224, 0) 70%),
                radial-gradient(130mm 90mm at 0% 100%, rgba(80, 58, 160, 0.45), rgba(80, 58, 160, 0) 70%),
                var(--ink);
            color: #f4f1fa;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 14mm;
            overflow: hidden;
        }
        .panel::after {
            content: ''; position: absolute; inset: 4.5mm; border-radius: 7mm;
            border: 0.35mm solid rgba(255, 255, 255, 0.14); pointer-events: none;
        }

        .qr-card {
            position: relative;
            width: 158mm; height: 158mm;
            background: #fff; border-radius: 7mm;
            padding: 10mm;
            box-shadow: 0 0 0 1.8mm rgba(184, 164, 245, 0.35);
        }
        .qr-card #qr, .qr-card img, .qr-card canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
        .qr-card img { display: block; }
        /* Esquinas tipo visor de cámara */
        .corner { position: absolute; width: 17mm; height: 17mm; border: 1.5mm solid var(--lilac); }
        .c1 { top: -8mm; left: -8mm; border-right: 0; border-bottom: 0; border-top-left-radius: 6mm; }
        .c2 { top: -8mm; right: -8mm; border-left: 0; border-bottom: 0; border-top-right-radius: 6mm; }
        .c3 { bottom: -8mm; left: -8mm; border-right: 0; border-top: 0; border-bottom-left-radius: 6mm; }
        .c4 { bottom: -8mm; right: -8mm; border-left: 0; border-top: 0; border-bottom-right-radius: 6mm; }

        .scan {
            margin-top: 15mm;
            font-family: 'Instrument Serif', serif; font-weight: 400;
            font-size: 21mm; line-height: 1; letter-spacing: -0.02em; text-align: center;
        }
        .scan em { color: var(--lilac); }
        .sub {
            margin-top: 5mm;
            display: flex; align-items: center; gap: 3mm;
            font-size: 7mm; font-weight: 400; color: rgba(244, 241, 250, 0.8);
        }
        .sub svg { width: 7.5mm; height: 7.5mm; color: #25d366; }

        /* ===== Pie ===== */
        .foot {
            position: relative;
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 7mm; font-size: 4.4mm; color: var(--muted);
        }
        .foot b { color: var(--ink); font-weight: 600; }

        /* ===== Versión blanco y negro (?modo=mono) =====
           Sin fondos ni color: todo es tinta negra sobre papel blanco, así sale
           bien en cualquier impresora y no hace falta activar "Gráficos de fondo".
           El panel oscuro pasa a ser un marco doble de línea. */
        body.mono .poster::before { display: none; }
        body.mono .tagline,
        body.mono h1 .l2,
        body.mono .scan em { color: var(--ink); }
        body.mono .panel {
            background: #fff; color: var(--ink);
            border: 1.4mm solid var(--ink);
        }
        body.mono .panel::after { border-color: var(--ink); border-width: 0.35mm; }
        body.mono .qr-card { box-shadow: none; }
        body.mono .corner { border-color: var(--ink); }
        body.mono .sub { color: #2b2b2b; }
        body.mono .sub svg { color: var(--ink); }
        body.mono .foot { color: #444; }

        /* ===== Vista en pantalla (no afecta la impresión) ===== */
        @media screen {
            html { background: #e9e6ef; }
            body { background: transparent; padding: 24px 0; }
            .poster { margin: 0 auto; box-shadow: 0 20px 60px rgba(13, 11, 18, 0.18); transform-origin: top center; }
            body.embed { padding: 0; }
            body.embed .poster { box-shadow: none; }
        }
    </style>
</head>
<body>
    <article class="poster">
        <header class="top">
            <img src="logo.png" alt="HomePoint">
            <div class="tagline">Programa mayorista</div>
        </header>

        <h1><span class="l1">Comprá a precio</span><span class="l2">mayorista.</span></h1>

        <section class="panel">
            <div class="qr-card">
                <span class="corner c1"></span><span class="corner c2"></span>
                <span class="corner c3"></span><span class="corner c4"></span>
                <div id="qr"></div>
            </div>
            <h2 class="scan">Escaneá y <em>registrate</em></h2>
            <p class="sub">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.03c-.24.68-1.42 1.3-1.96 1.36-.5.06-1.13.08-1.82-.12-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.66.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.1.19-.14.31-.29.48-.14.17-.3.37-.43.5-.14.14-.29.3-.13.59.17.29.74 1.22 1.59 1.98 1.09.97 2.01 1.27 2.3 1.42.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.65-.14.26.1 1.68.79 1.97.94.29.14.48.22.55.34.07.12.07.7-.17 1.38z"/></svg>
                Te contactamos por WhatsApp
            </p>
        </section>

        <footer class="foot">
            <span><b>HomePoint</b> · Distribuidora</span>
            <span>¿Sin cámara? <b id="urlCorta"></b></span>
        </footer>
    </article>

    <script>
        const mono = new URLSearchParams(location.search).get('modo') === 'mono';
        document.body.classList.toggle('mono', mono);

        const url = new URL('registroMayorista.html', location.href).href;
        document.getElementById('urlCorta').textContent = url.replace(/^https?:\/\//, '');

        // Se genera grande (1200 px) para que en 14 cm de papel quede nítido.
        new QRCode(document.getElementById('qr'), {
            text: url, width: 1200, height: 1200,
            colorDark: '#0d0b12', colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.Q
        });

        // Dentro del panel se ve como vista previa; abierto solo, se ajusta a la ventana.
        if (window.self !== window.top) {
            document.body.classList.add('embed');
        } else {
            const poster = document.querySelector('.poster');
            const ajustar = () => {
                const escala = Math.min(1, (window.innerWidth - 32) / poster.offsetWidth, (window.innerHeight - 48) / poster.offsetHeight);
                poster.style.transform = `scale(${escala})`;
                document.body.style.height = (poster.offsetHeight * escala + 48) + 'px';
            };
            ajustar();
            window.addEventListener('resize', ajustar);
            window.addEventListener('beforeprint', () => { poster.style.transform = ''; document.body.style.height = ''; });
            window.addEventListener('afterprint', ajustar);
        }
    </script>
</body>
</html>
