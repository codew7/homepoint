<!DOCTYPE html>
<html lang="es" data-theme="dark" data-density="comfortable">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="description" content="Nexo CRM · CRM profesional para atender, vender y medir por WhatsApp.">
  <title>Nexo CRM · WhatsApp</title>

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d6f55e'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23101308'%3EN%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/app.css">
</head>

<body>

  <!-- pantalla de arranque: evita el destello de contenido sin estilo -->
  <div id="boot"
    style="position:fixed;inset:0;z-index:9998;display:grid;place-items:center;background:var(--bg);gap:14px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="brand-mark" style="width:44px;height:44px;font-size:26px;border-radius:13px">N</div>
      <div class="t-eyebrow">Nexo CRM</div>
    </div>
  </div>

  <div id="shell">
    <div class="app" id="app" data-rail="full">
      <nav class="rail" id="rail" aria-label="Navegación principal"></nav>
      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="view" id="view"></main>
      </div>
    </div>
  </div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif">
      Nexo CRM necesita JavaScript activado para funcionar.
    </div>
  </noscript>

  <!-- Núcleo -->
  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/wa.js"></script>

  <!-- Vistas -->
  <script src="js/view-inbox.js"></script>
  <script src="js/view-contacts.js"></script>
  <script src="js/view-pipeline.js"></script>
  <script src="js/view-campaigns.js"></script>
  <script src="js/view-automations.js"></script>
  <script src="js/view-analytics.js"></script>
  <script src="js/view-settings.js"></script>

  <!-- Armazón -->
  <script src="js/app.js"></script>
</body>

</html>
