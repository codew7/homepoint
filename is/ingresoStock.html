<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111116">
    <title>Ingreso de Stock</title>
    <link rel="icon" href="faviconnegro.png" type="image/png">
    <link rel="apple-touch-icon" href="faviconnegro.png">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <!-- Barcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- Config (pedidos-87064) -->
    <script src="config.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

        :root{
            --bg:#111116;
            --surface:#1a1a22;
            --card:#212130;
            --card-hover:#292940;
            --border:#2e2e42;
            --border-light:#3a3a54;
            --primary:#6c4eb6;
            --primary-glow:rgba(108,78,182,0.25);
            --primary-soft:rgba(108,78,182,0.12);
            --success:#00e676;
            --success-glow:rgba(0,230,118,0.2);
            --danger:#ff5252;
            --danger-glow:rgba(255,82,82,0.15);
            --warning:#ffab40;
            --text:#e8e8f0;
            --text-muted:#7a7a90;
            --text-dim:#55556a;
            --font:'Manrope',system-ui,sans-serif;
            --mono:'JetBrains Mono','Consolas',monospace;
            --radius:10px;
            --radius-lg:16px;
            --shadow:0 4px 24px rgba(0,0,0,0.4);
        }

        html{background:var(--bg)}
        body{
            font-family:var(--font);
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            min-height:100dvh;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
        }

        /* Subtle grid pattern */
        body::before{
            content:'';
            position:fixed;inset:0;
            background-image:
                linear-gradient(rgba(108,78,182,0.03) 1px,transparent 1px),
                linear-gradient(90deg,rgba(108,78,182,0.03) 1px,transparent 1px);
            background-size:40px 40px;
            pointer-events:none;
            z-index:0;
        }

        /* ========= HEADER ========= */
        .app-header{
            position:sticky;top:0;z-index:100;
            background:rgba(17,17,22,0.88);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);
            padding:10px 16px;
            display:flex;align-items:center;justify-content:space-between;
        }
        .app-header h1{
            font-size:1.05rem;font-weight:700;
            letter-spacing:-0.02em;
            display:flex;align-items:center;gap:8px;
        }
        .app-header h1 .icon-box{
            width:28px;height:28px;border-radius:7px;
            background:var(--primary);
            display:flex;align-items:center;justify-content:center;
            font-size:0.8rem;
        }
        .header-meta{
            display:flex;align-items:center;gap:10px;
            font-size:0.75rem;color:var(--text-muted);
        }
        .install-btn{
            width:32px;height:32px;border-radius:8px;
            background:var(--primary-soft);border:1.5px solid var(--primary);
            color:var(--primary);cursor:pointer;
            display:none;align-items:center;justify-content:center;
            transition:all 0.2s;flex-shrink:0;
            font-family:var(--font);padding:0;
        }
        .install-btn.visible{display:flex}
        .install-btn:active{background:var(--primary);color:#fff;transform:scale(0.92)}
        .online-dot{
            width:7px;height:7px;border-radius:50%;
            background:var(--success);
            box-shadow:0 0 6px var(--success-glow);
            display:inline-block;
        }
        .online-dot.offline{background:var(--danger);box-shadow:0 0 6px var(--danger-glow)}
        .session-count{
            background:var(--primary-soft);
            color:var(--primary);
            padding:2px 9px;border-radius:20px;
            font-weight:600;font-variant-numeric:tabular-nums;
        }

        /* ========= MAIN CONTENT ========= */
        .main-content{
            position:relative;z-index:1;
            max-width:520px;margin:0 auto;
            padding:12px 12px 32px;
            display:flex;flex-direction:column;gap:10px;
        }

        /* ========= SCAN SECTION ========= */
        .scan-section{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:16px 14px;
            display:flex;flex-direction:column;align-items:center;gap:12px;
        }

        .scan-btn-hero{
            width:100%;
            height:100px;
            border-radius:var(--radius);
            border:2px dashed var(--border-light);
            background:var(--primary-soft);
            color:var(--primary);
            cursor:pointer;
            display:flex;flex-direction:row;
            align-items:center;justify-content:center;gap:14px;
            font-family:var(--font);
            font-size:0.95rem;font-weight:600;
            transition:all 0.25s ease;
            padding:0 20px;
        }
        .scan-btn-hero:active{
            transform:scale(0.97);
            background:var(--primary-glow);
            border-color:var(--primary);
        }
        .scan-btn-hero svg{opacity:0.8;flex-shrink:0}
        .scan-btn-hero .scan-text{display:flex;flex-direction:column;align-items:flex-start}
        .scan-btn-hero .scan-label{font-size:0.75rem;color:var(--text-muted);font-weight:400}

        .manual-input-row{
            width:100%;display:flex;gap:8px;
        }
        .manual-input{
            flex:1;
            padding:10px 12px;
            background:var(--surface);
            border:1.5px solid var(--border);
            border-radius:var(--radius);
            color:var(--text);
            font-family:var(--mono);
            font-size:0.88rem;
            outline:none;
            transition:border-color 0.2s;
        }
        .manual-input::placeholder{color:var(--text-dim);font-family:var(--font);font-size:0.78rem}
        .manual-input:focus{border-color:var(--primary)}
        .manual-search-btn{
            padding:0 14px;
            border-radius:var(--radius);
            border:1.5px solid var(--primary);
            background:var(--primary);
            color:#fff;
            font-weight:600;font-size:0.85rem;
            cursor:pointer;font-family:var(--font);
            transition:all 0.2s;
            white-space:nowrap;
        }
        .manual-search-btn:active{transform:scale(0.95);opacity:0.85}

        .divider-text{
            font-size:0.7rem;color:var(--text-dim);
            text-transform:uppercase;letter-spacing:0.08em;
            display:flex;align-items:center;gap:10px;
            width:100%;
        }
        .divider-text::before,.divider-text::after{
            content:'';flex:1;height:1px;background:var(--border);
        }

        /* ========= PRODUCT CARD ========= */
        .product-card{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            overflow:hidden;
            display:none;
            animation:slideUp 0.35s ease;
        }
        .product-card.visible{display:block}

        @keyframes slideUp{
            from{opacity:0;transform:translateY(16px)}
            to{opacity:1;transform:translateY(0)}
        }

        .product-header{
            padding:12px 14px;
            border-bottom:1px solid var(--border);
            display:flex;align-items:center;gap:10px;
        }
        .product-img{
            width:50px;height:50px;
            border-radius:8px;
            object-fit:cover;
            background:var(--surface);
            border:1px solid var(--border);
            flex-shrink:0;
        }
        .product-info{flex:1;min-width:0}
        .product-name{
            font-size:0.88rem;font-weight:700;
            line-height:1.25;
            display:-webkit-box;-webkit-line-clamp:2;
            -webkit-box-orient:vertical;overflow:hidden;
        }
        .product-code{
            font-family:var(--mono);
            font-size:0.72rem;color:var(--text-muted);
            margin-top:2px;
        }
        .product-barcode-tag{
            font-family:var(--mono);
            font-size:0.66rem;
            color:var(--primary);
            background:var(--primary-soft);
            padding:1px 6px;border-radius:4px;
            margin-top:3px;display:inline-block;
        }
        .product-close-btn{
            width:30px;height:30px;border-radius:7px;
            background:var(--surface);border:1px solid var(--border);
            color:var(--text-muted);font-size:1rem;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            flex-shrink:0;transition:all 0.15s;
        }
        .product-close-btn:active{background:var(--danger-glow);color:var(--danger);border-color:var(--danger)}

        .quantity-section{
            padding:12px 14px 14px;
            display:flex;flex-direction:column;gap:10px;
        }
        .qty-label{
            font-size:0.75rem;color:var(--text-muted);
            font-weight:500;text-transform:uppercase;
            letter-spacing:0.06em;
        }
        .qty-row{display:flex;align-items:center;gap:8px}
        .qty-btn{
            width:44px;height:44px;
            border-radius:var(--radius);
            border:1.5px solid var(--border);
            background:var(--surface);
            color:var(--text);font-size:1.2rem;
            cursor:pointer;display:flex;
            align-items:center;justify-content:center;
            transition:all 0.15s;font-weight:700;
            font-family:var(--mono);
        }
        .qty-btn:active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
        .qty-input{
            flex:1;height:44px;
            text-align:center;
            font-family:var(--mono);
            font-size:1.3rem;font-weight:700;
            background:var(--surface);
            border:1.5px solid var(--border);
            border-radius:var(--radius);
            color:var(--text);outline:none;
            transition:border-color 0.2s;
        }
        .qty-input:focus{border-color:var(--primary)}
        /* Hide number spinners */
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

        .confirm-btn{
            width:100%;height:48px;
            border-radius:var(--radius);
            border:none;
            background:linear-gradient(135deg,var(--primary),#8b6dd4);
            color:#fff;font-weight:700;font-size:0.95rem;
            cursor:pointer;font-family:var(--font);
            letter-spacing:0.01em;
            transition:all 0.2s;
            display:flex;align-items:center;justify-content:center;gap:8px;
            box-shadow:0 4px 20px var(--primary-glow);
        }
        .confirm-btn:active{transform:scale(0.97);opacity:0.9}
        .confirm-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

        /* ========= HISTORY ========= */
        .history-section{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            overflow:hidden;
        }
        .history-header{
            padding:10px 14px;
            border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;
        }
        .history-title{
            font-size:0.75rem;font-weight:600;
            text-transform:uppercase;letter-spacing:0.06em;
            color:var(--text-muted);
        }
        .history-clear{
            font-size:0.72rem;color:var(--text-dim);
            background:none;border:none;cursor:pointer;
            font-family:var(--font);text-decoration:underline;
        }
        .history-list{max-height:240px;overflow-y:auto}
        .history-item{
            padding:8px 14px;
            border-bottom:1px solid rgba(46,46,66,0.5);
            display:flex;align-items:center;gap:10px;
            animation:fadeIn 0.3s ease;
        }
        .history-item:last-child{border-bottom:none}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .history-icon{
            width:28px;height:28px;border-radius:6px;
            background:var(--success-glow);
            color:var(--success);
            display:flex;align-items:center;justify-content:center;
            font-size:0.78rem;font-weight:700;flex-shrink:0;
        }
        .history-info{flex:1;min-width:0}
        .history-name{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .history-meta{font-size:0.68rem;color:var(--text-muted);font-family:var(--mono);margin-top:1px}
        .history-qty{
            font-family:var(--mono);font-weight:700;font-size:0.88rem;
            color:var(--success);flex-shrink:0;
        }
        .history-empty{
            padding:20px 14px;text-align:center;
            color:var(--text-dim);font-size:0.8rem;
        }

        /* ========= SCANNER OVERLAY ========= */
        .scanner-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.97);
            z-index:1000;display:none;
            flex-direction:column;align-items:center;
        }
        .scanner-overlay.active{display:flex}
        .scanner-top{
            width:100%;padding:16px 20px;
            display:flex;align-items:center;justify-content:space-between;
            flex-shrink:0;
        }
        .scanner-close{
            width:40px;height:40px;border-radius:50%;
            background:rgba(255,255,255,0.1);
            border:none;color:#fff;font-size:1.4rem;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        .scanner-close:active{background:rgba(255,255,255,0.25)}
        .scanner-label{color:#fff;font-size:0.9rem;font-weight:600}
        .scanner-body{
            flex:1;width:100%;max-width:500px;
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            padding:0 20px;
        }
        #scannerReader{width:100%;border-radius:16px;overflow:hidden}
        #scannerReader video{border-radius:16px;object-fit:cover}
        /* html5-qrcode overrides */
        #scannerReader img[alt="Info icon"],
        #scannerReader span{display:none!important}
        #scannerReader #html5-qrcode-anchor-scan-type-change{display:none!important}
        .scanner-hint{
            color:rgba(255,255,255,0.45);
            font-size:0.8rem;text-align:center;
            margin-top:24px;
        }

        /* ========= PRODUCT SELECTOR MODAL ========= */
        .modal-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(6px);
            z-index:1001;display:none;
            align-items:flex-end;justify-content:center;
            padding:0;
        }
        .modal-overlay.active{display:flex}
        .modal-sheet{
            width:100%;max-width:520px;
            max-height:70vh;
            background:var(--card);
            border-radius:var(--radius-lg) var(--radius-lg) 0 0;
            overflow:hidden;
            animation:sheetUp 0.3s ease;
        }
        @keyframes sheetUp{
            from{transform:translateY(100%)}
            to{transform:translateY(0)}
        }
        .modal-handle{
            width:36px;height:4px;border-radius:2px;
            background:var(--border-light);
            margin:10px auto 0;
        }
        .modal-title{
            padding:16px 20px 12px;
            font-size:0.95rem;font-weight:700;
            border-bottom:1px solid var(--border);
        }
        .modal-list{overflow-y:auto;max-height:calc(70vh - 80px)}
        .modal-item{
            padding:14px 20px;
            border-bottom:1px solid rgba(46,46,66,0.4);
            display:flex;align-items:center;gap:12px;
            cursor:pointer;transition:background 0.15s;
        }
        .modal-item:active{background:var(--primary-soft)}
        .modal-item-img{
            width:48px;height:48px;border-radius:8px;
            object-fit:cover;background:var(--surface);
            border:1px solid var(--border);flex-shrink:0;
        }
        .modal-item-info{flex:1;min-width:0}
        .modal-item-name{font-size:0.88rem;font-weight:600}
        .modal-item-code{font-family:var(--mono);font-size:0.75rem;color:var(--text-muted);margin-top:2px}

        /* ========= SUCCESS STAMP ========= */
        .success-stamp{
            position:fixed;inset:0;z-index:2000;
            display:none;align-items:center;justify-content:center;
            background:rgba(0,0,0,0.5);
            pointer-events:none;
        }
        .success-stamp.active{display:flex}
        .stamp-circle{
            width:90px;height:90px;border-radius:50%;
            background:var(--success);
            display:flex;align-items:center;justify-content:center;
            animation:stampIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:0 0 60px var(--success-glow);
        }
        .stamp-circle svg{width:42px;height:42px;color:#fff}
        @keyframes stampIn{
            0%{transform:scale(0) rotate(-20deg);opacity:0}
            60%{transform:scale(1.1) rotate(5deg);opacity:1}
            100%{transform:scale(1) rotate(0deg)}
        }

        /* ========= TOAST ========= */
        .toast{
            position:fixed;
            bottom:max(16px, env(safe-area-inset-bottom));
            left:50%;
            transform:translateX(-50%) translateY(100px);
            background:var(--card);
            border:1px solid var(--border);
            color:var(--text);
            padding:10px 20px;border-radius:var(--radius);
            font-size:0.82rem;z-index:500;
            transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:var(--shadow);
            display:flex;align-items:center;gap:8px;
            max-width:calc(100vw - 32px);
            text-align:center;
        }
        .toast.show{transform:translateX(-50%) translateY(0)}
        .toast.error{border-color:var(--danger);color:var(--danger)}

        /* ========= SEARCH MODAL ========= */
        .search-modal-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(6px);
            z-index:1002;display:none;
            flex-direction:column;
        }
        .search-modal-overlay.active{display:flex}
        .search-modal-header{
            padding:16px 20px;
            display:flex;align-items:center;gap:10px;
            background:var(--surface);
            border-bottom:1px solid var(--border);
        }
        .search-modal-input{
            flex:1;padding:10px 14px;
            background:var(--card);
            border:1.5px solid var(--border);
            border-radius:var(--radius);
            color:var(--text);font-size:0.95rem;
            outline:none;font-family:var(--font);
        }
        .search-modal-input:focus{border-color:var(--primary)}
        .search-modal-input::placeholder{color:var(--text-dim)}
        .search-modal-close{
            width:36px;height:36px;border-radius:8px;
            background:var(--card);border:1px solid var(--border);
            color:var(--text-muted);font-size:1.2rem;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        .search-modal-results{
            flex:1;overflow-y:auto;
            background:var(--bg);
            padding:8px 16px;
        }
        .search-result-item{
            padding:12px 16px;margin-bottom:6px;
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            display:flex;align-items:center;gap:12px;
            cursor:pointer;transition:all 0.15s;
        }
        .search-result-item:active{border-color:var(--primary);background:var(--primary-soft)}
        .search-result-img{
            width:44px;height:44px;border-radius:8px;
            object-fit:cover;background:var(--surface);
            border:1px solid var(--border);flex-shrink:0;
        }
        .search-result-name{font-size:0.85rem;font-weight:600}
        .search-result-code{font-family:var(--mono);font-size:0.72rem;color:var(--text-muted);margin-top:2px}
        .search-no-results{
            text-align:center;padding:40px 20px;
            color:var(--text-dim);font-size:0.88rem;
        }

        /* ========= LOADING ========= */
        .loading-bar{
            position:fixed;top:0;left:0;right:0;
            height:3px;z-index:9999;
            background:var(--primary);
            transform-origin:left;
            animation:loadProgress 2s ease forwards;
            display:none;
        }
        .loading-bar.active{display:block}
        @keyframes loadProgress{
            0%{transform:scaleX(0)}
            50%{transform:scaleX(0.6)}
            90%{transform:scaleX(0.9)}
            100%{transform:scaleX(1)}
        }

        /* ========= MOBILE-SPECIFIC ========= */
        @media(max-width:380px){
            .app-header h1{font-size:0.95rem}
            .app-header h1 .icon-box{width:24px;height:24px;border-radius:6px}
            .app-header h1 .icon-box svg{width:12px;height:12px}
            .scan-btn-hero{height:80px;gap:10px}
            .scan-btn-hero svg{width:28px;height:28px}
            .scan-btn-hero .scan-text{font-size:0.88rem}
            .manual-input{padding:9px 10px;font-size:0.82rem}
            .manual-input::placeholder{font-size:0.72rem}
            .manual-search-btn{padding:0 10px;font-size:0.8rem}
            .product-img{width:42px;height:42px}
            .product-name{font-size:0.82rem}
            .qty-btn{width:40px;height:40px;font-size:1.1rem}
            .qty-input{height:40px;font-size:1.1rem}
            .confirm-btn{height:44px;font-size:0.88rem}
        }

        /* safe area padding for notch devices */
        .app-header{
            padding-top:max(10px, env(safe-area-inset-top));
        }
        .main-content{
            padding-bottom:max(32px, env(safe-area-inset-bottom));
        }

        /* ========= RESPONSIVE ========= */
        @media(min-width:600px){
            .main-content{padding:20px 16px 60px}
            .scan-section{padding:20px}
            .scan-btn-hero{height:120px}
        }

        @media(min-width:768px){
            .modal-overlay{align-items:center;padding:20px}
            .modal-sheet{border-radius:var(--radius-lg);max-height:60vh}
            @keyframes sheetUp{

<script>
// ============================================================
//  PWA — Install Prompt Handler
// ============================================================
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('visible');
});

installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    if (result.outcome === 'accepted') {
        console.log('App instalada');
    }
    deferredPrompt = null;
    installBtn.classList.remove('visible');
});

window.addEventListener('appinstalled', () => {
    console.log('PWA fue instalada exitosamente');
    deferredPrompt = null;
    installBtn.classList.remove('visible');
});

// ============================================================
//  PWA — Manifest & Service Worker (inline)
// ============================================================
(function initPWA() {
    // Manifest
    const manifest = {
        name: 'HomePoint - Ingreso de Stock',
        short_name: 'Stock',
        description: 'Registro rapido de entradas de stock',
        start_url: 'ingresoStock.html',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#111116',
        theme_color: '#6c4eb6',
        icons: [
            { src: 'faviconnegro.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' }
        ]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const mUrl = URL.createObjectURL(mBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = mUrl;
    document.head.appendChild(link);

    // Service Worker
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE='ingreso-stock-v2';
            const ASSETS=[
                'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
                'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js',
                'https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js',
                'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
                'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap'
            ];
            self.addEventListener('install',e=>{
                e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));
            });
            self.addEventListener('activate',e=>{
                e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
            });
            self.addEventListener('fetch',e=>{
                if(e.request.method!=='GET')return;
                e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
    }
})();

// ============================================================

// ============================================================
// Main project (pedidos-87064): movimientos
const mainApp = firebase.initializeApp(firebaseConfig);

// Secondary project (admin-homepoint): codigosBarras
const adminConfig = {
    apiKey: "AIzaSyCyBB6ICFF0cH8nRATrHLYlhPzyQ8jmbgw",
    authDomain: "admin-homepoint.firebaseapp.com",
    databaseURL: "https://admin-homepoint-default-rtdb.firebaseio.com",
    projectId: "admin-homepoint",
    storageBucket: "admin-homepoint.firebasestorage.app",
    messagingSenderId: "790057437566",
    appId: "1:790057437566:web:2a1f83267ec2cc91decb2f"
};
const adminApp = firebase.initializeApp(adminConfig, 'admin');
const adminDb = adminApp.database();

// ============================================================
//  Auth Check
// ============================================================
let authResolved = false;
setTimeout(() => { if (!authResolved) window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href); }, 6000);
firebase.auth().onAuthStateChanged(user => {
    authResolved = true;

});

// ============================================================
//  State
// ============================================================
let articulos = [];        // from Google Sheets: { codigo, nombre, imagen }
let firebaseBarcodes = {}; // codigo -> { key, codigoBarras }
let selectedProduct = null;
let sessionEntries = [];
let html5QrCode = null;

// ============================================================
//  Google Sheets — Product Catalog
// ============================================================
const SHEETS_URL = `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(GOOGLE_SHEETS_CONFIG.RANGO)}?key=${GOOGLE_SHEETS_CONFIG.API_KEY}`;

async function loadSheets() {
    try {
        const res = await fetch(SHEETS_URL);
        if (!res.ok) throw new Error('Sheets error');
        const data = await res.json();
        articulos = (data.values || []).map(row => {
            const imgRaw = (row[1] || '').trim();
            return {
                imagen: imgRaw.split(',')[0].trim(),
                codigo: (row[2] || '').trim(),
                nombre: (row[3] || '').trim()
            };
        }).filter(a => a.codigo && a.nombre);
    } catch (e) {
        console.error('Error loading sheets:', e);
    }
}

// ============================================================
//  Firebase — Barcode Data
// ============================================================
function loadBarcodes() {
    return new Promise(resolve => {
        codigosRef.once('value', snap => {
            const val = snap.val() || {};
            firebaseBarcodes = {};
            Object.entries(val).forEach(([key, entry]) => {
                if (entry.codigo) {
                    firebaseBarcodes[entry.codigo] = {
                        key,
                        codigoBarras: entry.codigoBarras || '',
                        articulo: entry.articulo || ''
                    };
                }
            });
            resolve();
        });
    });
}

// Real-time listener
function startBarcodeListener() {
    codigosRef.on('value', snap => {
        const val = snap.val() || {};
        const newMap = {};
        Object.entries(val).forEach(([key, entry]) => {
            if (entry.codigo) {
                newMap[entry.codigo] = {
                    key,
                    codigoBarras: entry.codigoBarras || '',
                    articulo: entry.articulo || ''
                };
            }
        });
        firebaseBarcodes = newMap;
    });
}

// ============================================================
//  Barcode Lookup — find all products matching a barcode
// ============================================================
function findProductsByBarcode(barcode) {
    const target = barcode.trim();
    if (!target) return [];
    const matches = [];
    for (const [codigo, fbEntry] of Object.entries(firebaseBarcodes)) {
        if (!fbEntry.codigoBarras) continue;
        const codes = fbEntry.codigoBarras.split(',').map(c => c.trim());
        if (codes.some(c => c && c === target)) {
            const sheetsArticle = articulos.find(a => a.codigo === codigo);
            matches.push({
                codigo,
                nombre: sheetsArticle?.nombre || fbEntry.articulo || codigo,
                imagen: sheetsArticle?.imagen || '',
                codigoBarras: target
            });
        }
    }
    return matches;
}

// ============================================================
//  Manual Lookup — busca por codigo de barras parcial (ultimos
//  digitos) o por codigo de articulo
// ============================================================
function findProductsManual(input) {
    const q = input.trim();
    if (!q) return [];

    // 1) Coincidencia exacta de codigo de barras
    const exact = findProductsByBarcode(q);
    if (exact.length > 0) return exact;

    // 2) Coincidencia por ultimos digitos del codigo de barras
    const partialMatches = [];
    for (const [codigo, fbEntry] of Object.entries(firebaseBarcodes)) {
        if (!fbEntry.codigoBarras) continue;
        const codes = fbEntry.codigoBarras.split(',').map(c => c.trim());
        if (codes.some(c => c && c.endsWith(q))) {
            const sheetsArticle = articulos.find(a => a.codigo === codigo);
            const matchedCode = codes.find(c => c && c.endsWith(q)) || q;
            partialMatches.push({
                codigo,
                nombre: sheetsArticle?.nombre || fbEntry.articulo || codigo,
                imagen: sheetsArticle?.imagen || '',
                codigoBarras: matchedCode
            });
        }
    }
    if (partialMatches.length > 0) return partialMatches;

    // 3) Coincidencia por codigo de articulo
    const codeMatches = [];
    const qLower = q.toLowerCase();
    for (const [codigo, fbEntry] of Object.entries(firebaseBarcodes)) {
        if (codigo.toLowerCase() === qLower) {
            const sheetsArticle = articulos.find(a => a.codigo === codigo);
            codeMatches.push({
                codigo,
                nombre: sheetsArticle?.nombre || fbEntry.articulo || codigo,
                imagen: sheetsArticle?.imagen || '',
                codigoBarras: fbEntry.codigoBarras || ''
            });
        }
    }
    // Si no esta en Firebase barcodes, buscar en catalogo de Sheets
    if (codeMatches.length === 0) {
        const sheetsMatch = articulos.find(a => a.codigo.toLowerCase() === qLower);
        if (sheetsMatch) {
            codeMatches.push({
                codigo: sheetsMatch.codigo,
                nombre: sheetsMatch.nombre,
                imagen: sheetsMatch.imagen,
                codigoBarras: firebaseBarcodes[sheetsMatch.codigo]?.codigoBarras || ''
            });
        }
    }
    return codeMatches;
}

// ============================================================
//  Register Movement — identical structure to inventario.html
// ============================================================
async function registerMovement(codigo, nombre, cantidad) {
    const mov = {
        timestamp: Date.now(),
        codigo,
        nombre,
        cantidad,
        tipo: 'ENTRADA'
    };
    const ref = mainDb.ref('movimientos').push();
    await ref.set(mov);
    return mov;
}

// ============================================================
//  Scanner
// ============================================================
function openScanner() {
    const overlay = document.getElementById('scannerOverlay');
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    startScanner();
}

function closeScanner() {
    document.getElementById('scannerOverlay').classList.remove('active');
    document.body.style.overflow = '';
    stopScanner();
}

async function startScanner() {
    try {
        html5QrCode = new Html5Qrcode('scannerReader');
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
            showToast('No se detecto camara', true);
            closeScanner();
            return;
        }
        const backCam = cameras.find(c => /back|rear|environment/i.test(c.label));
        const cameraId = backCam ? backCam.id : cameras[cameras.length - 1].id;

        await html5QrCode.start(cameraId, {
            fps: 15,
            qrbox: { width: 280, height: 120 },
            aspectRatio: 1.0,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.QR_CODE
            ]
        }, onScanSuccess, () => {});
    } catch (err) {
        console.error('Scanner error:', err);
        showToast('Error al acceder a la camara', true);
        closeScanner();
    }
}

async function stopScanner() {
    if (html5QrCode) {
        try { await html5QrCode.stop(); html5QrCode.clear(); } catch (_) {}
        html5QrCode = null;
    }
}

async function onScanSuccess(decodedText) {
    await stopScanner();
    closeScanner();
    // Escaneo de camara: busqueda exacta de barcode
    processLookup(decodedText.trim(), true);
}

// ============================================================
//  Process Lookup — core flow
//  fromScanner=true  → solo coincidencia exacta de barcode
//  fromScanner=false → busqueda ampliada (parcial + codigo)
// ============================================================
function processLookup(input, fromScanner) {
    if (!input) return;
    const matches = fromScanner
        ? findProductsByBarcode(input)
        : findProductsManual(input);

    if (matches.length === 0) {
        showToast('No se encontro articulo para: ' + input, true);
        return;
    }
    if (matches.length === 1) {
        selectProduct(matches[0]);
    } else {
        showProductSelector(matches, input);
    }
}

function selectProduct(product) {
    selectedProduct = product;
    const card = document.getElementById('productCard');
    document.getElementById('productName').textContent = product.nombre;
    document.getElementById('productCode').textContent = 'Cod: ' + product.codigo;
    document.getElementById('productBarcodeTag').textContent = product.codigoBarras;
    const img = document.getElementById('productImg');
    img.src = product.imagen || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect fill=%22%231a1a22%22 width=%2264%22 height=%2264%22/></svg>';

    card.classList.remove('visible');
    void card.offsetWidth; // force reflow for animation
    card.classList.add('visible');

    const qtyInput = document.getElementById('qtyInput');
    qtyInput.value = 1;
    setTimeout(() => qtyInput.focus(), 300);
}

function closeProductCard() {
    document.getElementById('productCard').classList.remove('visible');
    selectedProduct = null;
}

// ============================================================
//  Product Selector Modal (multiple matches)
// ============================================================
function showProductSelector(matches, barcode) {
    const modal = document.getElementById('selectorModal');
    const list = document.getElementById('selectorList');
    document.getElementById('selectorTitle').textContent = matches.length + ' articulos con codigo ' + barcode;

    list.innerHTML = matches.map(m => `
        <div class="modal-item" data-codigo="${m.codigo}">
            <img class="modal-item-img" src="${m.imagen || ''}" alt=""
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect fill=%22%231a1a22%22 width=%2248%22 height=%2248%22/></svg>'">
            <div class="modal-item-info">
                <div class="modal-item-name">${escapeHtml(m.nombre)}</div>
                <div class="modal-item-code">Cod: ${escapeHtml(m.codigo)}</div>
            </div>
        </div>
    `).join('');

    list.querySelectorAll('.modal-item').forEach(item => {
        item.addEventListener('click', () => {
            const match = matches.find(m => m.codigo === item.dataset.codigo);
            if (match) {
                closeSelectorModal();
                selectProduct(match);
            }
        });
    });

    modal.classList.add('active');
}

function closeSelectorModal() {
    document.getElementById('selectorModal').classList.remove('active');
}

// ============================================================
//  Search Modal (manual product search)
// ============================================================
function openSearchModal() {
    const modal = document.getElementById('searchModal');
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    const input = document.getElementById('searchModalInput');
    input.value = '';
    input.focus();
    document.getElementById('searchModalResults').innerHTML = '<div class="search-no-results">Escribe para buscar articulos</div>';
}

function closeSearchModal() {
    document.getElementById('searchModal').classList.remove('active');
    document.body.style.overflow = '';
}

function searchArticles(query) {
    const q = query.trim().toLowerCase();
    const container = document.getElementById('searchModalResults');
    if (!q) {
        container.innerHTML = '<div class="search-no-results">Escribe para buscar articulos</div>';
        return;
    }
    const results = articulos.filter(a =>
        a.nombre.toLowerCase().includes(q) || a.codigo.toLowerCase().includes(q)
    ).slice(0, 20);

    if (results.length === 0) {
        container.innerHTML = '<div class="search-no-results">Sin resultados</div>';
        return;
    }

    container.innerHTML = results.map(a => {
        const bc = firebaseBarcodes[a.codigo]?.codigoBarras || '';
        return `<div class="search-result-item" data-codigo="${a.codigo}">
            <img class="search-result-img" src="${a.imagen || ''}" alt=""
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 44 44%22><rect fill=%22%231a1a22%22 width=%2244%22 height=%2244%22/></svg>'">
            <div>
                <div class="search-result-name">${escapeHtml(a.nombre)}</div>
                <div class="search-result-code">Cod: ${escapeHtml(a.codigo)}${bc ? ' &middot; CB: ' + escapeHtml(bc) : ''}</div>
            </div>
        </div>`;
    }).join('');

    container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', () => {
            const art = articulos.find(a => a.codigo === item.dataset.codigo);
            if (art) {
                closeSearchModal();
                selectProduct({
                    codigo: art.codigo,
                    nombre: art.nombre,
                    imagen: art.imagen,
                    codigoBarras: firebaseBarcodes[art.codigo]?.codigoBarras || ''
                });
            }
        });
    });
}

// ============================================================
//  Confirm Registration
// ============================================================
async function confirmEntry() {
    if (!selectedProduct) return;
    const qty = parseInt(document.getElementById('qtyInput').value);
    if (isNaN(qty) || qty < 1) {
        showToast('Ingresa una cantidad valida', true);
        return;
    }

    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.innerHTML = '<span style="opacity:0.7">Registrando...</span>';

    try {
        const mov = await registerMovement(selectedProduct.codigo, selectedProduct.nombre, qty);
        // Success animation
        showSuccessStamp();
        // Add to session history
        sessionEntries.unshift({
            nombre: selectedProduct.nombre,
            codigo: selectedProduct.codigo,
            cantidad: qty,
            timestamp: mov.timestamp
        });
        updateSessionCount();
        renderHistory();
        // Reset
        closeProductCard();
        document.getElementById('manualInput').value = '';
    } catch (err) {
        console.error('Error registering:', err);
        showToast('Error al registrar movimiento', true);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Registrar Entrada';
    }
}

// ============================================================
//  History
// ============================================================
function renderHistory() {
    const list = document.getElementById('historyList');
    const empty = document.getElementById('historyEmpty');
    if (sessionEntries.length === 0) {
        list.innerHTML = '<div class="history-empty" id="historyEmpty">Sin entradas registradas</div>';
        return;
    }
    list.innerHTML = sessionEntries.slice(0, 30).map(e => {
        const time = new Date(e.timestamp);
        const hh = String(time.getHours()).padStart(2, '0');
        const mm = String(time.getMinutes()).padStart(2, '0');
        return `<div class="history-item">
            <div class="history-icon">+</div>
            <div class="history-info">
                <div class="history-name">${escapeHtml(e.nombre)}</div>
                <div class="history-meta">${escapeHtml(e.codigo)} &middot; ${hh}:${mm}</div>
            </div>
            <div class="history-qty">+${e.cantidad}</div>
        </div>`;
    }).join('');
}

function clearHistory() {
    sessionEntries = [];
    updateSessionCount();
    renderHistory();
}

function updateSessionCount() {
    const total = sessionEntries.reduce((s, e) => s + e.cantidad, 0);
    document.getElementById('sessionCount').textContent = total;
}

// ============================================================
//  UI Helpers
// ============================================================
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function showToast(msg, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function showSuccessStamp() {
    const stamp = document.getElementById('successStamp');
    stamp.classList.add('active');
    setTimeout(() => stamp.classList.remove('active'), 900);
}

// ============================================================
//  Online / Offline
// ============================================================
function updateOnlineStatus() {
    const dot = document.getElementById('onlineDot');
    if (navigator.onLine) {
        dot.classList.remove('offline');
        dot.title = 'En linea';
    } else {
        dot.classList.add('offline');
        dot.title = 'Sin conexion';
    }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ============================================================
//  Event Listeners
// ============================================================
document.getElementById('scanBtnHero').addEventListener('click', openScanner);
document.getElementById('scannerClose').addEventListener('click', closeScanner);
document.getElementById('scannerOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeScanner();
});

document.getElementById('manualSearchBtn').addEventListener('click', () => {
    const val = document.getElementById('manualInput').value.trim();
    if (val) {
        processLookup(val, false);
    } else {
        openSearchModal();
    }
});
document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) processLookup(val, false);
    }
});

document.getElementById('productCloseBtn').addEventListener('click', closeProductCard);

document.getElementById('qtyMinus').addEventListener('click', () => {
    const input = document.getElementById('qtyInput');
    const v = parseInt(input.value) || 1;
    input.value = Math.max(1, v - 1);
});
document.getElementById('qtyPlus').addEventListener('click', () => {
    const input = document.getElementById('qtyInput');
    const v = parseInt(input.value) || 0;
    input.value = v + 1;
});
document.getElementById('qtyInput').addEventListener('input', function () {
    if (this.value !== '' && parseInt(this.value) < 1) this.value = 1;
});

document.getElementById('confirmBtn').addEventListener('click', confirmEntry);
document.getElementById('qtyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmEntry();
});

document.getElementById('historyClear').addEventListener('click', clearHistory);

// Selector modal
document.getElementById('selectorModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeSelectorModal();
});

// Search modal
document.getElementById('searchModalClose').addEventListener('click', closeSearchModal);
let searchTimer;
document.getElementById('searchModalInput').addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => searchArticles(this.value), 200);
});

// ============================================================
//  Init
// ============================================================
async function init() {
    const bar = document.getElementById('loadingBar');
    bar.classList.add('active');
    try {
        await Promise.all([loadSheets(), loadBarcodes()]);
        startBarcodeListener();
    } catch (err) {
        console.error('Init error:', err);
        showToast('Error al cargar datos', true);
    } finally {
        setTimeout(() => bar.classList.remove('active'), 600);
    }
}

init();
</script>
</body>
