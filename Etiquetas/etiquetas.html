<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0e1512">
    <title>Etiquetas de Precio</title>
    <link rel="icon" href="faviconnegro.png" type="image/png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <!-- Barcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- PDF Generation -->
    <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

    <!-- Config (Google Sheets credentials) -->
    <script src="config.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

        :root{
            --bg:#0e1512;
            --surface:#141f1a;
            --card:#1a2b24;
            --card-hover:#223830;
            --border:#2a3f34;
            --border-light:#375446;
            --primary:#2e9e6a;
            --primary-glow:rgba(46,158,106,0.25);
            --primary-soft:rgba(46,158,106,0.12);
            --success:#34d399;
            --success-glow:rgba(52,211,153,0.2);
            --danger:#f87171;
            --danger-glow:rgba(248,113,113,0.15);
            --warning:#fbbf24;
            --text:#e2f0ea;
            --text-muted:#6b8f7e;
            --text-dim:#4a6b5c;
            --font:'Manrope',system-ui,sans-serif;
            --mono:'JetBrains Mono','Consolas',monospace;
            --radius:10px;
            --radius-lg:16px;
            --shadow:0 4px 24px rgba(0,0,0,0.4);
        }

        html{background:var(--bg)}
        body{
            font-family:var(--font);
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            min-height:100dvh;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
        }

        body::before{
            content:'';
            position:fixed;inset:0;
            background-image:
                linear-gradient(rgba(46,158,106,0.03) 1px,transparent 1px),
                linear-gradient(90deg,rgba(46,158,106,0.03) 1px,transparent 1px);
            background-size:40px 40px;
            pointer-events:none;
            z-index:0;
        }

        /* ========= HEADER ========= */
        .app-header{
            position:sticky;top:0;z-index:100;
            background:rgba(14,21,18,0.88);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);
            padding:10px 16px;
            padding-top:max(10px, env(safe-area-inset-top));
            display:flex;align-items:center;justify-content:space-between;
        }
        .app-header h1{
            font-size:1.05rem;font-weight:700;
            letter-spacing:-0.02em;
            display:flex;align-items:center;gap:8px;
        }
        .app-header h1 .icon-box{
            width:28px;height:28px;border-radius:7px;
            background:var(--primary);
            display:flex;align-items:center;justify-content:center;
            font-size:0.8rem;
        }
        .header-meta{
            display:flex;align-items:center;gap:10px;
            font-size:0.75rem;color:var(--text-muted);
        }
        .online-dot{
            width:7px;height:7px;border-radius:50%;
            background:var(--success);
            box-shadow:0 0 6px var(--success-glow);
            display:inline-block;
        }
        .online-dot.offline{background:var(--danger);box-shadow:0 0 6px var(--danger-glow)}
        .item-count{
            background:var(--primary-soft);
            color:var(--primary);
            padding:2px 9px;border-radius:20px;
            font-weight:600;font-variant-numeric:tabular-nums;
        }

        /* ========= MAIN CONTENT ========= */
        .main-content{
            position:relative;z-index:1;
            max-width:520px;margin:0 auto;
            padding:12px 12px 32px;
            padding-bottom:max(32px, env(safe-area-inset-bottom));
            display:flex;flex-direction:column;gap:10px;
        }

        /* ========= SCAN SECTION ========= */
        .scan-section{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:16px 14px;
            display:flex;flex-direction:column;align-items:center;gap:12px;
        }

        .scan-btn-hero{
            width:100%;
            height:100px;
            border-radius:var(--radius);
            border:2px dashed var(--border-light);
            background:var(--primary-soft);
            color:var(--primary);
            cursor:pointer;
            display:flex;flex-direction:row;
            align-items:center;justify-content:center;gap:14px;
            font-family:var(--font);
            font-size:0.95rem;font-weight:600;
            transition:all 0.25s ease;
            padding:0 20px;
        }
        .scan-btn-hero:active{
            transform:scale(0.97);
            background:var(--primary-glow);
            border-color:var(--primary);
        }
        .scan-btn-hero svg{opacity:0.8;flex-shrink:0}
        .scan-btn-hero .scan-text{display:flex;flex-direction:column;align-items:flex-start}
        .scan-btn-hero .scan-label{font-size:0.75rem;color:var(--text-muted);font-weight:400}

        .manual-input-row{
            width:100%;display:flex;gap:8px;
        }
        .manual-input{
            flex:1;
            padding:10px 12px;
            background:var(--surface);
            border:1.5px solid var(--border);
            border-radius:var(--radius);
            color:var(--text);
            font-family:var(--mono);
            font-size:0.88rem;
            outline:none;
            transition:border-color 0.2s;
        }
        .manual-input::placeholder{color:var(--text-dim);font-family:var(--font);font-size:0.78rem}
        .manual-input:focus{border-color:var(--primary)}
        .manual-search-btn{
            padding:0 14px;
            border-radius:var(--radius);
            border:1.5px solid var(--primary);
            background:var(--primary);
            color:#fff;
            font-weight:600;font-size:0.85rem;
            cursor:pointer;font-family:var(--font);
            transition:all 0.2s;
            white-space:nowrap;
        }
        .manual-search-btn:active{transform:scale(0.95);opacity:0.85}

        .divider-text{
            font-size:0.7rem;color:var(--text-dim);
            text-transform:uppercase;letter-spacing:0.08em;
            display:flex;align-items:center;gap:10px;
            width:100%;
        }
        .divider-text::before,.divider-text::after{
            content:'';flex:1;height:1px;background:var(--border);
        }

        /* ========= LABEL SETTINGS ========= */
        .label-settings{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:14px;
        }
        .label-settings-title{
            font-size:0.75rem;font-weight:600;
            text-transform:uppercase;letter-spacing:0.06em;
            color:var(--text-muted);margin-bottom:10px;
        }
        .settings-row{
            display:flex;gap:8px;flex-wrap:wrap;
        }
        .setting-field{
            flex:1;min-width:0;
            display:flex;flex-direction:column;gap:4px;
        }
        .setting-field label{
            font-size:0.68rem;color:var(--text-muted);font-weight:500;
        }
        .setting-field input{
            padding:8px 10px;
            background:var(--surface);
            border:1.5px solid var(--border);
            border-radius:var(--radius);
            color:var(--text);
            font-family:var(--mono);
            font-size:0.82rem;
            outline:none;
            transition:border-color 0.2s;
            width:100%;
            text-align:center;
        }
        .setting-field input:focus{border-color:var(--primary)}
        .setting-field .setting-unit{
            font-size:0.62rem;color:var(--text-dim);text-align:center;
        }

        /* ========= LABEL LIST ========= */
        .label-list-section{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            overflow:hidden;
        }
        .label-list-header{
            padding:10px 14px;
            border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;
        }
        .label-list-title{
            font-size:0.75rem;font-weight:600;
            text-transform:uppercase;letter-spacing:0.06em;
            color:var(--text-muted);
        }
        .label-list-clear{
            font-size:0.72rem;color:var(--text-dim);
            background:none;border:none;cursor:pointer;
            font-family:var(--font);text-decoration:underline;
        }
        .label-list{max-height:320px;overflow-y:auto}
        .label-item{
            padding:10px 14px;
            border-bottom:1px solid rgba(46,46,66,0.5);
            display:flex;align-items:center;gap:10px;
            animation:fadeIn 0.3s ease;
        }
        .label-item:last-child{border-bottom:none}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .label-item-info{flex:1;min-width:0}
        .label-item-name{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .label-item-meta{font-size:0.68rem;color:var(--text-muted);font-family:var(--mono);margin-top:1px}
        .label-item-price{
            font-family:var(--mono);font-weight:700;font-size:0.92rem;
            color:var(--success);flex-shrink:0;
        }
        .label-item-delete{
            width:28px;height:28px;border-radius:6px;
            background:var(--danger-glow);border:1px solid transparent;
            color:var(--danger);font-size:1.1rem;line-height:1;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            flex-shrink:0;transition:all 0.15s;padding:0;
            font-family:var(--font);
        }
        .label-item-delete:active{background:var(--danger);color:#fff;border-color:var(--danger)}
        .label-list-empty{
            padding:20px 14px;text-align:center;
            color:var(--text-dim);font-size:0.8rem;
        }

        /* ========= GENERATE PDF BTN ========= */
        .generate-btn{
            width:100%;height:52px;
            border-radius:var(--radius);
            border:none;
            background:linear-gradient(135deg,var(--primary),#3cc88a);
            color:#fff;font-weight:700;font-size:1rem;
            cursor:pointer;font-family:var(--font);
            letter-spacing:0.01em;
            transition:all 0.2s;
            display:flex;align-items:center;justify-content:center;gap:10px;
            box-shadow:0 4px 20px var(--primary-glow);
        }
        .generate-btn:active{transform:scale(0.97);opacity:0.9}
        .generate-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

        /* ========= LABEL PREVIEW ========= */
        .preview-section{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            overflow:hidden;
        }
        .preview-header{
            padding:10px 14px;
            border-bottom:1px solid var(--border);
            font-size:0.75rem;font-weight:600;
            text-transform:uppercase;letter-spacing:0.06em;
            color:var(--text-muted);
        }
        .preview-container{
            padding:14px;
            display:flex;
            justify-content:center;
            overflow-x:auto;
        }
        .label-preview{
            width:300px;
            height:120px;
            background:#fff;
            border-radius:4px;
            color:#000;
            display:flex;
            flex-direction:column;
            font-family:'Manrope',Arial,sans-serif;
            flex-shrink:0;
            position:relative;
            overflow:hidden;
            border:1px solid #bbb;
        }
        .label-preview .lp-top{
            display:flex;justify-content:space-between;align-items:center;
            gap:4px;
            background:#f5f5f5;
            padding:6px 10px;
            border-bottom:1px solid #ddd;
        }
        .label-preview .lp-name{
            font-size:11px;font-weight:700;
            line-height:1.25;
            flex:1;min-width:0;
            overflow:hidden;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
        }
        .label-preview .lp-price-row{
            flex:1;
            display:flex;align-items:center;
            padding:0 10px;
        }
        .label-preview .lp-currency{
            font-size:24px;font-weight:700;
            color:#333;margin-right:2px;
            align-self:center;
        }
        .label-preview .lp-price{
            font-size:56px;font-weight:800;
            line-height:1;letter-spacing:-2px;
            color:#000;
        }
        .label-preview .lp-bottom{
            display:flex;justify-content:space-between;align-items:flex-end;
            font-size:7px;color:#aaa;
            padding:0 10px 4px;
            gap:6px;
        }
        .label-preview .lp-date{font-family:var(--mono)}

        /* ========= SCANNER OVERLAY ========= */
        .scanner-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.97);
            z-index:1000;display:none;
            flex-direction:column;align-items:center;
        }
        .scanner-overlay.active{display:flex}
        .scanner-top{
            width:100%;padding:16px 20px;
            display:flex;align-items:center;justify-content:space-between;
            flex-shrink:0;
        }
        .scanner-close{
            width:40px;height:40px;border-radius:50%;
            background:rgba(255,255,255,0.1);
            border:none;color:#fff;font-size:1.4rem;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        .scanner-close:active{background:rgba(255,255,255,0.25)}
        .scanner-label{color:#fff;font-size:0.9rem;font-weight:600}
        .scanner-body{
            flex:1;width:100%;max-width:500px;
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            padding:0 20px;
        }
        #scannerReader{width:100%;border-radius:16px;overflow:hidden}
        #scannerReader video{border-radius:16px;object-fit:cover}
        #scannerReader img[alt="Info icon"],
        #scannerReader span{display:none!important}
        #scannerReader #html5-qrcode-anchor-scan-type-change{display:none!important}
        .scanner-hint{
            color:rgba(255,255,255,0.45);
            font-size:0.8rem;text-align:center;
            margin-top:24px;
        }

        /* ========= PRODUCT SELECTOR MODAL ========= */
        .modal-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(6px);
            z-index:1001;display:none;
            align-items:flex-end;justify-content:center;
            padding:0;
        }
        .modal-overlay.active{display:flex}
        .modal-sheet{
            width:100%;max-width:520px;
            max-height:70vh;
            background:var(--card);
            border-radius:var(--radius-lg) var(--radius-lg) 0 0;
            overflow:hidden;
            animation:sheetUp 0.3s ease;
        }
        @keyframes sheetUp{
            from{transform:translateY(100%)}
            to{transform:translateY(0)}
        }
        .modal-handle{
            width:36px;height:4px;border-radius:2px;
            background:var(--border-light);
            margin:10px auto 0;
        }
        .modal-title{
            padding:16px 20px 12px;
            font-size:0.95rem;font-weight:700;
            border-bottom:1px solid var(--border);
        }
        .modal-list{overflow-y:auto;max-height:calc(70vh - 80px)}
        .modal-item{
            padding:14px 20px;
            border-bottom:1px solid rgba(46,46,66,0.4);
            display:flex;align-items:center;gap:12px;
            cursor:pointer;transition:background 0.15s;
        }
        .modal-item:active{background:var(--primary-soft)}
        .modal-item-img{
            width:48px;height:48px;border-radius:8px;
            object-fit:cover;background:var(--surface);
            border:1px solid var(--border);flex-shrink:0;
        }
        .modal-item-info{flex:1;min-width:0}
        .modal-item-name{font-size:0.88rem;font-weight:600}
        .modal-item-code{font-family:var(--mono);font-size:0.75rem;color:var(--text-muted);margin-top:2px}

        /* ========= SEARCH MODAL ========= */
        .search-modal-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(6px);
            z-index:1002;display:none;
            flex-direction:column;
        }
        .search-modal-overlay.active{display:flex}
        .search-modal-header{
            padding:16px 20px;
            display:flex;align-items:center;gap:10px;
            background:var(--surface);
            border-bottom:1px solid var(--border);
        }
        .search-modal-input{
            flex:1;padding:10px 14px;
            background:var(--card);
            border:1.5px solid var(--border);
            border-radius:var(--radius);
            color:var(--text);font-size:0.95rem;
            outline:none;font-family:var(--font);
        }
        .search-modal-input:focus{border-color:var(--primary)}
        .search-modal-input::placeholder{color:var(--text-dim)}
        .search-modal-close{
            width:36px;height:36px;border-radius:8px;
            background:var(--card);border:1px solid var(--border);
            color:var(--text-muted);font-size:1.2rem;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        .search-modal-results{
            flex:1;overflow-y:auto;
            background:var(--bg);
            padding:8px 16px;
        }
        .search-result-item{
            padding:12px 16px;margin-bottom:6px;
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            display:flex;align-items:center;gap:12px;
            cursor:pointer;transition:all 0.15s;
        }
        .search-result-item:active{border-color:var(--primary);background:var(--primary-soft)}
        .search-result-img{
            width:44px;height:44px;border-radius:8px;
            object-fit:cover;background:var(--surface);
            border:1px solid var(--border);flex-shrink:0;
        }
        .search-result-name{font-size:0.85rem;font-weight:600}
        .search-result-code{font-family:var(--mono);font-size:0.72rem;color:var(--text-muted);margin-top:2px}
        .search-result-price{font-family:var(--mono);font-size:0.72rem;color:var(--success);margin-top:1px}
        .search-no-results{
            text-align:center;padding:40px 20px;
            color:var(--text-dim);font-size:0.88rem;
        }

        /* ========= SUCCESS STAMP ========= */
        .success-stamp{
            position:fixed;inset:0;z-index:2000;
            display:none;align-items:center;justify-content:center;
            background:rgba(0,0,0,0.5);
            pointer-events:none;
        }
        .success-stamp.active{display:flex}
        .stamp-circle{
            width:90px;height:90px;border-radius:50%;
            background:var(--success);
            display:flex;align-items:center;justify-content:center;
            animation:stampIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:0 0 60px var(--success-glow);
        }
        .stamp-circle svg{width:42px;height:42px;color:#fff}
        @keyframes stampIn{
            0%{transform:scale(0) rotate(-20deg);opacity:0}
            60%{transform:scale(1.1) rotate(5deg);opacity:1}
            100%{transform:scale(1) rotate(0deg)}
        }

        /* ========= TOAST ========= */
        .toast{
            position:fixed;
            bottom:max(16px, env(safe-area-inset-bottom));
            left:50%;
            transform:translateX(-50%) translateY(100px);
            background:var(--card);
            border:1px solid var(--border);
            color:var(--text);
            padding:10px 20px;border-radius:var(--radius);
            font-size:0.82rem;z-index:500;
            transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:var(--shadow);
            display:flex;align-items:center;gap:8px;
            max-width:calc(100vw - 32px);
            text-align:center;
        }
        .toast.show{transform:translateX(-50%) translateY(0)}
        .toast.error{border-color:var(--danger);color:var(--danger)}

        /* ========= LOADING ========= */
        .loading-bar{
            position:fixed;top:0;left:0;right:0;
            height:3px;z-index:9999;
            background:var(--primary);
            transform-origin:left;
            animation:loadProgress 2s ease forwards;
            display:none;
        }
        .loading-bar.active{display:block}
        @keyframes loadProgress{
            0%{transform:scaleX(0)}
            50%{transform:scaleX(0.6)}
            90%{transform:scaleX(0.9)}
            100%{transform:scaleX(1)}
        }

        @keyframes slideUp{
            from{opacity:0;transform:translateY(16px)}
            to{opacity:1;transform:translateY(0)}
        }

        /* ========= MOBILE-SPECIFIC ========= */
        @media(max-width:380px){
            .app-header h1{font-size:0.95rem}
            .app-header h1 .icon-box{width:24px;height:24px;border-radius:6px}
            .app-header h1 .icon-box svg{width:12px;height:12px}
            .scan-btn-hero{height:80px;gap:10px}
            .scan-btn-hero svg{width:28px;height:28px}
            .scan-btn-hero .scan-text{font-size:0.88rem}
            .manual-input{padding:9px 10px;font-size:0.82rem}
            .manual-input::placeholder{font-size:0.72rem}
            .manual-search-btn{padding:0 10px;font-size:0.8rem}
            .generate-btn{height:46px;font-size:0.9rem}
            .label-preview{transform:scale(0.85);transform-origin:center}
        }

        @media(min-width:600px){
            .main-content{padding:20px 16px 60px}
            .scan-section{padding:20px}
            .scan-btn-hero{height:120px}
        }

        @media(min-width:768px){
            .modal-overlay{align-items:center;padding:20px}
            .modal-sheet{border-radius:var(--radius-lg);max-height:60vh}
            @keyframes sheetUp{
                from{transform:translateY(30px);opacity:0}
                to{transform:translateY(0);opacity:1}
            }
        }
    </style>
</head>
<body>

    <div class="loading-bar" id="loadingBar"></div>

    <!-- ========= HEADER ========= -->
    <header class="app-header">
        <h1>
            <span class="icon-box">

    <!-- ========= MAIN ========= -->

<script>
// ============================================================
//  State
// ============================================================
let articulos = [];        // from Google Sheets: { codigo, nombre, imagen, precio, codigoBarras }
let labelItems = [];       // items added for label generation
let html5QrCode = null;

// Label settings (persisted in sessionStorage)
let labelSettings = {
    width: 70,    // mm
    height: 30,   // mm
    perLabel: 1   // articles per label page
};

function loadSettings() {
    try {
        const saved = sessionStorage.getItem('labelSettings');
        if (saved) {
            const parsed = JSON.parse(saved);
            labelSettings.width = parsed.width || 70;
            labelSettings.height = parsed.height || 30;
            labelSettings.perLabel = parsed.perLabel || 1;
        }
    } catch (_) {}
    document.getElementById('settingWidth').value = labelSettings.width;
    document.getElementById('settingHeight').value = labelSettings.height;
    document.getElementById('settingPerLabel').value = labelSettings.perLabel;
}

function saveSettings() {
    labelSettings.width = Math.max(20, Math.min(300, parseInt(document.getElementById('settingWidth').value) || 70));
    labelSettings.height = Math.max(20, Math.min(300, parseInt(document.getElementById('settingHeight').value) || 30));
    labelSettings.perLabel = Math.max(1, Math.min(20, parseInt(document.getElementById('settingPerLabel').value) || 1));
    sessionStorage.setItem('labelSettings', JSON.stringify(labelSettings));
}

// ============================================================
//  Google Sheets — Product Catalog
// ============================================================
const SHEETS_URL = `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(GOOGLE_SHEETS_CONFIG.RANGO)}?key=${GOOGLE_SHEETS_CONFIG.API_KEY}`;

async function loadSheets() {
    try {
        const res = await fetch(SHEETS_URL);
        if (!res.ok) throw new Error('Sheets error');
        const data = await res.json();
        articulos = (data.values || []).map(row => {
            const imgRaw = (row[1] || '').trim();
            const precioRaw = (row[6] || '').trim(); // Column G = index 6
            const cbRaw = (row[11] || '').trim();    // Column L = index 11 (barcodes)
            return {
                imagen: imgRaw.split(',')[0].trim(),
                codigo: (row[2] || '').trim(),   // Column C
                nombre: (row[3] || '').trim(),   // Column D
                precio: precioRaw,
                codigoBarras: cbRaw
            };
        }).filter(a => a.codigo && a.nombre);
    } catch (e) {
        console.error('Error loading sheets:', e);
    }
}

// ============================================================
//  Barcode Lookup — from Google Sheets data only
// ============================================================
function findProductsByBarcode(barcode) {
    const target = barcode.trim();
    if (!target) return [];
    // Compare only the last 6 characters
    const tail = target.slice(-6);
    return articulos.filter(a => {
        if (!a.codigoBarras) return false;
        const codes = a.codigoBarras.split(',').map(c => c.trim());
        return codes.some(c => c && c.slice(-6) === tail);
    });
}

function findProductsManual(input) {
    const q = input.trim();
    if (!q) return [];

    // 1) Exact barcode match
    const exact = findProductsByBarcode(q);
    if (exact.length > 0) return exact;

    // 2) Partial barcode match (last digits)
    const partial = articulos.filter(a => {
        if (!a.codigoBarras) return false;
        const codes = a.codigoBarras.split(',').map(c => c.trim());
        return codes.some(c => c && c.endsWith(q));
    });
    if (partial.length > 0) return partial;

    // 3) Code match
    const qLower = q.toLowerCase();
    const codeMatch = articulos.filter(a => a.codigo.toLowerCase() === qLower);
    if (codeMatch.length > 0) return codeMatch;

    // 4) Name match
    return articulos.filter(a =>
        a.nombre.toLowerCase().includes(qLower)
    ).slice(0, 20);
}

// ============================================================
//  Scanner
// ============================================================
function openScanner() {
    document.getElementById('scannerOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    startScanner();
}

function closeScanner() {
    document.getElementById('scannerOverlay').classList.remove('active');
    document.body.style.overflow = '';
    stopScanner();
}

async function startScanner() {
    try {
        html5QrCode = new Html5Qrcode('scannerReader');
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
            showToast('No se detecto camara', true);
            closeScanner();
            return;
        }
        const backCam = cameras.find(c => /back|rear|environment/i.test(c.label));
        const cameraId = backCam ? backCam.id : cameras[cameras.length - 1].id;

        await html5QrCode.start(cameraId, {
            fps: 15,
            qrbox: { width: 280, height: 120 },
            aspectRatio: 1.0,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.QR_CODE
            ]
        }, onScanSuccess, () => {});
    } catch (err) {
        console.error('Scanner error:', err);
        showToast('Error al acceder a la camara', true);
        closeScanner();
    }
}

async function stopScanner() {
    if (html5QrCode) {
        try { await html5QrCode.stop(); html5QrCode.clear(); } catch (_) {}
        html5QrCode = null;
    }
}

async function onScanSuccess(decodedText) {
    await stopScanner();
    closeScanner();
    processLookup(decodedText.trim(), true);
}

// ============================================================
//  Process Lookup
// ============================================================
function processLookup(input, fromScanner) {
    if (!input) return;
    const matches = fromScanner
        ? findProductsByBarcode(input)
        : findProductsManual(input);

    if (matches.length === 0) {
        showToast('No se encontro articulo para: ' + input, true);
        return;
    }
    if (matches.length === 1) {
        addToLabelList(matches[0]);
    } else {
        showProductSelector(matches, input);
    }
}

// ============================================================
//  Label List Management
// ============================================================
function addToLabelList(product) {
    // Check if already in list
    const existing = labelItems.find(i => i.codigo === product.codigo);
    if (existing) {
        showToast('Ya esta en la lista: ' + product.nombre, false);
        return;
    }

    const precio = product.precio || '0';
    labelItems.push({
        codigo: product.codigo,
        nombre: product.nombre,
        imagen: product.imagen,
        precio: precio,
        codigoBarras: product.codigoBarras
    });

    updateItemCount();
    renderLabelList();
    updatePreview(labelItems[labelItems.length - 1]);
    showToast('Agregado: ' + product.nombre, false);
    document.getElementById('manualInput').value = '';
}

function removeFromLabelList(codigo) {
    labelItems = labelItems.filter(i => i.codigo !== codigo);
    updateItemCount();
    renderLabelList();
    if (labelItems.length > 0) {
        updatePreview(labelItems[labelItems.length - 1]);
    } else {
        document.getElementById('previewSection').style.display = 'none';
    }
}

function clearLabelList() {
    labelItems = [];
    updateItemCount();
    renderLabelList();
    document.getElementById('previewSection').style.display = 'none';
}

function updateItemCount() {
    document.getElementById('itemCount').textContent = labelItems.length;
    document.getElementById('generateBtn').disabled = labelItems.length === 0;
}

function renderLabelList() {
    const list = document.getElementById('labelList');
    if (labelItems.length === 0) {
        list.innerHTML = '<div class="label-list-empty">Agrega articulos para generar etiquetas</div>';
        return;
    }
    list.innerHTML = labelItems.map(item => {
        const precioDisplay = formatPriceDisplay(item.precio);
        return `<div class="label-item">
            <div class="label-item-info">
                <div class="label-item-name">${escapeHtml(item.nombre)}</div>
                <div class="label-item-meta">${escapeHtml(item.codigo)}</div>
            </div>
            <div class="label-item-price">$${precioDisplay}</div>
            <button class="label-item-delete" data-codigo="${escapeHtml(item.codigo)}" title="Quitar">&times;</button>
        </div>`;
    }).join('');

    list.querySelectorAll('.label-item-delete').forEach(btn => {
        btn.addEventListener('click', () => removeFromLabelList(btn.dataset.codigo));
    });
}

// ============================================================
//  Preview
// ============================================================
function updatePreview(item) {
    const section = document.getElementById('previewSection');
    section.style.display = 'block';
    document.getElementById('previewName').textContent = item.nombre;
    document.getElementById('previewCode').textContent = item.codigo;
    document.getElementById('previewPrice').textContent = formatPriceDisplay(item.precio);
    document.getElementById('previewDate').textContent = getTodayString();
}

function formatPriceDisplay(precio) {
    if (!precio) return '0';
    // Remove $ sign, spaces, and commas (thousand separator in source)
    let clean = precio.toString().replace(/[$\s,]/g, '');
    const num = parseFloat(clean);
    if (isNaN(num)) return precio;
    return Math.round(num).toLocaleString('es-AR');
}

function getTodayString() {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear());
    return dd + '/' + mm + '/' + yy;
}

// ============================================================
//  PDF Generation — jsPDF
// ============================================================
function generatePDF() {
    if (labelItems.length === 0) return;
    saveSettings();

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span style="opacity:0.7">Generando...</span>';

    try {
        const { jsPDF } = window.jspdf;
        const w = labelSettings.width;
        const h = labelSettings.height;
        const perLabel = labelSettings.perLabel;
        const orientation = w >= h ? 'landscape' : 'portrait';
        const format = orientation === 'landscape' ? [w, h] : [w, h];

        const doc = new jsPDF({
            orientation: orientation,
            unit: 'mm',
            format: format
        });

        const today = getTodayString();

        // Group items into pages
        const pages = [];
        for (let i = 0; i < labelItems.length; i += perLabel) {
            pages.push(labelItems.slice(i, i + perLabel));
        }

        pages.forEach((pageItems, pageIdx) => {
            if (pageIdx > 0) doc.addPage(format, orientation);

            // White background
            doc.setFillColor(255, 255, 255);
            doc.rect(0, 0, w, h, 'F');

            // Outer border
            doc.setDrawColor(180, 180, 180);
            doc.setLineWidth(0.35);
            doc.rect(0.5, 0.5, w - 1, h - 1);

            const itemCount = pageItems.length;
            const gapMm = itemCount > 1 ? 5 : 0; // 5mm separation between articles
            const totalGaps = Math.max(0, itemCount - 1) * gapMm;
            const slotH = (h - 1 - totalGaps) / itemCount;

            pageItems.forEach((item, slotIdx) => {
                const yOffset = 0.5 + slotIdx * (slotH + gapMm);

                // Dividing line centered in the gap between articles
                if (slotIdx > 0) {
                    const lineY = yOffset - gapMm / 2;
                    doc.setDrawColor(180, 180, 180);
                    doc.setLineWidth(0.2);
                    doc.line(1.5, lineY, w - 1.5, lineY);
                }

                drawArticleInSlot(doc, item, 0.5, yOffset, w - 1, slotH, today);
            });
        });

        doc.save('etiquetas.pdf');
        showSuccessStamp();
        showToast('PDF generado con ' + labelItems.length + ' etiqueta(s) en ' + pages.length + ' pagina(s)', false);
        clearLabelList();

    } catch (err) {
        console.error('PDF generation error:', err);
        showToast('Error al generar PDF: ' + err.message, true);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Generar PDF';
    }
}

function drawArticleInSlot(doc, item, x, y, slotW, slotH, today) {
    // Fixed font sizes in mm, converted to pt (1mm ≈ 2.835pt)
    const MM2PT = 2.835;
    const NAME_H_MM = 3;       // title height: 5mm
    const PRICE_H_MM = 15;     // price height: 16mm
    const BOTTOM_H_MM = 3;     // code/barcode/date height: 4mm

    const namePt = NAME_H_MM * MM2PT;       // ~19.8pt
    const pricePt = PRICE_H_MM * MM2PT;     // ~45.4pt
    const bottomPt = BOTTOM_H_MM * MM2PT;   // ~11.3pt

    const pad = 2; // 2mm padding

    // === TOP BAND: Product name (7mm zone) ===
    const topBandH = NAME_H_MM + 2; // 2mm vertical padding
    doc.setFillColor(245, 245, 245);
    doc.rect(x, y, slotW, topBandH, 'F');
    doc.setDrawColor(200, 200, 200);
    doc.setLineWidth(0.15);
    doc.line(x, y + topBandH, x + slotW, y + topBandH);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(namePt);
    doc.setTextColor(20, 20, 20);
    // Truncate name if too wide
    const usableW = slotW - pad * 2;
    let displayName = item.nombre;
    while (doc.getTextWidth(displayName) > usableW && displayName.length > 1) {
        displayName = displayName.slice(0, -1);
    }
    if (displayName.length < item.nombre.length) displayName += '…';
    const nameBaseline = y + topBandH / 2 + (namePt / MM2PT) * 0.35;
    doc.text(displayName, x + pad, nameBaseline);

    // === PRICE ZONE ===
    const priceText = formatPriceDisplay(item.precio);
    const bottomStripH = BOTTOM_H_MM + 1.5; // 1.5mm vertical padding
    const priceZoneTop = y + topBandH;
    const priceZoneH = slotH - topBandH - bottomStripH;

    doc.setFont('helvetica', 'bold');

    // Draw $ at ~45% of price size
    const currSizePt = pricePt * 0.45;
    doc.setFontSize(currSizePt);
    doc.setTextColor(50, 50, 50);
    const dollarW = doc.getTextWidth('$ ');
    const priceBaseline = priceZoneTop + priceZoneH / 2 + (pricePt / MM2PT) * 0.32;
    doc.text('$', x + pad, priceBaseline);

    // Draw price number
    doc.setFontSize(pricePt);
    doc.setTextColor(0, 0, 0);
    doc.text(priceText, x + pad + dollarW, priceBaseline);

    // === BOTTOM STRIP: code, date (4mm font) ===
    const bottomYmm = y + slotH - 1;

    // Left: codigo
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(bottomPt);
    doc.setTextColor(130, 130, 130);
    doc.text(item.codigo, x + pad, bottomYmm);

    // Right: date
    doc.text(today, x + slotW - pad, bottomYmm, { align: 'right' });
}

// ============================================================
//  Product Selector Modal
// ============================================================
function showProductSelector(matches, barcode) {
    const modal = document.getElementById('selectorModal');
    const list = document.getElementById('selectorList');
    document.getElementById('selectorTitle').textContent = matches.length + ' articulos encontrados';

    list.innerHTML = matches.map(m => `
        <div class="modal-item" data-codigo="${escapeHtml(m.codigo)}">
            <img class="modal-item-img" src="${m.imagen || ''}" alt=""
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect fill=%22%231a1a22%22 width=%2248%22 height=%2248%22/></svg>'">
            <div class="modal-item-info">
                <div class="modal-item-name">${escapeHtml(m.nombre)}</div>
                <div class="modal-item-code">Cod: ${escapeHtml(m.codigo)} ${m.precio ? ' &middot; $' + formatPriceDisplay(m.precio) : ''}</div>
            </div>
        </div>
    `).join('');

    list.querySelectorAll('.modal-item').forEach(item => {
        item.addEventListener('click', () => {
            const match = matches.find(m => m.codigo === item.dataset.codigo);
            if (match) {
                closeSelectorModal();
                addToLabelList(match);
            }
        });
    });

    modal.classList.add('active');
}

function closeSelectorModal() {
    document.getElementById('selectorModal').classList.remove('active');
}

// ============================================================
//  Search Modal
// ============================================================
function openSearchModal() {
    const modal = document.getElementById('searchModal');
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    const input = document.getElementById('searchModalInput');
    input.value = '';
    input.focus();
    document.getElementById('searchModalResults').innerHTML = '<div class="search-no-results">Escribe para buscar articulos</div>';
}

function closeSearchModal() {
    document.getElementById('searchModal').classList.remove('active');
    document.body.style.overflow = '';
}

function searchArticles(query) {
    const q = query.trim().toLowerCase();
    const container = document.getElementById('searchModalResults');
    if (!q) {
        container.innerHTML = '<div class="search-no-results">Escribe para buscar articulos</div>';
        return;
    }
    const results = articulos.filter(a =>
        a.nombre.toLowerCase().includes(q) || a.codigo.toLowerCase().includes(q)
    ).slice(0, 20);

    if (results.length === 0) {
        container.innerHTML = '<div class="search-no-results">Sin resultados</div>';
        return;
    }

    container.innerHTML = results.map(a => {
        return `<div class="search-result-item" data-codigo="${escapeHtml(a.codigo)}">
            <img class="search-result-img" src="${a.imagen || ''}" alt=""
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 44 44%22><rect fill=%22%231a1a22%22 width=%2244%22 height=%2244%22/></svg>'">
            <div>
                <div class="search-result-name">${escapeHtml(a.nombre)}</div>
                <div class="search-result-code">Cod: ${escapeHtml(a.codigo)}${a.codigoBarras ? ' &middot; CB: ' + escapeHtml(a.codigoBarras) : ''}</div>
                ${a.precio ? '<div class="search-result-price">$' + formatPriceDisplay(a.precio) + '</div>' : ''}
            </div>
        </div>`;
    }).join('');

    container.querySelectorAll('.search-result-item').forEach(item => {
        item.addEventListener('click', () => {
            const art = articulos.find(a => a.codigo === item.dataset.codigo);
            if (art) {
                closeSearchModal();
                addToLabelList(art);
            }
        });
    });
}

// ============================================================
//  UI Helpers
// ============================================================
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function showToast(msg, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function showSuccessStamp() {
    const stamp = document.getElementById('successStamp');
    stamp.classList.add('active');
    setTimeout(() => stamp.classList.remove('active'), 900);
}

// ============================================================
//  Online / Offline
// ============================================================
function updateOnlineStatus() {
    const dot = document.getElementById('onlineDot');
    if (navigator.onLine) {
        dot.classList.remove('offline');
        dot.title = 'En linea';
    } else {
        dot.classList.add('offline');
        dot.title = 'Sin conexion';
    }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ============================================================
//  Event Listeners
// ============================================================
document.getElementById('scanBtnHero').addEventListener('click', openScanner);
document.getElementById('scannerClose').addEventListener('click', closeScanner);
document.getElementById('scannerOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeScanner();
});

document.getElementById('manualSearchBtn').addEventListener('click', () => {
    const val = document.getElementById('manualInput').value.trim();
    if (val) {
        processLookup(val, false);
    } else {
        openSearchModal();
    }
});
document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) processLookup(val, false);
    }
});

document.getElementById('labelListClear').addEventListener('click', clearLabelList);
document.getElementById('generateBtn').addEventListener('click', generatePDF);

// Settings inputs — save on change
['settingWidth', 'settingHeight', 'settingPerLabel'].forEach(id => {
    document.getElementById(id).addEventListener('change', saveSettings);
});

// Selector modal
document.getElementById('selectorModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeSelectorModal();
});

// Search modal
document.getElementById('searchModalClose').addEventListener('click', closeSearchModal);
let searchTimer;
document.getElementById('searchModalInput').addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => searchArticles(this.value), 200);
});

// ============================================================
//  Init
// ============================================================
async function init() {
    loadSettings();
    const bar = document.getElementById('loadingBar');
    bar.classList.add('active');
    try {
        await loadSheets();
    } catch (err) {
        console.error('Init error:', err);
        showToast('Error al cargar datos', true);
    } finally {
        setTimeout(() => bar.classList.remove('active'), 600);
    }
}

init();

// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
