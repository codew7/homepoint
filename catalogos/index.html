<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="theme-color" content="#EFEEE8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121310" media="(prefers-color-scheme: dark)">
    <title>Catálogos · HomePoint</title>
    <link rel="icon" href="../faviconnegro.png" type="image/png">

    <!-- Panel de Catálogos · administra la interfaz de CatalogoWeb/catalogo.html
         (Mayorista) y CatalogoWeb/catalogoInterior.html (Interior) sin tocar su
         código: escribe en catalogoCMS/ de Firebase y el script
         CatalogoWeb/cms/catalogo-cms.js lo aplica en cada catálogo.
         Acceso: solo usuarios con /admins/<email>/rol = 'root'. -->

    <script>
        // Tema antes del primer pintado (sin destello)
        (function () {
            try { var t = localStorage.getItem('hpcms:tema'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/panel.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <!-- Mismo proyecto que los catálogos (pedidos-87064) -->
    <script src="../config.js"></script>
    <script type="module" src="js/app.js"></script>
</head>
<body class="cargando-app">
    <div class="arranque" aria-live="polite">
        <span class="marca-logo marca-logo--grande">hp</span>
        <div class="arranque-barra"><span></span></div>
        <span class="arranque-texto">Abriendo el panel de catálogos…</span>
    </div>
    <noscript>Este panel necesita JavaScript.</noscript>
</body>
</html>
