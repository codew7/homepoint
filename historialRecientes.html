<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos del Día</title>
  <link rel="icon" href="faviconnegro.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase Auth Check -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
  </script>
  <script>
    let pedidosCache = {};
    // === ALIAS: Historial desde localStorage + Google Sheets ===
    let aliasHistorial = [];
    let aliasDesdeSheets = [];

    function cargarHistorialAliasDesdeLocalStorage() {
      try {
        const aliasGuardados = localStorage.getItem('historialAlias');
        aliasHistorial = aliasGuardados ? JSON.parse(aliasGuardados) : [];
      } catch (error) {
        aliasHistorial = [];
      }
    }

    async function cargarAliasDesdeSheets() {
      try {
        if (typeof GOOGLE_SHEETS_CONFIG === 'undefined') return;
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID}/values/Alias!A2:A?key=${GOOGLE_SHEETS_CONFIG.API_KEY}`;
        const resp = await fetch(url);
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.values) {
          aliasDesdeSheets = data.values.map(r => r[0]).filter(Boolean).map(a => a.trim().toUpperCase());
        }
      } catch (error) {
        console.error('Error cargando alias desde Google Sheets:', error);
      }
    }

    function guardarAliasEnLocalStorage(nuevoAlias) {
      try {
        if (!nuevoAlias || nuevoAlias.trim() === '') return;
        const aliasLimpio = nuevoAlias.trim().toUpperCase();
        let historial = [];
        const aliasGuardados = localStorage.getItem('historialAlias');
        if (aliasGuardados) historial = JSON.parse(aliasGuardados);
        historial = historial.filter(a => a !== aliasLimpio);
        historial.unshift(aliasLimpio);
        historial = historial.slice(0, 15);
        localStorage.setItem('historialAlias', JSON.stringify(historial));
        aliasHistorial = historial;
      } catch (error) {
        console.error('Error guardando alias en localStorage:', error);
      }
    }

    function obtenerListaAlias() {
      const vistos = new Set();
      const lista = [];
      aliasHistorial.forEach(a => { if (!vistos.has(a)) { vistos.add(a); lista.push(a); } });
      aliasDesdeSheets.forEach(a => { if (!vistos.has(a)) { vistos.add(a); lista.push(a); } });
      return lista;
    }

    // Cargar alias al inicio
    cargarHistorialAliasDesdeLocalStorage();
    cargarAliasDesdeSheets();

    // === MODAL WHATSAPP ===
    let whatsappPedidoId = null;

    function abrirModalWhatsapp(id) {
      whatsappPedidoId = id;
      const pedido = pedidosCache[id];
      if (!pedido) { alert('Pedido no encontrado'); return; }

      const aliasActual = (pedido.pagos && pedido.pagos.alias) ? pedido.pagos.alias.trim().toUpperCase() : '';
      document.getElementById('waAliasInput').value = aliasActual;

      // Poblar datalist
      const datalist = document.getElementById('waAliasDatalist');
      datalist.innerHTML = '';
      obtenerListaAlias().forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        datalist.appendChild(opt);
      });

      document.getElementById('waModal').style.display = 'flex';
      document.getElementById('waAliasInput').focus();
    }

    function cerrarModalWhatsapp() {
      document.getElementById('waModal').style.display = 'none';
      whatsappPedidoId = null;
    }

    async function enviarWhatsapp() {
      if (!whatsappPedidoId) return;
      const pedido = pedidosCache[whatsappPedidoId];
      if (!pedido) { alert('Pedido no encontrado'); return; }

      const aliasInput = document.getElementById('waAliasInput').value.trim().toUpperCase();
      if (!aliasInput) { alert('Debe ingresar un alias'); return; }

      const telefono = (pedido.cliente && pedido.cliente.telefono) ? pedido.cliente.telefono.replace(/\D/g, '') : '';
      if (!telefono) { alert('El cliente no tiene teléfono registrado'); return; }

      // Guardar alias en Firebase si es diferente al actual
      const aliasActual = (pedido.pagos && pedido.pagos.alias) ? pedido.pagos.alias.trim().toUpperCase() : '';
      if (aliasInput !== aliasActual) {
        try {
          await db.ref('pedidos/' + whatsappPedidoId + '/pagos/alias').set(aliasInput);
          // Actualizar caché local
          if (!pedidosCache[whatsappPedidoId].pagos) pedidosCache[whatsappPedidoId].pagos = {};
          pedidosCache[whatsappPedidoId].pagos.alias = aliasInput;
          guardarAliasEnLocalStorage(aliasInput);
        } catch (e) {
          console.error('Error guardando alias:', e);
          alert('Error al guardar el alias en Firebase');
          return;
        }
      }

      // Formatear teléfono: asegurar prefijo 54 para Argentina
      let tel = telefono;
      if (!tel.startsWith('54')) tel = '54' + tel;

      const url = `https://api.whatsapp.com/send/?phone=${tel}&text=${encodeURIComponent(aliasInput)}`;
      window.open(url, '_blank');
      cerrarModalWhatsapp();
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Calcular fecha de hoy en Argentina (UTC-3) antes de armar la query
      const now = new Date();
      const argentinaTime = new Date(now.getTime() - (3 * 60 * 60 * 1000));
      const fechaHoy = argentinaTime.toISOString().split('T')[0]; // YYYY-MM-DD

      // Query optimizada: solo descarga registros del día de hoy desde Firebase.
      // orderByChild('fecha') con startAt/endAt limita los datos en el servidor.
      // createdby = admin se filtra en cliente (no requiere descarga extra).
      db.ref('pedidos')
        .orderByChild('fecha')
        .startAt(fechaHoy)
        .endAt(fechaHoy + '\uf8ff')
        .on('value', snap => {
          pedidosCache = {};
          snap.forEach(child => {
            const val = child.val();
            if (val.createdby === 'admin') {
              pedidosCache[child.key] = val;
            }
          });
          renderPedidos();
        });

      // Permitir aplicar filtros con Enter en los campos de filtro
      document.getElementById('filtroNombre').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') aplicarFiltros();
      });
    });

    function renderPedidos() {
      const tbody = document.getElementById('pedidosBody');
      let pedidos = pedidosCache;
      const filtroNombre = document.getElementById('filtroNombre').value.trim().toLowerCase();

      // Los registros ya vienen filtrados por fecha de hoy y createdby = admin desde Firebase
      let keys = Object.keys(pedidos).reverse();

      if (filtroNombre) {
        keys = keys.filter(id => (pedidos[id].cliente?.nombre || '').toLowerCase().includes(filtroNombre));
      }
      if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">No hay pedidos del día de hoy que coincidan con los filtros.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      keys.forEach(id => {
        const p = pedidos[id];
        const fecha = p.fecha || '';
        const cliente = p.cliente || {};
        const vendedor = p.vendedor || 'No asignado';
        const isCancelado = (p.status || '').toUpperCase() === 'CANCELADO';
        const pagos = p.pagos || {};
        // totalFinal y subtotal pueden ser string o number, se fuerza a number si es posible
        const totalFinal = pagos.totalFinal !== undefined ? `$${Number(pagos.totalFinal).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2})}` : '';
        const subtotal = pagos.subtotal !== undefined ? `$${Number(pagos.subtotal).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2})}` : '';
        tbody.innerHTML += `
          <tr${isCancelado ? ' style="background:#e0e0e0;color:#888;"' : ''}>
            <td>${fecha}</td>
            <td style="cursor:pointer;text-decoration:underline;color:#2a3d8f;" onclick="verPedido('${id}')">${cliente.nombre || ''}</td>
            <td>${totalFinal}</td>
            <td>${vendedor}</td>
            <td>
              <button onclick="abrirModalWhatsapp('${id}')" style="background:#25D366;padding:6px 10px;" title="WhatsApp"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16" style="vertical-align:middle;"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.116.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.116-.198-.012-.304.087-.403.089-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.325-.336-.445-.342-.116-.007-.248-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.13 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.116-.943-.05-.084-.182-.133-.38-.232z"/></svg></button>
              <button onclick="verPedido('${id}')" style="background:#2a3d8f;padding:6px 10px;" title="Ver pedido"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16" style="vertical-align:middle;"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/></svg></button>
              <button onclick="imprimirPedido('${id}')" style="background:#555;padding:6px 10px;" title="Imprimir"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16" style="vertical-align:middle;"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 10a1 1 0 0 1-1-1V9h8v3a1 1 0 0 1-1 1H5z"/></svg></button>
              <button onclick="cancelarPedido('${id}')" style="background:${isCancelado ? '#ccc' : '#f44336'};padding:6px 10px;${isCancelado ? 'cursor:not-allowed;' : ''}" title="Cancelar"${isCancelado ? ' disabled' : ''}><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16" style="vertical-align:middle;"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8z"/></svg></button>
            </td>
            </tr>
        `;
      });
    }
    function aplicarFiltros() {
      renderPedidos();
    }
    function limpiarFiltros() {
      document.getElementById('filtroNombre').value = '';
      renderPedidos();
    }
    function verPedido(id) {
      window.open(`ingresoPedido.html?id=${id}`, '_blank');
    }
    
    function imprimirPedido(id) {
      // Usar caché local: el pedido ya fue descargado, no se hace otro fetch a Firebase
      const pedido = pedidosCache[id];
      if (!pedido) {
        alert('Pedido no encontrado');
        return;
      }
      generarReciboYImprimir(pedido);
    }
    
    function generarReciboYImprimir(pedido) {
      // Obtener datos del pedido
      const cliente = pedido.cliente || {};
      const nombre = cliente.nombre || '';
      const telefono = cliente.telefono || '';
      const direccion = cliente.direccion || '';
      const dni = cliente.dni || '';
      const email = cliente.email || '';
      const tipoCliente = cliente.tipoCliente || '';
      const pagos = pedido.pagos || {};
      const medioPago = pagos.medioPago || '';
      const alias = pagos.alias || '';
      const subtotal = pagos.subtotal ? Number(pagos.subtotal).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '0';
      const recargo = pagos.recargo ? Number(pagos.recargo).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '0';
      const descuento = pagos.descuento ? Number(pagos.descuento).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '0';
      const envio = pagos.envio ? Number(pagos.envio).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '0';
      const totalFinal = pagos.totalFinal ? Number(pagos.totalFinal).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '0';
      
      // Items
      let itemsHtml = '';
      if (pedido.items && Array.isArray(pedido.items)) {
        pedido.items.forEach(item => {
          const valorUFormatted = Number(item.valorU || 0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
          const totalItem = Number((item.cantidad || 0) * (item.valorU || 0)).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
          itemsHtml += `<tr><td>${item.codigo || ''}</td><td>${item.nombre || ''}</td><td>${item.cantidad || 0}</td><td>$${valorUFormatted}</td><td>$${totalItem}</td></tr>`;
        });
      }
      
      // Recibo HTML
      const reciboHtml = `
        <html>
        <head>
          <title>Orden de Pedido</title>
          <style>
            body { font-family: 'Courier New', Courier, monospace; color: #111; background: #fff; }
            .recibo-box { margin: 0 auto; border: 1px dashed #333; padding: 24px 18px; background: #fff; }
            h2 { text-align: left; font-size: 1.3em; margin: 0 0 12px 0; }
            table { width: 100%; border-collapse: collapse; margin: 12px 0; }
            th, td { border-bottom: 1px dotted #aaa; padding: 4px 2px; font-size: 0.90em; }
            th { background: #eee; font-weight: bold; text-align: left; }
            .totales td { border: none; font-weight: bold; }
            .label { width: 110px; display: inline-block; }
            @media print { button { display: none !important; } }
          </style>
        </head>
        <body>
          <div class='recibo-box'>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <h2 style="margin:0;">Orden de Pedido</h2>
              <img src="logo.png" alt="Logo" style="height:48px;max-width:180px;object-fit:contain;">
            </div>
            <div style="font-size:0.90em; margin-bottom: 5px;">${new Date(pedido.timestamp).toLocaleString('es-AR', { hour12: false })}</div>
            <div><span class='label'>Nombre:</span> ${nombre}</div>
            <div><span class='label'>Teléfono:</span> ${telefono}</div>
            <div><span class='label'>Dirección:</span> ${direccion}</div>
            <div><span class='label'>DNI:</span> ${dni}</div>
            <div><span class='label'>Email:</span> ${email}</div>
            <hr style='margin:10px 0;'>
            <table>
              <thead>
                <tr><th>Cod</th><th>Artículo</th><th>Cant</th><th>Valor</th><th>Total</th></tr>
              </thead>
              <tbody>
                ${itemsHtml}
              </tbody>
            </table>
            <table>
              <tr class='totales'><td>Subtotal</td><td style='text-align:right;'>$${subtotal}</td></tr>
              <tr class='totales'><td>Medio de Pago</td><td style='text-align:right;'>${medioPago}</td></tr>
              ${Number(pagos.recargo) ? `<tr class='totales'><td>Recargo</td><td style='text-align:right;'>$${recargo}</td></tr>` : ''}
              ${Number(pagos.descuento) ? `<tr class='totales'><td>Descuento</td><td style='text-align:right;'>$${descuento}</td></tr>` : ''}
              ${Number(pagos.envio) ? `<tr class='totales'><td>Costo de Envío</td><td style='text-align:right;'>$${envio}</td></tr>` : ''}
              <tr class='totales'><td>Total</td><td style='text-align:right;font-size:1.1em;'>$${totalFinal}</td></tr>
            </table>
            <hr style='margin:10px 0;'>
            <div style="text-align:center;font-size:0.80em;font-weight:bold;color:#333;">POR FAVOR, RECUERDE REVISAR EL ESTADO DE LA MERCADERIA ANTES DE RETIRARSE</div>
          </div>
          <script>window.onload = function(){ window.print(); }<\/script>
        </body>
        </html>
      `;
      
      // Abrir ventana e imprimir
      const w = window.open('', '_blank', 'width=600,height=800');
      w.document.write(reciboHtml);
      w.document.close();
    }
    
    // === ACTUALIZACIÓN DE STOCK EN TIEMPO REAL ===
    /**
     * Actualiza el stock de un artículo usando transacciones de Firebase para garantizar atomicidad.
     * @param {string} codigo - Código del artículo
     * @param {string} nombre - Nombre del artículo
     * @param {number} cantidad - Cantidad a modificar
     * @param {string} tipo - Tipo de movimiento: 'ENTRADA', 'SALIDA', 'RETIRO'
     */
    async function actualizarStock(codigo, nombre, cantidad, tipo) {
      if (!codigo || !nombre || !cantidad) return;
      
      const stockRef = db.ref('stock/' + codigo);
      
      try {
        await stockRef.transaction(function(currentData) {
          // Si no existe data previa, crear objeto base
          if (currentData === null) {
            currentData = {
              nombre: nombre,
              stockActual: 0
            };
          }
          
          let stockActual = currentData.stockActual || 0;
          
          // Calcular nuevo stock según tipo de movimiento
          if (tipo === 'ENTRADA') {
            stockActual += cantidad;
          } else if (tipo === 'SALIDA' || tipo === 'RETIRO') {
            stockActual -= cantidad;
          }
          
          // Stock mínimo es 0
          stockActual = Math.max(0, stockActual);
          
          // Preservar todos los campos existentes y solo actualizar stockActual
          return {
            ...currentData,
            nombre: nombre,
            stockActual: stockActual
          };
        });
      } catch (error) {
        console.error('Error actualizando stock:', error, { codigo, nombre, cantidad, tipo });
      }
    }
    
    async function cancelarPedido(id) {
      const clave = prompt('Ingrese la contraseña para cancelar el pedido:');
      if (clave === null) return;
      if (clave !== '2574') { alert('Contraseña incorrecta'); return; }
      if (!confirm('¿Seguro que desea cancelar este pedido? Esta acción es IRREVERSIBLE y el pedido no podrá ser modificado ni reactivado.')) return;
      
      try {
        // Primero obtener los movimientos antes de eliminarlos
        const movimientosSnap = await db.ref('movimientos').orderByChild('pedidoId').equalTo(id).once('value');
        const movimientos = movimientosSnap.val();
        
        // Restaurar stock solo si hay movimientos de SALIDA
        if (movimientos) {
          const movimientosArray = Object.values(movimientos);
          const movimientosSalida = movimientosArray.filter(mov => mov.tipo === 'SALIDA');
          
          if (movimientosSalida.length > 0) {
            // Restaurar stock sumando las cantidades que se habían restado
            for (const mov of movimientosSalida) {
              if (mov.codigo && mov.nombre && mov.cantidad) {
                // Restaurar sumando la cantidad (revertir la SALIDA)
                await actualizarStock(mov.codigo, mov.nombre, mov.cantidad, 'ENTRADA');
              }
            }
          }
          
          // Eliminar los movimientos
          const updates = {};
          Object.keys(movimientos).forEach(key => {
            updates[key] = null;
          });
          await db.ref('movimientos').update(updates);
        }
        
        // Actualizar el pedido como cancelado
        await db.ref('pedidos/' + id).update({ 
          status: 'CANCELADO', 
          locked: true, 
          movimientosRegistrados: false 
        });
        
        alert('Pedido cancelado. Ya no podrá ser modificado. Los movimientos asociados han sido eliminados y el stock ha sido restaurado.');
      } catch (e) {
        console.error('Error al cancelar pedido:', e);
        alert('Error al cancelar o eliminar movimientos');
      }
    }
  </script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f1f1f1; }
    main { max-width: 1000px; margin: 30px auto; background: #fff; border-radius: 8px; padding: 24px; }
    header {background: linear-gradient(90deg, #5c5866, #989899); padding: 1.5rem 1rem 1.5rem 1rem; box-shadow: #5c5866 0px 2px 8px 0px; text-align: center;}
    header h1 {margin: 0; font-size: 2.2rem; color: #39373f; letter-spacing: 1px; font-weight: 700;}
    table { width: 100%; min-width: 1000px; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
    th { background: #5c5866; color: #fff; }
    tr:nth-child(even) { background: #f9f9f9; }
    button { margin: 0 2px; padding: 6px 12px; border-radius: 4px; border: none; background: #f44336; color: #fff; cursor: pointer; }
    button:hover { background: #d8382c; }
    #filtroNombre {
      width: 220px;
    }
  </style>
</head>
<body>
<header>
  <h1>📦 Historial Reciente 📝</h1>
</header>
  <main>
    <div style="margin-bottom: 16px; display: flex; gap: 20px; align-items: center;">
      <input type="text" id="filtroNombre" placeholder="Filtrar por nombre" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
      <button style="background:#39373f;" onclick="aplicarFiltros()">Filtrar</button>
      <button style="background:#888;" onclick="limpiarFiltros()">Limpiar</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>

      <label for="waAliasInput" style="font-weight:600;font-size:0.9rem;color:#555;display:block;margin-bottom:6px;">Alias</label>
      <input type="text" id="waAliasInput" list="waAliasDatalist" placeholder="Ingrese o seleccione un alias" style="width:100%;padding:10px 12px;border:2px solid #ccc;border-radius:6px;font-size:1rem;text-transform:uppercase;box-sizing:border-box;margin-bottom:16px;">

        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.116.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.116-.198-.012-.304.087-.403.089-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.325-.336-.445-.342-.116-.007-.248-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.13 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.116-.943-.05-.084-.182-.133-.38-.232z"/></svg>
        Enviar WhatsApp

  <script>
    // Cerrar modal con Escape y enviar con Enter
    document.addEventListener('keydown', function(e) {
      if (document.getElementById('waModal').style.display === 'flex') {
        if (e.key === 'Escape') cerrarModalWhatsapp();
        if (e.key === 'Enter' && document.activeElement.id === 'waAliasInput') enviarWhatsapp();
      }
    });
    // Cerrar modal al hacer clic fuera
    document.getElementById('waModal').addEventListener('click', function(e) {
      if (e.target === this) cerrarModalWhatsapp();
    });
  </script>
