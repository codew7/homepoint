<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
    <!-- Fuera de los buscadores: noindex impide que Google indexe la pagina y
         nofollow que siga sus enlaces. Debe quedar rastreable en robots.txt,
         porque si se bloquea el crawleo Google nunca lee esta etiqueta. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subir audio · SoundBoard Showroom</title>
  <meta name="theme-color" content="#0A0A0B" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <a href="index.html" class="btn btn-ghost btn-sm back-btn" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Pistas
      </a>
    </div>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="4" y1="10" x2="4" y2="14" /><line x1="8" y1="6" x2="8" y2="18" /><line x1="12" y1="3" x2="12" y2="21" /><line x1="16" y1="7" x2="16" y2="17" /><line x1="20" y1="10" x2="20" y2="14" />
        </svg>
      </span>
      <div class="brand-text">
        <h1>SoundBoard <span class="accent">Showroom</span></h1>
      </div>
    </div>
    <div></div>
  </header>

  <main class="upload-page">
    <div class="upload-intro">
      <span class="eyebrow">Nuevo aviso</span>
      <h2>Subir audio</h2>
      <p>Agregá un aviso al showroom. Después vas a poder programar cuándo suena.</p>
    </div>
    <section class="upload-card">
      <div id="upload-zone" class="upload-zone" tabindex="0">
        <input type="file" id="file-input" accept="audio/*" hidden />
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <h3>Arrastrá tu archivo aquí</h3>
        <p>o <button type="button" class="link-btn" id="browse-btn">elegí desde el disco</button></p>
        <small class="hint">MP3, WAV, OGG o M4A · máx. 20MB</small>
      </div>

      <div id="preview-section" class="preview-section" hidden>
        <div class="preview-head">
          <div class="preview-file">
            <span class="preview-file-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
              </svg>
            </span>
            <div>
              <h4 id="preview-filename">archivo.mp3</h4>
              <span id="preview-meta" class="muted">—</span>
            </div>
          </div>
          <button class="icon-btn" id="clear-file" aria-label="Quitar archivo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6M14 11v6" />
              <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
        </div>
        <audio id="preview-audio" controls></audio>

        <form id="upload-form" class="upload-form">
          <div class="field">
            <label for="audio-name">Nombre del aviso *</label>
            <input type="text" id="audio-name" maxlength="60" required placeholder="Ej: Aviso de cierre" />
          </div>
          <div class="field">
            <label for="audio-description">Descripción corta</label>
            <input type="text" id="audio-description" maxlength="120" placeholder="Ej: Se reproduce 15 minutos antes del cierre" />
          </div>
          <div class="field">
            <label>Color identificador</label>
            <div class="color-picker" id="color-picker">
              <button type="button" data-color="#F0B35B" style="--c:#F0B35B" class="active" aria-label="Ámbar" title="Ámbar"></button>
              <button type="button" data-color="#FF6B5E" style="--c:#FF6B5E" aria-label="Coral" title="Coral"></button>
              <button type="button" data-color="#F472B6" style="--c:#F472B6" aria-label="Rosa" title="Rosa"></button>
              <button type="button" data-color="#A78BFA" style="--c:#A78BFA" aria-label="Lavanda" title="Lavanda"></button>
              <button type="button" data-color="#60A5FA" style="--c:#60A5FA" aria-label="Azul" title="Azul"></button>
              <button type="button" data-color="#5AC8FA" style="--c:#5AC8FA" aria-label="Celeste" title="Celeste"></button>
              <button type="button" data-color="#3DDC97" style="--c:#3DDC97" aria-label="Menta" title="Menta"></button>
              <button type="button" data-color="#D1D1D6" style="--c:#D1D1D6" aria-label="Plata" title="Plata"></button>
            </div>
          </div>
          <div class="field">
            <label for="initial-volume">Volumen inicial · <span id="volume-display">80%</span></label>
            <input type="range" id="initial-volume" min="0" max="100" value="80" class="slider" />
          </div>

          <div id="progress-wrapper" class="progress-wrapper" hidden>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            <span id="progress-text" class="progress-text">0%</span>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="cancel-upload">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="submit-upload">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
              Subir audio
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/upload.js"></script>
</body>
</html>
