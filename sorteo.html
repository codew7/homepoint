<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡SORTEO EN VIVO! - HomePoint</title>
    <link rel="icon" href="faviconnegro.png" type="image/png">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <!-- Fonts: Fredoka (display) + Outfit (body) + Bebas (numeros) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-deep: #1a0b2e;
            --bg-stage: #2d1b4e;
            --card-bg: rgba(45, 27, 78, 0.7);
            --card-border: rgba(255, 215, 0, 0.25);
            --text-primary: #fff8e7;
            --text-secondary: #c4b5fd;
            --text-muted: #8b7bc7;

            --gold: #ffd700;
            --gold-deep: #ffa500;
            --pink: #ff2e9a;
            --pink-hot: #ff6ec7;
            --cyan: #00e5ff;
            --lime: #aaff00;
            --purple: #a855f7;
            --orange: #ff6b35;

            --gradient-rainbow: linear-gradient(90deg, #ff2e9a, #ff6b35, #ffd700, #aaff00, #00e5ff, #a855f7, #ff2e9a);
            --gradient-gold: linear-gradient(135deg, #ffeb3b, #ffd700 40%, #ff9800);
            --gradient-stage: linear-gradient(135deg, #ff2e9a 0%, #a855f7 50%, #00e5ff 100%);

            --shadow-neon-pink: 0 0 20px rgba(255, 46, 154, 0.5), 0 0 40px rgba(255, 46, 154, 0.3);
            --shadow-neon-gold: 0 0 30px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.3);
            --shadow-neon-cyan: 0 0 20px rgba(0, 229, 255, 0.5), 0 0 40px rgba(0, 229, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { overflow-x: hidden; }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(255, 46, 154, 0.35), transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 229, 255, 0.3), transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(168, 85, 247, 0.4), transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 215, 0, 0.2), transparent 50%),
                linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
            background-attachment: fixed;
            animation: bg-shift 18s ease-in-out infinite;
        }

        @keyframes bg-shift {
            0%, 100% { background-position: 0% 0%, 100% 0%, 50% 100%, 100% 100%, 0% 0%; }
            50%      { background-position: 10% 5%, 90% 15%, 45% 95%, 95% 85%, 0% 0%; }
        }

        /* Stars twinkling overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #ffd700, transparent),
                radial-gradient(1px 1px at 60px 80px, #ff6ec7, transparent),
                radial-gradient(1.5px 1.5px at 120px 50px, #00e5ff, transparent),
                radial-gradient(1px 1px at 200px 120px, #ffffff, transparent),
                radial-gradient(2px 2px at 280px 40px, #ffd700, transparent),
                radial-gradient(1px 1px at 340px 90px, #aaff00, transparent),
                radial-gradient(1.5px 1.5px at 100px 200px, #ff6ec7, transparent),
                radial-gradient(1px 1px at 220px 260px, #00e5ff, transparent);
            background-size: 360px 300px;
            background-repeat: repeat;
            animation: twinkle 3s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }

        /* Floating bubbles */
        .bubbles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            opacity: 0.15;
            animation: float-up linear infinite;
        }

        .bubble:nth-child(1) { left: 8%; width: 60px; height: 60px; background: var(--pink); animation-duration: 18s; }
        .bubble:nth-child(2) { left: 22%; width: 30px; height: 30px; background: var(--cyan); animation-duration: 14s; animation-delay: 3s; }
        .bubble:nth-child(3) { left: 40%; width: 80px; height: 80px; background: var(--gold); animation-duration: 22s; animation-delay: 5s; }
        .bubble:nth-child(4) { left: 55%; width: 45px; height: 45px; background: var(--lime); animation-duration: 16s; animation-delay: 1s; }
        .bubble:nth-child(5) { left: 70%; width: 55px; height: 55px; background: var(--purple); animation-duration: 20s; animation-delay: 7s; }
        .bubble:nth-child(6) { left: 85%; width: 35px; height: 35px; background: var(--orange); animation-duration: 15s; animation-delay: 4s; }

        @keyframes float-up {
            0%   { transform: translateY(0) scale(1); opacity: 0.2; }
            100% { transform: translateY(-120vh) scale(1.3); opacity: 0; }
        }

        .app-shell {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* ─── Header ─── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 24px;
            gap: 12px;
        }

        .top-bar-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            height: 48px;
            width: auto;
            filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.6));
        }

        .brand-logo-fallback {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--gradient-gold);
            display: grid;
            place-items: center;
            font-size: 24px;
            color: var(--bg-deep);
            box-shadow: var(--shadow-neon-gold);
        }

        .brand-text {
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.5rem;
            letter-spacing: 0.03em;
            background: var(--gradient-rainbow);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-flow 4s linear infinite;
            line-height: 1;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .brand-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.95rem;
            color: var(--gold);
            letter-spacing: 0.2em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: #fff;
            background: linear-gradient(135deg, var(--pink), var(--pink-hot));
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: var(--shadow-neon-pink);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fff;
            animation: live-pulse 1s ease-in-out infinite;
            box-shadow: 0 0 8px #fff;
        }

        @keyframes live-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.7); opacity: 0.6; }
        }

        /* ─── Glass Card Base ─── */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 38px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* ─── Mode Tabs ─── */
        .mode-tabs {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 999px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .mode-tab {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
            position: relative;
        }

        .mode-tab.active {
            background: var(--gradient-stage);
            color: #fff;
            box-shadow:
                0 4px 14px rgba(168, 85, 247, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* ─── Date / Cond Inputs ─── */
        .date-grid {
            display: grid;
            gap: 12px;
        }

        .date-grid.range {
            grid-template-columns: 1fr 1fr;
        }

        .date-field label {
            display: block;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.72rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .date-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 12px 16px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            color: #fff;
            outline: none;
            transition: all 0.25s ease;
        }

        .date-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15), 0 0 20px rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(1) saturate(5) hue-rotate(0deg);
            cursor: pointer;
        }

        /* Condiciones */
        .cond-panel { display: none; }
        .cond-panel.active { display: block; }

        .cond-group { margin-bottom: 18px; }
        .cond-group:last-child { margin-bottom: 0; }

        .cond-label {
            display: block;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.72rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .cond-checks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cond-check { display: none; }

        .cond-check-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.35);
            color: var(--text-secondary);
            font-family: 'Fredoka', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .cond-check-label:hover {
            border-color: rgba(255, 215, 0, 0.4);
            color: #fff;
        }

        .cond-check:checked + .cond-check-label {
            background: var(--gradient-gold);
            color: var(--bg-deep);
            border-color: var(--gold);
            box-shadow: var(--shadow-neon-gold);
            transform: translateY(-1px);
        }

        .cond-check-label i { font-size: 1rem; }

        .cond-total-wrap { position: relative; }

        .cond-total-prefix {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            pointer-events: none;
        }

        .cond-total-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 12px 16px 12px 36px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            color: #fff;
            outline: none;
            transition: all 0.25s ease;
        }

        .cond-total-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15);
        }

        .cond-total-input::placeholder { color: var(--text-muted); }

        .cond-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
            margin: 18px 0;
        }

        /* ─── Counter Card ─── */
        .counter-card {
            background:
                linear-gradient(135deg, rgba(255, 46, 154, 0.15), rgba(0, 229, 255, 0.15)),
                var(--card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 24px;
            padding: 22px 26px;
            margin-bottom: 46px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: var(--shadow-neon-gold), 0 12px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .counter-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.08), transparent 30%);
            animation: spin-slow 10s linear infinite;
            pointer-events: none;
        }

        @keyframes spin-slow { to { transform: rotate(360deg); } }

        .counter-card > * { position: relative; z-index: 1; }

        .counter-icon {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: var(--gradient-gold);
            display: grid;
            place-items: center;
            font-size: 1.8rem;
            color: var(--bg-deep);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.5);
            animation: wobble 3s ease-in-out infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .counter-info { flex: 1; }

        .counter-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.75rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .counter-value {
            font-family: 'Luckiest Guy', cursive;
            font-size: 2.8rem;
            line-height: 1;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 12px rgba(255, 215, 0, 0.3);
            letter-spacing: 0.02em;
        }

        .counter-value.empty {
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .counter-detail {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-align: right;
            line-height: 1.4;
        }

        /* ─── Giant Sortear Button ─── */
        .sortear-wrap {
            display: flex;
            justify-content: center;
            padding: 30px 0 50px;
            position: relative;
        }

        .btn-sortear {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background:
                radial-gradient(circle at 30% 25%, #fff7b3, var(--gold) 35%, var(--gold-deep) 65%, #c97c00 100%);
            color: var(--bg-deep);
            font-family: 'Luckiest Guy', cursive;
            font-size: 2.2rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 0 80px rgba(255, 215, 0, 0.6),
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 -12px 24px rgba(160, 80, 0, 0.4),
                inset 0 8px 16px rgba(255, 255, 255, 0.5);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: pulse-big 2s ease-in-out infinite;
        }

        @keyframes pulse-big {
            0%, 100% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.6), 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 -12px 24px rgba(160, 80, 0, 0.4), inset 0 8px 16px rgba(255, 255, 255, 0.5); }
            50% { box-shadow: 0 0 120px rgba(255, 215, 0, 0.9), 0 0 180px rgba(255, 46, 154, 0.4), 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 -12px 24px rgba(160, 80, 0, 0.4), inset 0 8px 16px rgba(255, 255, 255, 0.5); }
        }

        /* Marquee light bulbs around button */
        .btn-sortear::before {
            content: '';
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 0%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 100% 50%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 50% 100%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 0% 50%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 85.36% 14.64%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 85.36% 85.36%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 14.64% 85.36%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 14.64% 14.64%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 69.13% 4.38%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 95.62% 30.87%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 95.62% 69.13%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 69.13% 95.62%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 30.87% 95.62%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 4.38% 69.13%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 4.38% 30.87%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 30.87% 4.38%, #fff 0, #fff 3px, transparent 4px);
            filter: drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 12px #ffd700);
            animation: bulbs-blink 0.6s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes bulbs-blink {
            from { opacity: 0.5; filter: drop-shadow(0 0 4px #ff6ec7); }
            to { opacity: 1; filter: drop-shadow(0 0 10px #ffd700) drop-shadow(0 0 16px #ffd700); }
        }

        .btn-sortear::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            border: 3px dashed rgba(255, 255, 255, 0.35);
            animation: spin-slow 8s linear infinite;
            pointer-events: none;
        }

        .btn-sortear:hover:not(:disabled) { transform: scale(1.06) rotate(-2deg); }
        .btn-sortear:active:not(:disabled) { transform: scale(0.97); }

        .btn-sortear:disabled {
            background: radial-gradient(circle at 30% 25%, #4a3a5a, #2a2a3a 60%, #1a1a24 100%);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            animation: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-sortear:disabled::before { opacity: 0.15; animation: none; }
        .btn-sortear:disabled::after { opacity: 0.2; }

        .btn-sortear-inner {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.4);
        }

        .btn-sortear-inner i {
            font-size: 2.8rem;
            filter: drop-shadow(2px 2px 0 rgba(255, 255, 255, 0.4));
        }

        /* ─── Roulette ─── */
        .roulette-wrap {
            display: none;
            padding: 20px 0 50px;
            text-align: center;
        }

        .roulette-wrap.active { display: block; }

        .roulette-label {
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 0.1em;
            margin-bottom: 14px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: blink 0.7s ease-in-out infinite;
        }

        .roulette-display {
            background:
                linear-gradient(135deg, rgba(255, 46, 154, 0.2), rgba(0, 229, 255, 0.2)),
                rgba(0, 0, 0, 0.6);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 36px 24px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Luckiest Guy', cursive;
            font-size: 2.6rem;
            color: #fff;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow-neon-gold), inset 0 0 40px rgba(255, 215, 0, 0.15);
        }

        .roulette-display::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg, transparent 0, transparent 20px, rgba(255, 215, 0, 0.06) 20px, rgba(255, 215, 0, 0.06) 21px);
            animation: stripe-scroll 2s linear infinite;
        }

        @keyframes stripe-scroll {
            to { background-position: 40px 0; }
        }

        .roulette-name {
            position: relative;
            z-index: 1;
            animation: roulette-blur 0.08s linear infinite;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            background: var(--gradient-rainbow);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: roulette-blur 0.08s linear infinite, rainbow-flow 1s linear infinite;
        }

        @keyframes roulette-blur {
            0%   { filter: blur(0px); transform: translateY(0); }
            50%  { filter: blur(2px); transform: translateY(-3px); }
            100% { filter: blur(0px); transform: translateY(0); }
        }

        /* ─── Winner Modal ─── */
        .winner-overlay {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at center, rgba(168, 85, 247, 0.4), rgba(26, 11, 46, 0.95) 60%);
            backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .winner-overlay.show {
            display: flex;
            opacity: 1;
        }

        /* Rotating spotlight rays */
        .winner-overlay::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg, rgba(255, 215, 0, 0.15) 10deg, transparent 20deg,
                transparent 60deg, rgba(255, 46, 154, 0.15) 70deg, transparent 80deg,
                transparent 120deg, rgba(0, 229, 255, 0.15) 130deg, transparent 140deg,
                transparent 180deg, rgba(255, 215, 0, 0.15) 190deg, transparent 200deg,
                transparent 240deg, rgba(170, 255, 0, 0.15) 250deg, transparent 260deg,
                transparent 300deg, rgba(168, 85, 247, 0.15) 310deg, transparent 320deg
            );
            animation: spin-rays 12s linear infinite;
            pointer-events: none;
        }

        @keyframes spin-rays { to { transform: rotate(360deg); } }

        .winner-card {
            background:
                linear-gradient(145deg, rgba(45, 27, 78, 0.95), rgba(26, 11, 46, 0.98));
            border: 3px solid transparent;
            background-clip: padding-box;
            border-radius: 28px;
            padding: 44px 36px 36px;
            max-width: 640px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow:
                0 0 80px rgba(255, 215, 0, 0.5),
                0 0 160px rgba(255, 46, 154, 0.3),
                0 30px 80px rgba(0, 0, 0, 0.6);
            transform: scale(0.7) rotate(-3deg);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            z-index: 1;
        }

        .winner-overlay.show .winner-card {
            transform: scale(1) rotate(0);
        }

        /* Rainbow border */
        .winner-card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 28px;
            background: var(--gradient-rainbow);
            background-size: 200% 100%;
            animation: rainbow-flow 3s linear infinite;
            z-index: -1;
        }

        /* Sparkles inside card */
        .winner-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 10% 20%, #ffd700, transparent),
                radial-gradient(1.5px 1.5px at 85% 30%, #ff6ec7, transparent),
                radial-gradient(1px 1px at 70% 80%, #00e5ff, transparent),
                radial-gradient(2px 2px at 25% 75%, #aaff00, transparent),
                radial-gradient(1.5px 1.5px at 90% 65%, #ffd700, transparent);

            0% { transform: scale(0.5); opacity: 0; }

            display: flex;
            gap: 12px;
            justify-content: center;

        }

        .btn {
            padding: 14px 28px;

            border: 2px solid transparent;

        /* ─── Loading ─── */

        .loader-ring {
            width: 54px;

        .loader-ring::after {
            content: '';

            inset: -4px;

            background: conic-gradient(from 0deg, transparent 70%, var(--gold));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
        }

        .loading-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;

            animation: blink 1.2s ease-in-out infinite;

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);

        /* ─── Historial / Leaderboard ─── */
        .history-section {
            margin-top: 56px;

            font-family: 'Luckiest Guy', cursive;

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background:
                linear-gradient(135deg, rgba(255, 46, 154, 0.08), rgba(0, 229, 255, 0.08)),
                rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.92rem;
            transition: all 0.25s ease;
        }

        .history-item:hover {
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateX(4px);
        }

        .history-name {
            font-family: 'Fredoka', sans-serif;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .history-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        /* Confetti sits on top */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
        }

        /* Animations for entrance */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.08s; }
        .delay-2 { animation-delay: 0.16s; }
        .delay-3 { animation-delay: 0.24s; }

        /* ─── Responsive ─── */
        @media (max-width: 560px) {
            .app-shell { padding: 16px 12px 40px; }
            .brand-text { font-size: 1.2rem; }
            .brand-sub { display: none; }
            .btn-sortear { width: 230px; height: 230px; font-size: 1.7rem; }

            .winner-card { padding: 34px 22px 28px; }

        }

        @media (max-width: 380px) {
            .mode-tab { font-size: 0.75rem; padding: 8px 6px; }
        }
    </style>
</head>

    <script>
        // Firebase init
        try { firebase.initializeApp(firebaseConfig); } catch (e) { console.warn('Firebase init skipped', e); }

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzs8fJtVLkdUjOwx76miDSku6m-tVp371iqfxjepxgWydumKKHhd7w0zLHTMZxDo95Cw/exec';

        // ───── Audio (Web Audio API, sin archivos) ─────
        let audioCtx = null;
        function getAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch (e) { return null; }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone({ freq, duration, type = 'sine', vol = 0.15, slide = null, attack = 0.005 }) {
            const ctx = getAudio();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(ctx.destination);
            const now = ctx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(vol, now + attack);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            if (slide !== null) osc.frequency.exponentialRampToValueAtTime(slide, now + duration);
            osc.start(now);
            osc.stop(now + duration + 0.02);
        }

        // Whoosh inicial al presionar "Sortear"
        function playStartSound() {
            playTone({ freq: 200, slide: 900, duration: 0.35, type: 'sawtooth', vol: 0.18 });
            setTimeout(() => playTone({ freq: 1200, slide: 600, duration: 0.25, type: 'triangle', vol: 0.12 }), 120);
        }

        // Tick de ruleta (slot machine)
        function playTick() {
            playTone({ freq: 1400, duration: 0.035, type: 'square', vol: 0.08, attack: 0.001 });
        }

        // Fanfarria del ganador
        function playWinnerSound() {
            const ctx = getAudio();
            if (!ctx) return;
            // Escala ascendente C → E → G → C (do mayor)
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((f, i) => {
                setTimeout(() => {
                    playTone({ freq: f, duration: 0.22, type: 'triangle', vol: 0.2 });
                    playTone({ freq: f / 2, duration: 0.22, type: 'sine', vol: 0.1 });
                }, i * 110);
            });
            // Nota final larga + quinta
            setTimeout(() => {
                playTone({ freq: 1046.5, duration: 0.9, type: 'triangle', vol: 0.22 });
                playTone({ freq: 1318.5, duration: 0.9, type: 'triangle', vol: 0.15 });
                playTone({ freq: 523.25, duration: 0.9, type: 'sine', vol: 0.15 });
            }, 480);
            // Bajo
            setTimeout(() => playTone({ freq: 130.81, duration: 1.2, type: 'sawtooth', vol: 0.1 }), 0);
            // Chispitas agudas
            for (let i = 0; i < 6; i++) {
                setTimeout(() => playTone({
                    freq: 2000 + Math.random() * 1500,
                    duration: 0.08, type: 'sine', vol: 0.06
                }), 500 + i * 70);
            }
        }

        // State
        let pedidosCache = null;
        let pedidosFiltrados = [];
        let historial = [];
        let sorteoCount = 0;
        let mode = 'single';
        let dateMode = 'single';
        let lastWinnerId = null;

        // DOM
        const loadingState = document.getElementById('loadingState');
        const mainContent = document.getElementById('mainContent');
        const dateGrid = document.getElementById('dateGrid');
        const datePanelWrap = document.getElementById('datePanelWrap');
        const condPanel = document.getElementById('condPanel');
        const countValue = document.getElementById('countValue');
        const countDetail = document.getElementById('countDetail');
        const btnSortear = document.getElementById('btnSortear');
        const rouletteWrap = document.getElementById('rouletteWrap');
        const rouletteName = document.getElementById('rouletteName');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const winnerName = document.getElementById('winnerName');
        const historySection = document.getElementById('historySection');
        const historyList = document.getElementById('historyList');

        // Auth
        if (typeof firebase !== 'undefined' && firebase.auth) {
            firebase.auth().onAuthStateChanged(user => {
                if (user) init();
                else window.location.href = 'login.html';
            });
        } else {
            init();
        }

        function init() {
            const hoy = toLocalDateString(new Date());
            document.getElementById('dateSingle').value = hoy;
            document.getElementById('dateSingle').addEventListener('change', updateCount);

            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.addEventListener('click', () => switchMode(tab.dataset.mode));
            });

            btnSortear.addEventListener('click', realizarSorteo);
            document.getElementById('btnAgain').addEventListener('click', () => {
                closeWinner();
                setTimeout(realizarSorteo, 400);
            });
            winnerOverlay.addEventListener('click', e => {
                if (e.target === winnerOverlay) closeWinner();
            });

            document.getElementById('historyTitle').addEventListener('dblclick', () => {
                historial = [];
                sorteoCount = 0;
                renderHistorial();
                showToast('¡Historial borrado!');
            });

            document.querySelectorAll('.cond-check').forEach(c => c.addEventListener('change', updateCount));
            document.getElementById('minTotal').addEventListener('input', updateCount);

            fetchData();
        }

        function switchMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.mode === newMode);
            });

            const hoy = toLocalDateString(new Date());
            const hace30 = toLocalDateString(new Date(Date.now() - 30*24*60*60*1000));

            if (newMode === 'condiciones') {
                datePanelWrap.style.display = 'none';
                condPanel.classList.add('active');
            } else {
                datePanelWrap.style.display = '';
                condPanel.classList.remove('active');
                dateMode = newMode;

                if (newMode === 'single') {
                    dateGrid.classList.remove('range');
                    const prev = document.getElementById('dateSingle')?.value || hoy;
                    dateGrid.innerHTML = `
                        <div class="date-field">
                            <label>Fecha</label>
                            <input type="date" class="date-input" id="dateSingle" value="${prev}">
                        </div>`;
                    document.getElementById('dateSingle').addEventListener('change', updateCount);
                } else {
                    dateGrid.classList.add('range');
                    const prevFrom = document.getElementById('dateFrom')?.value || hace30;
                    const prevTo = document.getElementById('dateTo')?.value || hoy;
                    dateGrid.innerHTML = `
                        <div class="date-field">
                            <label>Desde</label>
                            <input type="date" class="date-input" id="dateFrom" value="${prevFrom}">
                        </div>
                        <div class="date-field">
                            <label>Hasta</label>
                            <input type="date" class="date-input" id="dateTo" value="${prevTo}">
                        </div>`;
                    document.getElementById('dateFrom').addEventListener('change', updateCount);
                    document.getElementById('dateTo').addEventListener('change', updateCount);
                }
            }
            updateCount();
        }

        function toLocalDateString(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function fetchData() {
            setStatus('CARGANDO', false);
            try {
                const res = await fetch(APPS_SCRIPT_URL);
                if (!res.ok) throw new Error('Error de red');
                const data = await res.json();
                pedidosCache = data.pedidos || data;
                setStatus('LIVE', true);
                loadingState.style.display = 'none';
                mainContent.style.display = 'block';
                updateCount();
            } catch (err) {
                console.error(err);
                setStatus('ERROR', false);
                showToast('Error al cargar datos');
                loadingState.style.display = 'none';
            }
        }

        function setStatus(text, ok) {
            document.getElementById('statusText').textContent = text;
        }

        function titleCase(str) {
            return str.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase());
        }

        function getCondiciones() {
            const medios = [];
            document.querySelectorAll('.cond-check:checked').forEach(c => medios.push(c.value));
            const minVal = parseFloat(document.getElementById('minTotal')?.value) || 0;
            return { medios, minTotal: minVal };
        }

        function normalizarMedioPago(mp) {
            const l = (mp || '').toLowerCase();
            if (l === 'efectivo') return 'efectivo';
            if (l === 'transferencia') return 'transferencia';
            if (l === 'mercadopago' || l === 'mercado pago') return 'mercadopago';
            return 'parcial';
        }

        function extraerPedidos() {
            if (!pedidosCache) return [];
            const rango = getRango();
            if (!rango) return [];
            const [desde, hasta] = rango;
            const { medios, minTotal } = getCondiciones();

            const out = [];
            Object.entries(pedidosCache).forEach(([id, p]) => {
                if (!p.fecha) return;
                if (p.status !== 'DESPACHADO/ENTREGADO') return;
                if (p.cliente?.tipoCliente?.toLowerCase() === 'admin') return;

                const fp = toLocalDateString(new Date(p.fecha));
                if (fp < desde || fp > hasta) return;

                const total = p.pagos?.totalFinal || 0;
                if (minTotal > 0 && total < minTotal) return;

                const medioPagoNorm = normalizarMedioPago(p.pagos?.medioPago);
                if (medios.length > 0 && !medios.includes(medioPagoNorm)) return;

                out.push({
                    id,
                    cliente: titleCase(p.cliente?.nombre || 'Sin Nombre'),
                    fecha: fp,
                    total,
                    medioPago: p.pagos?.medioPago || 'Efectivo'
                });
            });
            return out;
        }

        function getRango() {
            const effectiveMode = mode === 'condiciones' ? dateMode : mode;
            if (effectiveMode === 'single') {
                const d = document.getElementById('dateSingle')?.value;
                if (!d) return null;
                return [d, d];
            } else {
                const f = document.getElementById('dateFrom')?.value;
                const t = document.getElementById('dateTo')?.value;
                if (!f || !t) return null;
                return f <= t ? [f, t] : [t, f];
            }
        }

        function updateCount() {
            pedidosFiltrados = extraerPedidos();
            const n = pedidosFiltrados.length;
            countValue.textContent = n;
            countValue.className = 'counter-value ' + (n === 0 ? 'empty' : '');
            btnSortear.disabled = n === 0;

            const rango = getRango();
            let detail = '';
            if (rango) {
                const [a, b] = rango;
                detail = a === b ? formatFecha(a) : `${formatFecha(a)}<br>→ ${formatFecha(b)}`;
            }
            const { minTotal } = getCondiciones();
            if (minTotal > 0) detail += (detail ? '<br>' : '') + `mín $${minTotal.toLocaleString('es-AR')}`;
            countDetail.innerHTML = detail;
        }

        function formatFecha(iso) {
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y.slice(2)}`;
        }

        async function realizarSorteo() {
            if (pedidosFiltrados.length === 0) return;
            btnSortear.disabled = true;

            playStartSound();

            let pool = pedidosFiltrados;
            if (pool.length > 1 && lastWinnerId) {
                const filtered = pool.filter(p => p.id !== lastWinnerId);
                if (filtered.length > 0) pool = filtered;
            }

            rouletteWrap.classList.add('active');
            rouletteWrap.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const duracion = 2800;
            const inicio = Date.now();
            const tick = () => {
                const elapsed = Date.now() - inicio;
                const progress = elapsed / duracion;
                if (progress >= 1) {
                    elegirGanador(pool);
                    return;
                }
                const delay = 40 + Math.pow(progress, 3) * 220;
                const rand = pool[Math.floor(Math.random() * pool.length)];
                rouletteName.textContent = rand.cliente;
                playTick();
                setTimeout(tick, delay);
            };
            tick();
        }

        function elegirGanador(pool) {
            const ganador = pool[Math.floor(Math.random() * pool.length)];
            lastWinnerId = ganador.id;
            rouletteName.textContent = ganador.cliente;

            setTimeout(() => {
                rouletteWrap.classList.remove('active');
                mostrarGanador(ganador);
            }, 500);
        }

        function mostrarGanador(g) {
            winnerName.textContent = g.cliente;
            // retrigger name animation
            winnerName.style.animation = 'none';
            void winnerName.offsetWidth;
            winnerName.style.animation = '';

            winnerOverlay.classList.add('show');
            playWinnerSound();
            lanzarConfetti();
            agregarHistorial(g);
            btnSortear.disabled = false;
        }

        function closeWinner() {
            winnerOverlay.classList.remove('show');
        }

        function agregarHistorial(g) {
            sorteoCount++;
            historial.unshift({ ...g, num: sorteoCount });
            if (historial.length > 10) historial.pop();
            renderHistorial();
        }

        function renderHistorial() {
            if (historial.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            historySection.style.display = 'block';
            historyList.innerHTML = historial.map(h => `
                <div class="history-item">
                    <span class="history-name">${escapeHTML(h.cliente)}</span>
                    <span class="history-num">${h.num}° Sorteo</span>
                </div>
            `).join('');
        }

        function lanzarConfetti() {
            if (typeof confetti === 'undefined') return;
            const colors = ['#ffd700', '#ff2e9a', '#00e5ff', '#aaff00', '#a855f7', '#ff6b35', '#ffffff'];
            const duration = 3500;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 80,
                    origin: { x: 0, y: 0.7 },
                    colors,
                    ticks: 240
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 80,
                    origin: { x: 1, y: 0.7 },
                    colors,
                    ticks: 240
                });
                if (Date.now() < end) requestAnimationFrame(frame);
            })();

            // Big burst
            confetti({
                particleCount: 180,
                spread: 130,
                startVelocity: 50,
                origin: { y: 0.5 },
                colors,
                shapes: ['circle', 'square', 'star']
            });

            // Stars burst after 300ms
            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    spread: 160,
                    origin: { y: 0.4 },
                    colors: ['#ffd700', '#ffeb3b'],
                    shapes: ['star'],
                    scalar: 1.4
                });
            }, 350);
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2400);
        }
    </script>
</body>
</html>
