<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoFacYou — Procesador de Comprobantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #0a0612;
            --bg-surface: #130e1f;
            --bg-card: #1a1328;
            --bg-card-hover: #221a33;
            --purple-dim: #6b3fa0;
            --purple-core: #8b5cf6;
            --purple-bright: #a78bfa;
            --purple-glow: #c4b5fd;
            --magenta: #d946ef;
            --cyan-accent: #22d3ee;
            --text-primary: #f0ecf7;
            --text-secondary: #a09bb5;
            --text-muted: #6b6580;
            --border: #2a2240;
            --border-active: #8b5cf680;
            --success: #34d399;
            --error: #f87171;
            --radius: 14px;
            --radius-sm: 8px;
        }

        html { font-size: 16px; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -40%; left: -20%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, #8b5cf615 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -15%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, #d946ef0a 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .noise {
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 1120px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeDown 0.6s ease-out;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }
        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--purple-core), var(--magenta));
            border-radius: 10px;
            display: grid; place-items: center;
            font-size: 1.1rem;
            box-shadow: 0 0 24px #8b5cf640;
        }
        .logo-text {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--purple-bright), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: border-color 0.25s, box-shadow 0.25s;
            animation: fadeUp 0.5s ease-out both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card:hover {
            border-color: var(--border-active);
        }
        .card.has-file {
            border-color: var(--success);
            box-shadow: 0 0 20px #34d39915;
        }
        .card-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--purple-bright);
            margin-bottom: 1rem;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 2.2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--purple-core);
            background: #8b5cf608;
        }
        .dropzone input {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer;
        }
        .dropzone-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }
        .dropzone-text {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .dropzone-text strong {
            color: var(--purple-bright);
            font-weight: 600;
        }
        .file-info {
            display: none;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 1rem;
            background: #8b5cf60a;
            border-radius: var(--radius-sm);
            margin-top: 1rem;
        }
        .file-info.visible { display: flex; }
        .file-info .fi-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #22734a, #34d399);
            border-radius: 8px;
            display: grid; place-items: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .file-info .fi-details { flex: 1; min-width: 0; }
        .file-info .fi-name {
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-info .fi-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .file-info .fi-remove {
            background: none; border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .file-info .fi-remove:hover { color: var(--error); }

        .action-bar {
            animation: fadeUp 0.5s ease-out 0.15s both;
        }
        .btn-process {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--purple-core), var(--magenta));
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .btn-process::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, #a78bfa, #e879f9);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-process:hover::before { opacity: 1; }
        .btn-process:hover {
            box-shadow: 0 8px 32px #8b5cf650;
            transform: translateY(-1px);
        }
        .btn-process:active { transform: translateY(0); }
        .btn-process:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-process:disabled::before { display: none; }
        .btn-process span { position: relative; z-index: 1; }

        .status-bar {
            margin-top: 1.5rem;
            animation: fadeUp 0.4s ease-out;
        }
        .status-msg {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-msg.processing {
            background: #8b5cf612;
            border: 1px solid #8b5cf630;
            color: var(--purple-bright);
        }
        .status-msg.success {
            background: #34d39912;
            border: 1px solid #34d39930;
            color: var(--success);
        }
        .status-msg.error {
            background: #f8717112;
            border: 1px solid #f8717130;
            color: var(--error);
        }

        .preview-section {
            margin-top: 1.5rem;
            animation: fadeUp 0.5s ease-out;
        }
        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .preview-title {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--purple-bright);
        }
        .preview-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .table-wrap th {
            background: #1f1730;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 0.7rem 1rem;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
        }
        .table-wrap td {
            padding: 0.55rem 1rem;
            border-bottom: 1px solid #1f1a2d;
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .table-wrap tr:hover td {
            background: #1f1a2d;
        }
        .table-wrap td:nth-child(4) { color: var(--cyan-accent); }
        .table-wrap td:nth-child(2) { color: var(--success); }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.4rem;
            background: #34d39918;
            border: 1px solid #34d39940;
            color: var(--success);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-download:hover {
            background: #34d39928;
            border-color: var(--success);
            box-shadow: 0 4px 16px #34d39920;
        }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .config-section {
            margin-top: 1.5rem;
            animation: fadeUp 0.5s ease-out 0.1s both;
        }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }
        @media (max-width: 900px) {
            .config-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 550px) {
            .config-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 0;
            overflow: hidden;
        }
        .config-item label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        .config-item input, .config-item select {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.55rem 0.8rem;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            transition: border-color 0.2s;
        }
        .config-item input:focus, .config-item select:focus {
            outline: none;
            border-color: var(--purple-core);
        }
        .config-item input[type="date"] {
            color-scheme: dark;
        }
        .config-item input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7) sepia(1) saturate(3) hue-rotate(220deg);
            cursor: pointer;
        }

        .template-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: #8b5cf60a;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 0.82rem;
            margin-bottom: 1.5rem;
            animation: fadeUp 0.5s ease-out 0.05s both;
        }
        .template-badge .tb-dot {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="app">
        <header>
            <div class="logo">
                <div class="logo-icon">&#9889;</div>
                <div class="logo-text">NeoFacYou</div>
            </div>
            <p>Procesador de comprobantes &mdash; Excel a plantilla AFIP</p>
        </header>

        <!-- TEMPLATE BADGE -->
        <div class="template-badge">
            <span class="tb-dot"></span>
            Plantilla integrada: Modelo para importar comprobantes.xls
        </div>

        <!-- UPLOAD ORIGIN -->
        <div class="card" id="card-origin">
            <div class="card-label">Archivo Origen</div>
            <div class="dropzone" id="drop-origin">
                <input type="file" accept=".xlsx,.xls" id="input-origin">
                <div class="dropzone-icon">&#128196;</div>
                <div class="dropzone-text">
                    Arrastr&aacute; o <strong>seleccion&aacute;</strong> el reporte<br>
                    de MercadoPago (.xlsx)
                </div>
            </div>
            <div class="file-info" id="info-origin">
                <div class="fi-icon">&#10003;</div>
                <div class="fi-details">
                    <div class="fi-name" id="name-origin"></div>
                    <div class="fi-meta" id="meta-origin"></div>
                </div>
                <button class="fi-remove" onclick="clearFile()" title="Quitar">&#10005;</button>
            </div>
        </div>

        <!-- CONFIG -->
        <div class="config-section">
            <div class="card">
                <div class="card-label">Configuraci&oacute;n</div>
                <div class="config-grid">
                    <div class="config-item">
                        <label>Tipo Comprobante</label>
                        <input type="text" id="cfg-tipo" value="FCB">
                    </div>
                    <div class="config-item">
                        <label>Punto de Venta</label>
                        <input type="number" id="cfg-pv" value="10">
                    </div>
                    <div class="config-item">
                        <label>Cond. Venta</label>
                        <input type="number" id="cfg-condvta" value="1">
                    </div>
                    <div class="config-item">
                        <label>Descripci&oacute;n Art&iacute;culo</label>
                        <input type="text" id="cfg-desc" value="Art. Hogar">
                    </div>
                    <div class="config-item">
                        <label>Fecha Min</label>
                        <input type="date" id="cfg-fechamin" value="">
                    </div>
                </div>
            </div>
        </div>

        <!-- PROCESS -->
        <div class="action-bar" style="margin-top:1.5rem;">
            <button class="btn-process" id="btn-process" disabled onclick="processFiles()">
                <span>Procesar y Generar Comprobantes</span>
            </button>
        </div>

        <!-- STATUS -->
        <div id="status-container"></div>

        <!-- PREVIEW -->
        <div id="preview-container"></div>
    </div>

// ===== STATE =====
var originData = null;
var templateWB = null;
var processedRows = [];

// Load embedded template on startup
function loadEmbeddedTemplate() {
    var binary = atob(TEMPLATE_B64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    templateWB = XLSX.read(bytes, { type: 'array', cellDates: false, cellStyles: true });
}

// ===== FILE HANDLING =====
function setupDropzone() {
    var drop = document.getElementById('drop-origin');
    var input = document.getElementById('input-origin');

    ['dragenter','dragover'].forEach(function(e) {
        drop.addEventListener(e, function(ev) { ev.preventDefault(); drop.classList.add('dragover'); });
    });
    ['dragleave','drop'].forEach(function(e) {
        drop.addEventListener(e, function(ev) { ev.preventDefault(); drop.classList.remove('dragover'); });
    });
    drop.addEventListener('drop', function(ev) {
        var file = ev.dataTransfer.files[0];
        if (file) handleFile(file);
    });
    input.addEventListener('change', function(ev) {
        var file = ev.target.files[0];
        if (file) handleFile(file);
    });
}

function handleFile(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type: 'array', cellDates: false, cellStyles: true });
        var ws = wb.Sheets[wb.SheetNames[0]];
        originData = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
        showFileInfo(file.name, (originData.length - 1) + ' filas \u00b7 ' + wb.SheetNames[0]);
        updateProcessButton();
    };
    reader.readAsArrayBuffer(file);
}

function showFileInfo(name, meta) {
    document.getElementById('name-origin').textContent = name;
    document.getElementById('meta-origin').textContent = meta;
    document.getElementById('info-origin').classList.add('visible');
    document.getElementById('card-origin').classList.add('has-file');
}

function clearFile() {
    originData = null;
    document.getElementById('info-origin').classList.remove('visible');
    document.getElementById('card-origin').classList.remove('has-file');
    document.getElementById('input-origin').value = '';
    updateProcessButton();
}

function updateProcessButton() {
    document.getElementById('btn-process').disabled = !(originData && templateWB);
}

// ===== DATE HELPERS =====
function parseDate(val) {
    if (val == null || val === '') return null;
    if (typeof val === 'number') return val;
    if (typeof val === 'string') {
        // Extract date parts directly from ISO string to avoid timezone issues
        var m = val.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) {
            var d = new Date(Date.UTC(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])));
            return dateToExcelSerial(d);
        }
        var d = new Date(val);
        if (isNaN(d.getTime())) return null;
        return dateToExcelSerial(d);
    }
    return null;
}

function dateToExcelSerial(date) {
    var epoch = new Date(Date.UTC(1899, 11, 30));
    var utc = Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
    return Math.floor((utc - epoch.getTime()) / (24 * 60 * 60 * 1000));
}

function excelSerialToDateStr(serial, separator) {
    if (!serial) return '';
    var epoch = new Date(Date.UTC(1899, 11, 30));
    var d = new Date(epoch.getTime() + serial * 24 * 60 * 60 * 1000);
    var dd = String(d.getUTCDate()).padStart(2, '0');
    var mm = String(d.getUTCMonth() + 1).padStart(2, '0');
    var yy = String(d.getUTCFullYear()).slice(-2);
    var sep = separator || '/';
    return dd + sep + mm + sep + yy;
}

// ===== PROCESS =====
function processFiles() {
    showStatus('processing', 'Procesando archivo origen...');

    setTimeout(function() {
        try {
            var cfg = {
                tipo: document.getElementById('cfg-tipo').value || 'FCB',
                pv: parseInt(document.getElementById('cfg-pv').value) || 10,
                condVta: parseInt(document.getElementById('cfg-condvta').value) || 1,
                desc: document.getElementById('cfg-desc').value || 'Art. Hogar',
                fechaMin: document.getElementById('cfg-fechamin').value || ''
            };

            // Parse fecha min override (if set)
            var fechaMinSerial = null;
            if (cfg.fechaMin) {
                var parts = cfg.fechaMin.split('-');
                var fechaMinDate = new Date(Date.UTC(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])));
                fechaMinSerial = dateToExcelSerial(fechaMinDate);
            }

            // Filter origin: only "Pago" rows with Monto > 0, skip header
            var filtered = [];
            for (var i = 1; i < originData.length; i++) {
                var row = originData[i];
                var descripcion = (row[1] || '').toString().trim();
                var monto = parseFloat(row[2]) || 0;

                if (descripcion === 'Pago' && monto > 0) {
                    filtered.push({
                        fecha: row[0],
                        monto: monto,
                        tipoId: (row[3] || '').toString().trim(),
                        numero: row[4] ? row[4].toString().trim() : '',
                        nombre: (row[5] || '').toString().trim()
                    });
                }
            }

            if (filtered.length === 0) {
                showStatus('error', 'No se encontraron filas con Descripci\u00f3n="Pago" y Monto > 0.');
                return;
            }

            // Build output workbook from template
            var outWB = XLSX.utils.book_new();

            // Track min/max dates for filename
            var minDateSerial = Infinity;
            var maxDateSerial = -Infinity;

            // Copy all sheets from template
            templateWB.SheetNames.forEach(function(name, idx) {
                if (idx === 0) {
                    var templateWS = templateWB.Sheets[name];
                    var ws = {};

                    // Copy header row from template
                    var templateRange = XLSX.utils.decode_range(templateWS['!ref']);
                    for (var c = templateRange.s.c; c <= templateRange.e.c; c++) {
                        var addr = XLSX.utils.encode_cell({ r: 0, c: c });
                        if (templateWS[addr]) {
                            ws[addr] = Object.assign({}, templateWS[addr]);
                        }
                    }

                    if (templateWS['!cols']) ws['!cols'] = templateWS['!cols'];

                    processedRows = [];
                    filtered.forEach(function(item, i) {
                        var r = i + 1;
                        var fechaSerial = parseDate(item.fecha);
                        var hasNumero = item.numero && item.numero !== '';

                        // Apply fecha min override
                        if (fechaMinSerial && fechaSerial && fechaSerial < fechaMinSerial) {
                            fechaSerial = fechaMinSerial;
                        }

                        // Track date range
                        if (fechaSerial) {
                            if (fechaSerial < minDateSerial) minDateSerial = fechaSerial;
                            if (fechaSerial > maxDateSerial) maxDateSerial = fechaSerial;
                        }

                        // A = Tipo comprobante
                        ws[XLSX.utils.encode_cell({r:r, c:0})] = { v: cfg.tipo, t: 's' };
                        // B = PV
                        ws[XLSX.utils.encode_cell({r:r, c:1})] = { v: cfg.pv, t: 'n' };
                        // D = Fecha (col 3)
                        if (fechaSerial) {
                            ws[XLSX.utils.encode_cell({r:r, c:3})] = { v: fechaSerial, t: 'n', z: 'dd/mm/yy' };
                        }
                        // E = Cond vta (col 4)
                        ws[XLSX.utils.encode_cell({r:r, c:4})] = { v: cfg.condVta, t: 'n' };
                        // G = Nombre (col 6)
                        if (item.nombre) {
                            ws[XLSX.utils.encode_cell({r:r, c:6})] = { v: item.nombre, t: 's' };
                        }
                        // H = idTipoDocumento (col 7)
                        var tipoDoc = (!item.nombre && !hasNumero) ? 99 : 96;
                        ws[XLSX.utils.encode_cell({r:r, c:7})] = { v: tipoDoc, t: 'n' };
                        // I = Nro documento (col 8)
                        if (hasNumero) {
                            ws[XLSX.utils.encode_cell({r:r, c:8})] = { v: parseFloat(item.numero) || item.numero, t: 'n' };
                        }
                        // J = idTipoResponsable (col 9)
                        ws[XLSX.utils.encode_cell({r:r, c:9})] = { v: 5, t: 'n' };
                        // N = idLista (col 13)
                        ws[XLSX.utils.encode_cell({r:r, c:13})] = { v: 1, t: 'n' };
                        // O = idConcepto (col 14)
                        ws[XLSX.utils.encode_cell({r:r, c:14})] = { v: 1, t: 'n' };
                        // Q = Descripcion (col 16)
                        ws[XLSX.utils.encode_cell({r:r, c:16})] = { v: cfg.desc, t: 's' };
                        // S = Cantidad (col 18)
                        ws[XLSX.utils.encode_cell({r:r, c:18})] = { v: 1, t: 'n' };
                        // T = Precio (col 19)
                        ws[XLSX.utils.encode_cell({r:r, c:19})] = { v: item.monto, t: 'n' };
                        // Y = Percepciones (col 24) — siempre vacia, no se escribe

                        processedRows.push({
                            fecha: fechaSerial ? excelSerialToDateStr(fechaSerial) : '',
                            nombre: item.nombre || '\u2014',
                            tipoDoc: tipoDoc,
                            numero: item.numero || '\u2014',
                            monto: item.monto
                        });
                    });

                    ws['!ref'] = XLSX.utils.encode_range({
                        s: { r: 0, c: 0 },
                        e: { r: filtered.length, c: 26 }
                    });

                    XLSX.utils.book_append_sheet(outWB, ws, name);
                } else {
                    XLSX.utils.book_append_sheet(outWB, templateWB.Sheets[name], name);
                }
            });

            // Generate filename with date range
            var minDateStr = excelSerialToDateStr(minDateSerial, '-');
            var maxDateStr = excelSerialToDateStr(maxDateSerial, '-');
            var filename = 'Comprobantes - ' + minDateStr + ' - ' + maxDateStr + '.xls';

            // Generate & download
            var wbout = XLSX.write(outWB, { bookType: 'xls', type: 'array' });
            var blob = new Blob([wbout], { type: 'application/vnd.ms-excel' });
            var url = URL.createObjectURL(blob);

            showStatus('success', filtered.length + ' comprobantes generados correctamente.', url, filename);
            showPreview(processedRows);

        } catch (err) {
            showStatus('error', 'Error: ' + err.message);
            console.error(err);
        }
    }, 300);
}

// ===== UI HELPERS =====
function showStatus(type, msg, downloadUrl, downloadName) {
    var container = document.getElementById('status-container');
    var icons = { processing: '<span class="spinner"></span>', success: '\u2713', error: '\u2715' };
    var extra = '';
    if (downloadUrl) {
        extra = '<a href="' + downloadUrl + '" download="' + downloadName + '" class="btn-download" style="margin-left:auto;">\u2193 Descargar ' + downloadName + '</a>';
    }
    container.innerHTML = '<div class="status-bar"><div class="status-msg ' + type + '">' + icons[type] + ' ' + msg + ' ' + extra + '</div></div>';
}

function showPreview(rows) {
    var container = document.getElementById('preview-container');
    var maxShow = Math.min(rows.length, 50);
    var tableRows = '';
    for (var i = 0; i < maxShow; i++) {
        var r = rows[i];
        tableRows += '<tr><td>' + (i + 1) + '</td><td>' + r.nombre + '</td><td>' + r.numero + '</td><td>' + r.fecha + '</td><td>' + r.tipoDoc + '</td><td>$' + r.monto.toLocaleString('es-AR', {minimumFractionDigits:2}) + '</td></tr>';
    }

    var moreText = rows.length > maxShow ? '<p style="color:var(--text-muted);font-size:0.78rem;margin-top:0.5rem;text-align:center;">Mostrando ' + maxShow + ' de ' + rows.length + '</p>' : '';

    container.innerHTML = '<div class="preview-section"><div class="preview-header"><span class="preview-title">Vista Previa</span><span class="preview-count">' + rows.length + ' registros</span></div><div class="table-wrap" style="max-height:400px; overflow-y:auto;"><table><thead><tr><th>#</th><th>Nombre</th><th>Documento</th><th>Fecha</th><th>Tipo Doc</th><th>Monto</th></tr></thead><tbody>' + tableRows + '</tbody></table></div>' + moreText + '</div>';
}

// ===== INIT =====
