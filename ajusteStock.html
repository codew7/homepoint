<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajuste de Stock</title>
  <link rel="icon" href="faviconnegro.png" type="image/png">
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background-color: #2c3e50;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .logout-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background-color: #c0392b;
    }

    .controls {
      padding: 20px 30px;
      background-color: #ecf0f1;
      border-bottom: 1px solid #ddd;
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border: 2px solid #bdc3c7;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .search-box:focus {
      border-color: #3498db;
    }

    .table-container {
      padding: 30px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background-color: #34495e;
      color: white;
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #ecf0f1;
      font-size: 14px;
    }

    tbody tr:hover {
      background-color: #f8f9fa;
    }

    .stock-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stock-btn {
      width: 28px;
      height: 28px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stock-btn:hover {
      background-color: #2980b9;
    }

    .stock-btn.minus {
      background-color: #e74c3c;
    }

    .stock-btn.minus:hover {
      background-color: #c0392b;
    }

    .stock-input {
      width: 80px;
      padding: 6px 8px;
      border: 2px solid #bdc3c7;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
      outline: none;
    }

    .stock-input:focus {
      border-color: #3498db;
    }

    .date-input {
      padding: 6px 8px;
      border: 2px solid #bdc3c7;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      min-width: 130px;
    }

    .date-input:focus {
      border-color: #3498db;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
      font-size: 16px;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
      font-size: 16px;
    }

    .save-indicator {
      display: inline-block;
      margin-left: 8px;
      color: #27ae60;
      font-size: 12px;
      opacity: 0;
    }

    .save-indicator.show {
      opacity: 1;
    }

    .stats {
      padding: 0 30px 20px 30px;
      color: #7f8c8d;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Ajuste de Stock</h1>
      <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="controls">
      <input 
        type="text" 
        id="searchInput" 
        class="search-box" 
        placeholder="Buscar por código o nombre..."
      >
    </div>

    <div class="stats">
      <span id="statsText">Cargando...</span>
    </div>

    <div class="table-container">
      <table id="stockTable">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Stock Actual</th>
            <th>Última Entrada</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="4" class="loading">Cargando datos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Variables globales
    let stockData = {};
    let filteredData = {};
    
    // Sistema de autenticación
    let authResolved = false;
    
    function redirigirALogin() {
      const currentUrl = encodeURIComponent(window.location.href);
      window.location.href = `login.html?redirect=${currentUrl}`;
    }

    setTimeout(() => {
      if (!authResolved) {
        console.warn('Timeout de autenticación - redirigiendo a login');
        redirigirALogin();
      }
    }, 5000);

    firebase.auth().onAuthStateChanged(user => {
      authResolved = true;
      
      if (user) {
        console.log('Usuario autenticado:', user.email);
        cargarStock();
      } else {
        console.log('No hay usuario autenticado');
        redirigirALogin();
      }
    });

    function cerrarSesion() {
      firebase.auth().signOut().then(() => {
        window.location.href = 'login.html';
      }).catch((error) => {
        console.error('Error al cerrar sesión:', error);
      });
    }

    // Cargar datos de stock desde Firebase
    function cargarStock() {
      const stockRef = db.ref('stock');
      
      stockRef.on('value', (snapshot) => {
        stockData = snapshot.val() || {};
        filteredData = { ...stockData };
        renderizarTabla();
        actualizarEstadisticas();
      });
    }

    // Renderizar tabla
    function renderizarTabla() {
      const tbody = document.getElementById('tableBody');
      const entries = Object.entries(filteredData);
      
      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="no-results">No se encontraron resultados</td></tr>';
        return;
      }

      tbody.innerHTML = entries.map(([codigo, datos]) => {
        const nombre = datos.nombre || '';
        const stockActual = datos.stockActual || 0;
        const ultimaEntrada = datos.ultimaEntrada || '';
        
        return `
          <tr>
            <td>${codigo}</td>
            <td>${nombre}</td>
            <td>
              <div class="stock-controls">
                <button class="stock-btn minus" onclick="ajustarStock('${codigo}', -1)">−</button>
                <input 
                  type="number" 
                  class="stock-input" 
                  value="${stockActual}"
                  onchange="actualizarStockDirecto('${codigo}', this.value)"
                  onkeypress="handleEnterKey(event, '${codigo}', this)"
                >
                <button class="stock-btn" onclick="ajustarStock('${codigo}', 1)">+</button>
                <span class="save-indicator" id="save-${codigo}">✓</span>
              </div>
            </td>
            <td>
              <input 
                type="date" 
                class="date-input" 
                value="${ultimaEntrada}"
                onchange="actualizarFecha('${codigo}', this.value)"
              >
            </td>
          </tr>
        `;
      }).join('');
    }

    // Ajustar stock con botones +/-
    function ajustarStock(codigo, cambio) {
      const stockActual = parseInt(stockData[codigo]?.stockActual || 0);
      const nuevoStock = Math.max(0, stockActual + cambio);
      
      db.ref(`stock/${codigo}/stockActual`).set(nuevoStock)
        .then(() => {
          mostrarIndicadorGuardado(codigo);
        })
        .catch(error => {
          console.error('Error al actualizar stock:', error);
        });
    }

    // Actualizar stock directamente desde input
    function actualizarStockDirecto(codigo, valor) {
      const nuevoStock = Math.max(0, parseInt(valor) || 0);
      
      db.ref(`stock/${codigo}/stockActual`).set(nuevoStock)
        .then(() => {
          mostrarIndicadorGuardado(codigo);
        })
        .catch(error => {
          console.error('Error al actualizar stock:', error);
        });
    }

    // Manejar tecla Enter en input de stock
    function handleEnterKey(event, codigo, input) {
      if (event.key === 'Enter') {
        event.preventDefault();
        input.blur();
        actualizarStockDirecto(codigo, input.value);
      }
    }

    // Actualizar fecha
    function actualizarFecha(codigo, fecha) {
      db.ref(`stock/${codigo}/ultimaEntrada`).set(fecha)
        .then(() => {
          mostrarIndicadorGuardado(codigo);
        })
        .catch(error => {
          console.error('Error al actualizar fecha:', error);
        });
    }

    // Mostrar indicador de guardado
    function mostrarIndicadorGuardado(codigo) {
      const indicator = document.getElementById(`save-${codigo}`);
      if (indicator) {
        indicator.classList.add('show');
        setTimeout(() => {
          indicator.classList.remove('show');
        }, 1500);
      }
    }

    // Búsqueda en tiempo real
    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.getElementById('searchInput');
      
      searchInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase().trim();
        
        if (searchTerm === '') {
          filteredData = { ...stockData };
        } else {
          filteredData = {};
          Object.entries(stockData).forEach(([codigo, datos]) => {
            const nombre = (datos.nombre || '').toLowerCase();
            const codigoLower = codigo.toLowerCase();
            
            if (codigoLower.includes(searchTerm) || nombre.includes(searchTerm)) {
              filteredData[codigo] = datos;
            }
          });
        }
        
        renderizarTabla();
        actualizarEstadisticas();
      });
    });

    // Actualizar estadísticas
    function actualizarEstadisticas() {
      const totalRegistros = Object.keys(filteredData).length;
      const totalStock = Object.values(filteredData).reduce((sum, item) => {
        return sum + (parseInt(item.stockActual) || 0);
      }, 0);
      
      const statsText = document.getElementById('statsText');
      statsText.textContent = `Mostrando ${totalRegistros} artículos | Stock total: ${totalStock} unidades`;
    }
  </script>

</body>
</html>
