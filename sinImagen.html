<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículos Sin Imagen - Control de Catálogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="faviconnegro.png" type="image/png">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        header h1 {
            margin: 0 0 10px 0;
            color: #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        header h1 i {
            color: #ff9800;
        }
        
        header p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .stat-item i {
            font-size: 24px;
        }
        
        .stat-item.total i { color: #2196F3; }
        .stat-item.sin-url i { color: #f44336; }
        .stat-item.url-rota i { color: #ff9800; }
        .stat-item.ok i { color: #4CAF50; }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .controls input, .controls select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .controls input:focus, .controls select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        
        .controls button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-export {
            background: #4CAF50;
            color: white;
        }
        
        .btn-export:hover {
            background: #388E3C;
            transform: translateY(-2px);
        }
        
        .btn-refresh {
            background: #2196F3;
            color: white;
        }
        
        .btn-refresh:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .loading i {
            font-size: 48px;
            color: #667eea;
            animation: spin 1s linear infinite;
        }
        
        .loading p {
            margin-top: 20px;
            color: #666;
            font-size: 16px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        
        .card-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .card-badge.sin-url {
            background: #ffebee;
            color: #c62828;
        }
        
        .card-badge.url-rota {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        .card-image-preview {
            width: 100%;
            height: 150px;
            background: #f5f5f5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 2px dashed #ddd;
        }
        
        .card-image-preview i {
            font-size: 48px;
            color: #ccc;
        }
        
        .card-image-preview.error {
            border-color: #ff9800;
            background: #fff8e1;
        }
        
        .card-image-preview.error i {
            color: #ff9800;
        }
        
        .card-image-preview.no-url {
            border-color: #f44336;
            background: #ffebee;
        }
        
        .card-image-preview.no-url i {
            color: #f44336;
        }
        
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            min-height: 40px;
        }
        
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }
        
        .card-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: #f5f5f5;
            border-radius: 6px;
        }
        
        .card-info-row label {
            color: #666;
            font-weight: 500;
        }
        
        .card-info-row span {
            color: #333;
            font-weight: 600;
        }
        
        .card-url {
            margin-top: 12px;
            padding: 10px;
            background: #fafafa;
            border-radius: 8px;
            font-size: 11px;
            word-break: break-all;
            color: #666;
            border: 1px solid #eee;
        }
        
        .card-url.empty {
            color: #f44336;
            font-style: italic;
        }
        
        .copy-btn {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .copy-btn:hover {
            background: #5a6fd6;
        }
        
        .no-results {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .no-results i {
            font-size: 64px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        
        .no-results h2 {
            color: #333;
            margin: 0 0 10px 0;
        }
        
        .no-results p {
            color: #666;
            margin: 0;
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            header h1 {
                font-size: 20px;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
            
            .stat-item {
                width: 100%;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .controls input[type="text"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-image"></i> Artículos Sin Imagen</h1>
            <p>Herramienta para identificar productos del catálogo que requieren imágenes</p>
            
            <div class="stats-bar">
                <div class="stat-item total">
                    <i class="fas fa-boxes"></i>
                    <div>
                        <div class="stat-value" id="totalProductos">-</div>
                        <div class="stat-label">Total productos</div>
                    </div>
                </div>
                <div class="stat-item sin-url">
                    <i class="fas fa-unlink"></i>
                    <div>
                        <div class="stat-value" id="sinUrl">-</div>
                        <div class="stat-label">Sin URL de imagen</div>
                    </div>
                </div>
                <div class="stat-item url-rota">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>
                        <div class="stat-value" id="urlRota">-</div>
                        <div class="stat-label">URL inválida/rota</div>
                    </div>
                </div>
                <div class="stat-item ok">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <div class="stat-value" id="conImagen">-</div>
                        <div class="stat-label">Con imagen válida</div>
                    </div>
                </div>
            </div>
        </header>
        
        <div class="controls">
            <input type="text" id="buscar" placeholder="🔍 Buscar por código, nombre o categoría...">
            <select id="filtroTipo">
                <option value="todos">Todos los problemas</option>
                <option value="sin-url">Sin URL de imagen</option>
                <option value="url-rota">URL inválida/rota</option>
            </select>
            <select id="filtroCategoria">
                <option value="">Todas las categorías</option>
            </select>
            <button class="btn-export" onclick="exportarCSV()">
                <i class="fas fa-file-csv"></i> Exportar CSV
            </button>
            <button class="btn-refresh" onclick="location.reload()">
                <i class="fas fa-sync-alt"></i> Actualizar
            </button>
        </div>
        
        <div id="loading" class="loading">
            <i class="fas fa-spinner"></i>
            <p>Cargando y verificando imágenes del catálogo...</p>
            <p id="loadingProgress" style="font-size: 12px; color: #999;"></p>
        </div>
        
        <div id="grid" class="grid" style="display: none;"></div>
        
        <div id="noResults" class="no-results" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <h2>¡Excelente!</h2>
            <p>Todos los artículos tienen imagen asignada correctamente.</p>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        // Variables globales
        let productosSinImagen = [];
        let productosFiltrados = [];
        let categoriasSet = new Set();
        
        // Función para validar URL de imagen (misma lógica que mayorista.js)
        function isValidImageUrl(url) {
            return url && url.match(/\.(jpeg|jpg|gif|png)$/i);
        }
        
        // Función para verificar si una imagen existe realmente
        function verificarImagen(url) {
            return new Promise((resolve) => {
                if (!url || !isValidImageUrl(url)) {
                    resolve({ exists: false, reason: 'invalid-url' });
                    return;
                }
                
                const img = new Image();
                img.onload = () => resolve({ exists: true });
                img.onerror = () => resolve({ exists: false, reason: 'load-error' });
                
                // Timeout de 5 segundos
                setTimeout(() => resolve({ exists: false, reason: 'timeout' }), 5000);
                
                img.src = url;
            });
        }
        
        // Mostrar toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Exportar a CSV
        function exportarCSV() {
            if (productosFiltrados.length === 0) {
                showToast('No hay productos para exportar');
                return;
            }
            
            let csv = 'Código,Nombre,Categoría,Tipo de Problema,URL Actual\n';
            productosFiltrados.forEach(p => {
                const urlLimpia = (p.url || '').replace(/,/g, ';');
                csv += `"${p.codigo}","${p.nombre}","${p.categoria}","${p.tipoProblema}","${urlLimpia}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `articulos_sin_imagen_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            showToast('✓ Archivo CSV descargado');
        }
        
        // Renderizar tarjetas
        function renderizarGrid() {
            const grid = document.getElementById('grid');
            const noResults = document.getElementById('noResults');
            
            if (productosFiltrados.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';
            
            productosFiltrados.forEach(producto => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const badgeClass = producto.tipoProblema === 'Sin URL' ? 'sin-url' : 'url-rota';
                const previewClass = producto.tipoProblema === 'Sin URL' ? 'no-url' : 'error';
                const iconClass = producto.tipoProblema === 'Sin URL' ? 'fa-unlink' : 'fa-exclamation-triangle';
                
                card.innerHTML = `
                    <div class="card-badge ${badgeClass}">${producto.tipoProblema}</div>
                    <div class="card-image-preview ${previewClass}">
                        <i class="fas ${iconClass}"></i>
                    </div>
                    <h3>${producto.nombre}</h3>
                    <div class="card-info">
                        <div class="card-info-row">
                            <label>Código:</label>
                            <span>${producto.codigo}</span>
                        </div>
                        <div class="card-info-row">
                            <label>Categoría:</label>
                            <span>${producto.categoria || 'Sin categoría'}</span>
                        </div>
                    </div>
                    <div class="card-url ${!producto.url ? 'empty' : ''}">
                        ${producto.url || 'Sin URL de imagen definida'}
                    </div>

                `;
                
                grid.appendChild(card);
            });
        }
        
        // Aplicar filtros
        function aplicarFiltros() {
            const busqueda = document.getElementById('buscar').value.toLowerCase();
            const tipoFiltro = document.getElementById('filtroTipo').value;
            const categoriaFiltro = document.getElementById('filtroCategoria').value;
            
            productosFiltrados = productosSinImagen.filter(p => {
                // Filtro de búsqueda
                const matchBusqueda = !busqueda || 
                    p.codigo.toLowerCase().includes(busqueda) ||
                    p.nombre.toLowerCase().includes(busqueda) ||
                    (p.categoria && p.categoria.toLowerCase().includes(busqueda));
                
                // Filtro de tipo de problema
                const matchTipo = tipoFiltro === 'todos' ||
                    (tipoFiltro === 'sin-url' && p.tipoProblema === 'Sin URL') ||
                    (tipoFiltro === 'url-rota' && p.tipoProblema !== 'Sin URL');
                
                // Filtro de categoría
                const matchCategoria = !categoriaFiltro || p.categoria === categoriaFiltro;
                
                return matchBusqueda && matchTipo && matchCategoria;
            });
            
            // Ordenar descendentemente por código (mayor a menor)
            productosFiltrados.sort((a, b) => {
                // Convertir a números para comparación numérica correcta
                const numA = parseInt(a.codigo) || 0;
                const numB = parseInt(b.codigo) || 0;
                return numB - numA;
            });
            
            renderizarGrid();
        }
        
        // Cargar datos
        async function cargarDatos() {
            const loading = document.getElementById('loading');
            const progressEl = document.getElementById('loadingProgress');
            
            try {
                const response = await fetch(
                    `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID}/values/${GOOGLE_SHEETS_CONFIG.RANGO}?key=${GOOGLE_SHEETS_CONFIG.API_KEY}`
                );
                
                if (!response.ok) throw new Error('Error al cargar datos');
                
                const data = await response.json();
                const items = data.values || [];
                
                // Filtrar items válidos (que tengan nombre)
                const productosValidos = items.filter(item => (item[3] || '').toString().trim() !== '');
                
                document.getElementById('totalProductos').textContent = productosValidos.length;
                
                let sinUrl = 0;
                let urlRota = 0;
                let conImagen = 0;
                let verificados = 0;
                
                // Verificar cada producto
                for (const item of productosValidos) {
                    verificados++;
                    progressEl.textContent = `Verificando ${verificados} de ${productosValidos.length}...`;
                    
                    const categoria = item[0] || '';
                    const urlImagen = item[1] || '';
                    const codigo = item[2] || '';
                    const nombre = item[3] || '';
                    
                    // Agregar categoría al set
                    if (categoria) categoriasSet.add(categoria);
                    
                    // Verificar si tiene URL válida
                    if (!urlImagen || urlImagen.trim() === '') {
                        sinUrl++;
                        productosSinImagen.push({
                            codigo,
                            nombre,
                            categoria,
                            url: '',
                            tipoProblema: 'Sin URL'
                        });
                    } else if (!isValidImageUrl(urlImagen.split(',')[0].trim())) {
                        // URL no tiene formato válido
                        urlRota++;
                        productosSinImagen.push({
                            codigo,
                            nombre,
                            categoria,
                            url: urlImagen,
                            tipoProblema: 'URL inválida'
                        });
                    } else {
                        // Verificar si la imagen existe
                        const primeraUrl = urlImagen.split(',')[0].trim();
                        const resultado = await verificarImagen(primeraUrl);
                        
                        if (!resultado.exists) {
                            urlRota++;
                            productosSinImagen.push({
                                codigo,
                                nombre,
                                categoria,
                                url: primeraUrl,
                                tipoProblema: resultado.reason === 'timeout' ? 'Timeout' : 'Imagen no encontrada'
                            });
                        } else {
                            conImagen++;
                        }
                    }
                }
                
                // Actualizar estadísticas
                document.getElementById('sinUrl').textContent = sinUrl;
                document.getElementById('urlRota').textContent = urlRota;
                document.getElementById('conImagen').textContent = conImagen;
                
                // Poblar selector de categorías
                const selectCategoria = document.getElementById('filtroCategoria');
                const categoriasOrdenadas = Array.from(categoriasSet).sort();
                categoriasOrdenadas.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    selectCategoria.appendChild(option);
                });
                
                // Copiar para filtrado
                productosFiltrados = [...productosSinImagen];
                
                // Ordenar descendentemente por código (mayor a menor)
                productosFiltrados.sort((a, b) => {
                    const numA = parseInt(a.codigo) || 0;
                    const numB = parseInt(b.codigo) || 0;
                    return numB - numA;
                });
                
                // Ocultar loading y mostrar resultados
                loading.style.display = 'none';
                renderizarGrid();
                
            } catch (error) {
                console.error('Error:', error);
                loading.innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="color: #f44336; animation: none;"></i>
                    <p style="color: #f44336;">Error al cargar los datos: ${error.message}</p>
                `;
            }
        }
        
        // Event listeners
        document.getElementById('buscar').addEventListener('input', aplicarFiltros);
        document.getElementById('filtroTipo').addEventListener('change', aplicarFiltros);
        document.getElementById('filtroCategoria').addEventListener('change', aplicarFiltros);
        
        // Iniciar
        cargarDatos();
    </script>
</body>
</html>
