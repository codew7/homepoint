<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Caja HomePoint</title>
  <style>
    :root {
      --fondo: #F6F5F1;
      --tarjeta: #FFFFFF;
      --texto: #17181C;
      --texto-suave: #6B6D74;
      --borde: rgba(23, 24, 28, 0.08);
      --violeta: #6c4eb6;
      --ambar: #d97706;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .tarjeta {
      width: min(440px, 100%);
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 36px 32px 28px;
      box-shadow: 0 1px 2px rgba(23, 24, 28, 0.04), 0 12px 32px -12px rgba(23, 24, 28, 0.12);
      text-align: center;
      animation: entrar 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .icono {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: rgba(217, 119, 6, 0.1);
      color: var(--ambar);
      display: grid;
      place-items: center;
    }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.55; color: var(--texto-suave); }
    .estado {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--texto-suave);
    }
    .punto {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ambar);
      animation: latir 1.6s ease-in-out infinite;
    }
    button {
      margin-top: 22px;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: var(--texto);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 160ms ease, transform 120ms ease;
    }
    button:hover { background: #2A2C33; }
    button:active { transform: scale(0.985); }
    button:focus-visible { outline: 3px solid rgba(108, 78, 182, 0.45); outline-offset: 2px; }
    @keyframes entrar {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes latir {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tarjeta, .punto { animation: none; }
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <div class="icono" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/>
        <path d="M19 12.86a10 10 0 0 0-2-1.48"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/>
        <path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>La caja necesita internet para trabajar con los pedidos, los artículos y los precios. Apenas vuelva la conexión, se abre sola.</p>
    <div class="estado" role="status"><span class="punto"></span>Reintentando cada 5 segundos…</div>
    <button type="button" id="reintentar">Reintentar ahora</button>
  </main>
  <script>
    document.getElementById('reintentar').addEventListener('click', () => {
      if (window.cajaApp) window.cajaApp.reintentarConexion();
    });
  </script>
</body>
</html>
