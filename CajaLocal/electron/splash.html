<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Caja HomePoint</title>
  <style>
    :root {
      --grafito: #17181C;
      --grafito-2: #22242A;
      --texto-suave: rgba(255, 255, 255, 0.52);
      --violeta: #6c4eb6;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, var(--grafito-2) 0%, var(--grafito) 70%);
      color: #fff;
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      cursor: default;
    }
    .contenido {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: entrar 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    img { width: 220px; height: auto; display: block; }
    .barra {
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }
    .barra::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--violeta), transparent);
      animation: recorrer 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .version {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--texto-suave);
      font-variant-numeric: tabular-nums;
    }
    @keyframes entrar {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes recorrer {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .contenido { animation: none; }
      .barra::after { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div class="contenido">
    <img src="logo-blanco.png" alt="HomePoint">
    <div class="barra" aria-hidden="true"></div>
  </div>
  <div class="version" id="version"></div>
  <script>
    const v = new URLSearchParams(location.search).get('v');
    if (v) document.getElementById('version').textContent = 'Caja · versión ' + v;
  </script>
</body>
</html>
