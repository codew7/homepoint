<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Consulta de Precios</title>
<link rel="icon" href="../favicon.png">
<script src="../config.js"></script>
<style>
  :root {
    --bg: #0a0a0c;
    --bg-glow: #1a1a22;
    --surface: #16161b;
    --surface-2: #1f1f26;
    --key: #1c1c22;
    --key-press: #2c2c35;
    --line: rgba(255,255,255,.08);
    --text: #f5f5f7;
    --text-2: #a1a1aa;
    --text-3: #6b6b75;
    --ok: #30d158;
    --warn: #ff9f0a;
    --bad: #ff453a;
    --sheet: #f5f5f7;
    --sheet-text: #0a0a0c;
    --sheet-text-2: #6e6e73;
    --radius: 28px;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-in: cubic-bezier(.64, 0, .78, 0);
    --gutter: clamp(16px, 5vw, 48px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg-glow) 0%, transparent 60%),
      var(--bg);
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { -webkit-user-drag: none; }

  /* ---------- Layout ---------- */
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(env(safe-area-inset-top), 20px) var(--gutter) max(env(safe-area-inset-bottom), 24px);
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    flex: none;
  }
  .logo { height: clamp(22px, 3.2vh, 30px); width: auto; opacity: .95; }
  .head-right { display: flex; align-items: center; gap: 14px; color: var(--text-2); font-size: 15px; }
  .clock { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
    color: var(--text-2);
    transition: transform .1s ease-out, background .2s;
  }
  .icon-btn:active { transform: scale(.92); background: var(--surface-2); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- Hero / display ---------- */
  .hero {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 0;
    padding: 1.5vh 0;
  }
  /* Si el contenido no entra en el alto disponible se escala (ver ajustarHero) en vez de pisar el teclado */
  .hero-in {
    display: flex; flex-direction: column; align-items: center;
    transform-origin: center;
  }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 14px;
  }
  /* ---------- Ilustración código de barras ---------- */
  .barcode {
    background: #fff;
    color: #0a0a0c;
    border-radius: 20px;
    padding: clamp(10px, 1.4vh, 16px) clamp(14px, 2vh, 22px) clamp(8px, 1.1vh, 12px);
    margin-bottom: clamp(14px, 2.4vh, 36px);
    box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    transform: rotate(-2.5deg);
    animation: label-in .8s var(--ease-out) both;
  }
  .bc-wrap {
    position: relative;
    width: clamp(190px, 30vw, 260px);
    height: clamp(36px, 5vh, 72px);
    overflow: hidden;
  }
  .bc-bars { width: 100%; height: 100%; display: block; fill: currentColor; }
  .bc-scan {
    position: absolute; left: -6px; right: -6px; top: 0; height: 2px;
    background: #ff3b30;
    box-shadow: 0 0 10px 2px rgba(255,59,48,.55);
    border-radius: 2px;
    animation: scan 2.6s ease-in-out infinite;
  }
  .bc-num {
    margin-top: 6px;
    display: flex; justify-content: center; align-items: center; gap: 6px;
    font-size: clamp(15px, 2vh, 19px);
    font-variant-numeric: tabular-nums;
    letter-spacing: .06em;
    color: #8e8e93;
    font-weight: 500;
  }
  .bc-num b {
    color: #fff; background: #0a0a0c;
    padding: 2px 8px; border-radius: 8px;
    font-weight: 700;
  }
  @keyframes scan { 0%, 100% { top: 6%; } 50% { top: 92%; } }
  @keyframes label-in { from { opacity: 0; transform: rotate(-2.5deg) translateY(12px) scale(.96); } }

  h1 {
    font-size: clamp(28px, 4.6vh, 54px);
    line-height: 1.04;
    letter-spacing: -.03em;
    font-weight: 700;
  }
  .sub {
    margin-top: 12px;
    font-size: clamp(16px, 2.1vh, 20px);
    line-height: 1.4;
    color: var(--text-2);
    max-width: 30ch;
  }
  .sub b { color: var(--text); font-weight: 600; }

  .display {
    margin-top: clamp(14px, 2.6vh, 56px);
    display: flex;
    justify-content: center;
    gap: clamp(6px, 1.2vw, 12px);
    min-height: clamp(52px, 7.5vh, 96px);
  }
  .slot {
    width: clamp(46px, 9vw, 72px);
    height: clamp(52px, 7.5vh, 96px);
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-size: clamp(30px, 4.6vh, 56px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    transition: border-color .2s, background .2s;
    position: relative;
  }
  .slot.filled { background: var(--surface-2); }
  .slot.filled span { animation: pop .22s var(--ease-out); }
  .slot.cursor::after {
    content: ""; position: absolute; left: 50%; bottom: 18%;
    width: 36%; height: 3px; border-radius: 3px; translate: -50% 0;
    background: var(--text);
    animation: blink 1.1s steps(1) infinite;
  }
  .display.long { gap: 6px; }
  .slot.extra { width: clamp(26px, 5vw, 42px); border-radius: 12px; font-size: clamp(26px, 3.8vh, 38px); color: var(--text-2); }
  .display.shake { animation: shake .36s var(--ease-out); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes shake {
    20% { transform: translateX(-10px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
  }

  .status {
    margin-top: clamp(8px, 1.4vh, 20px);
    height: 28px;
    font-size: 17px;
    font-weight: 500;
    color: var(--text-2);
    display: flex; align-items: center; gap: 8px;
    transition: color .2s;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.bad { color: var(--bad); }
  .status.hidden { opacity: 0; }

  /* ---------- Keypad ---------- */
  .keypad {
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 1.3vh, 16px);
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }
  .key {
    height: clamp(54px, 8vh, 104px);
    border-radius: 24px;
    background: var(--key);
    border: 1px solid var(--line);
    font-size: clamp(26px, 3.6vh, 40px);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    display: grid; place-items: center;
    transition: transform .14s var(--ease-out), background .18s;
  }
  .key.pressed { transform: scale(.95); background: var(--key-press); transition-duration: 0s; }
  .key.ghost { background: transparent; border-color: transparent; color: var(--text-2); font-size: 18px; font-weight: 600; }
  .key.ghost.pressed { background: var(--surface); }
  .key svg { width: 32px; height: 32px; }

  .search-btn {
    grid-column: 1 / -1;
    height: clamp(52px, 6.6vh, 84px);
    border-radius: 24px;
    background: var(--text);
    color: var(--bg);
    font-size: clamp(19px, 2.4vh, 23px);
    font-weight: 650;
    letter-spacing: -.01em;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .14s var(--ease-out), opacity .25s, background .2s;
    margin-top: 4px;
  }
  .search-btn svg { width: 22px; height: 22px; }
  .search-btn.pressed { transform: scale(.97); transition-duration: 0s; }
  .search-btn:disabled { opacity: .18; }

  .foot {
    flex: none;
    text-align: center;
    margin-top: clamp(8px, 1.4vh, 16px);
    font-size: 13px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    min-height: 18px;
  }

  /* ---------- Loading / error overlay ---------- */
  .boot {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: var(--bg);
    transition: opacity .5s var(--ease-out), visibility .5s;
    text-align: center;
    padding: var(--gutter);
  }
  .boot.gone { opacity: 0; visibility: hidden; }
  .boot img { height: 36px; }
  .boot p { color: var(--text-2); font-size: 17px; max-width: 32ch; line-height: 1.45; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--surface-2); border-top-color: var(--text);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .boot .retry {
    padding: 16px 32px; border-radius: 999px; background: var(--text); color: var(--bg);
    font-weight: 600; font-size: 17px;
  }
  .boot .retry:active { transform: scale(.96); }

  /* ---------- Sheet ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    opacity: 0; visibility: hidden;
    transition: opacity .42s var(--ease-out), visibility .42s;
  }
  .scrim.open { opacity: 1; visibility: visible; }

  .sheet {
    position: fixed; z-index: 30;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    max-width: 820px;
    height: calc(100dvh - max(env(safe-area-inset-top), 20px) - 28px);
    background: var(--sheet);
    color: var(--sheet-text);
    border-radius: var(--radius) var(--radius) 0 0;
    box-shadow: 0 -20px 60px rgba(0,0,0,.45);
    transform: translateY(105%);
    transition: transform .5s var(--ease-out);
    display: flex; flex-direction: column;
    overflow: hidden;
    will-change: transform;
  }
  .sheet.open { transform: translateY(0); }
  .sheet.closing { transition: transform .32s var(--ease-in); }
  .sheet.dragging { transition: none; }

  .grabber {
    flex: none; height: 30px; display: grid; place-items: center; touch-action: none;
  }
  .grabber::before { content: ""; width: 44px; height: 5px; border-radius: 5px; background: rgba(0,0,0,.18); }

  .sheet-top {
    flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--gutter) 6px;
    touch-action: none;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 17px; font-weight: 600; color: var(--sheet-text);
    padding: 8px 12px 8px 4px; border-radius: 12px;
  }
  .back-btn svg { width: 22px; height: 22px; }
  .back-btn:active { background: rgba(0,0,0,.06); }
  .back-btn.hidden { display: none; }

  .sheet-body {
    flex: 1 1 auto; min-height: 0;
    position: relative;
  }
  .view {
    position: absolute; inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 var(--gutter) 24px;
    transition: transform .42s var(--ease-out), opacity .3s;
  }
  .view.off-right { transform: translateX(14%); opacity: 0; pointer-events: none; }
  .view.off-left { transform: translateX(-14%); opacity: 0; pointer-events: none; }

  /* Product */
  /* La ficha entra completa en la hoja: la foto ocupa el espacio que dejan nombre y precio */
  #productView { overflow: hidden; padding-bottom: 8px; }
  .product { display: flex; flex-direction: column; height: 100%; }
  .photo {
    position: relative;
    width: 100%;
    flex: 1 1 0;
    min-height: 0;
    border-radius: 24px;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
  }
  /* Posición absoluta: la foto nunca agranda el recuadro; se escala a lo que entra, sin deformarse */
  .photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain; object-position: center; padding: 4%;
    opacity: 0; transform: scale(.97);
    transition: opacity .5s var(--ease-out), transform .7s var(--ease-out);
  }
  .photo img.ready { opacity: 1; transform: none; }
  .photo .shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, #f2f2f4 30%, #fafafa 50%, #f2f2f4 70%);
    background-size: 300% 100%;
    animation: shimmer 1.4s linear infinite;
    transition: opacity .4s;
  }
  .photo .shimmer.done { opacity: 0; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  .p-info { padding: clamp(18px, 2.6vh, 28px) 4px 0; flex: none; display: flex; flex-direction: column; }
  .p-name {
    font-size: clamp(26px, 3.6vh, 38px);
    line-height: 1.12;
    letter-spacing: -.022em;
    font-weight: 700;
    text-wrap: balance;
  }
  .p-price-wrap { padding-top: clamp(12px, 2vh, 24px); }
  .p-price {
    font-size: clamp(64px, 10vh, 112px);
    line-height: 1;
    letter-spacing: -.045em;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: flex-start;
  }
  .p-price .cur { font-size: .42em; letter-spacing: 0; margin: .14em .12em 0 0; font-weight: 650; }
  .p-price.na { font-size: clamp(30px, 4vh, 40px); letter-spacing: -.02em; color: var(--sheet-text-2); }

  /* Results list */
  .list-head { padding: 4px 4px 18px; }
  .list-head h2 { font-size: clamp(26px, 3.4vh, 34px); letter-spacing: -.025em; line-height: 1.1; font-weight: 700; }
  .list-head p { margin-top: 6px; color: var(--sheet-text-2); font-size: 17px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card {
    background: #fff; border-radius: 22px; overflow: hidden; text-align: left;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    display: flex; flex-direction: column;
    transition: transform .14s var(--ease-out);
    animation: rise .5s var(--ease-out) backwards;
  }
  .card.pressed { transform: scale(.97); transition-duration: 0s; }
  .card .thumb { aspect-ratio: 1/1; display: grid; place-items: center; background: #fff; }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 8%; }
  .card .meta { padding: 12px 16px 16px; border-top: 1px solid rgba(0,0,0,.05); }
  .card .c-name {
    font-size: 17px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2.5em;
  }
  .card .c-price { margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

  .sheet-foot {
    flex: none;
    padding: 12px var(--gutter) max(env(safe-area-inset-bottom), 20px);
    background: linear-gradient(to top, var(--sheet) 70%, rgba(245,245,247,0));
  }
  .done-btn {
    position: relative; overflow: hidden;
    width: 100%;
    height: clamp(64px, 7.6vh, 80px);
    border-radius: 22px;
    background: var(--sheet-text); color: var(--sheet);
    font-size: clamp(19px, 2.4vh, 22px); font-weight: 650; letter-spacing: -.01em;
    transition: transform .14s var(--ease-out);
  }
  .done-btn.pressed { transform: scale(.97); transition-duration: 0s; }
  .done-btn .progress {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
    background: rgba(255,255,255,.35);
    transform-origin: left; transform: scaleX(0);
  }
  .done-btn span { position: relative; }

  /* ---------- Accessibility prefs ---------- */
  @media (prefers-reduced-motion: reduce) {
    .bc-scan { display: none; }
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .sheet { transition: opacity .25s ease; transform: none; opacity: 0; visibility: hidden; }
    .sheet.open { opacity: 1; visibility: visible; }
    .view { transition: opacity .2s; transform: none !important; }
    .photo img { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .scrim { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(0,0,0,.85); }
  }

  /* Short screens (landscape fallback / small phones) */
  @media (max-height: 760px) {
    .sub { margin-top: 6px; }
  }
</style>
</head>
<body oncontextmenu="return false">

<div class="app">
  <header>
    <img class="logo" src="../logoblanco.png" alt="HomePoint">
    <div class="head-right">
      <span class="clock" id="clock"></span>
      <button class="icon-btn" id="fsBtn" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
      </button>
    </div>
  </header>

  <section class="hero" id="hero">
   <div class="hero-in" id="heroIn">
    <!-- Ilustración: etiqueta con código de barras y los últimos 6 números resaltados -->
    <div class="barcode" aria-hidden="true">
      <div class="bc-wrap">
        <svg class="bc-bars" viewBox="0 0 89 64" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="1" height="64"/><rect x="2" y="0" width="1" height="64"/><rect x="5" y="0" width="2" height="56"/><rect x="8" y="0" width="3" height="56"/><rect x="12" y="0" width="1" height="56"/><rect x="14" y="0" width="2" height="56"/><rect x="17" y="0" width="1" height="56"/><rect x="19" y="0" width="1" height="56"/><rect x="23" y="0" width="3" height="56"/><rect x="27" y="0" width="1" height="56"/><rect x="29" y="0" width="3" height="56"/><rect x="33" y="0" width="1" height="56"/><rect x="35" y="0" width="1" height="56"/><rect x="39" y="0" width="1" height="56"/><rect x="41" y="0" width="1" height="64"/><rect x="43" y="0" width="1" height="64"/><rect x="46" y="0" width="1" height="56"/><rect x="48" y="0" width="2" height="56"/><rect x="53" y="0" width="1" height="56"/><rect x="55" y="0" width="2" height="56"/><rect x="58" y="0" width="1" height="56"/><rect x="60" y="0" width="2" height="56"/><rect x="63" y="0" width="1" height="56"/><rect x="65" y="0" width="1" height="56"/><rect x="69" y="0" width="3" height="56"/><rect x="74" y="0" width="3" height="56"/><rect x="80" y="0" width="2" height="56"/><rect x="84" y="0" width="1" height="56"/><rect x="86" y="0" width="1" height="64"/><rect x="88" y="0" width="1" height="64"/></svg>
        <i class="bc-scan"></i>
      </div>
      <div class="bc-num"><span>7 790000</span><b>223785</b></div>
    </div>
    <h1>¿Cuánto cuesta?</h1>
    <p class="sub">Ingresá los <b>últimos 6 números</b> del código de barras del producto.</p>

    <div class="display" id="display" aria-live="polite"></div>
    <div class="status hidden" id="status"><span class="dot"></span><span id="statusText"></span></div>
   </div>
  </section>

  <div class="keypad" id="keypad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key ghost" data-k="clear">Borrar todo</button>
    <button class="key" data-k="0">0</button>
    <button class="key ghost" data-k="back" aria-label="Borrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/><path d="m17.5 9.5-5 5M12.5 9.5l5 5"/></svg>
    </button>
    <button class="search-btn" id="searchBtn" data-k="go" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Buscar</span>
    </button>
  </div>

  <div class="foot" id="foot"></div>
</div>

<!-- Boot overlay -->
<div class="boot" id="boot">
  <img src="../logoblanco.png" alt="HomePoint">
  <div class="spinner" id="bootSpin"></div>
  <p id="bootMsg">Cargando catálogo…</p>
  <button class="retry" id="bootRetry" hidden>Reintentar</button>
</div>

<!-- Sheet -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Resultado">
  <div class="grabber" id="grabber"></div>
  <div class="sheet-top" id="sheetTop">
    <button class="back-btn hidden" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Resultados
    </button>
  </div>
  <div class="sheet-body">
    <div class="view off-left" id="listView"></div>
    <div class="view off-right" id="productView"></div>
  </div>
  <div class="sheet-foot">
    <button class="done-btn" id="doneBtn"><span>Nueva consulta</span><i class="progress" id="idleBar"></i></button>
  </div>
</section>

<script>
// ============================================================
//  Configuración
// ============================================================
const MIN_DIGITS = 5;
const MAX_DIGITS = 14;
const AUTO_OPEN_MS = 650;          // espera tras teclear antes de abrir un resultado único
const SHEET_IDLE_MS = 25000;       // la ficha vuelve sola al teclado
const HOME_IDLE_MS = 30000;        // el número tecleado se borra solo
const REFRESH_MS = 10 * 60 * 1000; // recarga del catálogo
const CACHE_KEY = 'kioscoPrecios.catalogo.v1';

const RANGO = (GOOGLE_SHEETS_CONFIG.RANGO || 'Lista!A2:L').replace(/:[A-Z]+(\d*)$/, ':L$1');
const SHEETS_URL = `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(RANGO)}?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE&fields=values&key=${GOOGLE_SHEETS_CONFIG.API_KEY}`;

const PLACEHOLDER_IMG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect fill='%23f4f4f6' width='120' height='120'/%3E%3Cpath d='M38 78l14-18 10 13 12-16 16 21z' fill='%23d0d0d6'/%3E%3Ccircle cx='46' cy='46' r='7' fill='%23d0d0d6'/%3E%3C/svg%3E";

const $ = id => document.getElementById(id);

// ============================================================
//  Catálogo (Google Sheets)
// ============================================================
let catalogo = [];        // [{codigo, nombre, precio, imagenes[], barras[]}]
let ultimaCarga = null;

function parsePrecio(raw) {
  let s = String(raw || '').replace(/[^\d.,-]/g, '');
  if (!s) return null;
  if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');          // 6,221.50
  else if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); // 6.221,50
  else s = s.replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) && n > 0 ? n : null;
}

function mapRows(values) {
  return (values || []).map(row => {
    const imgs = String(row[1] || '').split(',').map(s => s.trim()).filter(Boolean);
    return {
      imagenes: [imgs[0], imgs[3]].filter((v, i, a) => v && a.indexOf(v) === i),
      codigo: String(row[2] || '').trim(),
      nombre: String(row[3] || '').trim(),
      precio: parsePrecio(row[6]),
      barras: String(row[11] || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
    };
  }).filter(a => a.codigo && a.nombre && a.barras.length);
}

function leerCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && Array.isArray(c.values)) return c;
  } catch (_) {}
  return null;
}
function guardarCache(values) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), values })); } catch (_) {}
}

async function cargarCatalogo() {
  const res = await fetch(SHEETS_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('Sheets ' + res.status);
  const data = await res.json();
  const nuevo = mapRows(data.values);
  if (!nuevo.length) throw new Error('Catálogo vacío');
  catalogo = nuevo;
  ultimaCarga = Date.now();
  guardarCache(data.values);
  pintarFoot();
}

async function iniciar() {
  const cache = leerCache();
  if (cache) {
    catalogo = mapRows(cache.values);
    ultimaCarga = cache.t;
    ocultarBoot();
    pintarFoot();
    cargarCatalogo().catch(() => pintarFoot(true));
    return;
  }
  $('bootSpin').hidden = false; $('bootRetry').hidden = true;
  $('bootMsg').textContent = 'Cargando catálogo…';
  try {
    await cargarCatalogo();
    ocultarBoot();
  } catch (e) {
    console.error(e);
    $('bootSpin').hidden = true;
    $('bootMsg').textContent = 'No pudimos conectar con el catálogo. Revisá la conexión a internet.';
    $('bootRetry').hidden = false;
  }
}
function ocultarBoot() { $('boot').classList.add('gone'); }
$('bootRetry').addEventListener('click', iniciar);

setInterval(() => cargarCatalogo().catch(() => pintarFoot(true)), REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    pedirWakeLock();
    if (!ultimaCarga || Date.now() - ultimaCarga > 60000) cargarCatalogo().catch(() => pintarFoot(true));
  }
});

function pintarFoot(error) {
  if (!ultimaCarga) { $('foot').textContent = ''; return; }
  const h = new Date(ultimaCarga).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  $('foot').textContent = (error ? 'Sin conexión · ' : '') + `Precios actualizados ${h} hs`;
}

// ============================================================
//  Búsqueda
// ============================================================
function buscar(q) {
  if (q.length < MIN_DIGITS) return [];
  const out = [];
  for (const a of catalogo) {
    if (a.barras.some(b => b.endsWith(q))) out.push(a);
  }
  return out;
}

const fmt = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
function precioHTML(p) {
  return p == null ? 'Consultar' : `<span class="cur">$</span>${fmt.format(Math.round(p))}`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ============================================================
//  Entrada numérica
// ============================================================
let entrada = '';
let resultados = [];
let autoTimer = null;
let homeIdle = null;

function pintarDisplay() {
  const d = $('display');
  const slots = Math.max(6, entrada.length);
  const extra = entrada.length > 6;
  let html = '';
  for (let i = 0; i < slots; i++) {
    const ch = entrada[i];
    const cls = ['slot'];
    if (ch) cls.push('filled');
    if (extra) cls.push('extra');
    if (i === entrada.length && !extra) cls.push('cursor');
    html += `<div class="${cls.join(' ')}">${ch ? `<span>${ch}</span>` : ''}</div>`;
  }
  d.innerHTML = html;
  d.classList.toggle('long', extra);
}

function setStatus(tipo, texto) {
  const s = $('status');
  s.className = 'status' + (tipo ? ' ' + tipo : '') + (texto ? '' : ' hidden');
  $('statusText').textContent = texto || '';
}

function actualizar() {
  pintarDisplay();
  clearTimeout(autoTimer);
  resultados = buscar(entrada);
  $('searchBtn').disabled = entrada.length < MIN_DIGITS;

  if (entrada.length === 0) setStatus('', '');
  else if (entrada.length < MIN_DIGITS) {
    const f = MIN_DIGITS - entrada.length;
    setStatus('', `${f === 1 ? 'Falta 1 número' : `Faltan ${f} números`}`);
  } else if (resultados.length === 0) {
    setStatus('bad', 'No encontramos ese código');
  } else if (resultados.length === 1) {
    setStatus('ok', 'Producto encontrado');
    precargar(resultados[0]);
    autoTimer = setTimeout(abrirResultados, AUTO_OPEN_MS);
  } else {
    setStatus('warn', `${resultados.length} productos coinciden`);
  }
  reiniciarHomeIdle();
}

function tecla(k) {
  if (sheetAbierta) return;
  if (k === 'back') entrada = entrada.slice(0, -1);
  else if (k === 'clear') entrada = '';
  else if (k === 'go') { ejecutarBusqueda(); return; }
  else if (/^\d$/.test(k)) {
    if (entrada.length >= MAX_DIGITS) { sacudir(); return; }
    entrada += k;
  }
  actualizar();
}

function ejecutarBusqueda() {
  clearTimeout(autoTimer);
  if (entrada.length < MIN_DIGITS) { sacudir(); return; }
  if (!resultados.length) { sacudir(); vibrar([12, 60, 12]); return; }
  abrirResultados();
}

function sacudir() {
  const d = $('display');
  d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} }

function reiniciarHomeIdle() {
  clearTimeout(homeIdle);
  if (entrada) homeIdle = setTimeout(() => { if (!sheetAbierta) { entrada = ''; actualizar(); } }, HOME_IDLE_MS);
}

// Feedback inmediato en pointer-down; la acción también se dispara al tocar
// (los kioscos premian la respuesta instantánea sobre la cancelación).
function bindPress(el, onPress) {
  el.addEventListener('pointerdown', e => {
    if (el.disabled) return;
    el.classList.add('pressed');
    vibrar(8);
    onPress && onPress(e);
  });
  const up = () => el.classList.remove('pressed');
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('pointercancel', up);
}
document.querySelectorAll('#keypad [data-k]').forEach(btn => {
  bindPress(btn, () => tecla(btn.dataset.k));
});

// Teclado físico o lector USB de códigos
document.addEventListener('keydown', e => {
  if (sheetAbierta) {
    if (e.key === 'Escape' || e.key === 'Enter') cerrarSheet();
    else if (/^\d$/.test(e.key)) { cerrarSheet(); entrada = e.key; actualizar(); }
    return;
  }
  if (/^\d$/.test(e.key)) tecla(e.key);
  else if (e.key === 'Backspace') tecla('back');
  else if (e.key === 'Escape') tecla('clear');
  else if (e.key === 'Enter') tecla('go');
});

// ============================================================
//  Imágenes
// ============================================================
const precargadas = new Map();
function precargar(a) {
  if (precargadas.has(a.codigo)) return;
  const im = new Image();
  im.src = a.imagenes[0] || PLACEHOLDER_IMG;
  precargadas.set(a.codigo, im);
}
function setImg(img, a, onReady) {
  const fuentes = [...a.imagenes, PLACEHOLDER_IMG];
  let i = 0;
  img.onload = () => onReady && onReady();
  img.onerror = () => { i++; if (i < fuentes.length) img.src = fuentes[i]; };
  img.src = fuentes[0];
}

// ============================================================
//  Sheet: lista y ficha
// ============================================================
let sheetAbierta = false;
let abiertaEn = 0;
let sheetIdle = null;
let enLista = false;

function abrirResultados() {
  clearTimeout(autoTimer);
  if (!resultados.length) return;
  if (resultados.length === 1) {
    pintarProducto(resultados[0]);
    mostrarVista('product', false);
  } else {
    pintarLista(resultados);
    mostrarVista('list', false);
  }
  abrirSheet();
  vibrar(14);
}

function pintarProducto(a) {
  const v = $('productView');
  v.innerHTML = `
    <div class="product">
      <div class="photo"><div class="shimmer"></div><img alt=""></div>
      <div class="p-info">
        <div class="p-name">${esc(a.nombre)}</div>
        <div class="p-price-wrap">
          <div class="p-price${a.precio == null ? ' na' : ''}">${precioHTML(a.precio)}</div>
        </div>
      </div>
    </div>`;
  v.scrollTop = 0;
  const img = v.querySelector('img');
  setImg(img, a, () => {
    img.classList.add('ready');
    v.querySelector('.shimmer').classList.add('done');
  });
}

function pintarLista(lista) {
  const v = $('listView');
  v.innerHTML = `
    <div class="list-head">
      <h2>Encontramos ${lista.length} productos</h2>
      <p>Tocá el que estás buscando.</p>
    </div>
    <div class="grid">
      ${lista.map((a, i) => `
        <button class="card" data-i="${i}" style="animation-delay:${Math.min(i, 10) * 40}ms">
          <div class="thumb"><img alt=""></div>
          <div class="meta">
            <div class="c-name">${esc(a.nombre)}</div>
            <div class="c-price">${a.precio == null ? 'Consultar' : '$ ' + fmt.format(Math.round(a.precio))}</div>
          </div>
        </button>`).join('')}
    </div>`;
  v.scrollTop = 0;
  v.querySelectorAll('.card').forEach(card => {
    const a = lista[+card.dataset.i];
    setImg(card.querySelector('img'), a);
    // En la lista hay scroll: el pressed es inmediato, pero la acción va en click
    // para no abrir un producto cuando el cliente solo quería desplazarse.
    card.addEventListener('pointerdown', () => card.classList.add('pressed'));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => card.addEventListener(ev, () => card.classList.remove('pressed')));
    card.addEventListener('click', () => {
      vibrar(8);
      pintarProducto(a);
      mostrarVista('product', true);
    });
  });
}

function mostrarVista(cual, conLista) {
  enLista = cual === 'list';
  const lv = $('listView'), pv = $('productView');
  if (enLista) {
    lv.className = 'view';
    pv.className = 'view off-right';
  } else {
    pv.className = 'view';
    lv.className = 'view off-left';
  }
  $('backBtn').classList.toggle('hidden', !( !enLista && conLista ));
  reiniciarSheetIdle();
}
$('backBtn').addEventListener('click', () => mostrarVista('list', true));

function abrirSheet() {
  sheetAbierta = true;
  abiertaEn = Date.now();
  const s = $('sheet');
  s.classList.remove('closing', 'dragging');
  s.style.transform = '';
  $('scrim').classList.add('open');
  requestAnimationFrame(() => s.classList.add('open'));
  reiniciarSheetIdle();
}

function cerrarSheet() {
  if (!sheetAbierta) return;
  sheetAbierta = false;
  const s = $('sheet');
  s.classList.remove('dragging');
  s.classList.add('closing');
  s.style.transform = '';
  s.classList.remove('open');
  $('scrim').classList.remove('open');
  clearTimeout(sheetIdle);
  pararBarra();
  entrada = '';
  actualizar();
}

bindPress($('doneBtn'));
// Ignora el "click fantasma" del mismo toque que abrió la ficha (el dedo se levanta sobre ella)
const cerrarPorToque = () => { if (Date.now() - abiertaEn > 500) cerrarSheet(); };
$('doneBtn').addEventListener('click', cerrarPorToque);
$('scrim').addEventListener('click', cerrarPorToque);

// Inactividad dentro de la ficha: barra de progreso en el botón + cierre automático
function reiniciarSheetIdle() {
  clearTimeout(sheetIdle);
  if (!sheetAbierta) return;
  sheetIdle = setTimeout(cerrarSheet, SHEET_IDLE_MS);
  const bar = $('idleBar');
  bar.style.transition = 'none';
  bar.style.transform = 'scaleX(0)';
  void bar.offsetWidth;
  bar.style.transition = `transform ${SHEET_IDLE_MS}ms linear`;
  bar.style.transform = 'scaleX(1)';
}
function pararBarra() {
  const bar = $('idleBar');
  bar.style.transition = 'none';
  bar.style.transform = 'scaleX(0)';
}
['pointerdown', 'scroll'].forEach(ev =>
  $('sheet').addEventListener(ev, () => reiniciarSheetIdle(), { capture: true, passive: true }));

// ============================================================
//  Arrastrar la ficha hacia abajo para cerrarla
//  1:1 con el dedo, resistencia hacia arriba y proyección de la velocidad al soltar.
// ============================================================
(function dragSheet() {
  const s = $('sheet');
  const handles = [$('grabber'), $('sheetTop')];
  let startY = 0, dy = 0, hist = [], activo = false;

  function rubberband(o, dim, c = 0.55) { return (o * dim * c) / (dim + c * Math.abs(o)); }
  function project(v, d = 0.998) { return (v / 1000) * d / (1 - d); }

  handles.forEach(h => h.addEventListener('pointerdown', e => {
    if (!sheetAbierta || e.target.closest('button')) return;
    activo = true; startY = e.clientY; dy = 0; hist = [{ y: e.clientY, t: e.timeStamp }];
    h.setPointerCapture(e.pointerId);
    s.classList.add('dragging');
  }));
  handles.forEach(h => h.addEventListener('pointermove', e => {
    if (!activo) return;
    dy = e.clientY - startY;
    const y = dy < 0 ? rubberband(dy, s.offsetHeight) : dy;
    s.style.transform = `translateY(${y}px)`;
    $('scrim').style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / s.offsetHeight));
    hist.push({ y: e.clientY, t: e.timeStamp });
    if (hist.length > 6) hist.shift();
  }));
  const fin = e => {
    if (!activo) return;
    activo = false;
    const a = hist[0], b = hist[hist.length - 1];
    const vel = b && a && b.t > a.t ? (b.y - a.y) / (b.t - a.t) * 1000 : 0; // px/s
    const destino = dy + project(vel);
    s.classList.remove('dragging');
    $('scrim').style.opacity = '';
    if (destino > s.offsetHeight * 0.35 && vel >= 0) cerrarSheet();
    else s.style.transform = '';
  };
  handles.forEach(h => { h.addEventListener('pointerup', fin); h.addEventListener('pointercancel', fin); });
})();

// ============================================================
//  Kiosco: reloj, pantalla completa, pantalla siempre encendida
// ============================================================
function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}
tick(); setInterval(tick, 15000);

$('fsBtn').addEventListener('click', () => {
  const d = document;
  if (!d.fullscreenElement) d.documentElement.requestFullscreen?.({ navigationUI: 'hide' }).catch(() => {});
  else d.exitFullscreen?.();
});

let wakeLock = null;
async function pedirWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (_) {}
}
document.addEventListener('pointerdown', pedirWakeLock, { once: true });
pedirWakeLock();

// Escala el bloque superior para que nunca se superponga con el teclado en pantallas bajas
function ajustarHero() {
  const hero = $('hero'), inner = $('heroIn');
  inner.style.transform = '';
  const cs = getComputedStyle(hero);
  const disponible = hero.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const escala = Math.min(1, disponible / inner.offsetHeight);
  if (escala < 1) inner.style.transform = `scale(${escala})`;
}
window.addEventListener('resize', ajustarHero);
document.fonts && document.fonts.ready.then(ajustarHero);

// ============================================================
pintarDisplay();
ajustarHero();
iniciar();
</script>
</body>
</html>
