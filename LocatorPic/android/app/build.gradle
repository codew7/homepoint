plugins {
    id 'com.android.application'
}

// google-services.json se descarga de la consola de Firebase (ver README) y no
// va al repositorio. Sin el, el proyecto compila igual (sirve para revisar el
// codigo), pero la app no puede conectarse a Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('AVISO: falta app/google-services.json. El APK no va a poder conectarse a Firebase.')
}

// Firma opcional, igual que pedidosv2T51: firma.properties NO va al repositorio.
def firma = new Properties()
def archivoFirma = rootProject.file('firma.properties')
if (archivoFirma.exists()) {
    archivoFirma.withInputStream { firma.load(it) }
}
def hayFirma = firma['storeFile'] != null

android {
    namespace 'ar.com.homepoint.locatorpic'
    compileSdk 34

    defaultConfig {
        applicationId "ar.com.homepoint.locatorpic"
        minSdk 26
        targetSdk 34
        // Subir versionCode en cada version nueva: si no, Android no deja
        // instalar encima de la que ya esta en el equipo.
        versionCode 3
        versionName "2.0"
    }

    signingConfigs {
        release {
            if (hayFirma) {
                storeFile file(firma['storeFile'])
                storePassword firma['storePassword']
                keyAlias firma['keyAlias']
                keyPassword firma['keyPassword']
                storeType firma.getProperty('storeType', 'PKCS12')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hayFirma) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Alinea las versiones de Kotlin que arrastran las librerias (ver pedidosv2T51).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.12.0'

    // Camara: CameraX con la maxima calidad del equipo.
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-extensions:$camerax"

    // Subidas en segundo plano, con reintentos aunque se cierre la app.
    implementation 'androidx.work:work-runtime:2.9.1'

    // Firebase: login, base de datos (con modo sin conexion) y Storage.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
}

// Deja el APK con un nombre claro en LocatorPic/LocatorPic.apk.
// La carpeta destino contiene el propio proyecto, asi que no se declara como
// salida de Gradle: se copia el archivo y listo.
tasks.register('copiarApk') {
    def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    def destino = rootProject.file('../LocatorPic.apk')
    doLast {
        java.nio.file.Files.copy(apk.get().asFile.toPath(), destino.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        println "APK listo: ${destino.canonicalPath}"
    }
}
afterEvaluate {
    tasks.named('assembleDebug') { finalizedBy 'copiarApk' }
}
