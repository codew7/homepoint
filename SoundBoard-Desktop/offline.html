<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>SoundBoard Showroom</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0A0A0B; color: #F5F5F7;
      font-family: -apple-system, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; }
    body { display: grid; place-items: center;
      background: radial-gradient(600px 400px at 50% 40%, rgba(240,179,91,.08), transparent 70%), #0A0A0B; }
    .card { text-align: center; max-width: 380px; padding: 24px; }
    img { width: 72px; height: 72px; margin-bottom: 20px; opacity: .9; }
    h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 600; }
    p { margin: 0; color: #A1A1A6; font-size: 14px; line-height: 1.6; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #F0B35B;
      margin-right: 8px; vertical-align: middle; animation: blink 1.6s ease-in-out infinite; }
    .status { margin-top: 22px; font-size: 12px; color: #6E6E73; }
    @keyframes blink { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <img src="build/icon.png" alt="" />
    <h1>Sin conexión a internet</h1>
    <p>SoundBoard necesita internet para cargar los avisos. Revisá la conexión de esta PC.</p>
    <p class="status"><span class="dot"></span>Reintentando automáticamente…</p>
  </div>
</body>
</html>
