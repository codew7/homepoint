<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Llega? · Envíos a sucursal</title>
<meta name="description" content="Consultá si una localidad tiene sucursal de Vía Cargo, Flecha Carga o Correo Argentino.">
<meta name="robots" content="noindex">

<meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)">

<style>
  :root {
    color-scheme: light dark;
    --fondo: #f3f2ee;
    --lateral: #ebeae5;
    --sup: #ffffff;
    --hundido: rgba(20, 24, 28, .055);
    --tinta: #14181c;
    --sec: #5c6167;
    --ter: #797e84;
    --linea: rgba(20, 24, 28, .1);
    --si: #0d7341;
    --si-tenue: #dff2e7;
    --no: #b0301d;
    --no-tenue: #f9e8e3;
    --ambar: #b5761a;
    --sombra: 0 1px 2px rgba(20, 24, 28, .05), 0 4px 16px rgba(20, 24, 28, .04);
    --curva: cubic-bezier(.32, .72, 0, 1);
    --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0f1215;
      --lateral: #15191d;
      --sup: #1a1f24;
      --hundido: rgba(255, 255, 255, .07);
      --tinta: #f2f3f1;
      --sec: #a4a9ae;
      --ter: #868c92;
      --linea: rgba(255, 255, 255, .1);
      --si: #62d392;
      --si-tenue: rgba(98, 211, 146, .14);
      --no: #ff917f;
      --no-tenue: rgba(255, 145, 127, .13);
      --ambar: #e0a63f;
      --sombra: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--fondo);
    color: var(--tinta);
    font: 400 1rem/1.42 var(--sans);
    word-spacing: .06em;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
  a { color: inherit; touch-action: manipulation; }
  h1, h2, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  svg { display: block; flex: none; }
  :focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- Estructura ---------- */
  .app { position: fixed; inset: 0; overflow: hidden; }
  .panel {
    position: absolute;
    inset: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    background: var(--fondo);
  }
  .panel-buscar { scroll-padding-top: 8.5rem; }
  .panel-lugar {
    z-index: 2;
    visibility: hidden;
    transform: translate3d(100%, 0, 0);
    box-shadow: -1px 0 0 var(--linea), -16px 0 40px rgba(0, 0, 0, .1);
    touch-action: pan-y;
  }
  .velo { position: absolute; inset: 0; z-index: 1; background: #000; opacity: 0; pointer-events: none; }

  /* ---------- Barra de búsqueda: material sobre el que pasa el contenido ---------- */
  .barra, .nav {
    position: sticky;
    top: 0;
    z-index: 3;
    background: color-mix(in srgb, var(--fondo) 76%, transparent);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    box-shadow: 0 1px 0 transparent;
    transition: box-shadow .2s ease;
  }
  .con-scroll > .barra, .con-scroll > .nav { box-shadow: 0 1px 0 var(--linea); }
  .barra { padding: calc(.75rem + env(safe-area-inset-top)) 1rem .75rem; }
  .plegable-marca {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .32s var(--curva), opacity .2s ease;
  }
  .plegable-marca > div { min-height: 0; overflow: hidden; }
  .buscando .plegable-marca { grid-template-rows: 0fr; opacity: 0; }
  .marca {
    display: flex;
    align-items: center;
    gap: .55rem;
    padding-bottom: .7rem;
    font-size: 1.3125rem;
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -.022em;
  }
  .marca img { width: 1.625rem; height: 1.625rem; }
  .marca span { font-size: .8125rem; font-weight: 450; letter-spacing: 0; color: var(--sec); padding-top: .2rem; }

  .campo { position: relative; }
  .campo .lupa { position: absolute; left: .85rem; top: 50%; margin-top: -.5625rem; width: 1.125rem; height: 1.125rem; color: var(--ter); pointer-events: none; }
  .campo input {
    width: 100%;
    height: 3rem;
    padding: 0 3rem 0 2.6rem;
    background: var(--sup);
    border: 0;
    border-radius: .875rem;
    box-shadow: 0 0 0 1px var(--linea), var(--sombra);
    font-size: 1.0625rem; /* 16 px o más: iOS no hace zoom al enfocar */
    letter-spacing: -.005em;
    appearance: none;
    transition: box-shadow .16s ease;
  }
  .campo input:focus { outline: none; box-shadow: 0 0 0 1.5px var(--ambar), 0 0 0 5px color-mix(in srgb, var(--ambar) 20%, transparent); }
  .campo input::placeholder { color: var(--ter); }
  .campo input::-webkit-search-cancel-button { display: none; }
  .limpiar {
    position: absolute;
    right: .125rem;
    top: .125rem;
    width: 2.75rem;
    height: 2.75rem;
    display: grid;
    place-items: center;
    color: var(--sec);
  }
  .limpiar span { display: grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--hundido); transition: transform .1s ease-out; }
  .limpiar:active span { transform: scale(.86); }
  .tecla {
    position: absolute;
    right: .75rem;
    top: 50%;
    margin-top: -.6875rem;
    min-width: 1.375rem;
    height: 1.375rem;
    display: none;
    place-items: center;
    border-radius: .3rem;
    box-shadow: inset 0 0 0 1px var(--linea);
    font-size: .75rem;
    font-weight: 500;
    color: var(--ter);
    pointer-events: none;
  }

  /* ---------- Resultados ---------- */
  .cuerpo { padding: .125rem 1rem calc(1.5rem + env(safe-area-inset-bottom)); }
  .rotulo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .75rem;
    padding: .625rem .25rem .4rem;
    font-size: .8125rem;
    font-weight: 500;
    color: var(--sec);
  }
  .rotulo button { color: var(--sec); font-weight: 450; padding: .35rem 0 .35rem .75rem; margin: -.35rem 0; }
  .lista { background: var(--sup); border-radius: .875rem; box-shadow: 0 0 0 1px var(--linea), var(--sombra); overflow: hidden; }
  .lista li + li .fila::before {
    content: "";
    position: absolute;
    top: 0;
    left: .875rem;
    right: 0;
    height: 1px;
    background: var(--linea);
  }
  .fila {
    position: relative;
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-height: 3.75rem;
    padding: .55rem .75rem .55rem .875rem;
    transition: background-color .22s ease;
  }
  .fila:active { background: var(--hundido); transition: none; }
  .fila:focus-visible { outline-offset: -2px; border-radius: .875rem; }
  .fila-texto { flex: 1; min-width: 0; }
  .fila-nombre {
    display: block;
    font-size: 1.0625rem;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -.012em;
    overflow-wrap: anywhere;
  }
  .fila-nombre mark { background: none; color: inherit; font-weight: 700; }
  .fila-prov { display: block; margin-top: .0625rem; font-size: .8438rem; color: var(--sec); overflow-wrap: anywhere; }
  .fichas { display: flex; gap: .1875rem; flex: none; }
  .ficha {
    width: 1.75rem;
    height: 1.4375rem;
    display: grid;
    place-items: center;
    border-radius: .375rem;
    font-size: .6875rem;
    font-weight: 650;
    letter-spacing: .01em;
    background: var(--si-tenue);
    color: var(--si);
  }
  .ficha.no { background: none; color: var(--ter); font-weight: 450; box-shadow: inset 0 0 0 1px var(--linea); }

  .aviso { padding: 2.5rem 1.25rem; text-align: center; color: var(--sec); font-size: .9375rem; }
  .aviso strong { display: block; margin-bottom: .25rem; color: var(--tinta); font-size: 1.0625rem; font-weight: 600; letter-spacing: -.012em; overflow-wrap: anywhere; }
  .aviso .accion { margin-top: .875rem; }

  /* Mientras cargan los datos */
  .fantasma { height: 3.75rem; padding: .875rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .fantasma + .fantasma { box-shadow: inset 0 1px 0 var(--linea); }
  .fantasma i, .fantasma b { display: block; height: .75rem; border-radius: .25rem; background: var(--hundido); animation: latido 1.4s ease-in-out infinite; }
  .fantasma i { width: 45%; }
  .fantasma b { width: 5.7rem; height: 1.4375rem; border-radius: .375rem; }
  @keyframes latido { 50% { opacity: .45; } }

  /* Resumen de la red */
  .resumen { margin-top: 1.25rem; }
  .resumen-total { padding: 0 .25rem .75rem; font-size: .9375rem; color: var(--sec); }
  .resumen-total strong { display: block; font-size: 2.25rem; font-weight: 600; line-height: 1.1; letter-spacing: -.035em; color: var(--tinta); }
  .red { background: var(--sup); border-radius: .875rem; box-shadow: 0 0 0 1px var(--linea), var(--sombra); }
  .red li { display: flex; align-items: center; gap: .75rem; min-height: 3.5rem; padding: .5rem .875rem; }
  .red li + li { box-shadow: inset 0 1px 0 var(--linea); }
  .red .logo { flex: 1; min-width: 0; }
  .red .cant { font-size: .875rem; color: var(--sec); font-variant-numeric: tabular-nums; }
  .fechas { padding: .75rem .25rem 0; font-size: .8125rem; line-height: 1.5; color: var(--sec); }
  .atajos { display: none; gap: 1.25rem; padding: 1.25rem .25rem 0; font-size: .8125rem; color: var(--sec); }
  .atajos kbd { font: inherit; font-weight: 500; padding: .0625rem .375rem; margin-right: .25rem; border-radius: .25rem; box-shadow: inset 0 0 0 1px var(--linea); }

  .logo { display: flex; align-items: center; min-height: 1.75rem; }
  .logo img { display: block; max-width: 100%; height: auto; object-fit: contain; }
  @media (prefers-color-scheme: dark) {
    /* Los logos están hechos para fondo claro. */
    .logo img { box-sizing: content-box; padding: .25rem .4375rem; background: #fff; border-radius: .375rem; }
  }

  /* ---------- Navegación del detalle (celular) ---------- */
  .nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    min-height: calc(2.875rem + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) .5rem 0 .25rem;
  }
  .volver {
    display: inline-flex;
    align-items: center;
    gap: .125rem;
    justify-self: start;
    height: 2.75rem;
    padding: 0 .75rem 0 .25rem;
    font-weight: 500;
    letter-spacing: -.01em;
    transition: opacity .12s ease;
  }
  .volver:active { opacity: .45; transition: none; }
  .nav-titulo {
    max-width: 52vw;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -.012em;
    opacity: 0;
    transform: translateY(.375rem);
    transition: opacity .18s ease, transform .28s var(--curva);
  }
  .titulo-fuera .nav-titulo { opacity: 1; transform: none; }

  /* ---------- Detalle ---------- */
  .contenido {
    max-width: 42.5rem;
    margin: 0 auto;
    padding: .25rem 1rem calc(2rem + env(safe-area-inset-bottom));
  }
  h1 {
    font-size: clamp(2rem, 8.6vw, 2.75rem);
    font-weight: 650;
    line-height: 1.06;
    letter-spacing: -.032em;
    overflow-wrap: anywhere;
  }
  h1:focus { outline: none; }
  .lugar { margin-top: .3125rem; font-size: .9375rem; color: var(--sec); }

  .veredicto { margin: 1.125rem 0 1.25rem; }
  .veredicto strong {
    display: block;
    font-size: 1.1875rem;
    font-weight: 600;
    letter-spacing: -.018em;
    color: var(--si);
  }
  .veredicto.nada strong { color: var(--no); }
  .tramos { display: grid; grid-template-columns: repeat(3, 1fr); gap: .25rem; margin-top: .5625rem; }
  .tramos i { position: relative; display: block; height: .3125rem; border-radius: .1875rem; background: var(--hundido); overflow: hidden; }
  .tramos i.si::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--si);
    border-radius: inherit;
    transform-origin: left center;
    animation: llenar .5s var(--curva) backwards;
    animation-delay: calc(var(--n) * 60ms + 120ms);
  }
  .rapido .tramos i.si::after { animation: none; }
  @keyframes llenar { from { transform: scaleX(0); } }

  .tarjetas { display: grid; gap: .625rem; }
  .empresa {
    background: var(--sup);
    border-radius: .9375rem;
    box-shadow: 0 0 0 1px var(--linea), var(--sombra);
    overflow: hidden;
  }
  .cabeza {
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-height: 4.75rem;
    padding: .75rem .75rem .75rem .875rem;
    transition: background-color .22s ease;
  }
  button.cabeza:active { background: var(--hundido); transition: none; }
  button.cabeza:focus-visible { outline-offset: -2px; border-radius: .9375rem; }
  .sello {
    flex: none;
    width: 1.875rem;
    height: 1.875rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--si-tenue);
    color: var(--si);
  }
  .empresa.no .sello { background: var(--no-tenue); color: var(--no); }
  .emp-texto { flex: 1; min-width: 0; }
  .emp-estado { display: block; margin-top: .25rem; font-size: .9375rem; font-weight: 550; letter-spacing: -.006em; color: var(--si); }
  .empresa.no .emp-estado { color: var(--no); }
  .emp-adelanto {
    display: block;
    font-size: .875rem;
    color: var(--sec);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .flecha { color: var(--ter); transition: transform .36s var(--curva); }
  [aria-expanded="true"] .flecha { transform: rotate(90deg); }
  .plegable { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .36s var(--curva); }
  .abierta > .plegable { grid-template-rows: 1fr; }
  .plegable-interior { min-height: 0; overflow: hidden; }
  .sucursal { padding: .875rem .875rem 1rem; box-shadow: inset 0 1px 0 var(--linea); }
  .suc-rotulo { display: block; margin-bottom: .25rem; font-size: .8125rem; font-weight: 500; color: var(--sec); }
  .suc-nombre { font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .suc-dato { margin-top: .0625rem; font-size: .9375rem; overflow-wrap: anywhere; }
  .suc-dato.tenue { color: var(--sec); }
  .horario {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: .0625rem .875rem;
    margin-top: .5rem;
    font-size: .875rem;
    color: var(--sec);
  }
  .horario dt { margin: 0; }
  .horario dd { margin: 0; color: var(--tinta); font-variant-numeric: tabular-nums; }
  .acciones { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  .accion {
    display: inline-flex;
    align-items: center;
    gap: .375rem;
    min-height: 2.25rem;
    padding: 0 .75rem 0 .625rem;
    border-radius: .625rem;
    background: var(--hundido);
    font-size: .875rem;
    font-weight: 550;
    letter-spacing: -.005em;
    text-decoration: none;
    transition: transform .16s var(--curva), background-color .18s ease;
  }
  .accion:active { transform: scale(.96); transition-duration: .08s; }
  .accion.hecho { background: var(--si-tenue); color: var(--si); }
  @media (pointer: coarse) { .accion { min-height: 2.75rem; padding: 0 .875rem 0 .75rem; } }
  .pie { margin-top: 1.125rem; padding: 0 .25rem; font-size: .8125rem; line-height: 1.5; color: var(--sec); }

  /* ---------- Pantalla ancha: lista y detalle lado a lado ---------- */
  .solo-ancho { display: none; }
  @media (min-width: 56.25rem) {
    .solo-ancho { display: block; }
    .solo-angosto, .nav, .velo { display: none !important; }
    .panel { position: absolute; top: 0; bottom: 0; }
    .panel-buscar { left: 0; right: auto; width: 26.25rem; background: var(--lateral); box-shadow: 1px 0 0 var(--linea); }
    .panel-lugar {
      left: 26.25rem;
      right: 0;
      visibility: visible;
      transform: none;
      box-shadow: none;
    }
    .barra { background: color-mix(in srgb, var(--lateral) 76%, transparent); padding-top: 1.125rem; }
    .plegable-marca, .buscando .plegable-marca { grid-template-rows: 1fr; opacity: 1; }
    .cuerpo { padding-left: .625rem; padding-right: .625rem; }
    .rotulo { padding-left: .625rem; padding-right: .625rem; }
    .lista { background: none; box-shadow: none; border-radius: 0; overflow: visible; display: grid; gap: .0625rem; }
    .lista li + li .fila::before { display: none; }
    .fila { min-height: 3.25rem; padding: .4375rem .625rem; border-radius: .625rem; transition: background-color .12s ease; }
    .fila-nombre { font-size: 1rem; }
    .fila-prov { font-size: .8125rem; }
    .fila.elegida { background: var(--hundido); }
    .fila.activa { box-shadow: inset 0 0 0 1.5px var(--ambar); }
    .contenido { padding: 3.25rem 2.5rem 2.5rem; }
    h1 { font-size: 2.75rem; }
    .tarjetas { gap: .75rem; }
    .atajos { display: flex; }
    .bienvenida { max-width: 25rem; margin: 0 auto; padding-top: 16vh; }
    .bienvenida .resumen { margin-top: 0; }
  }
  @media (hover: hover) and (pointer: fine) {
    .fila:hover { background: var(--hundido); }
    button.cabeza:hover, .accion:hover { background-color: var(--hundido); }
    .accion:hover { background-color: color-mix(in srgb, var(--tinta) 12%, transparent); }
    .accion.hecho:hover { background: var(--si-tenue); }
    .rotulo button:hover { color: var(--tinta); }
    .tecla { display: grid; }
    .campo input:focus ~ .tecla, .limpiar:not([hidden]) ~ .tecla { display: none; }
  }

  /* ---------- Preferencias del sistema ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .barra, .nav { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--fondo); }
    @media (min-width: 56.25rem) { .barra { background: var(--lateral); } }
  }
  @media (prefers-contrast: more) {
    :root { --linea: rgba(127, 127, 127, .7); --sec: var(--tinta); --ter: var(--tinta); }
    .barra, .nav { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--fondo); }
  }
</style>
</head>
<body>
<div class="app">
  <section id="vistaBuscar" class="panel panel-buscar" aria-label="Búsqueda">
    <header class="barra" id="barra">
      <div class="plegable-marca"><div>
        <p class="marca"><img src="icono.png" alt="" width="26" height="26">¿Llega?<span>Envíos a sucursal</span></p>
      </div></div>
      <div class="campo">
        <svg class="lupa" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7.75" cy="7.75" r="5.25"/><path d="m11.75 11.75 4 4"/></svg>
        <input id="q" type="search" placeholder="Localidad, barrio o CP" aria-label="Buscar localidad, barrio o código postal" role="combobox" aria-expanded="false" aria-controls="resultados" aria-autocomplete="list" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button id="limpiar" class="limpiar" type="button" aria-label="Borrar búsqueda" hidden><span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m1.5 1.5 7 7m0-7-7 7"/></svg></span></button>
        <span class="tecla" aria-hidden="true">/</span>
      </div>
    </header>
    <div id="lista" class="cuerpo"></div>
  </section>

  <div id="velo" class="velo"></div>

  <section id="vistaLugar" class="panel panel-lugar" aria-label="Disponibilidad">
    <div class="nav solo-angosto">
      <button id="volver" class="volver" type="button">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.5 4-6 6 6 6"/></svg>
        Buscar
      </button>
      <span id="navTitulo" class="nav-titulo" aria-hidden="true"></span>
    </div>
    <div id="lugar"></div>
  </section>
</div>
<p id="estado" class="oculto" role="status"></p>

<script>
"use strict";
const EMPRESAS = [
  { id: "v", pos: 1, nombre: "Vía Cargo", corto: "VC", logo: "../ViaCargo/logo-viacargo.png", w: 121, h: 24 },
  { id: "f", pos: 2, nombre: "Flecha Carga", corto: "FC", logo: "../Flecha%20Carga/logo-flechacarga-claro.png", w: 140, h: 16 },
  { id: "c", pos: 0, nombre: "Correo Argentino", corto: "CA", logo: "../Correo/logo-correo.png", w: 96, h: 26 },
];
const MAX_RESULTADOS = 30;
const CLAVE_RECIENTES = "llega:recientes";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ANCHO = matchMedia("(min-width: 56.25rem)");
const MOV_REDUCIDO = matchMedia("(prefers-reduced-motion: reduce)");
const CON_PUNTERO = matchMedia("(hover: hover) and (pointer: fine)");

const ICONOS = {
  si: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>`,
  no: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="m3 3 8 8m0-8-8 8"/></svg>`,
  flecha: `<svg class="flecha" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 3.5 5.5 5.5L7 14.5"/></svg>`,
  mapa: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 14.5s5-4.3 5-8.2a5 5 0 0 0-10 0c0 3.9 5 8.2 5 8.2Z"/><circle cx="8" cy="6.3" r="1.7"/></svg>`,
  tel: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5h2.4l1.1 3-1.5 1.1a9 9 0 0 0 3.9 3.9l1.1-1.5 3 1.1v2.4c0 .7-.6 1.2-1.3 1.2A10.7 10.7 0 0 1 1.8 3.8c0-.7.5-1.3 1.2-1.3Z"/></svg>`,
  copiar: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8"/><path d="M10.5 3.2c-.2-.7-.8-1.2-1.6-1.2H4.3C3 2 2 3 2 4.3v4.6c0 .8.5 1.4 1.2 1.6"/></svg>`,
};

let DATOS = null;
let LOCS = [];
const POR_RUTA = new Map();

/* ---------- Texto ---------- */
function sinTildes(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
}
// Misma cuenta que clave() en preparar_datos.py: "Gral. de la Madrid" -> "GENERAL MADRID".
function clave(s, conConectores) {
  const palabras = sinTildes(s).replace(/[.,;:'´`"]/g, " ").split(/\s+/).filter(Boolean);
  return palabras
    .filter((p) => conConectores || !DATOS.conect.includes(p))
    .map((p) => DATOS.abrev[p] || p)
    .join(" ");
}

// Algunas listas vienen en mayúsculas: se muestran legibles sin tocar el dato original.
const SIGLAS = new Set(["UP", "CP", "YPF", "SA", "SRL", "SN", "GBA", "CABA", "II", "III", "IV", "VI", "VII", "VIII", "IX", "XI", "XII", "RN", "RP", "PB", "BNA"]);
const MINUSCULAS = new Set(["DE", "DEL", "LA", "LAS", "LOS", "EL", "Y", "E", "A", "EN", "ENTRE", "AL"]);
function legible(s) {
  const texto = String(s ?? "");
  if (/[a-záéíóúñ]/.test(texto)) return texto;
  return texto.replace(/[A-ZÁÉÍÓÚÜÑ]+/g, (p, pos) => {
    if (SIGLAS.has(p)) return p;
    if (pos > 0 && MINUSCULAS.has(p)) return p.toLowerCase();
    if (p.length > 1 && p.length < 4 && !/[AEIOUÁÉÍÓÚ]/.test(p) && p !== "NRO" && p !== "ST") return p;
    return p[0] + p.slice(1).toLowerCase();
  });
}

// Tres formatos de horario distintos, una sola forma de leerlos.
const DIAS = { LUN: "Lun", MAR: "Mar", MIE: "Mié", JUE: "Jue", VIE: "Vie", SAB: "Sáb", DOM: "Dom" };
const ORDEN_DIAS = Object.values(DIAS);
function diasLegibles(texto) {
  const palabras = sinTildes(texto).replace(/[:/,.-]|\bDE\b/g, " ").trim().split(/\s+/).filter(Boolean);
  if (palabras[0] === "Y") palabras.shift();
  const salida = [];
  for (const p of palabras) {
    if (p === "A" || p === "Y") salida.push(p.toLowerCase());
    else if (DIAS[p.slice(0, 3)]) salida.push(DIAS[p.slice(0, 3)]);
    else return null;
  }
  return salida.join(" ");
}
function hora(h, m) { return `${h.padStart(2, "0")}:${m}`; }
function filasHorario(texto) {
  const patron = /([^\d]*?)(\d{1,2})[.:](\d{2})(?:\s*hs\.?)?\s*a\s*(\d{1,2})[.:](\d{2})(?:\s*hs\.?)?/gi;
  const filas = new Map();
  let actual = null, fin = 0, m;
  while ((m = patron.exec(texto))) {
    if (m.index !== fin) return null;
    fin = patron.lastIndex;
    const dias = diasLegibles(m[1]);
    if (dias === null) return null;
    if (dias) actual = dias;
    if (!actual) return null;
    if (!filas.has(actual)) filas.set(actual, []);
    filas.get(actual).push(`${hora(m[2], m[3])}–${hora(m[4], m[5])}`);
  }
  if (!filas.size || /[\p{L}\d]/u.test(texto.slice(fin))) return null;
  const posicion = (d) => ORDEN_DIAS.indexOf(d.slice(0, 3));
  return [...filas].sort((a, b) => posicion(a[0]) - posicion(b[0]));
}

/* ---------- Datos ---------- */
function preparar(d) {
  DATOS = d;
  LOCS = d.l.map(([nombre, prov, cps, lat, lon, otros, dep], i) => {
    const provincia = d.prov[prov] || "";
    const loc = { i, nombre, provincia, cps, lat, lon, dep, cob: null };
    loc.claves = [nombre, ...otros].map((n) => clave(n)).join(" | ");
    loc.ruta = [nombre, provincia, dep].filter(Boolean).join(" · ");
    POR_RUTA.set(loc.ruta, loc);
    return loc;
  });
}
function cobertura(loc) {
  if (loc.cob) return loc.cob;
  const sets = [new Set(), new Set(), new Set()];
  for (const cp of loc.cps) {
    const g = DATOS.cp[cp];
    if (g) g.forEach((lista, pos) => lista.forEach((idx) => sets[pos].add(idx)));
  }
  loc.cob = sets.map((s) => [...s]);
  return loc.cob;
}
function cuantasEmpresas(loc) {
  return cobertura(loc).filter((g) => g.length).length;
}

/* ---------- Búsqueda ---------- */
function buscar(texto) {
  const crudo = texto.trim();
  if (!crudo) return [];
  if (/^\d+$/.test(crudo)) {
    const exactos = [], parciales = [];
    for (const l of LOCS) {
      if (l.cps.includes(crudo)) exactos.push(l);
      else if (l.cps.some((cp) => cp.startsWith(crudo))) parciales.push(l);
    }
    const orden = (a, b) => cuantasEmpresas(b) - cuantasEmpresas(a) || a.nombre.localeCompare(b.nombre, "es");
    return [...exactos.sort(orden), ...parciales.sort(orden)];
  }
  // Si lo escrito son solo conectores ("la"), se busca tal cual.
  const q = clave(crudo) || clave(crudo, true);
  const partes = q.split(" ");
  const hallados = [];
  for (const l of LOCS) {
    if (!partes.every((p) => l.claves.includes(p))) continue;
    let rango = 2;
    if (l.claves.split(" | ").includes(q)) rango = -1;
    else if (l.claves.startsWith(q) || l.claves.includes("| " + q)) rango = 0;
    else if ((" " + l.claves).includes(" " + partes[0])) rango = 1;
    hallados.push({ l, rango });
  }
  hallados.sort((a, b) => a.rango - b.rango
    || (cuantasEmpresas(b.l) > 0) - (cuantasEmpresas(a.l) > 0)
    || a.l.nombre.length - b.l.nombre.length
    || a.l.nombre.localeCompare(b.l.nombre, "es"));
  return hallados.map((h) => h.l);
}

// Marca en el nombre lo que se escribió (si no coincide tal cual, por ejemplo "gral", queda sin marcar).
function nombreMarcado(nombre, texto) {
  const crudo = texto.trim();
  if (!crudo || /^\d+$/.test(crudo)) return esc(nombre);
  const plano = [...nombre].map((c) => { const s = sinTildes(c); return s.length === 1 ? s : c; }).join("");
  const letras = [...nombre];
  const marcas = new Array(letras.length).fill(false);
  for (const parte of sinTildes(crudo).split(/[\s.,;:]+/).filter(Boolean)) {
    const pos = plano.indexOf(parte);
    if (pos >= 0) marcas.fill(true, pos, pos + parte.length);
  }
  let salida = "", abierto = false;
  letras.forEach((c, i) => {
    if (marcas[i] !== abierto) { salida += marcas[i] ? "<mark>" : "</mark>"; abierto = marcas[i]; }
    salida += esc(c);
  });
  return salida + (abierto ? "</mark>" : "");
}

function filaLocalidad(l, n, texto) {
  const cob = cobertura(l);
  const fichas = EMPRESAS.map((e) => `<span class="ficha${cob[e.pos].length ? "" : " no"}">${e.corto}</span>`).join("");
  const resumen = EMPRESAS.map((e) => `${e.nombre}: ${cob[e.pos].length ? "sí" : "no"}`).join(", ");
  const crudo = texto.trim();
  const cpHallado = /^\d+$/.test(crudo) ? (l.cps.includes(crudo) ? crudo : l.cps.find((cp) => cp.startsWith(crudo))) : "";
  const lugar = [cpHallado && `CP ${cpHallado}`, l.dep, l.provincia].filter(Boolean).join(" · ");
  return `<li role="presentation"><button class="fila" id="fila${n}" role="option" aria-selected="false" type="button" data-ruta="${esc(l.ruta)}" aria-label="${esc(l.nombre)}, ${esc(lugar)}. ${resumen}">
    <span class="fila-texto"><span class="fila-nombre">${nombreMarcado(l.nombre, texto)}</span><span class="fila-prov">${esc(lugar)}</span></span>
    <span class="fichas" aria-hidden="true">${fichas}</span>
  </button></li>`;
}

function resumenRed() {
  const total = EMPRESAS.reduce((suma, e) => suma + DATOS.tot[e.id], 0);
  const filas = EMPRESAS.map((e) => `<li>
    <span class="ficha">${e.corto}</span>
    <span class="logo"><img src="${e.logo}" alt="${e.nombre}" width="${e.w}" height="${e.h}"></span>
    <span class="cant">${DATOS.tot[e.id].toLocaleString("es-AR")}</span>
  </li>`).join("");
  return `<div class="resumen">
    <p class="resumen-total"><strong>${total.toLocaleString("es-AR")}</strong>sucursales en todo el país</p>
    <ul class="red">${filas}</ul>
    <p class="fechas">Actualizado el ${fechaCorta(DATOS.generado)}. Conviene confirmar con la sucursal antes de despachar.</p>
    <p class="atajos"><span><kbd>/</kbd>buscar</span><span><kbd>↑</kbd><kbd>↓</kbd>recorrer</span><span><kbd>Esc</kbd>limpiar</span></p>
  </div>`;
}

let filaActiva = -1;
function filas() { return [...$("lista").querySelectorAll(".fila")]; }
function marcarFila(n, desplazar) {
  const todas = filas();
  filaActiva = todas.length ? Math.max(0, Math.min(n, todas.length - 1)) : -1;
  todas.forEach((f, i) => f.classList.toggle("activa", i === filaActiva));
  const activa = todas[filaActiva];
  if (activa) {
    $("q").setAttribute("aria-activedescendant", activa.id);
    if (desplazar) activa.scrollIntoView({ block: "nearest" });
  } else {
    $("q").removeAttribute("aria-activedescendant");
  }
}
function marcarElegida() {
  const ruta = rutaAbierta;
  filas().forEach((f) => {
    const es = f.dataset.ruta === ruta;
    f.classList.toggle("elegida", es);
    f.setAttribute("aria-selected", es);
  });
}

function pintarLista() {
  if (!DATOS) return;
  const texto = $("q").value;
  const hayTexto = !!texto.trim();
  $("limpiar").hidden = !texto;
  $("barra").classList.toggle("buscando", !!texto);
  $("q").setAttribute("aria-expanded", hayTexto);
  const lista = $("lista");
  filaActiva = -1;
  if (!hayTexto) {
    const recientes = leerRecientes().map((r) => POR_RUTA.get(r)).filter(Boolean);
    lista.innerHTML = (recientes.length
      ? `<div class="rotulo"><span>Últimas consultas</span><button type="button" id="borrarRecientes">Borrar</button></div>
         <ul class="lista" id="resultados" role="listbox" aria-label="Últimas consultas">${recientes.map((l, n) => filaLocalidad(l, n, "")).join("")}</ul>`
      : "")
      + `<div class="solo-angosto">${resumenRed()}</div>`;
    $("estado").textContent = "";
    marcarFila(-1);
    filaActiva = -1;
    filas().forEach((f) => f.classList.remove("activa"));
    marcarElegida();
    return;
  }
  const hallados = buscar(texto);
  const visibles = hallados.slice(0, MAX_RESULTADOS);
  const n = hallados.length;
  const rotulo = n > MAX_RESULTADOS
    ? `Primeras ${MAX_RESULTADOS} de ${n.toLocaleString("es-AR")}. Seguí escribiendo para afinar`
    : `${n} ${n === 1 ? "localidad" : "localidades"}`;
  lista.innerHTML = n
    ? `<div class="rotulo"><span>${rotulo}</span></div>
       <ul class="lista" id="resultados" role="listbox" aria-label="Resultados">${visibles.map((l, i) => filaLocalidad(l, i, texto)).join("")}</ul>`
    : `<div class="aviso"><strong>No encontramos «${esc(texto.trim())}»</strong>Probá con otra forma de escribirlo, con la ciudad más cercana o con el código postal.</div>`;
  $("estado").textContent = n ? rotulo : "Sin resultados";
  if (n && CON_PUNTERO.matches) marcarFila(0, false);
  marcarElegida();
  $("vistaBuscar").scrollTop = 0;
}

/* ---------- Resultado ---------- */
function distanciaKm(aLat, aLon, bLat, bLon) {
  const rad = Math.PI / 180;
  const x = Math.sin((bLat - aLat) * rad / 2) ** 2
    + Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin((bLon - aLon) * rad / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(x));
}
function masCercana(loc, empresa) {
  if (loc.lat == null) return null;
  let mejor = null;
  for (const s of DATOS.suc[empresa.id]) {
    if (s[5] == null) continue;
    const km = distanciaKm(loc.lat, loc.lon, s[5], s[6]);
    if (!mejor || km < mejor.km) mejor = { s, km };
  }
  return mejor;
}
function textoKm(km) {
  return km < 1 ? "a menos de 1 km" : `a unos ${Math.round(km)} km`;
}
function urlMapa(s, empresa) {
  // s[7]: ubicación aproximada (centro del CP); ahí el mapa busca por dirección o por nombre.
  const consulta = s[1] && s[5] != null && !s[7] ? `${s[5]},${s[6]}`
    : s[1] ? `${s[1]}, CP ${s[2]}, Argentina`
    : `${empresa.nombre} ${s[0]}, CP ${s[2]}, Argentina`;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(consulta);
}
function telefonoDe(texto) {
  const m = String(texto || "").match(/\+?\d[\d\s()-]{6,}\d/);
  return m ? m[0].replace(/[^\d+]/g, "") : "";
}
function textoCopiable(s, empresa) {
  const [nombre, direccion, cp, horario, contacto] = s;
  const filasH = horario ? filasHorario(horario) : null;
  return [
    `${empresa.nombre}: ${legible(nombre)}`,
    [direccion ? legible(direccion) : "", cp ? `CP ${cp}` : ""].filter(Boolean).join(" · "),
    filasH ? filasH.map(([d, r]) => `${d}: ${r.join(" y ")}`).join(" · ") : horario,
    contacto,
  ].filter(Boolean).join("\n");
}
function bloqueSucursal(s, empresa, rotulo) {
  const [nombre, direccion, cp, horario, contacto] = s;
  const tel = telefonoDe(contacto);
  const filasH = horario ? filasHorario(horario) : null;
  const copiable = navigator.clipboard
    ? `<button class="accion" type="button" data-copiar="${esc(textoCopiable(s, empresa))}">${ICONOS.copiar}<span>Copiar</span></button>`
    : "";
  return `<article class="sucursal">
    ${rotulo ? `<span class="suc-rotulo">${esc(rotulo)}</span>` : ""}
    <div class="suc-nombre">${esc(legible(nombre))}</div>
    <div class="suc-dato${direccion ? "" : " tenue"}">${direccion ? esc(legible(direccion)) : "Dirección no publicada"}${cp ? ` · CP ${esc(cp)}` : ""}</div>
    ${filasH
      ? `<dl class="horario">${filasH.map(([d, r]) => `<dt>${esc(d)}</dt><dd>${esc(r.join(", "))}</dd>`).join("")}</dl>`
      : horario ? `<div class="suc-dato tenue">${esc(horario)}</div>` : ""}
    ${contacto ? `<div class="suc-dato tenue">${esc(contacto)}</div>` : ""}
    <div class="acciones">
      <a class="accion" href="${esc(urlMapa(s, empresa))}" target="_blank" rel="noopener">${ICONOS.mapa}Mapa</a>
      ${tel ? `<a class="accion" href="tel:${esc(tel)}">${ICONOS.tel}Llamar</a>` : ""}
      ${copiable}
    </div>
  </article>`;
}
function ordenarSucursales(indices, empresa, loc) {
  // Primero las que se llaman como la localidad buscada: un CP puede abarcar varias.
  const base = clave(loc.nombre);
  const puntaje = (s) => (clave(s[0]).includes(base) ? 0 : 1);
  return indices.map((i) => DATOS.suc[empresa.id][i])
    .sort((a, b) => puntaje(a) - puntaje(b) || a[0].localeCompare(b[0], "es"));
}
function tarjetaEmpresa(loc, empresa) {
  const logo = `<span class="logo"><img src="${empresa.logo}" alt="${empresa.nombre}" width="${empresa.w}" height="${empresa.h}"></span>`;
  const indices = cobertura(loc)[empresa.pos];
  const n = indices.length;
  if (n) {
    const primera = ordenarSucursales(indices, empresa, loc)[0];
    return `<div class="empresa">
      <button class="cabeza" type="button" aria-expanded="false" data-empresa="${empresa.id}">
        <span class="sello" aria-hidden="true">${ICONOS.si}</span>
        <span class="emp-texto">${logo}
          <span class="emp-estado">${n} ${n === 1 ? "sucursal" : "sucursales"}</span>
          <span class="emp-adelanto">${esc(legible(/\p{L}/u.test(primera[1]) ? primera[1] : primera[0]))}</span></span>
        ${ICONOS.flecha}
      </button>
      <div class="plegable"><div class="plegable-interior" inert></div></div>
    </div>`;
  }
  const cerca = masCercana(loc, empresa);
  if (!cerca) {
    return `<div class="empresa no"><div class="cabeza">
      <span class="sello" aria-hidden="true">${ICONOS.no}</span>
      <span class="emp-texto">${logo}<span class="emp-estado">Sin sucursal en esta localidad</span></span>
    </div></div>`;
  }
  return `<div class="empresa no">
    <button class="cabeza" type="button" aria-expanded="false" data-cercana="${empresa.id}">
      <span class="sello" aria-hidden="true">${ICONOS.no}</span>
      <span class="emp-texto">${logo}
        <span class="emp-estado">Sin sucursal en esta localidad</span>
        <span class="emp-adelanto">La más cercana, ${textoKm(cerca.km)}</span></span>
      ${ICONOS.flecha}
    </button>
    <div class="plegable"><div class="plegable-interior" inert></div></div>
  </div>`;
}
function fechaCorta(iso) {
  if (!iso) return "s/d";
  const [a, m, d] = iso.slice(0, 10).split("-");
  return `${d}/${m}/${a}`;
}
function pieFechas() {
  const f = DATOS.fechas;
  return `Listas de sucursales: Vía Cargo ${fechaCorta(f.v)} · Flecha Carga ${fechaCorta(f.f)} · Correo Argentino ${fechaCorta(f.c)}. Conviene confirmar con la sucursal antes de despachar.`;
}

let observadorTitulo = null;
let ultimoPintado = 0;
function pintarLugar(loc) {
  const hay = cuantasEmpresas(loc);
  const veredicto = hay === 3 ? "Llega con los tres" : hay === 0 ? "Ninguno tiene sucursal acá" : `Llega con ${hay} de 3`;
  const cps = loc.cps.length === 0 ? "" : loc.cps.length <= 3 ? `CP ${loc.cps.join(", ")}` : `${loc.cps.length} códigos postales`;
  const lugar = [loc.dep, loc.provincia, cps].filter(Boolean).join(" · ");
  const cob = cobertura(loc);
  const tramos = EMPRESAS.map((e, n) => `<i class="${cob[e.pos].length ? "si" : ""}" style="--n:${n}"></i>`).join("");

  const ahora = performance.now();
  const rapido = ahora - ultimoPintado < 220; // flecha mantenida: sin animar cada paso
  ultimoPintado = ahora;

  const caja = $("lugar");
  caja.classList.toggle("rapido", rapido);
  caja.innerHTML = `<div class="contenido">
    <h1 tabindex="-1">${esc(loc.nombre)}</h1>
    <p class="lugar">${esc(lugar)}</p>
    <div class="veredicto${hay ? "" : " nada"}"><strong>${veredicto}</strong><div class="tramos" aria-hidden="true">${tramos}</div></div>
    <div class="tarjetas">${EMPRESAS.map((e) => tarjetaEmpresa(loc, e)).join("")}</div>
    <p class="pie">${esc(pieFechas())}</p>
  </div>`;
  $("navTitulo").textContent = loc.nombre;
  $("vistaLugar").scrollTop = 0;
  $("vistaLugar").classList.remove("con-scroll", "titulo-fuera");

  if (observadorTitulo) observadorTitulo.disconnect();
  observadorTitulo = new IntersectionObserver(([e]) => {
    $("vistaLugar").classList.toggle("titulo-fuera", !e.isIntersecting);
  }, { root: $("vistaLugar"), rootMargin: "-46px 0px 0px 0px" });
  observadorTitulo.observe(caja.querySelector("h1"));

  if (ANCHO.matches && !rapido && !MOV_REDUCIDO.matches) {
    caja.animate(
      [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }],
      { duration: 220, easing: "cubic-bezier(.32,.72,0,1)" },
    );
  }
}
function pintarBienvenida() {
  $("lugar").innerHTML = ANCHO.matches ? `<div class="contenido"><div class="bienvenida">${resumenRed()}</div></div>` : "";
  $("navTitulo").textContent = "";
}

// Abrir y cerrar sucursales: delegado, para no volver a enganchar en cada pintada.
$("lugar").addEventListener("click", async (e) => {
  const copia = e.target.closest("[data-copiar]");
  if (copia) {
    try {
      await navigator.clipboard.writeText(copia.dataset.copiar);
      const texto = copia.querySelector("span");
      copia.classList.add("hecho");
      texto.textContent = "Copiado";
      $("estado").textContent = "Sucursal copiada";
      clearTimeout(copia._t);
      copia._t = setTimeout(() => { copia.classList.remove("hecho"); texto.textContent = "Copiar"; }, 1500);
    } catch { /* sin permiso para copiar: el botón queda como estaba */ }
    return;
  }
  const b = e.target.closest("button.cabeza");
  if (!b) return;
  const tarjeta = b.parentElement;
  const interior = tarjeta.querySelector(".plegable-interior");
  const abrir = b.getAttribute("aria-expanded") !== "true";
  if (abrir && !interior.dataset.listo) {
    const loc = POR_RUTA.get(rutaAbierta);
    const empresa = EMPRESAS.find((x) => x.id === (b.dataset.empresa || b.dataset.cercana));
    if (b.dataset.empresa) {
      interior.innerHTML = ordenarSucursales(cobertura(loc)[empresa.pos], empresa, loc).map((s) => bloqueSucursal(s, empresa)).join("");
    } else {
      const cerca = masCercana(loc, empresa);
      interior.innerHTML = bloqueSucursal(cerca.s, empresa, `Más cercana, ${textoKm(cerca.km)} en línea recta`);
    }
    interior.dataset.listo = "1";
  }
  b.setAttribute("aria-expanded", abrir);
  tarjeta.classList.toggle("abierta", abrir);
  interior.inert = !abrir;
  if (abrir) {
    // Si lo que se abrió queda bajo el borde, se trae a la vista al terminar de abrirse.
    setTimeout(() => {
      const panel = $("vistaLugar").getBoundingClientRect();
      const caja = tarjeta.getBoundingClientRect();
      if (caja.bottom > panel.bottom && tarjeta.classList.contains("abierta")) {
        const sube = Math.min(caja.bottom - panel.bottom + 12, caja.top - panel.top - 56);
        if (sube > 0) $("vistaLugar").scrollBy({ top: sube, behavior: MOV_REDUCIDO.matches ? "auto" : "smooth" });
      }
    }, 380);
  }
});

/* ---------- Recientes ---------- */
function leerRecientes() {
  try { return JSON.parse(localStorage.getItem(CLAVE_RECIENTES)) || []; } catch { return []; }
}
function guardarReciente(ruta) {
  try {
    const lista = [ruta, ...leerRecientes().filter((r) => r !== ruta)].slice(0, 5);
    localStorage.setItem(CLAVE_RECIENTES, JSON.stringify(lista));
  } catch { /* sin almacenamiento: solo no se recuerdan */ }
}

/* ---------- Transición entre pantallas en el celular ----------
   Un resorte sin rebote sobre un solo valor (0 = lista, 1 = detalle). Arranca siempre desde
   donde está y con la velocidad que trae, así se puede interrumpir o agarrar a mitad de camino. */
const nav = { p: 0, v: 0, objetivo: 0, raf: 0, ultimo: 0 };
const RESPUESTA = 0.38;

function aplicarNav() {
  const buscar = $("vistaBuscar"), lugar = $("vistaLugar"), velo = $("velo");
  if (ANCHO.matches) {
    buscar.style.transform = lugar.style.transform = lugar.style.visibility = buscar.style.visibility = "";
    buscar.inert = lugar.inert = false;
    return;
  }
  const p = nav.p;
  lugar.style.transform = `translate3d(${(1 - p) * 100}%,0,0)`;
  buscar.style.transform = `translate3d(${-p * 26}%,0,0)`;
  velo.style.opacity = p * 0.18;
  lugar.style.visibility = p <= 0.0005 ? "hidden" : "visible";
  buscar.style.visibility = p >= 0.9995 ? "hidden" : "visible";
  buscar.inert = nav.objetivo === 1;
  lugar.inert = nav.objetivo === 0;
}
function pasoResorte(ahora) {
  const dt = Math.min(0.032, (ahora - nav.ultimo) / 1000);
  nav.ultimo = ahora;
  const w = (2 * Math.PI) / RESPUESTA;
  for (let i = 0; i < 4; i++) {
    const a = -w * w * (nav.p - nav.objetivo) - 2 * w * nav.v;
    nav.v += a * (dt / 4);
    nav.p += nav.v * (dt / 4);
  }
  if (nav.p <= 0 || nav.p >= 1) { nav.p = Math.max(0, Math.min(1, nav.p)); nav.v = 0; }
  if (Math.abs(nav.p - nav.objetivo) < 0.0005 && Math.abs(nav.v) < 0.02) {
    nav.p = nav.objetivo;
    nav.v = 0;
    nav.raf = 0;
    aplicarNav();
    alTerminarNav();
    return;
  }
  aplicarNav();
  nav.raf = requestAnimationFrame(pasoResorte);
}
function irA(objetivo, sinAnimar) {
  nav.objetivo = objetivo;
  if (ANCHO.matches) { nav.p = objetivo; nav.v = 0; aplicarNav(); return; }
  if (sinAnimar || MOV_REDUCIDO.matches) {
    cancelAnimationFrame(nav.raf);
    nav.raf = 0;
    nav.p = objetivo;
    nav.v = 0;
    aplicarNav();
    if (MOV_REDUCIDO.matches && !sinAnimar) {
      $(objetivo ? "vistaLugar" : "vistaBuscar").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
    }
    alTerminarNav();
    return;
  }
  aplicarNav();
  if (!nav.raf) {
    nav.ultimo = performance.now();
    nav.raf = requestAnimationFrame(pasoResorte);
  }
}
function alTerminarNav() {
  if (!ANCHO.matches && nav.objetivo === 0) pintarBienvenida();
}

/* Deslizar hacia la derecha para volver. */
(function deslizar() {
  const lugar = $("vistaLugar");
  let toque = null;
  lugar.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch" || ANCHO.matches || nav.objetivo !== 1 || MOV_REDUCIDO.matches) return;
    toque = { id: e.pointerId, x: e.clientX, y: e.clientY, activo: false, p0: 1, hist: [] };
  });
  lugar.addEventListener("pointermove", (e) => {
    if (!toque || e.pointerId !== toque.id) return;
    const dx = e.clientX - toque.x, dy = e.clientY - toque.y;
    if (!toque.activo) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (dx <= 0 || Math.abs(dx) < Math.abs(dy) * 1.2) { toque = null; return; }
      toque.activo = true;
      toque.x = e.clientX; // sin salto: arranca a seguir el dedo desde acá
      toque.p0 = nav.p;
      cancelAnimationFrame(nav.raf);
      nav.raf = 0;
      nav.v = 0;
      lugar.setPointerCapture(e.pointerId);
    }
    const ancho = lugar.offsetWidth;
    nav.p = Math.max(0, Math.min(1, toque.p0 - (e.clientX - toque.x) / ancho));
    aplicarNav();
    toque.hist.push({ x: e.clientX, t: e.timeStamp });
    if (toque.hist.length > 6) toque.hist.shift();
  });
  const soltar = (e) => {
    if (!toque || e.pointerId !== toque.id) return;
    const t = toque;
    toque = null;
    if (!t.activo) return;
    const a = t.hist[0], b = t.hist[t.hist.length - 1];
    const vel = a && b && b.t > a.t ? ((b.x - a.x) / (b.t - a.t)) * 1000 : 0; // px/s
    const ancho = lugar.offsetWidth;
    // Se decide con el punto al que iría a parar el gesto, no con donde se soltó.
    const proyectado = (1 - nav.p) * ancho + (vel / 1000) * (0.998 / 0.002);
    const vuelve = e.type !== "pointercancel" && proyectado > ancho / 2 && vel > -80;
    nav.v = -vel / ancho;
    if (vuelve) {
      nav.objetivo = 0;
      irA(0);
      cerrar();
    } else {
      irA(1);
    }
  };
  lugar.addEventListener("pointerup", soltar);
  lugar.addEventListener("pointercancel", soltar);
})();

/* ---------- Navegación ---------- */
let rutaAbierta = null;
function rutaActual() {
  try { return decodeURIComponent(location.hash.slice(1)); } catch { return ""; }
}
function mostrar(evento) {
  if (!DATOS) return;
  const loc = POR_RUTA.get(rutaActual());
  const ruta = loc ? loc.ruta : "";
  const inicial = rutaAbierta === null;
  if (ruta === rutaAbierta) return; // popstate y hashchange llegan juntos
  rutaAbierta = ruta;
  // iOS ya animó su propio gesto de volver: no se repite.
  const sinAnimar = inicial || (evento && evento.hasUAVisualTransition);
  if (loc) {
    pintarLugar(loc);
    document.title = `${loc.nombre} · ¿Llega?`;
    irA(1, sinAnimar);
  } else {
    document.title = "¿Llega? · Envíos a sucursal";
    if (ANCHO.matches) pintarBienvenida();
    irA(0, sinAnimar);
    if (!ANCHO.matches) pintarLista();
    else if (!$("q").value.trim()) pintarLista();
  }
  marcarElegida();
}
function navegar(ruta) {
  const url = "#" + encodeURIComponent(ruta);
  // En pantalla ancha cambiar de localidad reemplaza: "atrás" no recorre cada flecha apretada.
  if (ANCHO.matches && rutaAbierta) history.replaceState({ interna: true }, "", url);
  else history.pushState({ interna: true }, "", url);
  mostrar();
}
function abrir(ruta) {
  guardarReciente(ruta);
  navegar(ruta);
  if (ANCHO.matches) {
    if (CON_PUNTERO.matches) $("q").focus({ preventScroll: true });
  } else {
    $("q").blur();
    const h1 = $("lugar").querySelector("h1");
    if (h1) h1.focus({ preventScroll: true });
  }
}
function cerrar() {
  if (history.state && history.state.interna) history.back();
  else {
    history.replaceState(null, "", location.pathname + location.search);
    mostrar();
  }
}

/* ---------- Inicio ---------- */
async function cargar() {
  const fantasma = `<div class="fantasma"><i></i><b></b></div>`;
  $("lista").innerHTML = `<div class="rotulo"><span>Cargando sucursales…</span></div><div class="lista">${fantasma.repeat(5)}</div>`;
  try {
    const r = await fetch("datos.json");
    if (!r.ok) throw new Error(r.status);
    preparar(await r.json());
    pintarLista();
    if (POR_RUTA.has(rutaActual())) guardarReciente(rutaActual());
    mostrar();
    if (!rutaAbierta) pintarBienvenida();
    if (CON_PUNTERO.matches && (ANCHO.matches || !rutaAbierta)) $("q").focus({ preventScroll: true });
  } catch (e) {
    $("lista").innerHTML = `<div class="aviso"><strong>No se pudieron cargar las sucursales.</strong>Revisá la conexión e intentá de nuevo.<br><button class="accion" type="button" id="reintentar">Reintentar</button></div>`;
    $("reintentar").addEventListener("click", cargar);
  }
}

let cuadro = 0;
$("q").addEventListener("input", () => {
  cancelAnimationFrame(cuadro);
  cuadro = requestAnimationFrame(pintarLista);
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const todas = filas();
    if (!todas.length) return;
    e.preventDefault();
    const paso = e.key === "ArrowDown" ? 1 : -1;
    marcarFila(filaActiva < 0 ? (paso > 0 ? 0 : todas.length - 1) : filaActiva + paso, true);
    // En pantalla ancha el detalle sigue a la selección, sin tener que abrir nada.
    if (ANCHO.matches && todas[filaActiva]) navegar(todas[filaActiva].dataset.ruta);
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    const todas = filas();
    const f = todas[Math.max(0, filaActiva)];
    if (f) abrir(f.dataset.ruta);
  }
});
$("limpiar").addEventListener("click", () => {
  $("q").value = "";
  pintarLista();
  $("q").focus();
});
$("lista").addEventListener("click", (e) => {
  if (e.target.closest("#borrarRecientes")) {
    try { localStorage.removeItem(CLAVE_RECIENTES); } catch { /* nada que borrar */ }
    pintarLista();
    return;
  }
  const b = e.target.closest(".fila");
  if (b) abrir(b.dataset.ruta);
});
$("volver").addEventListener("click", cerrar);

// Línea bajo la barra solo cuando hay contenido pasando por debajo.
for (const panel of [$("vistaBuscar"), $("vistaLugar")]) {
  panel.addEventListener("scroll", () => panel.classList.toggle("con-scroll", panel.scrollTop > 2), { passive: true });
}

addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if ($("q").value) {
      $("q").value = "";
      pintarLista();
      if (ANCHO.matches) $("q").focus();
    } else if (rutaAbierta) {
      cerrar();
    }
    return;
  }
  const escribiendo = e.target.matches && e.target.matches("input, textarea");
  if ((e.key === "/" && !escribiendo) || (e.key.toLowerCase() === "k" && (e.ctrlKey || e.metaKey))) {
    e.preventDefault();
    if (!ANCHO.matches && rutaAbierta) cerrar();
    $("q").focus();
    $("q").select();
  }
});

addEventListener("hashchange", () => mostrar());
addEventListener("popstate", (e) => mostrar(e));
ANCHO.addEventListener("change", () => {
  nav.p = nav.objetivo = rutaAbierta ? 1 : 0;
  nav.v = 0;
  cancelAnimationFrame(nav.raf);
  nav.raf = 0;
  $("velo").style.opacity = "";
  $("vistaBuscar").style.transform = "";
  aplicarNav();
  if (!DATOS) return;
  if (!rutaAbierta) pintarBienvenida();
  pintarLista();
});
cargar();
</script>
</body>
</html>
